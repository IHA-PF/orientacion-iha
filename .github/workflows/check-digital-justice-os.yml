name: Check Digital Justice OS public pages

on:
  push:
    branches:
      - feature/digital-justice-os-positioning
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout site
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate links, languages, structured data and sitemap
        run: node scripts/check-digital-justice-os.mjs
