name: Validate IHA website orientation
on:
  push:
    branches: [feature/digital-justice-os-positioning, release/simple-orientation-20261123]
  pull_request:
    paths:
      - 'index.html'
      - 'simple-orientation.css'
      - 'es/**'
      - 'en/**'
      - 'fr/**'
      - 'pt/**'
      - 'digital-justice-os/**'
      - 'scripts/check-simple-orientation.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check orientation, language links and JavaScript syntax
        run: node scripts/check-simple-orientation.mjs
