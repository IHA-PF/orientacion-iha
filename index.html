 control there is no compensation, but you are entitled to information, rebooking or a refund.", "La Supertransporte indica 15 días de respuesta a las quejas.": "Supertransporte states a 15-day reply period for complaints.", "Pida en el mostrador una constancia de la demora.": "Ask at the counter for written proof of the delay.", "Reclamo escrito a la aerolínea o a la agencia.": "Written complaint to the airline or the agency.", "Si no resuelven, queja ante la Superintendencia de Transporte; la SIC también es competente en protección al consumidor.": "If they do not resolve it, complain to the Superintendencia de Transporte; the SIC is also competent on consumer protection.", "Tiquete y pase de abordar": "Ticket and boarding pass", "Constancia de la demora": "Proof of the delay", "Recibos de gastos": "Expense receipts", "Cancelación por causa de la aerolínea: puede desistir y recibir el reembolso, o seguir viaje con la atención y la compensación que fija el reglamento aeronáutico.": "Cancellation caused by the airline: you can give up the trip and get a refund, or travel with the care and compensation set by the aviation rules.", "Sobreventa: deben embarcarlo en el siguiente vuelo disponible y compensarlo según el reglamento aeronáutico.": "Overbooking: they must put you on the next available flight and compensate you under the aviation rules.", "Cancelación por causas ajenas a la aerolínea, como el clima: devolución total del precio sin penalidades.": "Cancellation for reasons outside the airline's control, such as weather: full refund of the fare without penalties.", "Reclamo escrito cuanto antes; respuesta indicada por la Supertransporte: 15 días.": "Written complaint as soon as possible; reply period stated by Supertransporte: 15 days.", "Pida por escrito la causa de la cancelación o del no embarque.": "Ask in writing for the reason for the cancellation or denied boarding.", "Reclamo a la aerolínea o agencia.": "Complaint to the airline or agency.", "Si no resuelven, Superintendencia de Transporte o SIC.": "If they do not resolve it, Superintendencia de Transporte or SIC.", "Tiquete": "Ticket", "Constancia de cancelación o de no embarque": "Proof of cancellation or denied boarding", "Si el equipaje se demora, la aerolínea debe cubrir artículos básicos y compensarlo según el reglamento aeronáutico.": "If your baggage is delayed, the airline must cover basic items and compensate you under the aviation rules.", "En vuelos internacionales, el Convenio de Montreal limita la indemnización por equipaje; declare objetos de valor al facturar.": "On international flights, the Montreal Convention limits compensation for baggage; declare valuables at check-in.", "Daño, pérdida o hurto: protesta escrita a más tardar en 7 días.": "Damage, loss or theft: written complaint within 7 days at the latest.", "Demora: reclamo dentro de los 21 días siguientes a la fecha en que debía llegar.": "Delay: complaint within 21 days of the date it should have arrived.", "Antes de salir del aeropuerto, reporte en el mostrador de la aerolínea y pida el número de reclamo.": "Before leaving the airport, report it at the airline's desk and ask for the claim number.", "Protesta escrita dentro del plazo.": "Written complaint within the deadline.", "Si no resuelven, Superintendencia de Transporte.": "If they do not resolve it, Superintendencia de Transporte.", "Tiquete y etiqueta del equipaje": "Ticket and baggage tag", "Reporte del aeropuerto": "Airport report", "Fotos del daño": "Photos of the damage", "Recibos de compras de emergencia": "Receipts for emergency purchases", "Los plazos del equipaje son cortos: 7 días para daño o pérdida y 21 días para demora.": "Baggage deadlines are short: 7 days for damage or loss and 21 days for delay.", "Puede desistir del viaje antes del vuelo; la aerolínea puede retener una parte limitada de la tarifa, según el reglamento aeronáutico.": "You can give up the trip before the flight; the airline may keep a limited part of the fare under the aviation rules.", "Las tarifas promocionales pueden tener condiciones distintas: revise las que aceptó al comprar.": "Promotional fares may have different conditions: check the ones you accepted when buying.", "Haga la solicitud por escrito y antes del vuelo.": "Make the request in writing and before the flight.", "Solicite por escrito el desistimiento o el retracto y guarde la constancia.": "Request the withdrawal or cancellation in writing and keep proof.", "Si no reembolsan, reclamo y luego Superintendencia de Transporte o SIC.": "If they do not refund, complain and then go to the Superintendencia de Transporte or the SIC.", "Tiquete y condiciones de la tarifa": "Ticket and fare conditions", "Comprobante de pago": "Proof of payment", "Constancia de la solicitud": "Proof of the request", "Tiene derecho a información, a viajar en condiciones de calidad, a la protección contra publicidad engañosa, a llevar su equipaje y, según las reglas, a retractarse o desistir del tiquete (guía de la Supertransporte).": "You have the right to information, to travel in quality conditions, to protection against misleading advertising, to carry your luggage and, under the rules, to withdraw from or give up the ticket (Supertransporte guide).", "También hay reglas para viajar con mascotas y con menores de edad: pregunte a la empresa antes de comprar.": "There are also rules for travelling with pets and with minors: ask the company before buying.", "Los porcentajes de devolución dependen de la norma y de la empresa: pida la política por escrito.": "Refund percentages depend on the rules and on the company: ask for the policy in writing.", "Respuesta a peticiones: 15 días.": "Reply to requests: 15 days.", "Acción de protección al consumidor: 1 año.": "Consumer protection claim: 1 year.", "Reclamo a la empresa o al intermediario que le vendió.": "Complaint to the company or to the intermediary that sold you the ticket.", "Si no resuelven, Superintendencia de Transporte; luego jueces o SIC.": "If they do not resolve it, Superintendencia de Transporte; then the courts or the SIC.", "Fotos": "Photos", "Recibos": "Receipts", "Datos del bus y la hora": "Bus details and time", "Quien le cobra debe informarle el precio de forma veraz y atender su reclamo (Ley 1480).": "Whoever charges you must state the price truthfully and handle your complaint (Law 1480).", "Taxis y transporte público: Superintendencia de Transporte y la secretaría de movilidad de la ciudad.": "Taxis and public transport: Superintendencia de Transporte and the city's mobility department.", "Si hubo un incidente de seguridad, primero la denuncia (123).": "If there was a safety incident, report it first (123).", "Reversión del pago en línea: 5 días hábiles, en los casos de ley.": "Online payment reversal: 5 business days, in the cases set by law.", "Reclamo en la app con capturas del viaje y del cobro.": "Complaint in the app with screenshots of the trip and the charge.", "Si el cobro fue con tarjeta en línea y procede, pida la reversión.": "If you paid online by card and it applies, ask for the reversal.", "Queja ante la SIC; para taxis y servicio público, Superintendencia de Transporte.": "Complaint to the SIC; for taxis and public service, Superintendencia de Transporte.", "Capturas del viaje (ruta, conductor, placa, precio)": "Screenshots of the trip (route, driver, plate, price)", "Extracto del cobro": "Statement showing the charge", "Mensajes con soporte": "Messages with support", "El SOAT cubre a las víctimas de accidentes de tránsito, sin discutir culpas: atención médica, incapacidad, muerte y transporte de la víctima.": "SOAT insurance covers road accident victims regardless of fault: medical care, disability, death and transport of the victim.", "Si el vehículo no tenía SOAT o huyó, la reclamación se presenta ante la ADRES.": "If the vehicle had no SOAT or fled, the claim is filed with ADRES.", "El SOAT no cubre los daños a su vehículo ni a sus bienes: esos se reclaman al responsable o a su póliza.": "SOAT does not cover damage to your vehicle or belongings: claim those from the person responsible or their insurance.", "Las urgencias no pueden negarle la atención.": "Emergency services cannot refuse to treat you.", "Reclame pronto: los plazos y documentos varían.": "Claim promptly: deadlines and documents vary.", "Llame al 123 y pida el informe policial del accidente.": "Call 123 and ask for the police accident report.", "Atención en urgencias con los datos del SOAT del vehículo.": "Emergency care with the vehicle's SOAT details.", "Reclamación a la aseguradora del SOAT o a la ADRES.": "Claim to the SOAT insurer or to ADRES.", "Informe policial": "Police report", "Historia clínica": "Medical records", "Datos del vehículo y del SOAT": "Vehicle and SOAT details", "Documento de identidad": "ID document", "Deben entregarle en el plazo que aceptó al comprar; si no se pactó, en el plazo máximo que fija la ley (Ley 2439 de 2024).": "They must deliver within the period you accepted when buying; if none was agreed, within the maximum period set by law (Law 2439 of 2024).", "Si no cumplen, puede terminar el contrato y recuperar lo pagado.": "If they fail to deliver, you can end the contract and get back what you paid.", "Si el producto no está disponible, deben avisarle de inmediato; si cancela, el reembolso es en 15 días calendario. Si acepta un nuevo plazo (máximo 30 días) y lo incumplen, recupera todo sin descuentos.": "If the product is unavailable, they must tell you at once; if you cancel, the refund is within 15 calendar days. If you accept a new date (30 days at most) and they miss it, you get everything back with no deductions.", "Reversión del pago: 5 días hábiles.": "Payment reversal: 5 business days.", "Reembolso: 15 días calendario.": "Refund: 15 calendar days.", "Reclamo por el canal de atención de la tienda: debe darle un número de radicado.": "Complaint through the store's customer service channel: it must give you a filing number.", "Confirmación del pedido con el plazo de entrega": "Order confirmation showing the delivery date", "Número de radicado": "Filing number", "Si pagó con tarjeta o medio electrónico y el producto no llegó, la reversión del pago debe pedirse dentro de 5 días hábiles.": "If you paid by card or electronic means and the product did not arrive, the payment reversal must be requested within 5 business days.", "En compras a distancia puede retractarse dentro de 5 días hábiles, sin justificar (Ley 1480, art. 47).": "For distance purchases you can withdraw within 5 business days without giving a reason (Law 1480, art. 47).", "Devuelve el producto por los mismos medios; los costos de transporte de la devolución son suyos.": "You return the product the same way; the return shipping costs are yours.", "Le devuelven el dinero en máximo 15 días calendario, al mismo medio de pago (Ley 2439 de 2024).": "Your money is refunded within 15 calendar days at most, to the same payment method (Law 2439 of 2024).", "No aplica, entre otros, a servicios ya iniciados con su consentimiento, bienes personalizados, perecederos o de uso personal.": "It does not apply, among others, to services already started with your consent, personalised goods, perishables or items for personal use.", "Retracto: 5 días hábiles.": "Withdrawal: 5 business days.", "Escriba a la tienda ejerciendo el retracto y guarde la constancia.": "Write to the store exercising your right of withdrawal and keep proof.", "Devuelva el producto como indiquen.": "Return the product as instructed.", "Si no reembolsan, queja o demanda ante la SIC.": "If they do not refund, file a complaint or claim with the SIC.", "Factura": "Invoice", "Constancia del retracto": "Proof of withdrawal", "Guía de envío de la devolución": "Return shipping receipt", "El retracto vence a los 5 días hábiles: ejérzalo por escrito hoy.": "The withdrawal right expires after 5 business days: use it in writing today.", "Reparación gratuita; si la falla se repite, usted elige nueva reparación, cambio o devolución del precio (Ley 1480, art. 11).": "Free repair; if the fault comes back, you choose another repair, a replacement or a refund (Law 1480, art. 11).", "Productor y vendedor responden solidariamente: puede reclamar a cualquiera (Ley 1480, art. 10).": "Producer and seller are jointly liable: you can claim from either (Law 1480, art. 10).", "Reparación en máximo 30 días hábiles si la SIC no fija otro plazo; con bien en préstamo, hasta 60 (Decreto 735 de 2013, art. 8).": "Repair within 30 business days at most unless the SIC sets another period; up to 60 if you are lent a replacement (Decree 735 of 2013, art. 8).", "Si no indicaron plazo, la garantía de un producto nuevo es de un año.": "If no period was stated, a new product's warranty is one year.", "Demanda: hasta un año después de vencida la garantía.": "Claim: up to one year after the warranty expires.", "Reclamo escrito al vendedor o al fabricante; exija constancia de recibo del producto.": "Written complaint to the seller or manufacturer; ask for a receipt when you hand in the product.", "Si no responden o niegan sin razón, demanda ante la SIC.": "If they do not reply or refuse without reason, file a claim with the SIC.", "Constancia de entrega a reparación": "Receipt for the product handed in for repair", "Fotos o video de la falla": "Photos or video of the fault", "Reversión del pago: en compras en línea con tarjeta u otro instrumento electrónico, por fraude, operación no solicitada, producto no recibido, distinto o defectuoso (Ley 1480, art. 51; Decreto 587 de 2016).": "Payment reversal: for online purchases by card or other electronic means, in cases of fraud, unrequested transactions, or products not received, different or faulty (Law 1480, art. 51; Decree 587 of 2016).", "Fraude bancario: avise de inmediato al banco, inactive sus productos, guarde pruebas y denuncie ante la Policía (CAI Virtual) o la Fiscalía.": "Bank fraud: tell your bank at once, block your cards and accounts, keep evidence and report it to the Police (CAI Virtual) or the Fiscalía.", "Puede quejarse ante el banco, su Defensor del Consumidor Financiero o la Superfinanciera; si no hay acuerdo, demandar ante la Superfinanciera, sin abogado si el valor es menor a 40 salarios mínimos.": "You can complain to the bank, its Financial Consumer Ombudsman or the Superfinanciera; if there is no agreement, sue before the Superfinanciera, without a lawyer if the amount is below 40 minimum wages.", "Reversión: 5 días hábiles desde que se enteró.": "Reversal: 5 business days from when you found out.", "Demanda ante la Superfinanciera: hasta un año desde el fin de la relación con la entidad.": "Lawsuit before the Financial Superintendence: up to one year after the relationship with the bank ends.", "Llame al banco y bloquee.": "Call the bank and block everything.", "Reclamo escrito al banco y, si aplica, solicitud de reversión al vendedor y al emisor.": "Written complaint to the bank and, if it applies, a reversal request to the seller and the card issuer.", "Denuncia penal.": "Criminal complaint.", "Defensor del Consumidor Financiero o Superfinanciera.": "Financial Consumer Ombudsman or Superfinanciera.", "Extracto con los cobros": "Statement showing the charges", "Capturas de mensajes o llamadas sospechosas": "Screenshots of suspicious messages or calls", "Radicado del reclamo": "Complaint filing number", "Bloquee hoy sus productos y avise al banco: cada hora cuenta en un fraude.": "Block your cards and accounts today and tell the bank: every hour counts in a fraud.", "Antes de demandar debe reclamar a la entidad; adjunte el reclamo y la respuesta a la demanda.": "Before suing you must complain to the institution; attach the complaint and its reply to the claim.", "Puede acudir al Defensor del Consumidor Financiero de la entidad o quejarse ante la Superfinanciera.": "You can go to the institution's Financial Consumer Ombudsman or complain to the Superfinanciera.", "Acción de protección al consumidor financiero: ante un juez o la Superfinanciera (una sola vía), sin abogado hasta 40 salarios mínimos.": "Financial consumer protection claim: before a judge or the Superfinanciera (one route only), without a lawyer up to 40 minimum wages.", "Puede cancelar un producto cuando lo necesite, sin penalidades injustificadas.": "You can cancel a product whenever you need to, without unjustified penalties.", "Demanda: hasta un año desde el fin de la relación con la entidad.": "Claim: up to one year from the end of your relationship with the institution.", "Reclamo escrito a la entidad.": "Written complaint to the institution.", "Defensor del Consumidor Financiero o queja ante la Superfinanciera.": "Financial Consumer Ombudsman or complaint to the Superfinanciera.", "Demanda ante la Superfinanciera o un juez.": "Claim before the Superfinanciera or a judge.", "Contrato o póliza": "Contract or policy", "Extractos": "Statements", "Radicado del reclamo y respuesta": "Complaint filing number and reply", "Solo pueden contactarlo por los canales que usted autorizó, de lunes a viernes de 7 a. m. a 7 p. m. y sábados de 8 a. m. a 3 p. m.; nunca domingos ni festivos (Ley 2300 de 2023).": "They may only contact you through the channels you authorised, Monday to Friday from 7 a.m. to 7 p.m. and Saturdays from 8 a.m. to 3 p.m.; never on Sundays or public holidays (Law 2300 of 2023).", "No pueden usar varios canales la misma semana ni contactarlo más de una vez al día, ni llamar a sus referencias; tampoco visitar su casa o trabajo, salvo excepciones.": "They cannot use several channels in the same week, contact you more than once a day or call your references; nor visit your home or workplace, with some exceptions.", "Un reporte negativo dura el doble del tiempo de la mora, máximo 4 años, y caduca a los 8 años de la mora (Ley 2157 de 2021).": "A negative credit report lasts twice as long as the arrears, up to 4 years, and expires 8 years after the arrears (Law 2157 of 2021).", "Deben responder sus reclamos en 15 días hábiles (prorrogables 8); si no responden, se entiende aceptado.": "They must answer your complaints within 15 business days (extendable by 8); if they do not reply, your complaint is deemed accepted.", "Reclamo de hábeas data: 15 días hábiles, más 8 de prórroga.": "Data protection (habeas data) complaint: 15 business days, plus an 8-day extension.", "Reclamo escrito a la entidad que lo reporta o lo cobra.": "Written complaint to the institution that reported you or is collecting the debt.", "Si no responde o incumple, queja ante la Superfinanciera o la SIC.": "If it does not reply or does not comply, complain to the Superfinanciera or the SIC.", "Registro de llamadas y mensajes con fecha y hora": "Log of calls and messages with date and time", "Certificado de la central de riesgo": "Credit bureau certificate", "Paz y salvo, si lo tiene": "Certificate of no debt, if you have it", "Toda petición o queja recibe un código único (CUN); el operador debe responder en 15 días hábiles. Si no responde a tiempo, se entiende aceptada (silencio administrativo positivo).": "Every request or complaint gets a unique code (CUN); the operator must reply within 15 business days. If it does not reply in time, your request is deemed accepted (positive administrative silence).", "Si niega, presente reposición y, en subsidio, apelación en un solo escrito; la apelación la decide la SIC.": "If it refuses, file an appeal for reconsideration and, in the alternative, an appeal to the SIC in a single document; the SIC decides the appeal.", "Puede cancelar el servicio; el operador debe tramitar la solicitud sin trabas.": "You can cancel the service; the operator must process the request without obstacles.", "Si el servicio falla, puede pedir el descuento correspondiente y, si el incumplimiento es grave, terminar sin penalidad.": "If the service fails, you can ask for the corresponding discount and, if the breach is serious, end the contract without penalty.", "Respuesta del operador: 15 días hábiles.": "Operator's reply: 15 business days.", "Recurso de reposición, con apelación en subsidio: 10 días hábiles desde que le notifican la respuesta.": "Appeal for reconsideration, with a further appeal in the alternative: 10 business days from when you are notified of the reply.", "Si la respuesta no llega a tiempo, el operador debe cumplir lo pedido en 72 horas.": "If the reply does not arrive in time, the operator must do what you asked within 72 hours.", "PQR al operador y anote el CUN.": "Complaint (PQR) to the operator, and note the CUN.", "Reposición y apelación en subsidio.": "Appeal for reconsideration with a further appeal in the alternative.", "Queja ante la SIC con el CUN.": "Complaint to the SIC with the CUN.", "Número CUN": "CUN number", "Capturas de fallas o pruebas de velocidad": "Screenshots of outages or speed tests", "Puede reclamar ante la empresa; debe responder en 15 días hábiles. Si no responde, el reclamo se entiende resuelto a su favor (Ley 142 de 1994, art. 158).": "You can complain to the company; it must reply within 15 business days. If it does not reply, the complaint is deemed resolved in your favour (Law 142 of 1994, art. 158).", "No pueden exigirle pagar la factura reclamada para tramitar su recurso; pague lo no reclamado o el promedio de los últimos cinco periodos (art. 155).": "They cannot make you pay the disputed bill to process your appeal; pay the undisputed part or the average of the last five billing periods (art. 155).", "No pueden suspender ni cortar el servicio mientras resuelven el recurso presentado a tiempo, salvo excepciones (art. 155).": "They cannot suspend or cut off the service while they decide an appeal filed on time, with some exceptions (art. 155).", "No proceden reclamos contra facturas con más de cinco meses de expedidas (art. 154).": "Bills issued more than five months ago can no longer be disputed (art. 154).", "Recurso de reposición: 5 días desde que conoce la decisión.": "Appeal for reconsideration: 5 days from when you learn of the decision.", "Respuesta: 15 días hábiles.": "Reply: 15 business days.", "Facturas de más de 5 meses: ya no se pueden reclamar.": "Bills older than 5 months can no longer be disputed.", "Reclamo escrito a la empresa.": "Written complaint to the company.", "Recurso de reposición y, en subsidio, apelación ante la Superintendencia de Servicios Públicos.": "Appeal for reconsideration and, in the alternative, an appeal to the Superintendencia de Servicios Públicos.", "Facturas": "Bills", "Fotos del medidor": "Photos of the meter", "Para recurrir una factura tiene solo 5 días desde que conoce la decisión de la empresa.": "To challenge a bill you have only 5 days from when you learn of the company's decision.", "Si el servicio no se presta como se contrató, usted elige que se preste en las condiciones contratadas o la devolución del precio pagado (Ley 1480, art. 11, num. 3, citado por la SIC).": "If the service is not provided as agreed, you choose whether it is provided under the agreed conditions or the price you paid is refunded (Law 1480, art. 11, para. 3, cited by the SIC).", "El organizador debe informar la cancelación o el aplazamiento de forma oportuna, clara y veraz (Circular SIC 004 de 2022).": "The organiser must announce a cancellation or postponement in a timely, clear and truthful way (SIC Circular 004 of 2022).", "La SIC puede ordenar medidas para evitar daños a los consumidores; la devolución de los cargos de servicio depende del caso.": "The SIC can order measures to prevent harm to consumers; whether service fees are refunded depends on the case.", "Reclamo al organizador y a la boletera: 15 días hábiles de respuesta.": "Complaint to the organiser and the ticket seller: 15 business days to reply.", "Reclamo escrito al organizador y a la boletera.": "Written complaint to the organiser and the ticket seller.", "Si no devuelven, demanda de efectividad de la garantía ante la SIC.": "If they do not refund, a warranty enforcement claim before the SIC.", "Boletas y comprobante de compra": "Tickets and proof of purchase", "Anuncio de la cancelación": "Cancellation announcement", "La propina es voluntaria (Ley 1935 de 2018).": "Tipping is voluntary (Law 1935 of 2018).", "Deben preguntarle si la acepta antes de facturar; si aparece en la factura, puede negarse a pagarla.": "They must ask whether you accept it before billing; if it appears on the bill, you can refuse to pay it.", "El precio que paga es el precio anunciado, con impuestos incluidos (Ley 1480, art. 26).": "The price you pay is the advertised price, taxes included (Law 1480, art. 26).", "Reclame en el momento y pida la factura corregida.": "Complain on the spot and ask for a corrected bill.", "Pida que retiren la propina o el cobro no informado.": "Ask them to remove the tip or the undisclosed charge.", "Si se niegan, denuncia ante la SIC.": "If they refuse, report it to the SIC.", "Foto de la carta con los precios": "Photo of the menu with prices", "El parqueadero debe custodiar el vehículo y devolverlo en el mismo estado en que lo recibió (Ley 1480).": "The car park must look after the vehicle and return it in the same condition it was received (Law 1480).", "Los avisos de «no respondemos por daños ni robos» son cláusulas abusivas y no lo dejan sin derecho a reclamar (SIC, 2026).": "“We are not liable for damage or theft” signs are unfair terms and do not take away your right to claim (SIC, 2026).", "Deben darle un recibo con tarifas; si no anota daños previos, se presume que el vehículo entró en buen estado.": "They must give you a receipt showing the rates; if they do not note existing damage, the vehicle is presumed to have entered in good condition.", "Los objetos dentro del carro solo se cubren si avisó al personal. Los parqueaderos residenciales siguen la Ley 675 de 2001.": "Items inside the car are only covered if you told the staff. Residential car parks follow Law 675 of 2001.", "Reporte antes de salir del parqueadero, por escrito.": "Report it in writing before leaving the car park.", "Deje constancia escrita antes de retirarse y tome fotos.": "Leave a written record before you leave and take photos.", "Reclamo escrito al parqueadero.": "Written complaint to the car park.", "Si no responden, demanda ante la SIC.": "If they do not reply, file a claim with the SIC.", "Recibo de entrada": "Entry ticket", "Testigos": "Witnesses", "Cotización de la reparación": "Repair quote", "El vehículo tiene la garantía indicada en su manual; si no se indicó plazo, un año desde la entrega (Ley 1480, art. 8).": "The vehicle has the warranty stated in its manual; if no period was stated, one year from delivery (Law 1480, art. 8).", "Reparación gratuita de piezas con defecto de fábrica; si la falla se repite, usted elige nueva reparación, cambio o devolución (Ley 1480, art. 11).": "Free repair of parts with manufacturing defects; if the fault comes back, you choose another repair, a replacement or a refund (Law 1480, art. 11).", "Consulte si su modelo tiene una campaña de seguridad (llamado a revisión) vigente.": "Check whether your model has an open safety recall.", "Reparación: 30 días hábiles si la SIC no fija otro plazo (Decreto 735 de 2013).": "Repair: 30 business days unless the SIC sets another period (Decree 735 of 2013).", "Reclamo escrito al concesionario o al importador, con orden de servicio.": "Written complaint to the dealer or importer, with the service order.", "Si la falla se repite, pida por escrito el cambio o la devolución.": "If the fault comes back, ask in writing for a replacement or a refund.", "Demanda ante la SIC.": "Claim before the SIC.", "Factura y manual de garantía": "Invoice and warranty manual", "Órdenes de servicio de cada ingreso al taller": "Service orders for each workshop visit", "Garantía legal de un inmueble: estabilidad de la obra por 10 años y acabados por 1 año (Ley 1480, art. 8).": "Legal warranty for a property: structural stability for 10 years and finishes for 1 year (Law 1480, art. 8).", "Los proyectos nuevos de cinco o más unidades, o de 2.000 m² o más, deben amparar al comprador si la estructura falla en los 10 años siguientes (Ley 1796 de 2016 y Decreto 282 de 2019).": "New projects of five or more units, or of 2,000 m² or more, must protect the buyer if the structure fails within the following 10 years (Law 1796 of 2016 and Decree 282 of 2019).", "Al reclamar, deben darle constancia de recibo y hacer una visita de verificación en 5 días hábiles; los acabados se reparan en 30 días hábiles después de aceptar el reclamo (Decreto 735 de 2013, art. 13).": "When you complain, they must give you a receipt and carry out an inspection visit within 5 business days; finishes are repaired within 30 business days after the complaint is accepted (Decree 735 of 2013, art. 13).", "Acabados: 1 año.": "Finishes: 1 year.", "Estabilidad: 10 años.": "Structural stability: 10 years.", "Reclamo escrito a la constructora con fotos.": "Written complaint to the builder with photos.", "Exija la visita en 5 días hábiles.": "Insist on the visit within 5 business days.", "Escritura y acta de entrega": "Title deed and handover record", "Fotos con fecha": "Dated photos", "Reclamos y respuestas": "Complaints and replies", "Primero, PQRS ante su EPS y guarde el número de radicado.": "First, file a PQRS with your EPS and keep the filing number.", "Si no responden o la respuesta no es satisfactoria, queja ante la Superintendencia de Salud.": "If they do not reply or the reply is unsatisfactory, complain to the Superintendencia de Salud.", "En urgencia vital puede presentar una tutela desde el primer día; el juez decide en máximo 10 días.": "In a life-threatening emergency you can file a tutela from day one; the judge decides within 10 days at most.", "Tutela: el juez decide en máximo 10 días.": "Tutela: the judge decides within 10 days at most.", "PQRS a la EPS o a la prepagada.": "PQRS to the EPS or private health plan.", "Queja ante la Superintendencia de Salud con el radicado.": "Complaint to the Superintendencia de Salud with the filing number.", "Tutela si hay urgencia.": "Tutela if it is urgent.", "Orden médica": "Doctor's order", "Radicado de la PQRS": "PQRS filing number", "Puede consultar sus datos; deben responder en 10 días hábiles (prorrogables 5) (Ley 1581 de 2012, art. 14).": "You can ask to see your data; they must reply within 10 business days (extendable by 5) (Law 1581 of 2012, art. 14).", "Puede reclamar para corregir, actualizar o suprimir sus datos; deben responder en 15 días hábiles (prorrogables 8) e incluir la leyenda «reclamo en trámite» (art. 15).": "You can file a complaint to correct, update or delete your data; they must reply within 15 business days (extendable by 8) and flag it as “complaint in progress” (art. 15).", "Solo puede quejarse ante la SIC después de agotar la consulta o el reclamo ante la empresa (art. 16).": "You can only complain to the SIC after exhausting the request or complaint to the company (art. 16).", "Los mensajes comerciales requieren su autorización y deben permitirle darse de baja en cualquier momento (Ley 2300 de 2023).": "Marketing messages require your consent and must let you unsubscribe at any time (Law 2300 of 2023).", "Consulta: 10 días hábiles.": "Data request: 10 business days.", "Reclamo: 15 días hábiles.": "Complaint: 15 business days.", "Consulta o reclamo escrito a la empresa.": "Written request or complaint to the company.", "Si no responde o incumple, queja ante la SIC.": "If it does not reply or comply, complain to the SIC.", "Capturas de los mensajes": "Screenshots of the messages", "Constancia de la consulta o del reclamo": "Proof of the request or complaint", "La permanencia mínima solo vale si se pactó de forma expresa y, por regla general, por máximo un año (Ley 1480, art. 41).": "A minimum term only applies if it was expressly agreed and, as a rule, for one year at most (Law 1480, art. 41).", "En ventas en línea de contratos continuos, deben informarle la duración mínima antes de contratar (Ley 2439 de 2024).": "For ongoing contracts sold online, they must tell you the minimum term before you sign up (Law 2439 of 2024).", "Cargos por servicios que no aceptó no son exigibles.": "Charges for services you did not accept cannot be enforced.", "Guarde la constancia de su solicitud de cancelación.": "Keep proof of your cancellation request.", "Solicite la cancelación por el canal por el que contrató y guarde la constancia.": "Request cancellation through the channel you used to sign up and keep proof.", "Si siguen cobrando, reclamo y, si procede, reversión del pago.": "If they keep charging, complain and, if it applies, request a payment reversal.", "Queja ante la SIC (o la Superfinanciera para productos financieros).": "Complaint to the SIC (or the Superfinanciera for financial products).", "Contrato o condiciones": "Contract or terms", "Extractos con los cobros": "Statements showing the charges", "La publicidad engañosa está prohibida; el anunciante responde por los daños que cause (Ley 1480, art. 30).": "Misleading advertising is prohibited; the advertiser is liable for the harm it causes (Law 1480, art. 30).", "Usted solo está obligado a pagar el precio anunciado (Ley 1480, art. 26).": "You only have to pay the advertised price (Law 1480, art. 26).", "Las ofertas en línea deben indicar su vigencia y la disponibilidad del producto (Ley 2439 de 2024).": "Online offers must state how long they last and whether the product is available (Law 2439 of 2024).", "Reclamo al vendedor: 15 días hábiles de respuesta.": "Complaint to the seller: 15 business days to reply.", "Guarde la publicidad (captura con fecha).": "Keep the advert (a dated screenshot).", "Reclamo escrito pidiendo que respeten lo anunciado.": "Written complaint asking them to honour what was advertised.", "Denuncia ante la SIC; si sufrió un daño, demanda.": "Report it to the SIC; if you suffered harm, file a claim.", "Captura de la publicidad": "Screenshot of the advert", " Verifique si ese plazo ya pasó; aún puede quedar la vía del reclamo y la SIC.": " Check whether that deadline has already passed; the complaint route and the SIC may still be open.", "Registro Nacional de Turismo (RNT) antes de empezar, tramitado ante la cámara de comercio (Ley 2068 de 2020, art. 3).": "National Tourism Registry (RNT) before starting, processed through the chamber of commerce (Law 2068 of 2020, art. 3).", "Registro mercantil activo y RUT, que se piden para tramitar el RNT.": "An active commercial registration and tax ID (RUT), both required to obtain the RNT.", "Un código de conducta contra la explotación sexual de niños, niñas y adolescentes, adoptado y fijado en un lugar visible; sin él no se puede inscribir ni actualizar el RNT (Ley 1336 de 2009, arts. 1 y 5).": "A code of conduct against the sexual exploitation of children and adolescents, adopted and posted in a visible place; without it the RNT cannot be registered or updated (Law 1336 of 2009, arts. 1 and 5).", "No alojar a menores de edad sin la compañía o la autorización de sus padres o representantes, como exige la Alcaldía de Medellín.": "Do not host minors without their parents’ or guardians’ presence or authorisation, as required by the Medellín mayor’s office.", "Contribución parafiscal al FONTUR: 2,5 por mil de los ingresos de la actividad turística, cada trimestre; si no hubo ingresos, se declara en cero (Ley 1101 de 2006, art. 3).": "Para-fiscal contribution to FONTUR: 2.5 per thousand of tourism income, every quarter; with no income, a zero return is filed (Law 1101 of 2006, art. 3).", "En Medellín, además: uso del suelo que lo permita, reglamento del edificio que lo autorice expresamente, aviso escrito a la Policía (Ley 1801 de 2016, art. 87), certificado de seguridad de bomberos, concepto sanitario favorable y, si pone música o televisión al público, paz y salvo de derechos de autor.": "In Medellín, also: zoning that allows it, building rules that expressly authorise it, written notice to the police (Law 1801 of 2016, art. 87), a fire-safety certificate, a favourable health inspection and, if you play music or TV for guests in public areas, copyright clearance.", "Y con cada huésped: la TRA, el reporte al SIRE si es extranjero y una póliza que cubra daños a huéspedes y a terceros (Ley 2068 de 2020, arts. 22 y 32).": "And with every guest: the TRA, the SIRE report if they are foreign, and an insurance policy covering harm to guests and third parties (Law 2068 of 2020, arts. 22 and 32).", "RNT: renovación cada año, entre enero y el 31 de marzo.": "RNT: renewal every year, between January and 31 March.", "FONTUR: declaración y pago cada trimestre.": "FONTUR: return and payment every quarter.", "TRA y SIRE: con cada huésped, en los plazos que fijan el MinCIT y Migración Colombia.": "TRA and SIRE: for every guest, within the deadlines set by MinCIT and Migración Colombia.", "RNT, registro mercantil y renovaciones: ante la cámara de comercio.": "RNT, commercial registration and renewals: at the chamber of commerce.", "TRA: plataforma del MinCIT. SIRE: portal de Migración Colombia.": "TRA: MinCIT’s platform. SIRE: Migración Colombia’s portal.", "Uso del suelo: Planeación municipal. Bomberos y concepto sanitario: Cuerpo de Bomberos y Secretaría de Salud.": "Zoning: the municipal planning office. Fire and health: the fire department and the health secretariat.", "Un alojamiento sin RNT o que no cumple se reporta ante la SIC; si hay peligro, llame al 123.": "A property with no RNT or that doesn’t comply can be reported to the SIC; if there is danger, call 123.", "Certificado del RNT": "RNT certificate", "Registro mercantil y RUT": "Commercial registration and RUT", "Código de conducta contra la explotación sexual de menores, firmado y visible": "Signed and posted code of conduct against child sexual exploitation", "Póliza de responsabilidad": "Liability insurance policy", "Concepto de uso del suelo y reglamento del edificio": "Land-use statement and building rules", "Certificado de bomberos y concepto sanitario": "Fire-safety certificate and health inspection", "Constancia del aviso a la Policía": "Proof of notice to the police", "Declaraciones al FONTUR": "FONTUR returns", "Quien arrienda o subarrienda vivienda por periodos inferiores a 30 días presta un servicio turístico (Ley 2068 de 2020, art. 37).": "Renting or subletting a home for periods of less than 30 days is a tourism service (Colombian Law 2068 of 2020, art. 37).", "Todo prestador debe inscribirse en el Registro Nacional de Turismo (RNT) antes de prestar el servicio (Ley 2068 de 2020, art. 3).": "Every provider must register in the National Tourism Registry (RNT) before offering the service (Law 2068 of 2020, art. 3).", "Prestar el servicio sin RNT es una infracción: la SIC puede imponer las sanciones del Estatuto del Consumidor y cancelar el registro hasta por 5 años (Ley 2068 de 2020, arts. 71 y 72).": "Operating without an RNT is an infringement: the SIC can impose the Consumer Statute’s penalties and cancel the registration for up to 5 years (Law 2068 of 2020, arts. 71 and 72).", "Las plataformas deben dejar un espacio para el número de RNT y retirar los anuncios de prestadores sin RNT activo cuando la autoridad lo pida (Ley 2068 de 2020, art. 38).": "Platforms must provide a space for the RNT number and remove listings by providers without an active RNT when the authorities request it (Law 2068 of 2020, art. 38).", "El RNT se renueva cada año, entre enero y el 31 de marzo.": "The RNT must be renewed every year, between January and 31 March.", "Verifique en el RNT que su inscripción esté activa.": "Check in the RNT that your registration is active.", "Si no la tiene, inscríbase antes de seguir publicando y muestre el número en cada anuncio.": "If you don’t have one, register before listing again and show the number on every listing.", "Revise también el reglamento del edificio y el uso del suelo de su zona: el RNT solo no basta.": "Also check the building rules and your area’s zoning: the RNT alone is not enough.", "Certificado del RNT vigente": "Valid RNT certificate", "Registro mercantil y RUT, si aplica": "Commercial registration and tax ID (RUT), if applicable", "Capturas de sus anuncios con el número de RNT": "Screenshots of your listings showing the RNT number", "El reglamento de propiedad horizontal obliga a los propietarios y a quienes usan los inmuebles del edificio (Ley 675 de 2001).": "The building’s condominium rules bind owners and anyone using the units (Colombian Law 675 of 2001).", "Para operar una vivienda turística, la Alcaldía de Medellín exige que el reglamento autorice expresamente esa actividad.": "To run a short-term rental, the Medellín mayor’s office requires the building rules to expressly authorise that activity.", "Las multas por incumplir el reglamento se repiten mientras dure el incumplimiento; cada una no puede superar dos veces la cuota de administración mensual, y en total no más de diez veces (Ley 675 de 2001, art. 59).": "Fines for breaking the building rules repeat while the breach continues; each cannot exceed twice the monthly service charge, and no more than ten times in total (Law 675 of 2001, art. 59).", "Antes de sancionarlo, la copropiedad debe darle la oportunidad de explicarse y defenderse.": "Before fining you, the condominium must give you the chance to explain yourself and defend your position.", "Revise en la carta de sanción y en el reglamento el plazo para presentar descargos o recursos.": "Check the fine letter and the building rules for the deadline to respond or appeal.", "Pida el reglamento registrado y el acta o la decisión que impuso la multa.": "Ask for the registered building rules and the minutes or decision imposing the fine.", "Presente sus descargos por escrito dentro del plazo.": "Submit your written response within the deadline.", "Si el reglamento no lo permite, suspenda el alquiler por días mientras se define, para no acumular multas.": "If the rules don’t allow it, pause short-term rentals while the matter is settled, so fines don’t pile up.", "Reglamento de propiedad horizontal registrado": "Registered building rules", "Carta o resolución de la multa": "Fine letter or decision", "Actas de asamblea": "Minutes of owners’ meetings", "Todo prestador de alojamiento debe registrar a sus huéspedes en la Tarjeta de Registro de Alojamiento (TRA), que sirve como prueba del contrato de hospedaje (Ley 2068 de 2020, art. 22).": "Every accommodation provider must record guests on the Accommodation Registration Card (TRA), which serves as proof of the lodging contract (Law 2068 of 2020, art. 22).", "Los huéspedes extranjeros también se reportan a Migración Colombia en el SIRE (Resolución 2357 de 2020), y no hacerlo a tiempo puede dar lugar a multas.": "Foreign guests must also be reported to Migración Colombia through SIRE (Resolution 2357 of 2020), and failing to do so on time can lead to fines.", "Los prestadores de alojamiento deben tener una póliza de seguro que cubra daños a huéspedes y a terceros (Ley 2068 de 2020, art. 32).": "Accommodation providers must hold an insurance policy covering harm to guests and third parties (Law 2068 of 2020, art. 32).", "En Medellín, la apertura de la vivienda turística se comunica por escrito a la estación de Policía más cercana (Ley 1801 de 2016, art. 87).": "In Medellín, the opening of a short-term rental must be notified in writing to the nearest police station (Law 1801 of 2016, art. 87).", "Reporte en el SIRE cada entrada y salida de huéspedes extranjeros dentro del plazo que fija Migración Colombia.": "Report every foreign guest’s arrival and departure in SIRE within the deadline set by Migración Colombia.", "Haga la TRA de cada huésped a su llegada.": "Complete the TRA for each guest on arrival.", "Reporte en el SIRE la entrada y la salida de cada huésped extranjero.": "Report each foreign guest’s arrival and departure in SIRE.", "Guarde las constancias de cada registro y la póliza vigente.": "Keep proof of each record and a valid insurance policy.", "Constancias de la TRA": "TRA records", "Reportes del SIRE": "SIRE reports", "Además del RNT, el uso del suelo de la zona debe permitir el alojamiento turístico según el Plan de Ordenamiento Territorial (POT).": "Besides the RNT, the area’s zoning must allow tourist accommodation under the land-use plan (POT).", "En Medellín, según el POT vigente (Acuerdo 48 de 2014), la vivienda turística se permite en zonas de media y alta mixtura de usos.": "In Medellín, under the current POT (Agreement 48 of 2014), short-term rentals are allowed in medium- and high-mixed-use zones.", "Un proyecto de revisión del POT la limitaría a zonas de alta mixtura, zonas de tratamiento especial y áreas de desarrollo orientado al transporte; aún no está aprobado.": "A draft revision of the POT would limit it to high-mixed-use zones, special treatment zones and transit-oriented development areas; it has not been approved yet.", "Verifique el uso del suelo antes de comprar o de publicar un anuncio.": "Check the zoning before buying or listing.", "Consulte el uso del suelo de su predio ante Planeación de Medellín y pida el concepto por escrito.": "Check your property’s zoning with Medellín’s Planning Department and ask for the written land-use statement.", "Revise que el reglamento del edificio autorice la actividad.": "Check that the building rules authorise the activity.", "Siga las novedades del nuevo POT antes de invertir.": "Follow the news on the new POT before investing.", "Concepto de uso del suelo": "Land-use statement", "Escritura y certificado de libertad": "Title deed and property certificate", "Reglamento de propiedad horizontal": "Building rules", "Los términos de la plataforma fijan sus reglas, una apelación interna y a veces un arbitraje en el exterior. Si el servicio se ofrece en Colombia, la ley colombiana y la SIC también pueden aplicar.": "The platform’s terms set its rules, an internal appeal and sometimes arbitration abroad. If the service is offered in Colombia, Colombian law and the SIC may also apply.", "Si usa la plataforma como consumidor, las cláusulas abusivas no producen efectos (Ley 1480, arts. 42 y 43).": "If you use the platform as a consumer, abusive clauses have no effect (Law 1480, arts. 42 and 43).", "Puede pedir a la plataforma qué datos personales tiene sobre usted y para qué los usa: debe responder en 10 días hábiles, prorrogables 5 (Ley 1581 de 2012, art. 14).": "You can ask the platform what personal data it holds about you and what it uses it for: it must answer within 10 business days, extendable by 5 (Law 1581 of 2012, art. 14).", "Apelación interna: revise el plazo en los términos de la plataforma; suele ser corto.": "Internal appeal: check the deadline in the platform’s terms; it is usually short.", "Consulta de datos personales: 10 días hábiles, prorrogables 5.": "Personal data request: 10 business days, extendable by 5.", "Pida por escrito el motivo concreto y la regla que aplicaron.": "Ask in writing for the specific reason and the rule applied.", "Use la apelación interna y guarde la constancia.": "Use the internal appeal and keep proof.", "Si no resuelven, queja ante la SIC o la vía que fijen los términos.": "If it isn’t resolved, complain to the SIC or use the route set in the terms.", "Avisos y correos de suspensión": "Suspension notices and emails", "Copia descargada de sus datos": "Downloaded copy of your data", "Capturas de su perfil e historial": "Screenshots of your profile and history", "Los términos de la plataforma fijan cuándo puede retener pagos y por cuánto tiempo: es la primera regla que se revisa.": "The platform’s terms set when it may withhold payouts and for how long: that is the first rule to check.", "Una retención que no se ajusta a los términos es un incumplimiento del contrato y puede reclamarse.": "Withholding that doesn’t follow the terms is a breach of contract and can be claimed.", "Si usted actúa como consumidor y el servicio se ofrece en Colombia, la SIC puede ser una vía; si es un negocio, la vía suele ser la del contrato.": "If you act as a consumer and the service is offered in Colombia, the SIC may be a route; if you are a business, the route is usually the contract.", "Descargue hoy el historial de pagos: puede dejar de estar disponible si la cuenta se cierra.": "Download your payout history today: it may become unavailable if the account is closed.", "Pida por escrito el motivo, el monto retenido y la fecha de liberación.": "Ask in writing for the reason, the amount withheld and the release date.", "Use la apelación interna.": "Use the internal appeal.", "Si no resuelven, carta formal de reclamación y, si el monto lo justifica, la vía del contrato o la SIC.": "If it isn’t resolved, send a formal claim letter and, if the amount justifies it, take the contractual route or go to the SIC.", "Historial de pagos y saldo pendiente": "Payout history and pending balance", "Términos vigentes en la fecha, en PDF": "Terms in force on the date, as PDF", "Avisos de la plataforma": "Platform notices", "En alojamiento, las plataformas deben dejar un espacio para el número de RNT y retirar los anuncios de prestadores sin RNT activo cuando la autoridad lo pida (Ley 2068 de 2020, art. 38).": "In accommodation, platforms must provide a space for the RNT number and remove listings by providers without an active RNT when the authorities request it (Law 2068 of 2020, art. 38).", "Fuera de esos casos, el retiro debe ajustarse a los términos de la plataforma: pida la regla concreta que aplicaron.": "Outside those cases, the removal must follow the platform’s terms: ask for the specific rule applied.", "No publique acusaciones contra la plataforma en redes: puede debilitar su reclamo.": "Don’t post accusations against the platform on social media: it can weaken your claim.", "Revise el plazo de apelación en los términos de la plataforma.": "Check the appeal deadline in the platform’s terms.", "Guarde capturas del anuncio y de sus calificaciones.": "Keep screenshots of the listing and your ratings.", "Pida el motivo por escrito y apele.": "Ask for the reason in writing and appeal.", "Si el motivo es el RNT, regularícelo y pida la reactivación.": "If the reason is the RNT, sort it out and ask for reactivation.", "Capturas del anuncio y de sus reseñas": "Screenshots of the listing and its reviews", "Aviso de retiro": "Removal notice", "Certificado del RNT, si aplica": "RNT certificate, if applicable", "Si pagó con tarjeta o medio electrónico, la reversión del pago debe pedirse dentro de los 5 días hábiles siguientes a enterarse del problema.": "If you paid by card or electronic means, the payment reversal must be requested within 5 business days of learning of the problem.", "Las plataformas donde otros venden deben exigir a cada vendedor datos que permitan identificarlo: nombre, documento, dirección y teléfonos (Ley 1480, art. 53).": "Marketplaces must require each seller to provide identifying details: name, ID document, address and phone numbers (Law 1480, art. 53).", "Si usted compró, puede consultar esos datos para presentar su queja o reclamo contra el vendedor (Ley 1480, art. 53).": "If you bought something, you can consult those details to file your complaint or claim against the seller (Law 1480, art. 53).", "Si pagó en línea con tarjeta y no recibió el producto, puede proceder la reversión del pago (Ley 1480, art. 51).": "If you paid online by card and did not receive the product, a payment reversal may apply (Law 1480, art. 51).", "Respuesta del vendedor a su reclamo: 15 días hábiles.": "Seller’s answer to your complaint: 15 business days.", "Pida a la plataforma los datos del vendedor, citando el artículo 53 de la Ley 1480.": "Ask the platform for the seller’s details, citing article 53 of Law 1480.", "Reclame por escrito al vendedor.": "Complain in writing to the seller.", "Si no responde, queja o demanda ante la SIC.": "If there’s no answer, file a complaint or claim with the SIC.", "Pedido y comprobante de pago": "Order and proof of payment", "Publicación del producto": "The product listing", "Mensajes con el vendedor y la plataforma": "Messages with the seller and the platform", "Una estancia de 30 días o más en vivienda urbana suele regirse por la Ley 820 de 2003, no por las normas de turismo.": "A stay of 30 days or more in urban housing is usually governed by Law 820 of 2003, not by tourism rules.", "El arrendador no puede exigir depósitos en dinero ni otras garantías reales para asegurar el pago (Ley 820 de 2003, art. 16).": "The landlord cannot require cash deposits or other collateral to secure payment (Law 820 of 2003, art. 16).", "El canon solo puede subir una vez cada 12 meses y como máximo en el IPC del año anterior (Ley 820 de 2003, art. 20).": "Rent can only rise once every 12 months and by no more than the previous year’s consumer price index (Law 820 of 2003, art. 20).", "El arrendador debe entregar el inmueble en buen estado y hacer las reparaciones necesarias; el arrendatario responde por las reparaciones locativas causadas por su uso (Ley 820 de 2003, arts. 8 y 9).": "The landlord must hand over the property in good condition and make necessary repairs; the tenant is responsible for minor repairs caused by their use (Law 820 of 2003, arts. 8 and 9).", "Medida temporal: si su vivienda o su contrato resultaron afectados directamente por el sismo del 10 de agosto de 2026, el Decreto 1423 de 2026 suspende por 6 meses la ejecución de órdenes de restitución, aplaza los reajustes del canon y permite prorrogar 6 meses los contratos que vencían entre el 10 de agosto y el 31 de diciembre de 2026, con excepciones (riesgo de colapso, vivienda propia del arrendador).": "Temporary measure: if your home or lease was directly affected by the earthquake of 10 August 2026, Decree 1423 of 2026 suspends enforcement of repossession orders for 6 months, postpones rent increases and lets leases ending between 10 August and 31 December 2026 be extended by 6 months, with exceptions (risk of collapse, landlord’s own housing).", "La terminación anticipada exige un preaviso escrito: revise el plazo en su contrato y en la Ley 820.": "Early termination requires written notice: check the period in your contract and in Law 820.", "Reclame por escrito al arrendador o a la inmobiliaria.": "Complain in writing to the landlord or the agency.", "Intente una conciliación.": "Try conciliation.", "Si no hay acuerdo, el caso va ante un juez civil; las alcaldías vigilan a las inmobiliarias (en Bogotá, la Secretaría del Hábitat).": "If there’s no agreement, the case goes to a civil judge; municipalities oversee rental agencies (in Bogotá, the Housing Secretariat).", "Contrato de arrendamiento": "Lease contract", "Recibos de pago del canon": "Rent payment receipts", "Inventario y fotos de la entrega": "Inventory and handover photos", "Llame ya a su banco por la línea oficial, reporte la transferencia y bloquee sus canales: en una transferencia inmediata, cada minuto cuenta.": "Call your bank now on its official line, report the transfer and block your channels: with an instant transfer, every minute counts.", "Su banco tiene un deber reforzado de seguridad: debe identificarlo bien y vigilar los movimientos inusuales por monto, frecuencia o destino.": "Your bank has a heightened duty of security: it must identify you properly and watch for unusual transactions by amount, frequency or destination.", "Si el banco no detectó ni frenó movimientos claramente inusuales, la Superfinanciera puede ordenarle devolver todo o parte del dinero; también se revisa si usted actuó con cuidado, por ejemplo si compartió claves o reportó tarde.": "If the bank failed to detect or stop clearly unusual transactions, the Financial Superintendence can order it to return all or part of the money; it also checks whether you acted carefully, for example whether you shared passwords or reported late.", "Si usted mismo autorizó la transferencia porque lo engañaron, recuperar el dinero es más difícil: por eso el reporte inmediato y la denuncia son decisivos.": "If you authorised the transfer yourself because you were deceived, getting the money back is harder: that is why reporting immediately and filing a police report are decisive.", "Puede quejarse ante el Defensor del Consumidor Financiero o la Superfinanciera, y demandar ante la Superfinanciera sin abogado si el valor es menor a 40 salarios mínimos.": "You can complain to the Financial Consumer Ombudsman or the Financial Superintendence, and sue before the Financial Superintendence without a lawyer if the amount is below 40 minimum monthly wages.", "Reporte al banco: de inmediato, en la primera hora.": "Report to the bank: immediately, within the first hour.", "Llame a su banco por la línea oficial, reporte la transferencia y bloquee la aplicación y las tarjetas. Algunos bancos permiten reportarlo desde su aplicación.": "Call your bank on its official line, report the transfer and block the app and cards. Some banks let you report it from their app.", "Pida por escrito que el banco contacte al banco que recibió el dinero para intentar retenerlo, y guarde el número de radicado.": "Ask the bank in writing to contact the receiving bank to try to hold the funds, and keep the reference number.", "Denuncie ante la Fiscalía o en el CAI Virtual de la Policía.": "File a report with the Attorney General’s Office or the Police’s virtual CAI.", "Si el banco no responde o se niega, Defensor del Consumidor Financiero y Superfinanciera.": "If the bank doesn’t answer or refuses, go to the Financial Consumer Ombudsman and the Financial Superintendence.", "Comprobante de la transferencia: hora, monto y llave o cuenta de destino": "Transfer receipt: time, amount and destination key or account", "Capturas del chat, el enlace o la llamada del engaño": "Screenshots of the chat, link or call used in the scam", "Radicado del reporte al banco": "Reference number of the report to the bank", "Mantenga la calma, no firme nada y, si puede hacerlo sin riesgo, grabe lo que pasa. Si hay violencia o amenazas, llame al 123.": "Stay calm, don’t sign anything and, if you can do so safely, record what happens. If there is violence or threats, call 123.", "Una estadía de menos de 30 días es un contrato de hospedaje (Ley 300 de 1996, art. 79). Solo termina antes de tiempo por falta de pago, por infracción del reglamento oficial del hospedaje o por otra causa pactada expresamente, como unas reglas de la casa que usted aceptó al reservar (Código de Comercio, arts. 1193 y 1197).": "A stay of less than 30 days is an accommodation contract (Law 300 of 1996, art. 79). It only ends early for non-payment, breach of the official accommodation regulations or another cause expressly agreed, such as house rules you accepted when booking (Commercial Code, arts. 1193 and 1197).", "Si el anfitrión lo saca sin una de esas causas, incumple: usted elige otro alojamiento de la misma calidad a costa de él, o el reembolso o la compensación (Ley 300 de 1996, art. 63), y puede reclamar los gastos extra.": "If the host removes you without one of those causes, it is a breach: you choose equivalent accommodation at the host’s expense, or a refund or compensation (Law 300 of 1996, art. 63), and you can claim extra costs.", "Durante la estadía, el alojamiento es su domicilio (Constitución, art. 28; Corte Constitucional, C-519 de 2007). La policía solo entra sin orden escrita por imperiosa necesidad, por ejemplo para auxiliar a alguien o por un incendio (Ley 1801 de 2016, art. 163).": "During your stay, the accommodation is your home (Constitution, art. 28; Constitutional Court, C-519 of 2007). The police may only enter without a written order in cases of pressing necessity, for example to help someone or because of a fire (Law 1801 of 2016, art. 163).", "La policía no decide quién tiene razón en el contrato: sus medidas sobre la tenencia de un inmueble son provisionales y el fondo lo resuelve un juez (Ley 1801 de 2016, art. 80). Usted puede grabar el procedimiento (art. 21).": "The police do not decide who is right under the contract: their measures on occupation of a property are provisional and the merits are decided by a judge (Law 1801 of 2016, art. 80). You may record the procedure (art. 21).", "Si el anfitrión termina el contrato, debe hacer un inventario de sus pertenencias ante testigos antes de retirarlas (Código de Comercio, art. 1198).": "If the host ends the contract, they must make an inventory of your belongings in front of witnesses before removing them (Commercial Code, art. 1198).", "Avise a la plataforma de inmediato, por su canal de emergencias.": "Tell the platform immediately, through its emergency channel.", "Reclamo escrito al anfitrión y a la plataforma: el mismo día; el proveedor tiene 15 días hábiles para responder.": "Written complaint to the host and the platform: the same day; the provider has 15 business days to reply.", "Pida el motivo por escrito y muestre su reserva y su pago. Si llega la policía, pida el nombre y la placa de los agentes y el motivo legal de la actuación.": "Ask for the reason in writing and show your booking and payment. If the police arrive, ask for the officers’ names and badge numbers and the legal ground for their action.", "Avise a la plataforma por su canal de emergencias y pida reubicación o reembolso.": "Alert the platform through its emergency channel and ask to be rebooked or refunded.", "Antes de salir, fotografíe sus pertenencias y no deje documentos ni dinero; si el anfitrión las retira, exija el inventario ante testigos.": "Before leaving, photograph your belongings and leave no documents or money behind; if the host removes them, demand the inventory in front of witnesses.", "Si hay violencia o amenazas, o le retienen sus cosas, llame al 123 y denuncie.": "If there is violence or threats, or your belongings are kept, call 123 and report it.", "Después: reclamo escrito al anfitrión y a la plataforma, y queja o demanda ante la SIC.": "Then: written complaint to the host and the platform, and a complaint or lawsuit before the SIC.", "Reserva y comprobante de pago": "Booking and proof of payment", "Mensajes del anfitrión y de la plataforma": "Messages from the host and the platform", "Video o audio de lo ocurrido, con nombre y placa de los policías": "Video or audio of what happened, with the officers’ names and badge numbers", "Facturas del nuevo alojamiento y del transporte": "Receipts for the new accommodation and transport", "Fotos o inventario de sus pertenencias": "Photos or inventory of your belongings", "No use la fuerza, no cambie la cerradura ni corte los servicios con el huésped adentro, y no retire sus cosas sin inventario: un problema del contrato puede volverse un problema penal. Si hay violencia, llame al 123.": "Don’t use force, don’t change the lock or cut off utilities with the guest inside, and don’t remove their belongings without an inventory: a contract problem can become a criminal one. If there is violence, call 123.", "El hospedaje termina al vencer el plazo, por falta de pago, por infracción del reglamento oficial del hospedaje o por otra causa pactada expresamente (Código de Comercio, arts. 1193 y 1197). Sus reglas de la casa solo cuentan como causa si el huésped las aceptó expresamente al reservar.": "Accommodation ends when the term expires, for non-payment, breach of the official accommodation regulations or another cause expressly agreed (Commercial Code, arts. 1193 and 1197). Your house rules only count as a cause if the guest expressly accepted them when booking.", "Si termina el contrato, haga un inventario de las pertenencias del huésped ante testigos antes de retirarlas (Código de Comercio, art. 1198). Si no paga, la ley prevé el remate de sus bienes por un martillo autorizado, no quedárselos (art. 1199).": "If you end the contract, make an inventory of the guest’s belongings in front of witnesses before removing them (Commercial Code, art. 1198). If the guest doesn’t pay, the law provides for an auction through an authorised auctioneer, not keeping the items (art. 1199).", "Mientras la estadía está vigente, el alojamiento es el domicilio del huésped (Constitución, art. 28; C-519 de 2007): entrar sin su permiso o grabar su vida privada adentro puede ser un delito (Código Penal, art. 189).": "While the stay is ongoing, the accommodation is the guest’s home (Constitution, art. 28; C-519 of 2007): entering without permission or recording their private life inside can be a crime (Criminal Code, art. 189).", "Por ruido, fiestas o riñas, la policía puede intervenir por convivencia (Ley 1801 de 2016, art. 33).": "For noise, parties or fights, the police can intervene under the coexistence rules (Law 1801 of 2016, art. 33).", "Si el huésped se queda después del fin de la reserva, el contrato ya terminó (Código de Comercio, art. 1197). El hospedaje tiene su propio mecanismo, distinto del proceso de restitución del arrendamiento: inventario ante testigos y retiro de las pertenencias (art. 1198), y querella ante la policía o el inspector como titular de la tenencia (Ley 1801 de 2016, arts. 77 y 79). Nunca por la fuerza.": "If the guest stays after the booking ends, the contract has ended (Commercial Code, art. 1197). Accommodation has its own mechanism, different from lease repossession: an inventory in front of witnesses and removal of belongings (art. 1198), and a complaint to the police or inspector as the lawful holder (Law 1801 of 2016, arts. 77 and 79). Never by force.", "Querella ante el inspector de policía como titular de la tenencia: preséntela cuanto antes; caduca a los 4 meses (Ley 1801 de 2016, arts. 79 y 80). La acción preventiva de 48 horas (art. 81) está pensada para ocupaciones de hecho: su uso contra un huésped que entró por contrato es discutible.": "Complaint to the police inspector as the lawful holder: file it as soon as possible; it lapses after 4 months (Law 1801 of 2016, arts. 79 and 80). The 48-hour preventive action (art. 81) is meant for unlawful occupations: using it against a guest who entered under a contract is debatable.", "Protección policiva de la tenencia: caduca a los 4 meses (Ley 1801 de 2016, art. 80).": "Police protection of occupation: expires after 4 months (Law 1801 of 2016, art. 80).", "Reporte a la plataforma: el mismo día, por su canal de emergencias.": "Report to the platform: the same day, through its emergency channel.", "Escriba al huésped, por la plataforma, el motivo y la hora de salida, citando sus reglas de la casa.": "Write to the guest through the platform with the reason and check-out time, citing your house rules.", "Avise a la plataforma por su canal de emergencias o de seguridad.": "Alert the platform through its emergency or safety channel.", "Si hay ruido, riña o peligro, llame al 123; si el huésped se queda después del fin de la reserva, pida la protección de la policía o del inspector.": "If there is noise, a fight or danger, call 123; if the guest stays after the booking ends, ask the police or police inspector for protection.", "No entre, no cambie la cerradura y no retire sus cosas sin inventario ante testigos.": "Don’t go in, don’t change the lock and don’t remove the guest’s belongings without an inventory in front of witnesses.", "Si no pagó o causó daños, use el reclamo de la plataforma y, si no se resuelve, la vía civil.": "If the guest didn’t pay or caused damage, use the platform’s claim process and, if that fails, a civil action.", "Reserva con fechas y reglas de la casa aceptadas": "Booking with dates and accepted house rules", "Mensajes con el huésped y la plataforma": "Messages with the guest and the platform", "Fotos o video de daños o del ruido, tomados desde zonas comunes": "Photos or video of damage or noise, taken from common areas", "Inventario firmado ante testigos, si retiró pertenencias": "Inventory signed in front of witnesses, if belongings were removed", "Número del reporte a la policía o a la plataforma": "Reference number of the report to the police or platform", "No salga del hotel sin una constancia escrita: pida que le confirmen por escrito que no hay habitación y qué solución le dan.": "Don’t leave the hotel without written proof: ask them to confirm in writing that there is no room and what solution they offer.", "La sobreventa es un incumplimiento: el hotel debe darle un alojamiento de la misma calidad, o la devolución o compensación del precio; si no tiene uno igual, debe contratarlo con un tercero a su costa (Ley 300 de 1996, arts. 63 y 64).": "Overbooking is a breach: the hotel must give you accommodation of the same quality, or a refund or compensation; if it has none, it must book it with a third party at its own expense (Law 300 of 1996, arts. 63 and 64).", "Usted elige entre el alojamiento equivalente y el reembolso.": "You choose between equivalent accommodation and a refund.", "Si reservó por una agencia o una app, avísele también: debe ayudarle a resolver según su política.": "If you booked through an agency or app, tell them too: they must help you under their policy.", "Pida la solución por escrito antes de salir del hotel.": "Ask for the solution in writing before leaving the hotel.", "Reclamo escrito: el proveedor tiene 15 días hábiles para responder.": "Written complaint: the provider has 15 business days to reply.", "Pida en la recepción una constancia escrita de que no hay habitación y de la solución que le ofrecen.": "Ask reception for written confirmation that there is no room and of the solution offered.", "Elija: alojamiento equivalente pagado por el hotel, o la devolución del precio.": "Choose: equivalent accommodation paid by the hotel, or a refund.", "Guarde las facturas de transporte, comidas y la diferencia de precio.": "Keep receipts for transport, meals and any price difference.", "Confirmación de la reserva y pago": "Booking confirmation and payment", "Constancia escrita del hotel": "Written statement from the hotel", "Facturas de los gastos extra": "Receipts for extra costs", "Fotos o video en la recepción": "Photos or video at reception", "Solo un juez puede ordenar que usted salga de una vivienda arrendada. No entregue las llaves ni firme nada bajo presión; si hay violencia, llame al 123.": "Only a judge can order you out of a rented home. Don’t hand over the keys or sign anything under pressure; if there is violence, call 123.", "Si usted no entrega la vivienda, el arrendador debe iniciar un proceso de restitución ante un juez (Código General del Proceso, art. 384). Ni el arrendador ni la policía pueden reemplazar esa orden.": "If you don’t hand back the home, the landlord must bring a repossession case before a judge (General Code of Procedure, art. 384). Neither the landlord nor the police can replace that order.", "Sin una falta suya, el arrendador puede terminar el contrato: durante las prórrogas, con preaviso escrito de al menos tres meses por correo certificado y una indemnización de tres cánones (Ley 820 de 2003, art. 22, num. 7); o al vencimiento, con preaviso de tres meses, para ocupar la vivienda, demolerla o repararla, o venderla, y después de cuatro años de contrato también por su sola voluntad, con una indemnización de un canon y medio (art. 22, num. 8).": "Without fault on your part, the landlord can end the lease: during renewals, with at least three months’ written notice by certified mail and compensation of three months’ rent (Law 820 of 2003, art. 22(7)); or at expiry, with three months’ notice, to live in, demolish or repair, or sell the property, and after four years of lease also at will, with compensation of one and a half months’ rent (art. 22(8)).", "Si el arrendador le suspende los servicios públicos a propósito, usted puede terminar el contrato y pagar la reconexión descontándola del canon (Ley 820 de 2003, art. 24, num. 1).": "If the landlord deliberately cuts off your utilities, you can end the lease and pay for reconnection, deducting it from the rent (Law 820 of 2003, art. 24(1)).", "Si le impiden entrar, por ejemplo cambiando la cerradura: como arrendatario, usted es mero tenedor (Código Civil, art. 775) y puede presentar una querella ante el inspector de policía, que puede ordenar que le restituyan la tenencia (Ley 1801 de 2016, arts. 77, num. 5, y 79). En el momento, llame al 123.": "If you are kept out, for example by a changed lock: as a tenant you are a lawful holder (Civil Code, art. 775) and can file a complaint with the police inspector, who can order your occupation restored (Law 1801 of 2016, arts. 77(5) and 79). At the time, call 123.", "Entrar a su vivienda sin su permiso, aunque sea el dueño, puede ser violación de habitación ajena (Código Penal, art. 189); obligarlo a salir con amenazas puede ser constreñimiento ilegal (art. 182).": "Entering your home without permission, even as the owner, can be violation of another’s dwelling (Criminal Code, art. 189); forcing you out with threats can be unlawful coercion (art. 182).", "Querella ante el inspector de policía si le impiden entrar: preséntela cuanto antes; caduca a los 4 meses del hecho (Ley 1801 de 2016, art. 80).": "Complaint to the police inspector if you are kept out: file it as soon as possible; it lapses 4 months after the event (Law 1801 of 2016, art. 80).", "Preaviso del arrendador para terminar sin falta suya: al menos 3 meses (Ley 820 de 2003, art. 22).": "Landlord’s notice to end the lease without fault on your part: at least 3 months (Law 820 of 2003, art. 22).", "Si hay proceso de restitución, siga pagando el canon: si no lo consigna, no lo escuchan en el proceso (Código General del Proceso, art. 384).": "If there is a repossession case, keep paying the rent: if you don’t deposit it, you won’t be heard in the case (General Code of Procedure, art. 384).", "No entregue las llaves ni firme una entrega bajo presión.": "Don’t hand over the keys or sign a handover under pressure.", "Pida por escrito el motivo y el fundamento legal.": "Ask for the reason and the legal ground in writing.", "Si le cambian la cerradura o le impiden entrar, llame al 123 o acuda al inspector de policía.": "If the lock is changed or you are kept out, call 123 or go to the police inspector.", "Siga pagando el canon y guarde los recibos; si el arrendador no lo recibe, consúltenos cómo consignarlo.": "Keep paying the rent and keep the receipts; if the landlord refuses it, ask us how to deposit it.", "Si le cortaron los servicios, guarde las facturas de reconexión.": "If utilities were cut, keep the reconnection receipts.", "Avisos o cartas del arrendador": "Notices or letters from the landlord", "Fotos o video de la cerradura cambiada o del corte": "Photos or video of the changed lock or the cut-off", "Número del reporte a la policía": "Police report number", "Quien se dedica a arrendar o intermediar vivienda urbana en municipios de más de 15.000 habitantes debe estar matriculado ante la autoridad local (Ley 820 de 2003, art. 28).": "Anyone whose business is renting out or brokering urban housing in municipalities of more than 15,000 inhabitants must be registered with the local authority (Law 820 of 2003, art. 28).", "La alcaldía (en Bogotá, la Secretaría del Hábitat) vigila a arrendadores e inmobiliarias y atiende quejas, por ejemplo por depósitos ilegales o por no entregar copia del contrato o los recibos (Ley 820 de 2003, art. 33).": "The city hall (in Bogotá, the Housing Secretariat) supervises landlords and agencies and handles complaints, for example about unlawful deposits or failure to provide a copy of the lease or receipts (Law 820 of 2003, art. 33).", "Puede imponer multas de hasta 100 salarios mínimos y suspender o cancelar la matrícula (Ley 820 de 2003, art. 34).": "It can impose fines of up to 100 minimum monthly wages and suspend or cancel the registration (Law 820 of 2003, art. 34).", "No le pueden exigir depósitos en dinero ni otras garantías reales para asegurar el pago (Ley 820 de 2003, art. 16).": "You cannot be required to pay cash deposits or give other real guarantees to secure payment (Law 820 of 2003, art. 16).", "Reclamo escrito a la inmobiliaria primero: guarde la constancia de envío.": "Written complaint to the agency first: keep proof of sending.", "Queja ante la alcaldía: preséntela con el contrato y los recibos.": "Complaint to the city hall: file it with the lease and receipts.", "Pida por escrito copia del contrato, de los recibos y la liquidación de lo que le deben.": "Ask in writing for a copy of the lease, the receipts and a statement of what you are owed.", "Verifique en la alcaldía si la inmobiliaria está matriculada.": "Check with the city hall whether the agency is registered.", "Presente queja ante la alcaldía (en Bogotá, la Secretaría del Hábitat).": "File a complaint with the city hall (in Bogotá, the Housing Secretariat).", "Si hay dinero en disputa, conciliación y, si no hay acuerdo, juez civil.": "If money is in dispute, conciliation and, failing agreement, a civil judge.", "Contrato y anexos": "Lease and annexes", "Recibos y extractos de pago": "Receipts and payment statements", "Correos y mensajes con la inmobiliaria": "Emails and messages with the agency", "Constancia del reclamo escrito": "Proof of the written complaint", "El hospedaje es solo para estadías de menos de 30 días (Ley 300 de 1996, art. 79). Una estadía de 30 días o más ya no es hospedaje turístico, aunque se reserve por una app.": "Accommodation contracts only cover stays of less than 30 days (Law 300 of 1996, art. 79). A stay of 30 days or more is no longer tourist accommodation, even if booked through an app.", "Si es una vivienda urbana que usted usa para vivir, por regla general es un arrendamiento de vivienda urbana (Ley 820 de 2003, art. 2): no le pueden exigir depósitos en dinero (art. 16) y, si usted no entrega, el arrendador debe acudir a un juez (Código General del Proceso, art. 384).": "If it is urban housing you live in, as a rule it is an urban housing lease (Law 820 of 2003, art. 2): cash deposits cannot be required (art. 16) and, if you don’t leave, the landlord must go to a judge (General Code of Procedure, art. 384).", "La plataforma sigue siendo intermediaria: sus términos y su centro de resolución aplican, y debe tener identificado al anfitrión para que usted pueda reclamar (Ley 1480 de 2011, art. 53).": "The platform is still the intermediary: its terms and resolution centre apply, and it must have the host identified so you can claim (Law 1480 of 2011, art. 53).", "Lo que cuenta es lo que realmente pactaron y cómo se usa el inmueble, no el nombre que le dé la plataforma (Código Civil, art. 1618).": "What counts is what was actually agreed and how the property is used, not the label the platform gives it (Civil Code, art. 1618).", "Si hay un problema, avise a la plataforma el mismo día: sus plazos para reportar suelen ser cortos.": "If there is a problem, tell the platform the same day: its reporting deadlines are usually short.", "Guarde la reserva y los términos de la plataforma vigentes en la fecha de la reserva (PDF o capturas).": "Keep the booking and the platform terms in force on the booking date (PDF or screenshots).", "Revise si firmó un contrato aparte con el anfitrión.": "Check whether you signed a separate contract with the host.", "Ante un conflicto, escriba al anfitrión y a la plataforma, y consúltenos antes de entregar el inmueble.": "In a dispute, write to the host and the platform, and ask us before handing back the property.", "Reserva y pagos": "Booking and payments", "Términos de la plataforma vigentes en la fecha": "Platform terms in force on that date", "Mensajes con el anfitrión": "Messages with the host", "Contrato aparte, si lo hay": "Separate contract, if any", "Si hubo un delito,
