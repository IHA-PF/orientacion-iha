Map;for(const a of["a-cancelacion","a-anuncio","a-cobros","a-desalojo","a-sobreventa","a-dano","o-entrega","p-marketplace","o-retracto","o-evento","t-app"])e[a]&&!e[a].c.includes("l1480_58")&&e[a].c.push("l1480_58");e["t-cancelacion"].c=e["t-cancelacion"].c.filter((e=>"mtl"!==e)),e["h-huesped"].pol=["pol79h","const28","pol33"],e["a-dano"].c=["hosp","cco1195","cco1196","dam","l1480_58"],e["r-desalojo"].c.push("d1423"),e["o-arriendo"].c.push("d1423");a.exTypes.find((e=>"app"===e.k)).law={c:["l2068","art53","cc1602"]},delete a.exTypes.find((e=>"hotel"===e.k)).law,a.exFrom.flight={es:"Fecha en que recibió el equipaje o en que debía recibirlo",en:"Date you received the baggage or should have",fr:"Date à laquelle vous avez reçu le bagage ou auriez dû le recevoir",pt:"Data em que recebeu a bagagem ou deveria ter recebido"},a.exCalcNote={es:"Cálculo orientativo y prudente: para sus plazos cuenta los sábados como hábiles, porque no hay una regla única; excluye domingos y festivos de Colombia. Ante la duda, actúe antes.",en:"Indicative, cautious calculation: for your deadlines it counts Saturdays as business days, since there is no single rule; it excludes Sundays and Colombian public holidays. If in doubt, act sooner.",fr:"Calcul indicatif et prudent : pour vos délais, il compte le samedi comme jour ouvrable, faute de règle unique ; il exclut dimanches et jours fériés colombiens. Dans le doute, agissez plus tôt.",pt:"Cálculo orientativo e prudente: para seus prazos conta os sábados como úteis, pois não há regra única; exclui domingos e feriados da Colômbia. Na dúvida, aja antes."},a.exRevNote={es:"La reversión aplica a compras a distancia pagadas con tarjeta u otro medio electrónico, con vendedor y banco en Colombia; no a pagos presenciales. En ese mismo plazo, reclame al vendedor y avise al banco emisor (Decreto 587 de 2016).",en:"Payment reversal applies to remote purchases paid by card or other electronic means, with seller and bank in Colombia; not to in-person payments. Within the same deadline, complain to the seller and notify the issuing bank (Decree 587 of 2016).",fr:"L’annulation du paiement vise les achats à distance payés par carte ou autre moyen électronique, avec vendeur et banque en Colombie ; pas les paiements en personne. Dans ce même délai, réclamez au vendeur et prévenez la banque émettrice (décret 587 de 2016).",pt:"O estorno se aplica a compras à distância pagas com cartão ou outro meio eletrônico, com vendedor e banco na Colômbia; não a pagamentos presenciais. No mesmo prazo, reclame ao vendedor e avise o banco emissor (Decreto 587 de 2016)."},a.exDateHint={es:"Escriba la fecha para ver su fecha límite.",en:"Enter the date to see your deadline.",fr:"Indiquez la date pour voir votre date limite.",pt:"Informe a data para ver sua data-limite."},a.exConsent={es:"Autorizo a IHA SOLUCIONES LEGALES Y TECNICAS S.A.S. a usar los datos de mi mensaje solo para responderme sobre este caso (Ley 1581 de 2012).",en:"I authorise IHA SOLUCIONES LEGALES Y TECNICAS S.A.S. to use the data in my message only to reply to me about this case (Colombian Law 1581 of 2012).",fr:"J’autorise IHA SOLUCIONES LEGALES Y TECNICAS S.A.S. à utiliser les données de mon message uniquement pour me répondre sur ce cas (loi colombienne 1581 de 2012).",pt:"Autorizo a IHA SOLUCIONES LEGALES Y TECNICAS S.A.S. a usar os dados da minha mensagem só para me responder sobre este caso (Lei colombiana 1581 de 2012)."},a.exWaNote={es:"Los mensajes de la vía express se atienden con prioridad.",en:"Express messages are handled first.",fr:"Les messages de la voie express sont traités en priorité.",pt:"As mensagens da via expressa são atendidas com prioridade."},a.exLawNote={es:"Resumen general de las normas; no es un concepto jurídico sobre su caso.",en:"General summary of the rules; not a legal opinion on your case.",fr:"Résumé général des règles ; ce n’est pas un avis juridique sur votre cas.",pt:"Resumo geral das normas; não é um parecer jurídico sobre o seu caso."},a.foot1={es:"Medellín, Colombia · Abogados colombianos especializados en plataformas digitales.",en:"Medellín, Colombia · Colombian lawyers specialising in digital platforms.",fr:"Medellín, Colombie · Avocats colombiens spécialisés dans les plateformes numériques.",pt:"Medellín, Colômbia · Advogados colombianos especializados em plataformas digitais."}}(),function(){Object.assign(a.exLaw,{rac3:{es:"RAC 3 (Reglamento Aeronáutico de Colombia), numeral 3.10.2.13.2: por demora imputable a la aerolínea, refrigerio y llamada desde 1 hora, alimentos desde 3 horas, compensación de al menos el 30 % del trayecto desde 5 horas, y hospedaje si la demora pasa de las 10 p. m.",en:"RAC 3 (Colombian Aviation Regulations), para. 3.10.2.13.2: for a delay attributable to the airline, a snack and a call from 1 hour, meals from 3 hours, compensation of at least 30% of the fare from 5 hours, and lodging if the delay runs past 10 p.m.",fr:"RAC 3 (règlement aéronautique colombien), num. 3.10.2.13.2 : pour un retard imputable à la compagnie, collation et appel dès 1 heure, repas dès 3 heures, compensation d’au moins 30 % du trajet dès 5 heures, et hébergement si le retard dépasse 22 h.",pt:"RAC 3 (Regulamento Aeronáutico da Colômbia), num. 3.10.2.13.2: por atraso imputável à companhia, lanche e ligação a partir de 1 hora, refeições a partir de 3 horas, compensação de pelo menos 30 % do trecho a partir de 5 horas, e hospedagem se o atraso passar das 22 h."},rac3c:{es:"RAC 3, numeral 3.10.2.13.1: si el vuelo se cancela o se demora por fuerza mayor o por el clima, la aerolínea queda liberada devolviendo el precio sin penalidad, y usted puede pedir el reembolso inmediato.",en:"RAC 3, para. 3.10.2.13.1: if the flight is cancelled or delayed by force majeure or weather, the airline is released by refunding the fare without penalty, and you can ask for an immediate refund.",fr:"RAC 3, num. 3.10.2.13.1 : si le vol est annulé ou retardé pour force majeure ou météo, la compagnie est libérée en remboursant le billet sans pénalité, et vous pouvez exiger le remboursement immédiat.",pt:"RAC 3, num. 3.10.2.13.1: se o voo for cancelado ou atrasado por força maior ou clima, a companhia fica liberada devolvendo o preço sem penalidade, e você pode pedir o reembolso imediato."},cco1882:{es:"Código de Comercio, art. 1882: si el viaje no puede iniciarse o se retrasa por fuerza mayor o clima, la aerolínea se libera devolviendo el precio; si se interrumpe en ruta, debe llevarlo a su destino a su costa y pagar gastos razonables de manutención y hospedaje.",en:"Commercial Code, art. 1882: if the journey cannot start or is delayed by force majeure or weather, the airline is released by refunding the fare; if it is interrupted en route, it must carry you to your destination at its own cost and pay reasonable meals and lodging.",fr:"Code de commerce, art. 1882 : si le voyage ne peut commencer ou est retardé pour force majeure ou météo, la compagnie se libère en remboursant le billet ; s’il est interrompu en route, elle doit vous acheminer à destination à ses frais et payer des frais raisonnables de repas et d’hébergement.",pt:"Código de Comércio, art. 1882: se a viagem não puder começar ou atrasar por força maior ou clima, a companhia se libera devolvendo o preço; se for interrompida no caminho, deve levá-lo ao destino à sua custa e pagar gastos razoáveis de alimentação e hospedagem."},can619:{es:"Decisión 619 de la Comunidad Andina, para vuelos que salen de Bolivia, Colombia, Ecuador o Perú: por cancelación, siguiente vuelo, transporte alternativo o reembolso total sin penalidad (art. 7), pagado en 5 días hábiles (art. 11); por sobreventa o demora de más de 6 horas imputable a la aerolínea, compensación mínima del 25 % del trayecto (art. 8).",en:"Andean Community Decision 619, for flights departing Bolivia, Colombia, Ecuador or Peru: on cancellation, the next flight, alternative transport or a full refund without penalty (art. 7), paid within 5 business days (art. 11); for overbooking or a delay of more than 6 hours attributable to the airline, minimum compensation of 25% of the fare (art. 8).",fr:"Décision 619 de la Communauté andine, pour les vols au départ de Bolivie, Colombie, Équateur ou Pérou : en cas d’annulation, vol suivant, transport alternatif ou remboursement intégral sans pénalité (art. 7), versé en 5 jours ouvrables (art. 11) ; en cas de surréservation ou de retard de plus de 6 heures imputable à la compagnie, compensation minimale de 25 % du trajet (art. 8).",pt:"Decisão 619 da Comunidade Andina, para voos que saem da Bolívia, Colômbia, Equador ou Peru: em cancelamento, próximo voo, transporte alternativo ou reembolso total sem penalidade (art. 7), pago em 5 dias úteis (art. 11); em overbooking ou atraso de mais de 6 horas imputável à companhia, compensação mínima de 25 % do trecho (art. 8)."},can619b:{es:"Decisión 619 de la CAN, arts. 18 y 19: la aerolínea debe entregarle un talón por cada equipaje facturado, y los objetos de valor deben viajar con declaración de valor.",en:"CAN Decision 619, arts. 18 and 19: the airline must give you a tag for each checked bag, and valuables must travel with a declared value.",fr:"Décision 619 de la CAN, art. 18 et 19 : la compagnie doit vous remettre un talon pour chaque bagage enregistré, et les objets de valeur doivent voyager avec une déclaration de valeur.",pt:"Decisão 619 da CAN, arts. 18 e 19: a companhia deve entregar um comprovante para cada bagagem despachada, e objetos de valor devem viajar com declaração de valor."},cp296:{es:"Código Penal, art. 296, falsedad personal: suplantar a una persona, por ejemplo a un funcionario del banco o a un conocido, para obtener un provecho. Multa, que puede aumentar hasta en un tercio si se usó inteligencia artificial (Ley 2502 de 2025).",en:"Criminal Code, art. 296, impersonation: posing as someone, for example a bank employee or an acquaintance, for gain. A fine, which can be increased by up to one third if artificial intelligence was used (Law 2502 of 2025).",fr:"Code pénal, art. 296, usurpation d’identité : se faire passer pour quelqu’un, par exemple un employé de banque ou un proche, pour en tirer profit. Amende, augmentée jusqu’à un tiers en cas d’usage de l’intelligence artificielle (loi 2502 de 2025).",pt:"Código Penal, art. 296, falsidade pessoal: passar-se por alguém, por exemplo um funcionário do banco ou um conhecido, para obter vantagem. Multa, que pode aumentar até um terço se foi usada inteligência artificial (Lei 2502 de 2025)."}}),a.exLaw.pol163={es:"Ley 1801 de 2016, art. 163: la policía solo entra a un inmueble sin orden escrita por imperiosa necesidad: auxiliar a quien lo pide, un incendio o inundación, un animal peligroso, una intrusión en la casa de un ausente, agresiones desde adentro o pólvora. La Corte Constitucional (C-212 de 2017) lo aceptó con un control judicial posterior: puede pedir al juez de control de garantías que revise la entrada.",en:"Law 1801 of 2016, art. 163: the police may only enter a property without a written order in cases of pressing necessity: helping someone who asks, a fire or flood, a dangerous animal, an intrusion into an absent person’s home, attacks from inside or fireworks. The Constitutional Court (C-212 of 2017) upheld it subject to later judicial review: you can ask the guarantees judge to review the entry.",fr:"Loi 1801 de 2016, art. 163 : la police n’entre sans ordre écrit qu’en cas de nécessité impérieuse : secourir quelqu’un qui appelle, un incendie ou une inondation, un animal dangereux, une intrusion chez un absent, des agressions depuis l’intérieur ou de la pyrotechnie. La Cour constitutionnelle (C-212 de 2017) l’a validé sous réserve d’un contrôle judiciaire postérieur : vous pouvez demander au juge des garanties de contrôler l’entrée.",pt:"Lei 1801 de 2016, art. 163: a polícia só entra num imóvel sem ordem escrita por necessidade imperiosa: socorrer quem pede, incêndio ou inundação, animal perigoso, invasão da casa de um ausente, agressões de dentro ou fogos de artifício. A Corte Constitucional (C-212 de 2017) o aceitou com controle judicial posterior: você pode pedir ao juiz de garantias que revise a entrada."};const e=a.exLawMap;e["t-cancelacion"].c=["transp","rac3c","cco1882","can619","dam","pr2t"],e["t-retraso"].c=["transp","rac3","cco1882","can619","mtl","dam","pr2t"],e["t-equipaje"].c=["transp","mtl31","mtl","can619b","pr2t"];for(const a of["o-transferencia","o-fraude"]){const o=e[a].p,s=o.indexOf("den");o.splice(s<0?o.length:s,0,"cp296")}const o="+57 301 383 2196",s=a.priv,r=(e,a)=>{for(const o of["es","en","fr","pt"])s[o]&&s[o][e]&&(s[o][e]=[s[o][e][0],a[o]])};r(0,{es:"IHA SOLUCIONES LEGALES Y TECNICAS S.A.S., NIT 900.365.039-8, con domicilio en Medellín, Colombia. Correo: {email}. Teléfono y WhatsApp: "+o+".",en:"IHA SOLUCIONES LEGALES Y TECNICAS S.A.S., NIT 900.365.039-8, domiciled in Medellín, Colombia. Email: {email}. Phone and WhatsApp: "+o+".",fr:"IHA SOLUCIONES LEGALES Y TECNICAS S.A.S., NIT 900.365.039-8, domiciliée à Medellín, Colombie. Courriel : {email}. Téléphone et WhatsApp : "+o+".",pt:"IHA SOLUCIONES LEGALES Y TECNICAS S.A.S., NIT 900.365.039-8, com sede em Medellín, Colômbia. E-mail: {email}. Telefone e WhatsApp: "+o+"."}),r(2,{es:"Para responderle, orientarle, preparar una propuesta y, si la acepta, prestar el servicio y facturarlo; también para gestionar su inscripción al plan Anfitrión en regla si la pide. No vendemos ni cedemos sus datos.",en:"To reply to you, guide you, prepare a proposal and, if you accept it, provide and invoice the service; also to handle your Anfitrión en regla plan sign-up if you request it. We do not sell or share your data.",fr:"Pour vous répondre, vous orienter, préparer une proposition et, si vous l’acceptez, fournir et facturer le service ; aussi pour gérer votre inscription à l’abonnement Anfitrión en regla si vous la demandez. Nous ne vendons ni ne cédons vos données.",pt:"Para responder, orientar, preparar uma proposta e, se aceitar, prestar e faturar o serviço; também para gerenciar sua inscrição no plano Anfitrión en regla se pedir. Não vendemos nem cedemos seus dados."}),r(8,{es:"Escriba a {email} o al WhatsApp "+o+". Atiende las consultas y reclamos sobre datos personales el equipo de IHA a cargo de la protección de datos. Respondemos las consultas en 10 días hábiles y los reclamos en 15 días hábiles, prorrogables según la ley.",en:"Write to {email} or WhatsApp "+o+". Requests and complaints about personal data are handled by the IHA team in charge of data protection. We answer requests within 10 business days and complaints within 15 business days, extendable by law.",fr:"Écrivez à {email} ou sur WhatsApp au "+o+". Les demandes et réclamations sur les données personnelles sont traitées par l’équipe d’IHA chargée de la protection des données. Nous répondons aux demandes en 10 jours ouvrables et aux réclamations en 15 jours ouvrables, prorogeables selon la loi.",pt:"Escreva para {email} ou para o WhatsApp "+o+". As consultas e reclamações sobre dados pessoais são atendidas pela equipe da IHA responsável pela proteção de dados. Respondemos às consultas em 10 dias úteis e às reclamações em 15 dias úteis, prorrogáveis conforme a lei."}),r(10,{es:"Esta política rige desde el 11 de noviembre de 2026. Las bases de datos se conservan mientras sean necesarias para estas finalidades y por el tiempo que exija la ley. Si la cambiamos de forma sustancial, lo avisaremos antes en esta página.",en:"This policy is in force from 11 November 2026. Databases are kept as long as needed for these purposes and for the time required by law. If we change it substantially, we will announce it on this page beforehand.",fr:"Cette politique est en vigueur depuis le 11 novembre 2026. Les bases de données sont conservées tant qu’elles sont nécessaires à ces finalités et pendant la durée exigée par la loi. Toute modification substantielle sera annoncée à l’avance sur cette page.",pt:"Esta política vigora desde 11 de novembro de 2026. As bases de dados são mantidas enquanto forem necessárias para essas finalidades e pelo tempo exigido por lei. Se a mudarmos substancialmente, avisaremos antes nesta página."})}(),a.abInc={es:["Su calendario de obligaciones, con un aviso por WhatsApp antes de cada fecha: renovación del RNT (1 de enero a 31 de marzo), declaración al FONTUR cada trimestre y, cuando se publique, las fechas del nuevo POT de Medellín.","Un aviso cuando cambie una norma que afecte su vivienda en su ciudad, explicado en pocas líneas y con lo que tiene que hacer.","Una consulta por escrito al mes sobre su vivienda, respondida por una abogada en 2 días hábiles, en una página como máximo. Las consultas que no use no se acumulan.","Una revisión al año de su cumplimiento: RNT, anuncio, reglamento de la copropiedad, reporte de huéspedes (TRA y SIRE) y reglas de la casa, con la lista de lo que falta.","Si surge un problema (una multa, una queja de la copropiedad o una visita de la alcaldía): una llamada de orientación en 1 día hábil y un plan de acción por escrito."],en:["Your obligations calendar, with a WhatsApp reminder before each date: RNT renewal (1 January to 31 March), the FONTUR return every quarter and, once published, the dates of Medellín’s new zoning plan (POT).","An alert when a rule affecting your rental in your city changes, explained in a few lines with what you need to do.","One written question a month about your rental, answered by a lawyer within 2 business days, in one page at most. Unused questions don’t carry over.","A yearly compliance review: RNT, listing, building rules, guest reporting (TRA and SIRE) and house rules, with a list of what’s missing.","If a problem comes up (a fine, a complaint from the building or a visit from the city): a guidance call within 1 business day and a written action plan."],fr:["Votre calendrier des obligations, avec un rappel sur WhatsApp avant chaque date : renouvellement du RNT (1er janvier au 31 mars), déclaration au FONTUR chaque trimestre et, dès sa publication, les dates du nouveau plan d’urbanisme (POT) de Medellín.","Une alerte quand une règle qui touche votre logement change dans votre ville, expliquée en quelques lignes avec ce que vous devez faire.","Une question écrite par mois sur votre logement, à laquelle une avocate répond en 2 jours ouvrables, en une page au plus. Les questions non utilisées ne se reportent pas.","Une revue annuelle de votre conformité : RNT, annonce, règlement de copropriété, déclaration des voyageurs (TRA et SIRE) et règlement intérieur, avec la liste de ce qui manque.","En cas de problème (une amende, une plainte de la copropriété ou un contrôle de la mairie) : un appel d’orientation sous 1 jour ouvrable et un plan d’action écrit."],pt:["Seu calendário de obrigações, com um aviso pelo WhatsApp antes de cada data: renovação do RNT (1º de janeiro a 31 de março), declaração ao FONTUR a cada trimestre e, quando for publicado, as datas do novo plano de zoneamento (POT) de Medellín.","Um aviso quando mudar uma norma que afete seu imóvel na sua cidade, explicado em poucas linhas e com o que você precisa fazer.","Uma consulta por escrito por mês sobre seu imóvel, respondida por uma advogada em 2 dias úteis, em uma página no máximo. As consultas não usadas não se acumulam.","Uma revisão por ano do seu cumprimento: RNT, anúncio, regulamento do condomínio, registro de hóspedes (TRA e SIRE) e regras da casa, com a lista do que falta.","Se surgir um problema (uma multa, uma queixa do condomínio ou uma fiscalização da prefeitura): uma ligação de orientação em 1 dia útil e um plano de ação por escrito."]},a.abNot={es:["Hacer los trámites por usted (RNT, FONTUR, DIAN). Si lo necesita, se los cotizamos aparte.","Las declaraciones de impuestos: son trabajo de su contador.","Defenderlo en un proceso de sanción, una querella o un pleito: se cotiza aparte, antes de empezar.","Multas, sanciones, tasas y gastos de trámite: el plan nunca los paga ni los reembolsa."],en:["Doing the filings for you (RNT, FONTUR, DIAN). If you need it, we quote it separately.","Tax returns: that is your accountant’s job.","Defending you in a sanction procedure, a police complaint procedure or a lawsuit: quoted separately, before we start.","Fines, penalties, fees and filing costs: the plan never pays or refunds them."],fr:["Faire les démarches à votre place (RNT, FONTUR, DIAN). Si vous en avez besoin, nous vous faisons un devis à part.","Les déclarations d’impôts : c’est le travail de votre comptable.","Vous défendre dans une procédure de sanction, une querella ou un procès : sur devis à part, avant de commencer.","Amendes, sanctions, taxes et frais de démarches : l’abonnement ne les paie ni ne les rembourse jamais."],pt:["Fazer os trâmites por você (RNT, FONTUR, DIAN). Se precisar, orçamos à parte.","As declarações de impostos: são trabalho do seu contador.","Defender você em um processo de sanção, uma querela ou uma ação judicial: orçado à parte, antes de começar.","Multas, sanções, taxas e custos de trâmites: o plano nunca os paga nem os reembolsa."]},a.abTerms={es:"Sin permanencia: puede cancelar cuando quiera, por el mismo medio por el que se inscribió. El plan anual no se renueva solo por otro año: le avisamos antes de que termine. Tiene 5 días hábiles para retractarse, salvo que nos pida empezar antes (Ley 1480 de 2011, art. 47). Antes de empezar le enviamos por escrito el contrato y los datos de pago.",en:"No lock-in: you can cancel at any time, through the same channel you signed up with. The yearly plan doesn’t renew itself for another year: we remind you before it ends. You have 5 business days to withdraw, unless you ask us to start sooner (Colombian Law 1480 of 2011, art. 47). Before we start, we send you the contract and payment details in writing.",fr:"Sans engagement : vous pouvez résilier quand vous voulez, par le même canal que votre inscription. L’abonnement annuel ne se renouvelle pas tout seul pour une nouvelle année : nous vous prévenons avant la fin. Vous avez 5 jours ouvrables pour vous rétracter, sauf si vous nous demandez de commencer plus tôt (loi colombienne 1480 de 2011, art. 47). Avant de commencer, nous vous envoyons par écrit le contrat et les modalités de paiement.",pt:"Sem fidelidade: você pode cancelar quando quiser, pelo mesmo meio pelo qual se inscreveu. O plano anual não se renova sozinho por mais um ano: avisamos antes de terminar. Você tem 5 dias úteis para desistir, salvo se pedir para começarmos antes (Lei colombiana 1480 de 2011, art. 47). Antes de começar, enviamos por escrito o contrato e os dados de pagamento."},function(){const e=(e,a,o,s)=>({es:e,en:a,fr:o,pt:s});a.ofFmt=(e,a)=>{const o=String(e).replace(/\B(?=(\d{3})+(?!\d))/g,"en"===a?",":"fr"===a?" ":".");return"es"===a?"$"+o:"fr"===a?o+" COP":"COP "+o},a.ofUsd=e=>Math.round(e/3240),Object.assign(a,{svEye:e("Servicios y precios","Services and prices","Services et prix","Serviços e preços"),svT:e("Lo gratuito primero; si lo necesita, una abogada lo hace por usted","Free help first; if you need it, a lawyer does it for you","D’abord le gratuit ; si besoin, une avocate s’en charge","Primeiro o gratuito; se precisar, uma advogada faz por você"),svLead:e("Las fichas, la vía express y la carta de reclamo son gratis. Si prefiere que nos encarguemos, cada servicio tiene un precio fijo, publicado e IVA incluido.","The guides, the express route and the complaint letter are free. If you’d rather we handle it, each service has a fixed, published price, VAT included.","Les fiches, la voie express et la lettre de réclamation sont gratuites. Si vous préférez que nous nous en chargions, chaque service a un prix fixe, publié et TVA incluse.","As fichas, a via expressa e a carta de reclamação são grátis. Se preferir que cuidemos disso, cada serviço tem um preço fixo, publicado e com IVA incluído."),svFreeH:e("Antes de pagar","Before you pay","Avant de payer","Antes de pagar"),svFree:e("Si el monto en juego es pequeño, la vía gratuita suele bastar: el reclamo directo a la empresa y, si no responde, SIC Facilita o la Superintendencia. Se lo diremos con franqueza antes de cobrarle.","If the amount at stake is small, the free route is often enough: a direct complaint to the company and, if it doesn’t answer, SIC Facilita or the Superintendency. We’ll tell you frankly before charging you.","Si le montant en jeu est faible, la voie gratuite suffit souvent : la réclamation directe à l’entreprise puis, sans réponse, SIC Facilita ou la Superintendance. Nous vous le dirons franchement avant de vous faire payer.","Se o valor em jogo for pequeno, o caminho gratuito costuma bastar: a reclamação direta à empresa e, se não responder, o SIC Facilita ou a Superintendência. Diremos isso com franqueza antes de cobrar."),svGroups:{res:e("Si vive en Colombia","If you live in Colombia","Si vous vivez en Colombie","Se você mora na Colômbia"),tur:e("Si está de visita en Colombia","If you’re visiting Colombia","Si vous êtes de passage en Colombie","Se você está de visita na Colômbia"),anf:e("Si es anfitrión","If you’re a host","Si vous êtes hôte","Se você é anfitrião"),pla:e("Si tiene un conflicto con una plataforma","If you have a dispute with a platform","Si vous avez un litige avec une plateforme","Se você tem um conflito com uma plataforma")},svTurNote:e("El servicio «Fraude: denuncia y reclamo» también se presta en inglés, francés y portugués.","The “Fraud: report and claim” service is also available in English, French and Portuguese.","Le service « Fraude : plainte et réclamation » est aussi assuré en anglais, en français et en portugais.","O serviço «Fraude: denúncia e reclamação» também é prestado em inglês, francês e português."),svIncH:e("Incluye","Includes","Comprend","Inclui"),svExcH:e("No incluye","Not included","Ne comprend pas","Não inclui"),svTimeH:e("Plazo","Timing","Délai","Prazo"),svAsk:e("Pedir este servicio","Request this service","Demander ce service","Pedir este serviço"),svIva:e("IVA incluido","VAT included","TVA incluse","IVA incluído"),svUsdNote:e("aprox., se factura en pesos","approx., billed in pesos","environ, facturé en pesos","aprox., faturado em pesos"),svCondH:e("Condiciones de todos los servicios","Terms for all services","Conditions de tous les services","Condições de todos os serviços"),svCond:{es:["Precios en pesos colombianos, IVA incluido. El valor en dólares es indicativo: se factura en pesos.","Antes de empezar le enviamos por escrito lo que incluye, lo que no incluye, el precio y el plazo. Usted paga antes de que empecemos y recibe factura electrónica.","Tiene 5 días hábiles para retractarse, salvo que nos pida empezar antes (Ley 1480 de 2011, art. 47).","Ningún servicio promete un resultado: le decimos con franqueza lo que puede esperar.","Los plazos valen mientras tengamos capacidad: si hay lista de espera, se lo decimos antes de cobrar.","Multas, tasas, traducciones oficiales, apostillas y gastos de envío no están incluidos."],en:["Prices in Colombian pesos, VAT included. The dollar amount is indicative: billing is in pesos.","Before we start, we send you in writing what is included, what is not, the price and the timing. You pay before we start and receive an electronic invoice.","You have 5 business days to withdraw, unless you ask us to start sooner (Colombian Law 1480 of 2011, art. 47).","No service promises an outcome: we tell you frankly what you can expect.","Timings apply while we have capacity: if there is a waiting list, we tell you before charging.","Fines, official fees, certified translations, apostilles and postage are not included."],fr:["Prix en pesos colombiens, TVA incluse. Le montant en dollars est indicatif : la facture est en pesos.","Avant de commencer, nous vous envoyons par écrit ce qui est inclus, ce qui ne l’est pas, le prix et le délai. Vous payez avant que nous commencions et recevez une facture électronique.","Vous avez 5 jours ouvrables pour vous rétracter, sauf si vous nous demandez de commencer plus tôt (loi colombienne 1480 de 2011, art. 47).","Aucun service ne promet un résultat : nous vous disons franchement ce que vous pouvez attendre.","Les délais valent dans la limite de notre capacité : s’il y a une liste d’attente, nous vous le disons avant de vous faire payer.","Amendes, taxes, traductions officielles, apostilles et frais d’envoi ne sont pas inclus."],pt:["Preços em pesos colombianos, IVA incluído. O valor em dólares é indicativo: a fatura é em pesos.","Antes de começar, enviamos por escrito o que inclui, o que não inclui, o preço e o prazo. Você paga antes de começarmos e recebe nota fiscal eletrônica.","Você tem 5 dias úteis para desistir, salvo se pedir para começarmos antes (Lei colombiana 1480 de 2011, art. 47).","Nenhum serviço promete um resultado: dizemos com franqueza o que você pode esperar.","Os prazos valem enquanto tivermos capacidade: se houver lista de espera, avisamos antes de cobrar.","Multas, taxas, traduções oficiais, apostilas e custos de envio não estão incluídos."]},svFormH:e("Pida un servicio por WhatsApp","Request a service on WhatsApp","Demandez un service sur WhatsApp","Peça um serviço pelo WhatsApp"),svFormP:e("Elija el servicio y envíenos el mensaje. Le respondemos con el alcance por escrito y los datos de pago. Cuéntenos su caso en el chat, sin enviar documentos todavía.","Choose the service and send us the message. We reply with the scope in writing and the payment details. Tell us about your case in the chat, without sending documents yet.","Choisissez le service et envoyez-nous le message. Nous vous répondons avec le périmètre par écrit et les modalités de paiement. Racontez-nous votre cas dans la conversation, sans envoyer de documents pour l’instant.","Escolha o serviço e envie a mensagem. Respondemos com o escopo por escrito e os dados de pagamento. Conte seu caso no chat, sem enviar documentos ainda."),svPick:e("Servicio","Service","Service","Serviço"),svConsent:e("Autorizo a IHA SOLUCIONES LEGALES Y TECNICAS S.A.S. a usar estos datos solo para responderme sobre el servicio (Ley 1581 de 2012).","I authorise IHA SOLUCIONES LEGALES Y TECNICAS S.A.S. to use this data only to reply to me about the service (Colombian Law 1581 of 2012).","J’autorise IHA SOLUCIONES LEGALES Y TECNICAS S.A.S. à utiliser ces données uniquement pour me répondre au sujet du service (loi colombienne 1581 de 2012).","Autorizo a IHA SOLUCIONES LEGALES Y TECNICAS S.A.S. a usar estes dados só para me responder sobre o serviço (Lei colombiana 1581 de 2012)."),svBtn:e("Enviar por WhatsApp","Send on WhatsApp","Envoyer sur WhatsApp","Enviar pelo WhatsApp"),svMsgH:e("SERVICIO","SERVICE","SERVICE","SERVIÇO"),svMsgEnd:e("Quisiera recibir el alcance por escrito y los datos de pago.","I’d like to receive the scope in writing and the payment details.","Je souhaite recevoir le périmètre par écrit et les modalités de paiement.","Gostaria de receber o escopo por escrito e os dados de pagamento."),svMsgWait:e("Quisiera inscribirme en la lista de espera, sin pagar todavía.","I’d like to join the waiting list, without paying yet.","Je souhaite m’inscrire sur la liste d’attente, sans payer pour l’instant.","Gostaria de entrar na lista de espera, sem pagar ainda."),svValid:e("Precios vigentes desde noviembre de 2026.","Prices valid from November 2026.","Prix en vigueur depuis novembre 2026.","Preços vigentes desde novembro de 2026."),svTeaserT:e("¿Prefiere que una abogada lo haga por usted?","Would you rather a lawyer did it for you?","Vous préférez qu’une avocate s’en charge ?","Prefere que uma advogada faça por você?"),svSee:e("Ver servicios y precios","See services and prices","Voir les services et les prix","Ver serviços e preços"),homeSvT:e("Servicios con precio fijo","Fixed-price services","Services à prix fixe","Serviços com preço fixo"),homeSvP:e("Revisión de caso, reclamo, fraude, anfitriones y turistas: lo que incluye cada uno y cuánto cuesta.","Case review, complaint, fraud, hosts and visitors: what each includes and what it costs.","Revue de cas, réclamation, fraude, hôtes et voyageurs : ce que chacun comprend et combien il coûte.","Revisão de caso, reclamação, fraude, anfitriões e turistas: o que cada um inclui e quanto custa."),footSv:e("Servicios y precios","Services and prices","Services et prix","Serviços e preços"),faqSvQ:e("¿Cuánto cuestan sus servicios?","How much do your services cost?","Combien coûtent vos services ?","Quanto custam os seus serviços?"),faqSvA:e("La orientación del sitio es gratuita. Si quiere que una abogada se encargue, cada servicio tiene un precio fijo con IVA incluido: por ejemplo, una revisión de caso cuesta $179.000 y una reclamación documentada $449.000. Antes de empezar le enviamos por escrito lo que incluye.","The guidance on the site is free. If you want a lawyer to take it on, each service has a fixed price including VAT: for example, a case review costs COP 179,000 and a documented complaint COP 449,000. Before we start, we send you in writing what is included.","L’orientation du site est gratuite. Si vous voulez qu’une avocate s’en charge, chaque service a un prix fixe TVA incluse : par exemple, une revue de cas coûte 179 000 COP et une réclamation documentée 449 000 COP. Avant de commencer, nous vous envoyons par écrit ce qui est inclus.","A orientação do site é gratuita. Se quiser que uma advogada cuide do caso, cada serviço tem um preço fixo com IVA incluído: por exemplo, uma revisão de caso custa COP 179.000 e uma reclamação documentada COP 449.000. Antes de começar, enviamos por escrito o que inclui.")}),a.offers=[{id:"revision",g:"res",v:179e3,n:e("Revisión de caso","Case review","Revue de cas","Revisão de caso"),inc:e(["Lectura de sus documentos: hasta 15 páginas o capturas.","Una videollamada de 30 minutos con una abogada.","Un plan de acción escrito de una página, con sus fechas límite."],["Review of your documents: up to 15 pages or screenshots.","A 30-minute video call with a lawyer.","A one-page written action plan, with your deadlines."],["Lecture de vos documents : jusqu’à 15 pages ou captures.","Un appel vidéo de 30 minutes avec une avocate.","Un plan d’action écrit d’une page, avec vos dates limites."],["Leitura dos seus documentos: até 15 páginas ou capturas.","Uma videochamada de 30 minutos com uma advogada.","Um plano de ação escrito de uma página, com seus prazos."]),exc:e(["Redactar y radicar el reclamo, el seguimiento y la representación."],["Drafting and filing the complaint, follow-up and representation."],["Rédiger et déposer la réclamation, le suivi et la représentation."],["Redigir e protocolar a reclamação, o acompanhamento e a representação."]),t:e("Llamada en 2 días hábiles; plan escrito el día hábil siguiente.","Call within 2 business days; written plan the next business day.","Appel sous 2 jours ouvrables ; plan écrit le jour ouvrable suivant.","Ligação em 2 dias úteis; plano escrito no dia útil seguinte."),note:e("Si contrata otro servicio en los 30 días siguientes, descontamos este valor.","If you book another service within 30 days, we deduct this amount.","Si vous prenez un autre service dans les 30 jours, nous déduisons ce montant.","Se contratar outro serviço nos 30 dias seguintes, descontamos este valor.")},{id:"reclamo",g:"res",v:449e3,n:e("Reclamación documentada","Documented complaint","Réclamation documentée","Reclamação documentada"),inc:e(["Reclamo formal o derecho de petición redactado por una abogada.","Radicación ante la empresa, el Defensor del Consumidor Financiero o SIC Facilita.","Una insistencia y 45 días de seguimiento."],["A formal complaint or petition drafted by a lawyer.","Filing with the company, the Financial Consumer Ombudsman or SIC Facilita.","One follow-up reminder and 45 days of monitoring."],["Réclamation formelle ou droit de pétition rédigé par une avocate.","Dépôt auprès de l’entreprise, du Défenseur du consommateur financier ou de SIC Facilita.","Une relance et 45 jours de suivi."],["Reclamação formal ou direito de petição redigido por uma adv ement, ou 759 000 COP par logement à partir de 2 logements, TVA incluse : 12 mois pour le prix de 11. Vous pouvez aussi payer au mois (89 000 ou 69 000 COP). Il comprend votre calendrier des obligations avec rappels, les alertes sur les règles, une question écrite par mois et une revue annuelle. Vous pouvez résilier quand vous voulez ; si vous avez payé l’année et résiliez avant, nous remboursons ce que vous avez payé, moins les mois commencés au prix mensuel.","Sim. O plano Anfitrión en regla custa COP 979.000 por ano por imóvel, ou COP 759.000 por imóvel a partir de 2 imóveis, IVA incluído: 12 meses pelo preço de 11. Também pode pagar mês a mês (COP 89.000 ou 69.000). Inclui seu calendário de obrigações com avisos, alertas de normas, uma consulta escrita por mês e uma revisão anual. Você pode cancelar quando quiser; se pagou o ano e cancelar antes, devolvemos o que pagou menos os meses iniciados, pelo preço mensal."))}(),a.hcEye={es:"Así responde el sitio, gratis y en 2 minutos",en:"How the site answers, free and in 2 minutes",fr:"Voici comment le site répond, gratuitement et en 2 minutes",pt:"Assim o site responde, grátis e em 2 minutos"},a.hcQ={es:"«Me cobraron en la tarjeta un pago que no reconozco.»",en:"“There’s a charge on my card that I don’t recognise.”",fr:"« Un paiement que je ne reconnais pas apparaît sur ma carte. »",pt:"“Apareceu no meu cartão um pagamento que não reconheço.”"},a.hcDlH={es:"Su fecha límite para pedir al banco que anule el pago",en:"Your deadline to ask the bank to reverse the payment",fr:"Votre date limite pour demander à la banque d’annuler le paiement",pt:"Seu prazo para pedir ao banco que anule o pagamento"},a.hcStepsH={es:"Lo que debe hacer ahora",en:"What to do now",fr:"Ce qu’il faut faire maintenant",pt:"O que fazer agora"},a.hcSteps={es:["Llame a su banco y bloquee la tarjeta.","Pida por escrito al banco que anule el pago.","Denuncie el fraude ante la Fiscalía."],en:["Call your bank and block the card.","Ask the bank in writing
