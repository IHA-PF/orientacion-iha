  // 8. PNC
  prfNcpH:{es:"El Punto Nacional de Contacto (PNC) de la OCDE",en:"The OECD National Contact Point (NCP)",fr:"Le Point de contact national (PCN) de l’OCDE",pt:"O Ponto de Contato Nacional (PCN) da OCDE"},
  prfNcpWhat:{es:"Colombia adhiere a las Líneas Directrices de la OCDE para Empresas Multinacionales sobre Conducta Empresarial Responsable. Cada país que las adopta tiene un Punto Nacional de Contacto; el de Colombia funciona en el Ministerio de Comercio, Industria y Turismo desde 2012 (Decreto 1400 de 2012).",
    en:"Colombia adheres to the OECD Guidelines for Multinational Enterprises on Responsible Business Conduct. Every country that adopts them has a National Contact Point; Colombia’s has operated within the Ministry of Commerce, Industry and Tourism since 2012 (Decree 1400 of 2012).",
    fr:"La Colombie adhère aux Principes directeurs de l’OCDE à l’intention des entreprises multinationales sur la conduite responsable des entreprises. Chaque pays qui les adopte a un Point de contact national ; celui de la Colombie fonctionne au sein du ministère du Commerce, de l’Industrie et du Tourisme depuis 2012 (décret 1400 de 2012).",
    pt:"A Colômbia adere às Diretrizes da OCDE para Empresas Multinacionais sobre Conduta Empresarial Responsável. Cada país que as adota tem um Ponto de Contato Nacional; o da Colômbia funciona no Ministério do Comércio, Indústria e Turismo desde 2012 (Decreto 1400 de 2012)."},
  prfNcpForH:{es:"Para qué sirve",en:"What it is for",fr:"À quoi il sert",pt:"Para que serve"},
  prfNcpFor:{es:"Recibe quejas, llamadas «instancias específicas», sobre la conducta de una empresa multinacional que no respetaría las Líneas Directrices, incluido su capítulo sobre los intereses de los consumidores: información veraz, prácticas comerciales leales, mecanismos para reclamar y protección de datos. Ofrece buenos oficios y una mediación gratuita entre usted y la empresa.",
    en:"It receives complaints, called “specific instances”, about a multinational’s conduct that may breach the Guidelines, including their chapter on consumer interests: truthful information, fair business practices, ways to complain and data protection. It offers good offices and free mediation between you and the company.",
    fr:"Il reçoit des plaintes, appelées « circonstances spécifiques », sur le comportement d’une multinationale qui ne respecterait pas les Principes directeurs, y compris leur chapitre sur les intérêts des consommateurs : information loyale, pratiques commerciales équitables, voies de réclamation et protection des données. Il offre ses bons offices et une médiation gratuite entre vous et l’entreprise.",
    pt:"Recebe queixas, chamadas “instâncias específicas”, sobre a conduta de uma multinacional que não respeitaria as Diretrizes, incluindo o capítulo sobre os interesses dos consumidores: informação verdadeira, práticas comerciais leais, mecanismos de reclamação e proteção de dados. Oferece bons ofícios e uma mediação gratuita entre você e a empresa."},
  prfNcpNotH:{es:"Lo que no es",en:"What it is not",fr:"Ce qu’il n’est pas",pt:"O que não é"},
  prfNcpNot:{es:"No es un juez ni reemplaza a la SIC. No ordena devoluciones ni multas, y sus decisiones no son obligatorias. Si no hay acuerdo, publica una declaración final con recomendaciones a la empresa.",
    en:"It is not a court and does not replace the SIC. It does not order refunds or fines, and its decisions are not binding. If there is no agreement, it publishes a final statement with recommendations to the company.",
    fr:"Ce n’est pas un juge et il ne remplace pas la SIC. Il n’ordonne ni remboursement ni amende, et ses décisions ne sont pas contraignantes. Faute d’accord, il publie une déclaration finale avec des recommandations à l’entreprise.",
    pt:"Não é um juiz nem substitui a SIC. Não ordena devoluções nem multas, e suas decisões não são obrigatórias. Se não houver acordo, publica uma declaração final com recomendações à empresa."},
  prfNcpWhyH:{es:"Por qué puede pesar en su caso",en:"Why it can matter in your case",fr:"Pourquoi il peut peser dans votre dossier",pt:"Por que pode pesar no seu caso"},
  prfNcpWhy:{es:["Llega a la casa matriz cuando la filial local no responde.","La empresa recibe su queja y, ante el PNC de Colombia, tiene 20 días hábiles para contestar.","La mediación es neutral, confidencial y sin costo.","Una declaración pública pesa en la reputación de una multinacional, que suele preferir un acuerdo.","Funciona con casos de consumidores: en 2025, el PNC de Irlanda recibió la queja de una persona contra la plataforma Temu, y el caso terminó en un acuerdo con el pago completo.","Puede ir junto con otros caminos: el PNC pide informar los procesos en curso, pero su existencia no impide presentar la queja."],
    en:["It reaches the parent company when the local subsidiary does not answer.","The company receives your complaint and, before Colombia’s NCP, has 20 business days to reply.","Mediation is neutral, confidential and free.","A public statement weighs on a multinational’s reputation, so companies often prefer an agreement.","It works for consumer cases: in 2025, Ireland’s NCP received an individual’s complaint against the Temu platform, and the case ended in a settlement with payment in full.","It can run alongside other routes: the NCP asks you to report ongoing proceedings, but their existence does not prevent you from filing."],
    fr:["Il atteint la maison mère quand la filiale locale ne répond pas.","L’entreprise reçoit votre plainte et, devant le PCN de Colombie, dispose de 20 jours ouvrables pour répondre.","La médiation est neutre, confidentielle et gratuite.","Une déclaration publique pèse sur la réputation d’une multinationale, qui préfère souvent un accord.","Il traite des cas de consommateurs : en 2025, le PCN d’Irlande a reçu la plainte d’un particulier contre la plateforme Temu, et l’affaire s’est conclue par un accord et un paiement intégral.","Il peut s’ajouter à d’autres recours : le PCN demande de signaler les procédures en cours, mais leur existence n’empêche pas de déposer la plainte."],
    pt:["Chega à matriz quando a filial local não responde.","A empresa recebe sua queixa e, perante o PCN da Colômbia, tem 20 dias úteis para responder.","A mediação é neutra, confidencial e gratuita.","Uma declaração pública pesa na reputação de uma multinacional, que costuma preferir um acordo.","Funciona para casos de consumidores: em 2025, o PCN da Irlanda recebeu a queixa de uma pessoa contra a plataforma Temu, e o caso terminou num acordo com pagamento integral.","Pode correr junto com outros caminhos: o PCN pede que se informem os processos em andamento, mas eles não impedem a apresentação da queixa."]},
  prfNcpWhenH:{es:"Cuándo conviene",en:"When it makes sense",fr:"Quand y recourir",pt:"Quando vale a pena"},
  prfNcpWhen:{es:["La empresa es multinacional o pertenece a un grupo con sede en un país que adhiere a las Líneas Directrices.","El problema muestra una conducta de la empresa, no solo una diferencia de precio.","Ya reclamó por escrito y no obtuvo una respuesta satisfactoria."],
    en:["The company is a multinational or part of a group based in a country that adheres to the Guidelines.","The problem shows a pattern of conduct by the company, not just a price disagreement.","You have already complained in writing without a satisfactory answer."],
    fr:["L’entreprise est une multinationale ou appartient à un groupe dont le siège est dans un pays adhérent.","Le problème révèle un comportement de l’entreprise, pas seulement un désaccord sur un prix.","Vous avez déjà réclamé par écrit sans obtenir de réponse satisfaisante."],
    pt:["A empresa é multinacional ou pertence a um grupo com sede num país que adere às Diretrizes.","O problema mostra uma conduta da empresa, não só uma diferença de preço.","Você já reclamou por escrito e não obteve resposta satisfatória."]},
  prfNcpWhere:{es:"Dónde presentarla: ante el PNC de Colombia si la conducta ocurrió en Colombia, o ante el PNC del país donde la empresa tiene su sede. La OCDE publica la lista de los PNC de los más de 50 países que adhieren.",
    en:"Where to file: with Colombia’s NCP if the conduct took place in Colombia, or with the NCP of the country where the company is based. The OECD publishes the list of NCPs of the more than 50 adhering countries.",
    fr:"Où la déposer : auprès du PCN de Colombie si les faits ont eu lieu en Colombie, ou auprès du PCN du pays où l’entreprise a son siège. L’OCDE publie la liste des PCN des plus de 50 pays adhérents.",
    pt:"Onde apresentar: no PCN da Colômbia se a conduta ocorreu na Colômbia, ou no PCN do país onde a empresa tem sede. A OCDE publica a lista dos PCN dos mais de 50 países que aderem."},
  prfNcpStepsH:{es:"Cómo funciona en Colombia",en:"How it works in Colombia",fr:"Comment cela fonctionne en Colombie",pt:"Como funciona na Colômbia"},
  prfNcpSteps:{es:["Queja escrita en español, con los hechos y sus pruebas, las Líneas Directrices que se habrían incumplido, lo que usted pide a la empresa y los otros procesos en curso.","El PNC la traslada a la empresa, que tiene 20 días hábiles para responder.","Evaluación inicial: hasta dos meses para aceptar o rechazar el caso.","Buenos oficios y mediación, voluntaria y confidencial.","Acuerdo o declaración final. El plazo indicativo total es de un año."],
    en:["A written complaint in Spanish, with the facts and their evidence, the Guidelines allegedly breached, what you ask of the company and any other ongoing proceedings.","The NCP forwards it to the company, which has 20 business days to reply.","Initial assessment: up to two months to accept or reject the case.","Good offices and mediation, voluntary and confidential.","Agreement or final statement. The indicative total timeframe is one year."],
    fr:["Une plainte écrite en espagnol, avec les faits et leurs preuves, les Principes directeurs qui auraient été enfreints, ce que vous demandez à l’entreprise et les autres procédures en cours.","Le PCN la transmet à l’entreprise, qui a 20 jours ouvrables pour répondre.","Évaluation initiale : jusqu’à deux mois pour accepter ou rejeter le dossier.","Bons offices et médiation, volontaire et confidentielle.","Accord ou déclaration finale. Le délai indicatif total est d’un an."],
    pt:["Queixa escrita em espanhol, com os fatos e suas provas, as Diretrizes que teriam sido descumpridas, o que você pede à empresa e os outros processos em andamento.","O PCN a encaminha à empresa, que tem 20 dias úteis para responder.","Avaliação inicial: até dois meses para aceitar ou rejeitar o caso.","Bons ofícios e mediação, voluntária e confidencial.","Acordo ou declaração final. O prazo indicativo total é de um ano."]},
  prfNcpEvid:{es:"Aquí las pruebas lo deciden todo: el PNC acepta o rechaza el caso según qué tan sustentada esté la queja, y sus pruebas son las que muestran el vínculo entre la conducta de la empresa y el daño que usted sufrió.",
    en:"Here evidence decides everything: the NCP accepts or rejects the case depending on how well the complaint is substantiated, and your evidence is what shows the link between the company’s conduct and the harm you suffered.",
    fr:"Ici, les preuves décident de tout : le PCN accepte ou rejette le dossier selon qu’il est bien étayé, et ce sont vos preuves qui montrent le lien entre le comportement de l’entreprise et le préjudice subi.",
    pt:"Aqui as provas decidem tudo: o PCN aceita ou rejeita o caso conforme a queixa esteja bem fundamentada, e são as suas provas que mostram o vínculo entre a conduta da empresa e o dano que você sofreu."},
  prfNcpRepH:{es:"¿Podemos representarlo?",en:"Can we represent you?",fr:"Pouvons-nous vous représenter ?",pt:"Podemos representar você?"},
  prfNcpRep:{es:"Sí. El PNC de Colombia admite que una persona presente la queja en nombre de otra, con su autorización expresa y por escrito. Nuestros abogados pueden preparar y radicar la instancia con su autorización y acompañarlo en la mediación. Ante los PNC de otros países las reglas cambian; las verificamos antes de presentar.",
    en:"Yes. Colombia’s NCP accepts a complaint filed on someone else’s behalf, with that person’s express written authorisation. Our lawyers can prepare and file the specific instance with your authorisation and accompany you in the mediation. The NCPs of other countries have their own rules; we check them before filing.",
    fr:"Oui. Le PCN de Colombie accepte qu’une personne dépose la plainte au nom d’une autre, avec son autorisation expresse et écrite. Nos avocats peuvent préparer et déposer la plainte avec votre autorisation et vous accompagner dans la médiation. Les PCN d’autres pays ont leurs propres règles ; nous les vérifions avant le dépôt.",
    pt:"Sim. O PCN da Colômbia admite que uma pessoa apresente a queixa em nome de outra, com autorização expressa e por escrito. Nossos advogados podem preparar e protocolar a instância com a sua autorização e acompanhar você na mediação. Os PCN de outros países têm regras próprias; nós as verificamos antes de apresentar."},
  prfNcpSrc:[
    ["PNC de Colombia (MinCIT)","https://www.mincit.gov.co/mincomercioexterior/temas-de-interes/colombia-en-la-ocde/punto-nacional-de-contacto-pnc-de-las-directrices/presentacion-de-una-instancia-especifica"],
    ["OECD NCPs","https://mneguidelines.oecd.org/ncps/"],
    ["Ireland NCP, Temu (2025)","https://enterprise.gov.ie/en/publications/publication-files/final-statement-ireland-ncp-temu.pdf"]],
  // cierre
  prfEndH:{es:"¿Ya tiene sus pruebas?",en:"Got your evidence?",fr:"Vous avez vos preuves ?",pt:"Já tem suas provas?"},
  prfEndP:{es:"Haga su ficha gratis y envíenosla. Le diremos qué falta y qué camino conviene.",en:"Get your free sheet and send it to us. We will tell you what is missing and which route fits.",fr:"Faites votre fiche gratuitement et envoyez-la-nous. Nous vous dirons ce qui manque et quelle voie convient.",pt:"Faça sua ficha grátis e envie para nós. Diremos o que falta e qual caminho convém."},
  prfNote:{es:"Información general para orientarlo; no reemplaza la revisión de su caso por un abogado.",en:"General information to guide you; it does not replace a lawyer’s review of your case.",fr:"Information générale pour vous orienter ; elle ne remplace pas l’examen de votre dossier par un avocat.",pt:"Informação geral para orientar você; não substitui a análise do seu caso por um advogado."}
});

  faq:[
    {q:{es:"¿Cuánto cuesta?",en:"How much does it cost?",fr:"Combien ça coûte ?",pt:"Quanto custa?"},
     a:{es:"La ficha y la orientación inicial no tienen costo. Si su caso necesita un servicio, como revisar su expediente o preparar un reclamo, le decimos el precio antes de empezar y usted decide.",en:"The sheet and the first guidance are free. If your case needs a service, such as reviewing your file or preparing a claim, we tell you the price before starting and you decide.",fr:"La fiche et la première orientation sont gratuites. Si votre dossier demande un service, comme l’examen de vos documents ou la préparation d’une réclamation, nous vous donnons le prix avant de commencer et vous décidez.",pt:"A ficha e a orientação inicial não têm custo. Se o seu caso precisar de um serviço, como revisar seus documentos ou preparar uma reclamação, informamos o preço antes de começar e você decide."}},
    {q:{es:"¿En cuánto tiempo responden?",en:"How quickly do you reply?",fr:"En combien de temps répondez-vous ?",pt:"Em quanto tempo vocês respondem?"},

    {q:{es:"¿Atienden fuera de Medellín o desde el exterior?",en:"Do you work outside Medellín or with people abroad?",fr:"Travaillez-vous hors de Medellín ou avec des personnes à l’étranger ?",pt:"Vocês atendem fora de Medellín ou no exterior?"},
     a:{es:"Sí. Trabajamos a distancia, con personas en toda Colombia y con quienes viven fuera del país.",en:"Yes. We work remotely, with people all over Colombia and with those living abroad.",fr:"Oui. Nous travaillons à distance, avec des personnes partout en Colombie et avec celles qui vivent à l’étranger.",pt:"Sim. Trabalhamos a distância, com pessoas de toda a Colômbia e com quem mora fora do país."}},
    {q:{es:"Soy extranjero. ¿La ley colombiana me protege?",en:"I’m a foreigner. Does Colombian law protect me?",fr:"Je suis étranger. La loi colombienne me protège-t-elle ?",pt:"Sou estrangeiro. A lei colombiana me protege?"},
     a:{es:"Sí. Si compró o recibió el servicio en Colombia, tiene los mismos derechos que un colombiano. Le orientamos en su idioma: español, inglés, francés o portugués.",en:"Yes. If you bought or received the service in Colombia, you have the same rights as a Colombian. We guide you in your language: Spanish, English, French or Portuguese.",fr:"Oui. Si vous avez acheté ou reçu le service en Colombie, vous avez les mêmes droits qu’un Colombien. Nous vous orientons dans votre langue : espagnol, anglais, français ou portugais.",pt:"Sim. Se você comprou ou recebeu o serviço na Colômbia, tem os mesmos direitos que um colombiano. Orientamos você no seu idioma: espanhol, inglês, francês ou português."},
     link:["#pruebas","prfIntlH"]},
    {q:{es:"¿Tengo que ir a un juzgado?",en:"Do I have to go to court?",fr:"Dois-je aller au tribunal ?",pt:"Preciso ir a um tribunal?"},
     a:{es:"En la mayoría de los casos, no. El primer paso es un reclamo escrito a la empresa; si no responde, se acude a la autoridad que corresponda, como la SIC. Solo algunos casos llegan a un juez, y se lo decimos antes.",en:"In most cases, no. The first step is a written complaint to the company; if it doesn’t answer, you turn to the relevant authority, such as the SIC. Only some cases reach a judge, and we tell you beforehand.",fr:"Dans la plupart des cas, non. La première étape est une réclamation écrite à l’entreprise ; sans réponse, on s’adresse à l’autorité compétente, comme la SIC. Seuls certains dossiers vont devant un juge, et nous vous le disons avant.",pt:"Na maioria dos casos, não. O primeiro passo é uma reclamação escrita à empresa; se ela não responder, recorre-se à autoridade competente, como a SIC. Só alguns casos chegam a um juiz, e avisamos antes."}},
    {q:{es:"¿Garantizan el resultado?",en:"Do you guarantee the outcome?",fr:"Garantissez-vous le résultat ?",pt:"Vocês garantem o resultado?"},
     a:{es:"No. Ningún abogado puede prometer un resultado. Le decimos con claridad qué es posible, qué riesgos hay y cuánto cuesta.",en:"No. No lawyer can promise an outcome. We tell you clearly what is possible, what the risks are and what it costs.",fr:"Non. Aucun avocat ne peut promettre un résultat. Nous vous disons clairement ce qui est possible, quels sont les risques et combien cela coûte.",pt:"Não. Nenhum advogado pode prometer um resultado. Dizemos com clareza o que é possível, quais são os riscos e quanto custa."}},
    {q:{es:"¿Qué pruebas necesito?",en:"What evidence do I need?",fr:"De quelles preuves ai-je besoin ?",pt:"De quais provas eu preciso?"},
     a:{es:"Depende del caso, pero casi siempre: el anuncio o el contrato, el comprobante de pago, los mensajes con la empresa y fotos con fecha. La guía de pruebas lo detalla por tipo de caso.",en:"It depends on the case, but almost always: the listing or contract, proof of payment, messages with the company and dated photos. The evidence guide details it by type of case.",fr:"Cela dépend du dossier, mais presque toujours : l’annonce ou le contrat, la preuve de paiement, les messages avec l’entreprise et des photos datées. Le guide des preuves détaille tout par type de dossier.",pt:"Depende do caso, mas quase sempre: o anúncio ou o contrato, o comprovante de pagamento, as mensagens com a empresa e fotos com data. O guia de provas detalha por tipo de caso."},
     link:["#pruebas","footPrf"]},
    {q:{es:"¿Pueden representarme ante una multinacional?",en:"Can you represent me against a multinational?",fr:"Pouvez-vous me représenter face à une multinationale ?",pt:"Vocês podem me representar contra uma multinacional?"},
     a:{es:"Sí. Además del reclamo y de la SIC, con su autorización escrita podemos presentar su caso ante el Punto Nacional de Contacto de la OCDE, que ofrece una mediación gratuita con la empresa.",en:"Yes. Besides the complaint and the SIC, with your written authorisation we can bring your case to the OECD National Contact Point, which offers free mediation with the company.",fr:"Oui. En plus de la réclamation et de la SIC, avec votre autorisation écrite nous pouvons porter votre dossier devant le Point de contact national de l’OCDE, qui propose une médiation gratuite avec l’entreprise.",pt:"Sim. Além da reclamação e da SIC, com sua autorização por escrito podemos levar o caso ao Ponto de Contato Nacional da OCDE, que oferece uma mediação gratuita com a empresa."},
     link:["#pruebas","prfNcpH"]},
    {q:{es:"¿Qué hacen con mis datos?",en:"What do you do with my data?",fr:"Que faites-vous de mes données ?",pt:"O que vocês fazem com meus dados?"},
     a:{es:"Esta página no guarda sus respuestas y cuenta las visitas de forma anónima, sin cookies. Si nos envía su ficha, usamos sus datos solo para orientarlo y responderle, y puede pedir que los corrijamos o los borremos (Ley 1581 de 2012).",en:"This page doesn’t store your answers and counts visits anonymously, without cookies. If you send us your sheet, we use your data only to guide you and reply, and you can ask us to correct or delete it (Colombian Law 1581 of 2012).",fr:"Cette page n’enregistre pas vos réponses et compte les visites de façon anonyme, sans cookies. Si vous nous envoyez votre fiche, nous utilisons vos données uniquement pour vous orienter et vous répondre, et vous pouvez demander leur correction ou leur suppression (loi colombienne 1581 de 2012).",pt:"Esta página não guarda suas respostas e conta as visitas de forma anônima, sem cookies. Se você nos enviar sua ficha, usamos seus dados só para orientar e responder, e você pode pedir que os corrijamos ou apaguemos (Lei colombiana 1581 de 2012)."}},
    {q:{es:"¿La información de la página es asesoría legal?",en:"Is the information on this page legal advice?",fr:"Les informations de cette page sont-elles un conseil juridique ?",pt:"A informação da página é assessoria jurídica?"},
     a:{es:"Es orientación general, con fuentes y fecha de actualización. No reemplaza la revisión de su caso, que nuestros abogados hacen antes de cualquier actuación.",en:"It is general guidance, with sources and an update date. It doesn’t replace the review of your case, which our lawyers carry out before taking any action.",fr:"C’est une orientation générale, avec des sources et une date de mise à jour. Elle ne remplace pas l’examen de votre dossier, que nos avocats font avant toute démarche.",pt:"É orientação geral, com fontes e data de atualização. Não substitui a análise do seu caso, que nossos advogados fazem antes de qualquer ação."}}

  exLawNote:{es:"Resumen general de las normas. Una abogada revisa cómo se aplican a su caso antes de actuar.",en:"General summary of the rules. A lawyer reviews how they apply to your case before acting.",fr:"Résumé général des règles. Une avocate vérifie comment elles s’appliquent à votre cas avant d’agir.",pt:"Resumo geral das normas. Uma advogada revisa como se aplicam ao seu caso antes de agir."},
  exLaw:{
    cc1546:{es:"Código Civil, art. 1546: si la otra parte no cumple, usted puede exigir el cumplimiento o la terminación del contrato, en ambos casos con indemnización de perjuicios.",en:"Civil Code, art. 1546: if the other party fails to perform, you can demand performance or termination of the contract, with damages in either case.",fr:"Code civil, art. 1546 : si l’autre partie n’exécute pas, vous pouvez exiger l’exécution ou la résolution du contrat, avec des dommages et intérêts dans les deux cas.",pt:"Código Civil, art. 1546: se a outra parte não cumprir, você pode exigir o cumprimento ou a resolução do contrato, com indenização por perdas e danos em ambos os casos."},
    cco870:{es:"Código de Comercio, art. 870: en un contrato comercial, si la otra parte incurre en mora, puede pedir la terminación con indemnización o el cumplimiento con indemnización por la demora.",en:"Commercial Code, art. 870: in a commercial contract, if the other party defaults, you can seek termination with damages or performance with damages for the delay.",fr:"Code de commerce, art. 870 : dans un contrat commercial, si l’autre partie est en demeure, vous pouvez demander la résiliation avec indemnisation, ou l’exécution avec indemnisation du retard.",pt:"Código de Comércio, art. 870: num contrato comercial, se a outra parte estiver em mora, você pode pedir a resolução com indenização ou o cumprimento com indenização pela demora."},
    cc1602:{es:"Código Civil, art. 1602: el contrato es ley para las partes; los términos que usted aceptó obligan también a la plataforma.",en:"Civil Code, art. 1602: a contract is binding law between the parties; the terms you accepted also bind the platform.",fr:"Code civil, art. 1602 : le contrat fait la loi des parties ; les conditions que vous avez acceptées engagent aussi la plateforme.",pt:"Código Civil, art. 1602: o contrato é lei entre as partes; os termos que você aceitou também obrigam a plataforma."},
    bf:{es:"Código de Comercio, art. 871, y Código Civil, art. 1603: los contratos deben ejecutarse de buena fe y obligan a todo lo que se deriva de su naturaleza.",en:"Commercial Code, art. 871, and Civil Code, art. 1603: contracts must be performed in good faith and bind the parties to everything that follows from their nature.",fr:"Code de commerce, art. 871, et Code civil, art. 1603 : les contrats s’exécutent de bonne foi et obligent à tout ce qui découle de leur nature.",pt:"Código de Comércio, art. 871, e Código Civil, art. 1603: os contratos devem ser executados de boa-fé e obrigam a tudo o que decorre da sua natureza."},
    dam:{es:"Código Civil, arts. 1613 y 1614: la indemnización cubre el daño emergente (lo que perdió o pagó de más) y el lucro cesante (lo que dejó de ganar).",en:"Civil Code, arts. 1613 and 1614: damages cover actual loss (what you lost or overpaid) and lost profit (what you failed to earn).",fr:"Code civil, art. 1613 et 1614 : l’indemnisation couvre la perte subie (ce que vous avez perdu ou payé en trop) et le gain manqué.",pt:"Código Civil, arts. 1613 e 1614: a indenização cobre o dano emergente (o que perdeu ou pagou a mais) e o lucro cessante (o que deixou de ganhar)."},
    pr10:{es:"Código Civil, art. 2536: la acción contractual ordinaria prescribe en 10 años.",en:"Civil Code, art. 2536: an ordinary contractual action is time-barred after 10 years.",fr:"Code civil, art. 2536 : l’action contractuelle ordinaire se prescrit par 10 ans.",pt:"Código Civil, art. 2536: a ação contratual ordinária prescreve em 10 anos."},
    hosp:{es:"Código de Comercio, arts. 1192 y siguientes: el hospedaje que presta una empresa dedicada a esa actividad es un contrato comercial.",en:"Commercial Code, arts. 1192 et seq.: accommodation provided by a business in that trade is a commercial contract.",fr:"Code de commerce, art. 1192 et suivants : l’hébergement fourni par une entreprise dont c’est l’activité est un contrat commercial.",pt:"Código de Comércio, arts. 1192 e seguintes: a hospedagem prestada por uma empresa dedicada a essa atividade é um contrato comercial."},
    transp:{es:"Código de Comercio, arts. 981 y 982: el transportador se obliga a llevarlo a usted y a su equipaje al destino, en el plazo y por el medio pactados, y a conducirlo sano y salvo.",en:"Commercial Code, arts. 981 and 982: the carrier must take you and your baggage to the destination, within the agreed time and by the agreed means, and carry you safe and sound.",fr:"Code de commerce, art. 981 et 982 : le transporteur doit vous conduire, vous et vos bagages, à destination dans le délai et par le moyen convenus, sain et sauf.",pt:"Código de Comércio, arts. 981 e 982: o transportador deve levar você e sua bagagem ao destino, no prazo e pelo meio combinados, e conduzi-lo são e salvo."},
    pr2t:{es:"Código de Comercio, art. 993: las acciones del contrato de transporte prescriben en 2 años desde que terminó o debió terminar el viaje.",en:"Commercial Code, art. 993: actions under a contract of carriage are time-barred 2 years after the journey ended or should have ended.",fr:"Code de commerce, art. 993 : les actions nées du contrat de transport se prescrivent par 2 ans à compter de la fin, réelle ou prévue, du voyage.",pt:"Código de Comércio, art. 993: as ações do contrato de transporte prescrevem em 2 anos a partir de quando a viagem terminou ou deveria ter terminado."},
    mtl:{es:"Convenio de Montreal de 1999 (Ley 701 de 2001), vuelos internacionales: la aerolínea responde por el retraso (art. 19) y por el equipaje (art. 17), con los límites del art. 22; la demanda se presenta dentro de 2 años (art. 35).",en:"Montreal Convention 1999 (Colombian Law 701 of 2001), international flights: the airline is liable for delay (art. 19) and baggage (art. 17), within the limits of art. 22; claims must be filed within 2 years (art. 35).",fr:"Convention de Montréal de 1999 (loi colombienne 701 de 2001), vols internationaux : la compagnie répond du retard (art. 19) et des bagages (art. 17), dans les limites de l’art. 22 ; l’action doit être intentée dans les 2 ans (art. 35).",pt:"Convenção de Montreal de 1999 (Lei colombiana 701 de 2001), voos internacionais: a companhia responde pelo atraso (art. 19) e pela bagagem (art. 17), com os limites do art. 22; a ação deve ser proposta em até 2 anos (art. 35)."},
    mtl31:{es:"Convenio de Montreal, art. 31: la protesta por escrito se presenta a más tardar 7 días después de recibir el equipaje dañado, o 21 días después de que se lo pongan a disposición si llegó con retraso.",en:"Montreal Convention, art. 31: a written complaint must be made within 7 days of receiving damaged baggage, or within 21 days of it being placed at your disposal if delayed.",fr:"Convention de Montréal, art. 31 : la protestation écrite doit être faite au plus tard 7 jours après réception du bagage endommagé, ou 21 jours après sa mise à disposition en cas de retard.",pt:"Convenção de Montreal, art. 31: o protesto por escrito deve ser feito até 7 dias após receber a bagagem danificada, ou até 21 dias após ser colocada à sua disposição em caso de atraso."},
    sale:{es:"Código de Comercio, art. 905: en la compraventa, el vendedor se obliga a transmitir la propiedad de lo vendido y usted a pagarlo; si el vendedor no cumple, aplica el art. 870.",en:"Commercial Code, art. 905: in a sale, the seller must transfer ownership of what was sold and you must pay for it; if the seller fails to perform, art. 870 applies.",fr:"Code de commerce, art. 905 : dans la vente, le vendeur s’oblige à transférer la propriété de la chose vendue et vous à la payer ; si le vendeur n’exécute pas, l’art. 870 s’applique.",pt:"Código de Comércio, art. 905: na compra e venda, o vendedor se obriga a transferir a propriedade do que vendeu e você a pagar; se o vendedor não cumprir, aplica-se o art. 870."},
    bank:{es:"Ley 1328 de 2009, art. 7, lit. q: el banco debe disponer de medios electrónicos y controles idóneos para dar seguridad a las transacciones.",en:"Law 1328 of 2009, art. 7(q): banks must have suitable electronic means and controls to keep transactions secure.",fr:"Loi 1328 de 2009, art. 7, lit. q : la banque doit disposer de moyens électroniques et de contrôles adaptés pour sécuriser les transactions.",pt:"Lei 1328 de 2009, art. 7, alínea q: o banco deve dispor de meios eletrônicos e controles idôneos para dar segurança às transações."},
    civ:{es:"Un incumplimiento, por sí solo, no es un delito: se reclama por la vía del consumidor o la del contrato. Hay delito cuando hubo engaño desde el principio, por ejemplo un anuncio, una tienda o un vendedor falsos.",en:"A breach of contract is not, by itself, a crime: it is pursued through consumer or contract law. There is a crime when there was deception from the start, for example a fake listing, shop or seller.",fr:"Une inexécution n’est pas, à elle seule, un délit : on agit par la voie de la consommation ou du contrat. Il y a délit quand il y a eu tromperie dès le départ, par exemple une fausse annonce, une fausse boutique ou un faux vendeur.",pt:"Um descumprimento, por si só, não é crime: reclama-se pela via do consumidor ou do contrato. Há crime quando houve engano desde o início, por exemplo um anúncio, uma loja ou um vendedor falsos."},
    civT:{es:"Un vuelo cancelado o retrasado no es un asunto penal: se reclama a la aerolínea, ante la Superintendencia de Transporte o por la vía del contrato.",en:"A cancelled or delayed flight is not a criminal matter: you claim from the airline, before the Superintendency of Transport or through contract law.",fr:"Un vol annulé ou retardé ne relève pas du pénal : on réclame à la compagnie, devant la Superintendencia de Transporte ou par la voie du contrat.",pt:"Um voo cancelado ou atrasado não é assunto penal: reclama-se à companhia, perante a Superintendência de Transporte ou pela via do contrato."},
    civP:{es:"Una suspensión de cuenta, una retención de pagos o el retiro de un anuncio son, en principio, asuntos del contrato y no penales.",en:"An account suspension, withheld payouts or a removed listing are, in principle, contract matters, not criminal ones.",fr:"Une suspension de compte, des paiements retenus ou une annonce retirée relèvent en principe du contrat, pas du pénal.",pt:"Uma suspensão de conta, uma retenção de pagamentos ou a retirada de um anúncio são, em princípio, assuntos do contrato e não penais."},
    cp246:{es:"Código Penal, art. 246, estafa: obtener un provecho ilícito induciendo a otro en error con engaños. Prisión de 32 a 144 meses; si el monto no supera 10 salarios mínimos (unos 17,5 millones de pesos en 2026), de 16 a 36 meses.",en:"Criminal Code, art. 246, fraud (estafa): obtaining an unlawful gain by deceiving another person. 32 to 144 months in prison; 16 to 36 months if the amount is no more than 10 minimum monthly wages (about COP 17.5 million in 2026).",fr:"Code pénal, art. 246, escroquerie (estafa) : obtenir un profit illicite en trompant autrui. Prison de 32 à 144 mois ; de 16 à 36 mois si le montant ne dépasse pas 10 salaires minimums (environ 17,5 millions de pesos en 2026).",pt:"Código Penal, art. 246, estelionato (estafa): obter vantagem ilícita induzindo outra pessoa em erro com enganos. Prisão de 32 a 144 meses; de 16 a 36 meses se o valor não passar de 10 salários mínimos (cerca de 17,5 milhões de pesos em 2026)."},
    cp269j:{es:"Código Penal, art. 269J, transferencia no consentida de activos: mover dinero ajeno mediante una manipulación informática o un artificio semejante. Prisión de 48 a 120 meses.",en:"Criminal Code, art. 269J, non-consensual transfer of assets: moving someone else’s money through computer manipulation or a similar trick. 48 to 120 months in prison.",fr:"Code pénal, art. 269J, transfert non consenti d’actifs : déplacer l’argent d’autrui par une manipulation informatique ou un artifice semblable. Prison de 48 à 120 mois.",pt:"Código Penal, art. 269J, transferência não consentida de ativos: movimentar dinheiro alheio por manipulação informática ou artifício semelhante. Prisão de 48 a 120 meses."},
    cp269i:{es:"Código Penal, art. 269I, hurto por medios informáticos: apoderarse de su dinero superando medidas de seguridad o suplantándolo ante el banco. Se castiga con las penas del hurto calificado.",en:"Criminal Code, art. 269I, theft by computer means: taking your money by bypassing security measures or impersonating you to the bank. Punished with the penalties for aggravated theft.",fr:"Code pénal, art. 269I, vol par moyens informatiques : s’emparer de votre argent en contournant des mesures de sécurité ou en se faisant passer pour vous auprès de la banque. Puni des peines du vol qualifié.",pt:"Código Penal, art. 269I, furto por meios informáticos: apoderar-se do seu dinheiro superando medidas de segurança ou se passando por você perante o banco. Punido com as penas do furto qualificado."},
    cp269a:{es:"Código Penal, art. 269A, acceso abusivo a un sistema informático: entrar a su cuenta sin autorización. Prisión de 48 a 96 meses.",en:"Criminal Code, art. 269A, unauthorised access to a computer system: getting into your account without permission. 48 to 96 months in prison.",fr:"Code pénal, art. 269A, accès abusif à un système informatique : entrer dans votre compte sans autorisation. Prison de 48 à 96 mois.",pt:"Código Penal, art. 269A, acesso abusivo a sistema informático: entrar na sua conta sem autorização. Prisão de 48 a 96 meses."},
    cp269f:{es:"Código Penal, art. 269F, violación de datos personales: obtener, vender o usar sus datos sin autorización y con provecho. Prisión de 48 a 96 meses.",en:"Criminal Code, art. 269F, personal data violation: obtaining, selling or using your data without authorisation for gain. 48 to 96 months in prison.",fr:"Code pénal, art. 269F, violation de données personnelles : obtenir, vendre ou utiliser vos données sans autorisation et avec profit. Prison de 48 à 96 mois.",pt:"Código Penal, art. 269F, violação de dados pessoais: obter, vender ou usar seus dados sem autorização e com proveito. Prisão de 48 a 96 meses."},
    cp269g:{es:"Código Penal, art. 269G, suplantación de sitios web: crear páginas o enlaces falsos para capturar datos personales. Prisión de 48 a 96 meses.",en:"Criminal Code, art. 269G, website spoofing: creating fake pages or links to capture personal data. 48 to 96 months in prison.",fr:"Code pénal, art. 269G, usurpation de sites web : créer de fausses pages ou de faux liens pour capter des données personnelles. Prison de 48 à 96 mois.",pt:"Código Penal, art. 269G, falsificação de sites: criar páginas ou links falsos para capturar dados pessoais. Prisão de 48 a 96 meses."},
    cp239:{es:"Código Penal, art. 239, hurto: apoderarse de una cosa ajena, por ejemplo objetos sacados de su equipaje.",en:"Criminal Code, art. 239, theft: taking someone else’s property, for example items removed from your baggage.",fr:"Code pénal, art. 239, vol : s’emparer du bien d’autrui, par exemple des objets retirés de votre bagage.",pt:"Código Penal, art. 239, furto: apoderar-se de coisa alheia, por exemplo objetos retirados da sua bagagem."},
    cpPers:{es:"Código Penal, arts. 111 y siguientes (lesiones personales) y art. 210A (acoso sexual): si hubo una agresión o acoso durante el viaje, es un delito.",en:"Criminal Code, arts. 111 et seq. (personal injury) and art. 210A (sexual harassment): an assault or harassment during the ride is a crime.",fr:"Code pénal, art. 111 et suivants (coups et blessures) et art. 210A (harcèlement sexuel) : une agression ou un harcèlement pendant le trajet est un délit.",pt:"Código Penal, arts. 111 e seguintes (lesões corporais) e art. 210A (assédio sexual): uma agressão ou assédio durante a corrida é crime."},
    quer:{es:"Ley 906 de 2004, arts. 73, 74 y 522: la estafa y el hurto de hasta 150 salarios mínimos (unos 262 millones de pesos en 2026) requieren querella de la víctima, dentro de los 6 meses siguientes al hecho, y antes se intenta una conciliación.",en:"Law 906 of 2004, arts. 73, 74 and 522: fraud and theft of up to 150 minimum monthly wages (about COP 262 million in 2026) require a complaint by the victim (querella) within 6 months of the events, preceded by an attempt at conciliation.",fr:"Loi 906 de 2004, art. 73, 74 et 522 : l’escroquerie et le vol jusqu’à 150 salaires minimums (environ 262 millions de pesos en 2026) exigent une plainte de la victime (querella) dans les 6 mois suivant les faits, précédée d’une tentative de conciliation.",pt:"Lei 906 de 2004, arts. 73, 74 e 522: o estelionato e o furto de até 150 salários mínimos (cerca de 262 milhões de pesos em 2026) exigem queixa da vítima (querella) dentro de 6 meses após o fato, precedida de uma tentativa de conciliação."},
    den:{es:"Dónde denunciar: Fiscalía General de la Nación o CAI Virtual de la Policía Nacional. Guarde el número de la denuncia: el banco o la plataforma pueden pedírselo.",en:"Where to report: the Attorney General’s Office (Fiscalía) or the National Police CAI Virtual. Keep the report number: the bank or platform may ask for it.",fr:"Où porter plainte : Fiscalía General de la Nación ou CAI Virtual de la Police nationale. Gardez le numéro de plainte : la banque ou la plateforme peuvent vous le demander.",pt:"Onde denunciar: Fiscalía General de la Nación ou CAI Virtual da Polícia Nacional. Guarde o número da denúncia: o banco ou a plataforma podem pedi-lo."}

    hosp79:{es:"Ley 300 de 1996, art. 79 (modificado por la Ley 2068 de 2020): el hospedaje es un contrato de adhesión para alojar a una persona por menos de 30 días a cambio de un precio.",en:"Law 300 of 1996, art. 79 (amended by Law 2068 of 2020): accommodation is a standard-form contract to lodge a person for less than 30 days for a price.",fr:"Loi 300 de 1996, art. 79 (modifié par la loi 2068 de 2020) : l’hébergement est un contrat d’adhésion pour loger une personne moins de 30 jours contre un prix.",pt:"Lei 300 de 1996, art. 79 (modificado pela Lei 2068 de 2020): a hospedagem é um contrato de adesão para alojar uma pessoa por menos de 30 dias mediante um preço."},
    cco1197:{es:"Código de Comercio, art. 1197: el hospedaje termina al vencer el plazo, sin plazo con aviso de 12 horas, por falta de pago, por infracción del reglamento o por otra causa pactada expresamente.",en:"Commercial Code, art. 1197: accommodation ends when the term expires, with 12 hours’ notice if there is no term, for non-payment, breach of the rules or another cause expressly agreed.",fr:"Code de commerce, art. 1197 : l’hébergement prend fin à l’échéance, sans terme avec un préavis de 12 heures, pour non-paiement, infraction au règlement ou autre cause expressément convenue.",pt:"Código de Comércio, art. 1197: a hospedagem termina ao vencer o prazo, sem prazo com aviso de 12 horas, por falta de pagamento, infração do regulamento ou outra causa pactuada expressamente."},
    cco1198:{es:"Código de Comercio, art. 1198: si el prestador termina el contrato, hace un inventario de las pertenencias del huésped ante testigos y puede retirarlas del alojamiento.",en:"Commercial Code, art. 1198: if the provider ends the contract, it makes an inventory of the guest’s belongings in front of witnesses and may remove them.",fr:"Code de commerce, art. 1198 : si le prestataire met fin au contrat, il dresse un inventaire des affaires du voyageur devant témoins et peut les retirer du logement.",pt:"Código de Comércio, art. 1198: se o prestador encerrar o contrato, faz um inventário dos pertences do hóspede diante de testemunhas e pode retirá-los."},
    cco1199:{es:"Código de Comercio, art. 1199: si el huésped no paga, el prestador puede hacer rematar sus bienes por un martillo autorizado y pagarse con el producto; el sobrante queda a disposición del huésped.",en:"Commercial Code, art. 1199: if the guest doesn’t pay, the provider may have the guest’s belongings auctioned by an authorised auctioneer and be paid from the proceeds; any surplus is held for the guest.",fr:"Code de commerce, art. 1199 : si le voyageur ne paie pas, le prestataire peut faire vendre ses biens aux enchères par un commissaire-priseur agréé et se payer sur le produit ; le surplus reste à la disposition du voyageur.",pt:"Código de Comércio, art. 1199: se o hóspede não pagar, o prestador pode leiloar os bens dele por um leiloeiro autorizado e se pagar com o produto; a sobra fica à disposição do hóspede."},
    l300_66:{es:"Ley 300 de 1996, art. 66: si no puede prolongar la estadía, el prestador suspende el servicio y facilita que el huésped retire sus pertenencias o las deja en un depósito seguro.",en:"Law 300 of 1996, art. 66: if the stay cannot be extended, the provider suspends the service and lets the guest collect their belongings or places them in safe storage.",fr:"Loi 300 de 1996, art. 66 : si le séjour ne peut être prolongé, le prestataire suspend le service et permet au voyageur de récupérer ses affaires, ou les place dans un dépôt sûr.",pt:"Lei 300 de 1996, art. 66: se não puder prolongar a estadia, o prestador suspende o serviço e permite que o hóspede retire seus pertences, ou os deixa num depósito seguro."},
    const28:{es:"Constitución, art. 28, y Corte Constitucional, C-519 de 2007: la habitación de hotel o el alojamiento temporal es domicilio; solo puede registrarse con orden escrita de autoridad judicial competente.",en:"Constitution, art. 28, and Constitutional Court, C-519 of 2007: a hotel room or temporary accommodation is a home; it can only be searched with a written order from a competent judicial authority.",fr:"Constitution, art. 28, et Cour constitutionnelle, C-519 de 2007 : la chambre d’hôtel ou le logement temporaire est un domicile ; il ne peut être perquisitionné que sur ordre écrit d’une autorité judiciaire compétente.",pt:"Constituição, art. 28, e Corte Constitucional, C-519 de 2007: o quarto de hotel ou a hospedagem temporária é domicílio; só pode ser revistado com ordem escrita de autoridade judicial competente."},
    pol163:{es:"Ley 1801 de 2016, art. 163: la policía solo entra a un inmueble sin orden escrita por imperiosa necesidad: auxiliar a quien lo pide, un incendio o inundación, un animal peligroso, una intrusión en la casa de un ausente, agresiones desde adentro o pólvora.",en:"Law 1801 of 2016, art. 163: the police may only enter a property without a written order in cases of pressing necessity: helping someone who asks, a fire or flood, a dangerous animal, an intrusion into an absent person’s home, attacks from inside or fireworks.",fr:"Loi 1801 de 2016, art. 163 : la police n’entre sans ordre écrit qu’en cas de nécessité impérieuse : secourir quelqu’un qui appelle, un incendie ou une inondation, un animal dangereux, une intrusion chez un absent, des agressions depuis l’intérieur ou de la pyrotechnie.",pt:"Lei 1801 de 2016, art. 163: a polícia só entra num imóvel sem ordem escrita por necessidade imperiosa: socorrer quem pede, incêndio ou inundação, animal perigoso, invasão da casa de um ausente, agressões de dentro ou fogos de artifício."},
    pol80:{es:"Ley 1801 de 2016, art. 80: la protección de la policía sobre la tenencia de un inmueble es provisional y no decide derechos, que resuelve un juez; caduca a los 4 meses.",en:"Law 1801 of 2016, art. 80: police protection of occupation of a property is provisional and does not decide rights, which a judge resolves; it expires after 4 months.",fr:"Loi 1801 de 2016, art. 80 : la protection policière de l’occupation d’un logement est provisoire et ne tranche pas les droits, qui relèvent d’un juge ; elle expire au bout de 4 mois.",pt:"Lei 1801 de 2016, art. 80: a proteção policial da posse de um imóvel é provisória e não decide direitos, que cabem a um juiz; caduca em 4 meses."},
    pol81:{es:"Ley 1801 de 2016, arts. 77 y 81: la policía puede actuar contra quien ocupa ilegalmente un inmueble, de forma preventiva dentro de las 48 horas siguientes a la ocupación.",en:"Law 1801 of 2016, arts. 77 and 81: the police can act against someone unlawfully occupying a property, preventively within 48 hours of the occupation.",fr:"Loi 1801 de 2016, art. 77 et 81 : la police peut agir contre l’occupant illégal d’un logement, à titre préventif dans les 48 heures suivant l’occupation.",pt:"Lei 1801 de 2016, arts. 77 e 81: a polícia pode agir contra quem ocupa ilegalmente um imóvel, de forma preventiva nas 48 horas seguintes à ocupação."},
    pol21:{es:"Ley 1801 de 2016, art. 21: todo procedimiento de policía puede grabarse; nadie puede impedirlo sin una restricción legal expresa.",en:"Law 1801 of 2016, art. 21: any police procedure may be recorded; no one may prevent it without an express legal restriction.",fr:"Loi 1801 de 2016, art. 21 : toute intervention de police peut être filmée ; nul ne peut l’empêcher sans restriction légale expresse.",pt:"Lei 1801 de 2016, art. 21: todo procedimento policial pode ser gravado; ninguém pode impedir sem uma restrição legal expressa."},
    pol33:{es:"Ley 1801 de 2016, art. 33: el ruido de fiestas o reuniones que afecte al vecindario es contrario a la convivencia; la policía puede intervenir.",en:"Law 1801 of 2016, art. 33: noise from parties or gatherings that disturbs the neighbourhood breaches the coexistence rules; the police can intervene.",fr:"Loi 1801 de 2016, art. 33 : le bruit de fêtes ou de réunions qui gêne le voisinage est contraire à la tranquillité publique ; la police peut intervenir.",pt:"Lei 1801 de 2016, art. 33: o barulho de festas ou reuniões que afeta a vizinhança é contrário à convivência; a polícia pode intervir."},
    cp189:{es:"Código Penal, art. 189, violación de habitación ajena: entrar sin permiso al alojamiento de otro, o escuchar, grabar o filmar su vida privada adentro. Multa; si lo hace un servidor público, también pérdida del empleo (art. 190).",en:"Criminal Code, art. 189, violation of another’s dwelling: entering someone’s accommodation without permission, or listening to, recording or filming their private life inside. A fine; if committed by a public official, also loss of office (art. 190).",fr:"Code pénal, art. 189, violation de domicile : entrer sans permission dans le logement d’autrui, ou écouter, enregistrer ou filmer sa vie privée à l’intérieur. Amende ; si l’auteur est un agent public, aussi perte de l’emploi (art. 190).",pt:"Código Penal, art. 189, violação de domicílio: entrar sem permissão na hospedagem de outra pessoa, ou escutar, gravar ou filmar sua vida privada lá dentro. Multa; se for servidor público, também perda do cargo (art. 190)."},
    cp182:{es:"Código Penal, art. 182, constreñimiento ilegal: obligar a otro a hacer, tolerar u omitir algo. Prisión de 16 a 36 meses.",en:"Criminal Code, art. 182, unlawful coercion: forcing someone to do, tolerate or refrain from something. 16 to 36 months in prison.",fr:"Code pénal, art. 182, contrainte illégale : forcer autrui à faire, tolérer ou s’abstenir de quelque chose. Prison de 16 à 36 mois.",pt:"Código Penal, art. 182, constrangimento ilegal: obrigar alguém a fazer, tolerar ou deixar de fazer algo. Prisão de 16 a 36 meses."},
    cp134a:{es:"Código Penal, art. 134A, actos de discriminación: impedir o restringir los derechos de una persona por su raza, nacionalidad, sexo, orientación sexual, discapacidad u otra razón de discriminación. Prisión de 12 a 36 meses y multa de 10 a 15 salarios mínimos.",en:"Criminal Code, art. 134A, acts of discrimination: preventing or restricting a person’s rights because of race, nationality, sex, sexual orientation, disability or other grounds. 12 to 36 months in prison and a fine of 10 to 15 minimum wages.",fr:"Code pénal, art. 134A, actes de discrimination : empêcher ou restreindre les droits d’une personne en raison de sa race, nationalité, sexe, orientation sexuelle, handicap ou d’un autre motif. Prison de 12 à 36 mois et amende de 10 à 15 salaires minimums.",pt:"Código Penal, art. 134A, atos de discriminação: impedir ou restringir os direitos de uma pessoa por raça, nacionalidade, sexo, orientação sexual, deficiência ou outro motivo. Prisão de 12 a 36 meses e multa de 10 a 15 salários mínimos."}

    art53:{es:"Ley 1480 de 2011, art. 53: la plataforma debe tener identificado a quien ofrece el alojamiento (nombre, documento, dirección y teléfono) y darle esos datos para que pueda reclamar.",en:"Law 1480 of 2011, art. 53: the platform must have the provider identified (name, ID, address and phone) and give you those details so you can claim.",fr:"Loi 1480 de 2011, art. 53 : la plateforme doit avoir identifié celui qui propose le logement (nom, pièce d’identité, adresse et téléphone) et vous transmettre ces données pour réclamer.",pt:"Lei 1480 de 2011, art. 53: a plataforma deve ter identificado quem oferece a hospedagem (nome, documento, endereço e telefone) e dar esses dados para você reclamar."},
    cco1195:{es:"Código de Comercio, art. 1195: puede entregar dinero y objetos de valor al hotel, con recibo, para que los custodie; solo puede negarse si son de valor considerable o muy voluminosos.",en:"Commercial Code, art. 1195: you can hand money and valuables to the hotel, against a receipt, for safekeeping; it may only refuse if they are of considerable value or very bulky.",fr:"Code de commerce, art. 1195 : vous pouvez confier argent et objets de valeur à l’hôtel, contre reçu, pour qu’il les garde ; il ne peut refuser que s’ils sont de grande valeur ou très volumineux.",pt:"Código de Comércio, art. 1195: você pode entregar dinheiro e objetos de valor ao hotel, com recibo, para custódia; ele só pode recusar se forem de valor considerável ou muito volumosos."},
    cco1196:{es:"Código de Comercio, art. 1196: el hotel responde como depositario; no responde si la pérdida o el daño se deben a culpa grave del huésped, de sus acompañantes o visitantes, o a la naturaleza o vicio de la cosa.",en:"Commercial Code, art. 1196: the hotel is liable as a depositary; it is not liable if the loss or damage is due to the gross fault of the guest, companions or visitors, or to the nature or defect of the item.",fr:"Code de commerce, art. 1196 : l’hôtel répond comme un dépositaire ; il n’en répond pas si la perte ou le dommage est dû à une faute lourde du client, de ses accompagnants ou visiteurs, ou à la nature ou au vice de la chose.",pt:"Código de Comércio, art. 1196: o hotel responde como depositário; não responde se a perda ou o dano se devem a culpa grave do hóspede, acompanhantes ou visitantes, ou à natureza ou vício da coisa."},
    cgp384:{es:"Código General del Proceso, art. 384: la restitución de un inmueble arrendado la ordena un juez; si la demanda es por falta de pago, el arrendatario debe consignar lo adeudado y los cánones que se causen para ser oído.",en:"General Code of Procedure, art. 384: repossession of a rented property is ordered by a judge; if the claim is for non-payment, the tenant must deposit what is owed and the ongoing rent to be heard.",fr:"Code général du procès, art. 384 : la restitution d’un logement loué est ordonnée par un juge ; si la demande porte sur des impayés, le locataire doit consigner les sommes dues et les loyers en cours pour être entendu.",pt:"Código Geral do Processo, art. 384: a restituição de um imóvel alugado é ordenada por um juiz; se a ação for por falta de pagamento, o locatário deve depositar o devido e os aluguéis em curso para ser ouvido."},
    l820_16:{es:"Ley 820 de 2003, art. 16: no se pueden exigir depósitos en dinero ni otras garantías reales para asegurar el pago, ni disfrazarlos en otros documentos.",en:"Law 820 of 2003, art. 16: cash deposits or other real guarantees cannot be required to secure payment, nor disguised in other documents.",fr:"Loi 820 de 2003, art. 16 : aucune caution en espèces ni autre garantie réelle ne peut être exigée pour assurer le paiement, ni être déguisée dans d’autres documents.",pt:"Lei 820 de 2003, art. 16: não se podem exigir depósitos em dinheiro nem outras garantias reais para assegurar o pagamento, nem disfarçá-los em outros documentos."},
    l820_20:{es:"Ley 820 de 2003, art. 20: el canon sube como máximo una vez cada 12 meses y hasta el IPC del año anterior, con aviso por correo certificado; sin aviso, el aumento no se le puede cobrar.",en:"Law 820 of 2003, art. 20: rent can rise at most once every 12 months, up to the previous year’s CPI, with notice by certified mail; without notice, the increase cannot be enforced against you.",fr:"Loi 820 de 2003, art. 20 : le loyer augmente au plus une fois tous les 12 mois, dans la limite de l’inflation de l’année précédente, avec avis par courrier certifié ; sans avis, la hausse ne vous est pas opposable.",pt:"Lei 820 de 2003, art. 20: o aluguel sobe no máximo uma vez a cada 12 meses e até o IPC do ano anterior, com aviso por correio certificado; sem aviso, o aumento não pode ser cobrado."},
    l820_22:{es:"Ley 820 de 2003, art. 22: el arrendador termina el contrato por las causales de ley; sin falta del arrendatario, en las prórrogas, con preaviso escrito de 3 meses e indemnización de 3 cánones (num. 7).",en:"Law 820 of 2003, art. 22: the landlord ends the lease on statutory grounds; without fault by the tenant, during renewals, with 3 months’ written notice and compensation of 3 months’ rent (para. 7).",fr:"Loi 820 de 2003, art. 22 : le propriétaire résilie pour les causes légales ; sans faute du locataire, pendant les reconductions, avec un préavis écrit de 3 mois et une indemnité de 3 mois de loyer (num. 7).",pt:"Lei 820 de 2003, art. 22: o locador encerra o contrato pelas causas legais; sem falta do locatário, nas prorrogações, com aviso escrito de 3 meses e indenização de 3 aluguéis (num. 7)."},
    l820_24:{es:"Ley 820 de 2003, art. 24: el arrendatario puede terminar el contrato si el arrendador le suspende los servicios a propósito (num. 1), o al vencimiento con preaviso de 3 meses sin indemnización (num. 5).",en:"Law 820 of 2003, art. 24: the tenant can end the lease if the landlord deliberately cuts off utilities (para. 1), or at expiry with 3 months’ notice and no compensation (para. 5).",fr:"Loi 820 de 2003, art. 24 : le locataire peut résilier si le propriétaire coupe volontairement les services (num. 1), ou à l’échéance avec un préavis de 3 mois sans indemnité (num. 5).",pt:"Lei 820 de 2003, art. 24: o locatário pode encerrar o contrato se o locador suspender os serviços de propósito (num. 1), ou no vencimento com aviso de 3 meses sem indenização (num. 5)."},
    l820_28:{es:"Ley 820 de 2003, art. 28: quien se dedica a arrendar o intermediar vivienda urbana en municipios de más de 15.000 habitantes debe estar matriculado ante la autoridad local.",en:"Law 820 of 2003, art. 28: anyone in the business of renting out or brokering urban housing in municipalities over 15,000 inhabitants must register with the local authority.",fr:"Loi 820 de 2003, art. 28 : quiconque loue ou intermédie des logements urbains dans une commune de plus de 15 000 habitants doit être immatriculé auprès de l’autorité locale.",pt:"Lei 820 de 2003, art. 28: quem se dedica a alugar ou intermediar moradia urbana em municípios de mais de 15 mil habitantes deve estar registrado na autoridade local."},
    l820_33:{es:"Ley 820 de 2003, arts. 33 y 34: la alcaldía vigila a arrendadores e inmobiliarias, atiende quejas y puede imponer multas de hasta 100 salarios mínimos y suspender o cancelar la matrícula.",en:"Law 820 of 2003, arts. 33 and 34: the city hall supervises landlords and agencies, handles complaints and can impose fines of up to 100 minimum wages and suspend or cancel registration.",fr:"Loi 820 de 2003, art. 33 et 34 : la mairie contrôle propriétaires et agences, traite les plaintes et peut infliger des amendes jusqu’à 100 salaires minimums et suspendre ou annuler l’immatriculation.",pt:"Lei 820 de 2003, arts. 33 e 34: a prefeitura fiscaliza locadores e imobiliárias, atende queixas e pode aplicar multas de até 100 salários mínimos e suspender ou cancelar o registro."},
    pol77t:{es:"Ley 1801 de 2016, arts. 77 y 81: impedir el ingreso o el uso de un inmueble a quien tiene su tenencia es contrario a la convivencia; la policía puede actuar de forma preventiva dentro de las 48 horas.",en:"Law 1801 of 2016, arts. 77 and 81: preventing someone who lawfully occupies a property from entering or using it breaches the coexistence rules; the police can act preventively within 48 hours.",fr:"Loi 1801 de 2016, art. 77 et 81 : empêcher l’occupant légitime d’entrer ou d’utiliser le logement est contraire à la tranquillité publique ; la police peut agir à titre préventif dans les 48 heures.",pt:"Lei 1801 de 2016, arts. 77 e 81: impedir a entrada ou o uso do imóvel a quem tem sua posse é contrário à convivência; a polícia pode agir de forma preventiva nas 48 horas."}

Object.assign(UI.exLaw, {
  pol77t:{es:"Ley 1801 de 2016, arts. 77 (num. 5) y 79, y Código Civil, art. 775: impedir el ingreso o el uso del inmueble a quien tiene su tenencia es contrario a la convivencia; el arrendatario, como mero tenedor, puede pedir al inspector que le restituya la tenencia (Corte Constitucional, T-164 de 2024).",en:"Law 1801 of 2016, arts. 77(5) and 79, and Civil Code, art. 775: preventing a lawful holder from entering or using a property breaches the coexistence rules; the tenant, as a holder, can ask the inspector to restore occupation (Constitutional Court, T-164 of 2024).",fr:"Loi 1801 de 2016, art. 77 (num. 5) et 79, et Code civil, art. 775 : empêcher le détenteur légitime d’entrer ou d’utiliser le logement est contraire à la tranquillité publique ; le locataire, en tant que détenteur, peut demander à l’inspecteur de lui rendre l’accès (Cour constitutionnelle, T-164 de 2024).",pt:"Lei 1801 de 2016, arts. 77 (num. 5) e 79, e Código Civil, art. 775: impedir a entrada ou o uso do imóvel a quem tem sua posse é contrário à convivência; o locatário, como mero detentor, pode pedir ao inspetor a restituição (Corte Constitucional, T-164 de 2024)."},

    l2068:{es:"Ley 2068 de 2020, arts. 38 y 39: la plataforma de servicios turísticos es prestadora de servicios turísticos, debe tener RNT vigente y retirar a quien no lo tenga; responde ante usted por publicidad engañosa si permite anunciar a prestadores sin RNT activo.",en:"Law 2068 of 2020, arts. 38 and 39: a tourism platform is itself a tourism provider, must hold a valid RNT and remove providers without one; it is liable to you for misleading advertising if it lets providers without an active RNT advertise.",fr:"Loi 2068 de 2020, art. 38 et 39 : la plateforme de services touristiques est elle-même prestataire touristique, doit avoir un RNT en vigueur et retirer ceux qui n’en ont pas ; elle répond envers vous de la publicité trompeuse si elle laisse annoncer des prestataires sans RNT actif.",pt:"Lei 2068 de 2020, arts. 38 e 39: a plataforma de serviços turísticos é ela própria prestadora turística, deve ter RNT vigente e retirar quem não tiver; responde perante você por publicidade enganosa se permitir anunciar prestadores sem RNT ativo."},
    d1423:{es:"Decreto 1423 de 2026 (sismo del 10 de agosto de 2026): para arrendatarios afectados directamente, suspende 6 meses la ejecución de restituciones, aplaza los reajustes y permite prorrogar 6 meses los contratos que vencían entre el 10 de agosto y el 31 de diciembre de 2026.",en:"Decree 1423 of 2026 (earthquake of 10 August 2026): for directly affected tenants, it suspends enforcement of repossessions for 6 months, postpones rent increases and allows 6-month extensions of leases ending between 10 August and 31 December 2026.",fr:"Décret 1423 de 2026 (séisme du 10 août 2026) : pour les locataires directement touchés, il suspend 6 mois l’exécution des restitutions, reporte les hausses de loyer et permet de prolonger de 6 mois les baux arrivant à échéance entre le 10 août et le 31 décembre 2026.",pt:"Decreto 1423 de 2026 (sismo de 10 de agosto de 2026): para locatários afetados diretamente, suspende por 6 meses a execução de restituições, adia os reajustes e permite prorrogar por 6 meses os contratos que venciam entre 10 de agosto e 31 de dezembro de 2026."},

    rac3:{es:"RAC 3 (Reglamento Aeronáutico de Colombia), numeral 3.10.2.13.2: por demora imputable a la aerolínea, refrigerio y llamada desde 1 hora, alimentos desde 3 horas, compensación de al menos el 30 % del trayecto desde 5 horas, y hospedaje si la demora pasa de las 10 p. m.",en:"RAC 3 (Colombian Aviation Regulations), para. 3.10.2.13.2: for a delay attributable to the airline, a snack and a call from 1 hour, meals from 3 hours, compensation of at least 30% of the fare from 5 hours, and lodging if the delay runs past 10 p.m.",fr:"RAC 3 (règlement aéronautique colombien), num. 3.10.2.13.2 : pour un retard imputable à la compagnie, collation et appel dès 1 heure, repas dès 3 heures, compensation d’au moins 30 % du trajet dès 5 heures, et hébergement si le retard dépasse 22 h.",pt:"RAC 3 (Regulamento Aeronáutico da Colômbia), num. 3.10.2.13.2: por atraso imputável à companhia, lanche e ligação a partir de 1 hora, refeições a partir de 3 horas, compensação de pelo menos 30 % do trecho a partir de 5 horas, e hospedagem se o atraso passar das 22 h."},

const LEGAL_TR = {"en": {"Garantía legal: todo producto debe servir para lo que se vende. Si no se indica plazo, la garantía de un producto nuevo es de un año desde la entrega (Ley 1480, art. 8). Un bien usado tiene tres meses de garantía, salvo que se haya vendido sin garantía con aceptación expresa y por escrito (Decreto 735 de 2013, art. 12).": "Legal warranty: every product must work for what it is sold for. If no period is stated, a new product's warranty is one year from delivery (Law 1480, art. 8). A used item has a three-month warranty, unless it was sold without warranty and you accepted this expressly and in writing (Decree 735 of 2013, art. 12).", "Reparación gratuita como regla. Si la falla se repite, usted elige: nueva reparación, cambio o devolución del precio (Ley 1480, art. 11). La reparación debe hacerse en máximo 30 días hábiles si la SIC no fija otro plazo, y la devolución del dinero en 15 días hábiles después de entregar el bien (Decreto 735 de 2013, arts. 8 y 10).": "Free repair is the rule. If the fault comes back, you choose: another repair, a replacement or a refund (Law 1480, art. 11). Repairs must be done within 30 business days unless the SIC sets another period, and refunds within 15 business days after you return the item (Decree 735 of 2013, arts. 8 and 10).", "Servicios mal prestados: usted elige que se repita el servicio o que le devuelvan el dinero (Decreto 735 de 2013, art. 16).": "Poorly provided services: you choose whether the service is provided again or your money is refunded (Decree 735 of 2013, art. 16).", "Precio: debe informarse en pesos y usted solo está obligado a pagar el precio anunciado (Ley 1480, art. 26).": "Price: it must be stated in Colombian pesos, and you only have to pay the advertised price (Law 1480, art. 26).", "Cláusulas abusivas, como las que limitan la responsabilidad del proveedor, no tienen efecto (Ley 1480, arts. 42 y 43).": "Unfair terms, such as those limiting the supplier's liability, have no effect (Law 1480, arts. 42 and 43).", "Permanencia mínima: solo vale si se pactó de forma expresa y, por regla general, no puede pasar de un año (Ley 1480, art. 41).": "Minimum contract term: it is only valid if expressly agreed and, as a rule, cannot exceed one year (Law 1480, art. 41).", "Primero reclame por escrito al proveedor; debe responder en 15 días hábiles. Guarde copia: es requisito para demandar (Ley 1480, art. 58, num. 5).": "First complain in writing to the supplier; it must reply within 15 business days. Keep a copy: it is required before you can sue (Law 1480, art. 58, para. 5).", "Demanda ante la SIC: a más tardar un año después de vencida la garantía (Ley 1480, art. 58, num. 3). Según la SIC, si lo que reclama es inferior a 40 salarios mínimos mensuales, no necesita abogado.": "Claim before the SIC: no later than one year after the warranty expires (Law 1480, art. 58, para. 3). According to the SIC, if your claim is below 40 monthly minimum wages, you do not need a lawyer.", "Compras en línea: retracto de 5 días hábiles, devolución del dinero en máximo 15 días calendario y reversión del pago en 5 días hábiles en los casos de ley (Ley 1480 y Ley 2439 de 2024).": "Online purchases: 5 business days to withdraw, refund within 15 calendar days at most, and payment reversal within 5 business days in the cases set by law (Law 1480 and Law 2439 of 2024).", "Si el prestador no cumple lo reservado, usted elige: otro servicio de la misma calidad o el reembolso o compensación del precio. Si no puede darle uno igual, debe contratarlo con un tercero a su costa (Ley 300 de 1996, art. 63).": "If the provider does not deliver what you booked, you choose: another service of the same quality, or a refund or compensation. If they cannot offer an equivalent, they must book one with a third party at their own cost (Law 300 of 1996, art. 63).", "La sobreventa recibe el mismo trato (Ley 300 de 1996, art. 64).": "Overbooking is treated the same way (Law 300 of 1996, art. 64).", "Cancelar una reserva confirmada para revenderla más cara es un incumplimiento que la SIC puede sancionar.": "Cancelling a confirmed booking to resell it at a higher price is a breach that the SIC can sanction.", "Si reservó por una app de alojamiento, revise también lo que ofrece la política de la plataforma.": "If you booked through a lodging app, also check what the platform's policy offers.", "Reclame por escrito de inmediato; el proveedor tiene 15 días hábiles para responder.": "Complain in writing straight away; the supplier has 15 business days to reply.", "Demanda ante la SIC: hasta un año.": "Lawsuit before the SIC: up to one year.", "Escriba al anfitrión u hotel y a la plataforma pidiendo alojamiento equivalente o reembolso.": "Write to the host or hotel and to the platform asking for equivalent accommodation or a refund.", "Si paga otro alojamiento más caro o transporte extra, guarde las facturas.": "If you pay for more expensive accommodation or extra transport, keep the invoices.", "Si no resuelven, queja o demanda ante la SIC.": "If they don’t resolve it, complaint or lawsuit before the SIC.", "Confirmación de la reserva y comprobante de pago": "Booking confirmation and proof of payment", "Mensajes de cancelación con fecha": "Dated cancellation messages", "Capturas del anuncio": "Screenshots of the listing", "Facturas de los gastos adicionales": "Invoices for the extra costs", "La información y la publicidad deben ser veraces; quien anuncia responde por lo que ofrece (Ley 1480, arts. 23 y 30).": "Information and advertising must be truthful; whoever advertises is liable for what they offer (Law 1480, arts. 23 and 30).", "Si el servicio no corresponde, usted puede pedir que se preste como se contrató o la devolución del dinero (garantía de servicios, Decreto 735 de 2013, art. 16).": "If the service does not match, you can ask for it to be provided as agreed or for a refund (service warranty, Decree 735 of 2013, art. 16).", "Si la plataforma permite publicar a un prestador sin Registro Nacional de Turismo activo, responde ante usted por publicidad engañosa (Ley 2068 de 2020, art. 39).": "If the platform lets a provider list without an active National Tourism Registry (RNT) number, the platform is liable to you for misleading advertising (Law 2068 of 2020, art. 39).", "Avise el mismo día por escrito: las plataformas suelen fijar plazos cortos para reportar problemas (revise sus términos).": "Report it in writing the same day: platforms often set short deadlines to report problems (check their terms).", "Al llegar, tome fotos y video con fecha visible.": "When you arrive, take photos and video with the date visible.", "Escriba al anfitrión y a la plataforma pidiendo solución, reubicación o reembolso.": "Write to the host and the platform asking for a fix, relocation or a refund.", "Capturas del anuncio tal como estaba al reservar": "Screenshots of the listing as it was when you booked", "Fotos y video del lugar": "Photos and video of the place", "Mensajes con el anfitrión y la plataforma": "Messages with the host and the platform", "Solo debe pagar el precio total anunciado antes de pagar (Ley 1480, art. 26).": "You only have to pay the total price shown before payment (Law 1480, art. 26).", "El depósito se devuelve según lo pactado; cualquier descuento por daños debe justificarse con pruebas.": "The deposit is returned as agreed; any deduction for damage must be backed by evidence.", "Si el cobro fue en línea con tarjeta y es fraudulento, no solicitado o por algo no recibido, puede proceder la reversión del pago (Ley 1480, art. 51).": "If the online card charge is fraudulent, unrequested or for something you did not receive, a payment reversal may apply (Law 1480, art. 51).", "Reversión del pago: 5 días hábiles desde que se enteró.": "Payment reversal: 5 business days from when you found out.", "Respuesta del proveedor a su reclamo: 15 días hábiles.": "Supplier's reply to your complaint: 15 business days.", "Pida por escrito el desglose del cobro o la razón del descuento.": "Ask in writing for a breakdown of the charge or the reason for the deduction.", "Si procede, pida la reversión al vendedor y a su banco.": "If it applies, ask the seller and your bank for the reversal.", "Anuncio con el precio": "Listing showing the price", "Recibos y extractos": "Receipts and statements", "Fotos de entrega del lugar": "Photos of the place at check-in", "Mensajes": "Messages", "Si pagó en línea con tarjeta un cobro que no reconoce, la reversión del pago debe pedirse dentro de los 5 días hábiles siguientes a enterarse.": "If you paid online by card and do not recognise the charge, the payment reversal must be requested within 5 business days of finding out.", "Usted tiene derecho a la seguridad y a no sufrir daños en condiciones normales de uso (Ley 1480).": "You have the right to safety and not to suffer harm under normal conditions of use (Law 1480).", "Los prestadores de alojamiento turístico deben tener una póliza de responsabilidad por daños a huéspedes y a terceros, que cubre como mínimo muerte, incapacidad, lesiones, daños a bienes de terceros y gastos médicos (Ley 2068 de 2020, art. 32). Pida los datos de la póliza.": "Tourist accommodation providers must have liability insurance for harm to guests and third parties, covering at least death, disability, injury, damage to third-party property and medical costs (Law 2068 of 2020, art. 32). Ask for the policy details.", "Si hubo un delito, la denuncia penal va primero; la reclamación de consumo, después.": "If a crime occurred, the criminal complaint comes first; the consumer claim comes after.", "Reporte por escrito al prestador el mismo día.": "Report it in writing to the provider the same day.", "Si hay peligro, llame al 123.": "If there is danger, call 123.", "Atención médica y denuncia si corresponde.": "Get medical care and file a police report if relevant.", "Reporte escrito al hotel o anfitrión y a la plataforma.": "Written report to the hotel or host and to the platform.", "Reclamación por los daños; si no responden, demanda civil o ante la SIC.": "Claim for the damage; if they do not reply, a civil claim or a claim before the SIC.", "Fotos y video": "Photos and video", "Informe médico": "Medical report", "Denuncia": "Police report", "Mensajes con el prestador": "Messages with the provider", "Si un servicio turístico vendido no se presta, usted elige otro de la misma calidad o el reembolso o compensación del precio (Ley 300 de 1996, art. 63).": "If a tourism service you bought is not provided, you choose another of the same quality, or a refund or compensation (Law 300 of 1996, art. 63).", "La información del paquete debe ser veraz, completa y entregada antes de pagar (Ley 1480).": "Package information must be truthful, complete and given before you pay (Law 1480).", "Reclame a la agencia y al prestador directo (hotel, aerolínea, operador): ambos pueden responder.": "Complain to the agency and to the direct provider (hotel, airline, operator): both may be liable.", "Respuesta a su reclamo: 15 días hábiles.": "Reply to your complaint: 15 business days.", "Reclamo escrito a la agencia y al prestador.": "Written complaint to the agency and the provider.", "Contrato o voucher del paquete": "Package contract or voucher", "Publicidad del paquete": "Package advertising", "Pagos": "Payments", "Rige la política de cancelación que aceptó, si se la informaron antes de pagar.": "The cancellation policy you accepted applies, if it was shown to you before paying.", "Si usted no se presenta, el prestador puede cobrar hasta el 20 % del precio o retener el anticipo pactado (Ley 300 de 1996, art. 65).": "If you do not show up, the provider may charge up to 20% of the price or keep the agreed advance payment (Law 300 of 1996, art. 65).", "Una cláusula que impida todo reembolso en cualquier caso puede revisarse como abusiva (Ley 1480, arts. 42 y 43).": "A clause that blocks any refund in every case may be challenged as unfair (Law 1480, arts. 42 and 43).", "La ley prevé un retracto de 5 días hábiles en servicios comprados a distancia que no empiecen a ejecutarse antes de cinco días (Ley 1480, art. 47). Su aplicación a su reserva concreta la verifica nuestro equipo de abogados.": "The law provides a 5-business-day withdrawal right for services bought remotely that do not start within five days (Law 1480, art. 47). Whether it applies to your specific booking is checked by our lawyers.", "Cancele por escrito y lo antes posible para entrar en la franja más favorable de la política.": "Cancel in writing as early as possible to fall in the most favourable bracket of the policy.", "Revise la política de cancelación que aceptó.": "Check the cancellation policy you accepted.", "Cancele por escrito y pida la liquidación del reembolso.": "Cancel in writing and ask for the refund calculation.", "Si la retención le parece abusiva, reclame y luego acuda a la SIC.": "If the amount kept seems unfair, complain and then go to the SIC.", "Política de cancelación (captura)": "Cancellation policy (screenshot)", "Confirmación y pago": "Confirmation and payment", "Más de 1 hora y menos de 3, por causa de la aerolínea: refrigerio y una llamada.": "More than 1 hour and less than 3, caused by the airline: a snack and a phone call.", "Más de 3 y menos de 5 horas: además, alimentos según la hora.": "More than 3 and less than 5 hours: meals as well, depending on the time of day.", "Más de 5 horas: compensación adicional mínima del 30 % del valor del trayecto.": "More than 5 hours: additional compensation of at least 30% of the fare for that leg.", "Si la demora pasa de las 10 p. m.: hospedaje (si no vive en esa ciudad) y traslados.": "If the delay goes past 10 p.m.: accommodation (if you do not live in that city) and transfers.", "Por clima u otras causas ajenas a la aerolínea no hay compensación, pero sí información, reprogramación o reembolso.": "For weather or other causes outside the airline's
