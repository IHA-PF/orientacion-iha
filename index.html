<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Orientación legal gratuita en 2 minutos: anfitriones, consumidores y conflictos con plataformas digitales en Colombia.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Orientación legal IHA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header with tabs and language, a navy "papel sellado" hero that three door cards overlap, one question per screen, then a sealed guidance sheet with a sticky action bar.
   Colour logic: navy = authority and trust, teal = calm and competence (all interactive states), gold = value (one element per screen),
   green/orange/red = verdict only. Sector hues (teal, blue, plum) are wayfinding only and never reused for the verdict. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#F8FAFB; --ink:#0F2A43; --muted:#4D5B67; --line:#DCE2E7; --line-strong:#C2CBD3;
  --navy:#0F2A43; --on-navy:#F3F7FA; --on-navy-muted:#B7C6D3; --on-navy-accent:#8FD0D2;
  --teal:#1E6F73; --teal-soft:#E2EFEF; --blue:#2B5C94; --blue-soft:#E4ECF5; --plum:#6A4F86; --plum-soft:#EDE8F3;
  --gold:#A87A1F; --gold-soft:#F8F0DE; --gold-line:#DDBF7E;
  --green:#28704A; --green-soft:#E1F1E7; --orange:#B05E0C; --orange-soft:#FBEAD6; --red:#B03528; --red-soft:#F8E0DC;
  --primary:#0F2A43; --on-primary:#FFFFFF; --wa:#1B7A4A; --on-wa:#FFFFFF; --focus:#1E6F73;
  --shadow:0 1px 2px rgba(15,42,67,.06),0 8px 24px rgba(15,42,67,.07);
  --display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --body:'Public Sans','Segoe UI',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1620; --surface:#122130; --surface-2:#0F1C29; --ink:#E8EEF2; --muted:#A3B0BB; --line:#25384A; --line-strong:#35506A;
  --navy:#16324B; --on-navy:#F1F5F8; --on-navy-muted:#B3C3D1; --on-navy-accent:#8FD0D2;
  --teal:#6CBDBF; --teal-soft:#14343A; --blue:#8DB4E2; --blue-soft:#16283D; --plum:#BBA6D6; --plum-soft:#2A2238;
  --gold:#E0B25F; --gold-soft:#2F2617; --gold-line:#6E5A2E;
  --green:#6CC490; --green-soft:#153021; --orange:#EDA75A; --orange-soft:#38271A; --red:#F29488; --red-soft:#3B1E1B;
  --primary:#6CBDBF; --on-primary:#06161D; --wa:#3FBF7F; --on-wa:#04150C; --focus:#6CBDBF;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1620; --surface:#122130; --surface-2:#0F1C29; --ink:#E8EEF2; --muted:#A3B0BB; --line:#25384A; --line-strong:#35506A;
  --navy:#16324B; --on-navy:#F1F5F8; --on-navy-muted:#B3C3D1; --on-navy-accent:#8FD0D2;
  --teal:#6CBDBF; --teal-soft:#14343A; --blue:#8DB4E2; --blue-soft:#16283D; --plum:#BBA6D6; --plum-soft:#2A2238;
  --gold:#E0B25F; --gold-soft:#2F2617; --gold-line:#6E5A2E;
  --green:#6CC490; --green-soft:#153021; --orange:#EDA75A; --orange-soft:#38271A; --red:#F29488; --red-soft:#3B1E1B;
  --primary:#6CBDBF; --on-primary:#06161D; --wa:#3FBF7F; --on-wa:#04150C; --focus:#6CBDBF;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3,h4{margin:0;text-wrap:balance} p{margin:0} ul,ol{margin:0}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,7vw,50px);line-height:1.1;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:600;font-size:clamp(23px,5vw,30px);line-height:1.2}
h3{font-size:17px;font-weight:700;line-height:1.3}
:focus{outline:none}
#view-title:focus{outline:none}
#app{min-height:60vh}
:is(button,a,input,summary,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.band :is(button,a,input):focus-visible,.sheet-head :focus-visible{outline-color:var(--on-navy)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;background:var(--primary);color:var(--on-primary);padding:10px 14px;border-radius:8px;z-index:50;font-weight:600}
.skip:focus{left:16px}
.ic{width:1.25em;height:1.25em;flex:none}
.icw{display:inline-flex;align-items:center;justify-content:center;flex:none}
.in{width:100%;max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in.narrow{max-width:760px}
.sp{padding-top:32px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.muted{color:var(--muted)}

/* header and navigation */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:10px;min-height:60px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;margin-left:-4px;cursor:pointer;color:var(--ink);font:inherit;text-align:left;border-radius:10px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.02em;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18)}
.brand-t{display:none;flex-direction:column;line-height:1.15}
.brand-t b{font-family:var(--display);font-size:18px}
.brand-t span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{background:none;border:0;font:600 14px var(--body);color:var(--muted);padding:10px 12px;border-radius:10px;cursor:pointer;position:relative}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:2px;background:var(--teal)}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface-2)}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:7px 10px;border-radius:999px;cursor:pointer;min-width:36px}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
@media (min-width:420px){.brand-t{display:flex}.brand-t span{display:none}}
@media (min-width:820px){.brand-t span{display:block}.tab{padding:10px 16px}}

/* hero band, "papel sellado" guilloche */
.band{background:var(--navy);color:var(--on-navy);padding-block:30px 92px;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 1px,transparent 1px 15px)}
.band.compact{padding-block:28px 30px}
.band h1{color:var(--on-navy);margin-bottom:14px}
.lead{font-size:clamp(16px,2.4vw,19px);line-height:1.55;color:var(--on-navy-muted);max-width:60ch}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px;padding:0;list-style:none}
.badges li{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:var(--on-navy)}
.badges .ic{width:15px;height:15px;color:var(--on-navy-accent)}
.lift{margin-top:-52px;position:relative}

/* three doors */
.doors{display:grid;gap:14px;grid-template-columns:1fr}
.door{display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:16px;row-gap:3px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);font:inherit;transition:border-color .15s,transform .15s,box-shadow .15s}
.door:hover{border-color:var(--teal)}
.door-ico{grid-row:1 / span 4;width:52px;height:52px;border-radius:14px;background:var(--teal-soft);color:var(--teal)}
.door-ico .ic{width:27px;height:27px}
.door-kick{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.door b{font-size:18px;line-height:1.3;font-weight:700}
.door-sub{font-size:14px;color:var(--muted);line-height:1.5}
.door-go{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;font-weight:700;color:var(--teal)}
.door-go .ic{width:18px;height:18px;transition:transform .15s}
.door:hover .door-go .ic{transform:translateX(3px)}
@media (min-width:860px){
  .doors{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  .door{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto 1fr auto;row-gap:6px;padding:24px}
  .door-ico{grid-row:auto;margin-bottom:8px}
  .door-go{padding-top:10px;align-self:end}
}

/* urgent note, steps, guide card, trust */
.sos{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--muted)}
.sos .icw{width:34px;height:34px;border-radius:50%;background:var(--red-soft);color:var(--red)}
.sos .ic{width:18px;height:18px}
.sos b{color:var(--ink)}
.sec-h{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.how{display:grid;gap:14px;padding:0;margin:0;list-style:none;counter-reset:how;grid-template-columns:1fr}
.how li{counter-increment:how;display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;align-items:start}
.how li::before{content:counter(how);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);font-weight:700;font-family:var(--mono)}
.how b{display:block;font-size:16px}
.how span{font-size:14px;color:var(--muted)}
@media (min-width:760px){.how{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.gcard-h{display:flex;gap:14px;align-items:flex-start}
.gcard-h .icw{width:44px;height:44px;border-radius:12px;background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-line)}
.gcard-h .ic{width:24px;height:24px}
.gcard h2{font-size:clamp(20px,4vw,24px)}
.gcard p{font-size:14px;color:var(--muted);margin-top:4px}
.sectors{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:760px){.sectors{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sector{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.sector:hover{border-color:var(--line-strong);background:var(--surface)}
.sector .icw{width:40px;height:40px;border-radius:12px}
.sector b{display:block;font-size:15px;line-height:1.25}
.sector small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.sector .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.s-teal{background:var(--teal-soft);color:var(--teal)} .s-blue{background:var(--blue-soft);color:var(--blue)} .s-plum{background:var(--plum-soft);color:var(--plum)}
.trust{display:grid;gap:14px;grid-template-columns:1fr;padding:0;margin:0;list-style:none}
@media (min-width:760px){.trust{grid-template-columns:repeat(3,minmax(0,1fr))}}
.trust li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.trust .icw{width:40px;height:40px;border-radius:12px;background:var(--teal-soft);color:var(--teal)}
.trust b{display:block;font-size:15px}
.trust span{font-size:14px;color:var(--muted)}

/* flow */
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px}
.link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;font:600 14px var(--body);color:var(--muted);cursor:pointer;padding:8px 10px;margin:-8px -10px;border-radius:10px}
.link:hover{color:var(--ink)}
.link .ic{width:18px;height:18px}
.qcard{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.topic{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.topic .ic{width:18px;height:18px}
.stepn{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress{display:flex;gap:5px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--teal)}
.progress i.cur{background:var(--teal);opacity:.45}
.hint{font-size:14px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--teal);background:var(--surface-2)}
.opt.sel,.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt-l{font-weight:600;font-size:16px;line-height:1.35}
.opt-s{font-size:13.5px;color:var(--muted);line-height:1.4}
.opt-go{color:var(--muted)}
.opts.row .opt{justify-content:center;text-align:center;padding-inline:8px}
.qfoot{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.qfoot .ic{width:16px;height:16px;color:var(--teal)}

/* result sheet */
.sheet{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.sheet-head{background:var(--navy);color:var(--on-navy);padding:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 1px,transparent 1px 15px)}
.sheet-head .eyebrow{color:var(--on-navy-accent);margin-bottom:8px}
.sh-title{font-family:var(--display);font-weight:700;font-size:clamp(23px,5vw,30px);line-height:1.2;color:var(--on-navy)}
.sh-meta{font-size:14px;color:var(--on-navy-muted);margin-top:6px}
.folio{font-family:var(--mono);font-size:12px;color:var(--on-navy-muted);line-height:1.6;border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:6px 10px;align-self:flex-start}
.sheet-body{padding:22px;display:flex;flex-direction:column;gap:28px}
.verdict{display:flex;flex-direction:column;gap:12px}
.vbox{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:center;border-radius:16px;padding:14px 16px}
.vbox .icw{width:44px;height:44px;border-radius:50%;background:var(--surface);}
.vbox .ic{width:26px;height:26px}
.vbox b{font-size:17px;line-height:1.3}
.vbox.green{background:var(--green-soft)} .vbox.green .icw{color:var(--green)}
.vbox.orange{background:var(--orange-soft)} .vbox.orange .icw{color:var(--orange)}
.vbox.red{background:var(--red-soft)} .vbox.red .icw{color:var(--red)}
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.scale i{height:6px;border-radius:3px;background:var(--line);opacity:.8}
.scale.green i:nth-child(1){background:var(--green);opacity:1}
.scale.orange i:nth-child(2){background:var(--orange);opacity:1}
.scale.red i:nth-child(3){background:var(--red);opacity:1}
.scale-l{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted);margin-top:-4px}
.scale-l span:nth-child(2){text-align:center} .scale-l span:nth-child(3){text-align:right}
.sec{display:flex;flex-direction:column;gap:14px}
.sh{display:flex;align-items:center;gap:10px}
.sh .icw{width:32px;height:32px;border-radius:10px;background:var(--teal-soft);color:var(--teal)}
.sh .ic{width:18px;height:18px}
.steps{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}
.steps li::before{content:counter(st);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);font:700 14px var(--mono)}
.issues{display:flex;flex-direction:column;gap:12px}
.issue{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}
.issue .icw{width:30px;height:30px;border-radius:50%}
.issue .ic{width:17px;height:17px}
.issue.red .icw{background:var(--red-soft);color:var(--red)} .issue.orange .icw{background:var(--orange-soft);color:var(--orange)} .issue.green .icw{background:var(--green-soft);color:var(--green)}
.acc{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.acc details{border-top:1px solid var(--line)} .acc details:first-child{border-top:0}
.acc summary,.case summary{cursor:pointer;list-style:none}
.acc summary::-webkit-details-marker,.case summary::-webkit-details-marker{display:none}
.acc summary{display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:600;background:var(--surface)}
.acc summary:hover{background:var(--surface-2)}
.acc summary .icw{color:var(--teal)} .acc summary .ic{width:20px;height:20px}
.acc summary .chev,.case .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.acc details[open]>summary .chev,.case[open]>summary .chev{transform:rotate(180deg)}
.acc-body{padding:4px 16px 18px 48px;background:var(--surface)}
.acc-body ul,.acc-body ol,.case-body ul,.case-body ol{padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.acc-body ul.src,.case-body ul.src{list-style:none;padding-left:0}
.acc-body a,.case-body a{color:var(--teal);text-underline-offset:3px}
.service{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px}
.service .eyebrow{color:var(--gold)}
.service h3{font-family:var(--display);font-size:21px;font-weight:600}
.service .price{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-top:6px;padding-top:12px;border-top:1px solid var(--gold-line)}
.service .price .ic{width:18px;height:18px;color:var(--gold)}
details.answers{border:1px dashed var(--line-strong);border-radius:14px}
details.answers summary{cursor:pointer;list-style:none;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted)}
details.answers summary::-webkit-details-marker{display:none}
details.answers[open] .chev{transform:rotate(180deg)}
details.answers .chev{margin-left:auto}
details.answers dl{margin:0;padding:0 16px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 14px;font-size:14px}
details.answers dt{color:var(--muted)} details.answers dd{margin:0;color:var(--ink);font-weight:600}
@media (max-width:520px){details.answers dl{grid-template-columns:1fr}details.answers dd{margin-bottom:8px}}

/* ---------- modelo de reclamo escrito (Ley 1480) ---------- */
function claimText(sit){
  const v = (x, ph) => (x && x.trim()) || ph;
  const today = new Date().toLocaleDateString("es-CO", {day:"numeric", month:"long", year:"numeric"});
  const valor = claim.valor.trim();
  const anexos = (sit.doc || []).filter((_, i) => claim.anexos[sit.id + ":" + i]);
  const pide = {
    devolucion: "la devolución del dinero pagado" + (valor ? ", por valor de " + valor : ""),
    cumplimiento: "el cumplimiento de lo ofrecido, en las condiciones anunciadas",
    garantia: "la efectividad de la garantía legal: la reparación del producto o, si corresponde, su cambio o la devolución del dinero",
    otra: v(claim.otra, "[describa lo que solicita]")
  }[claim.pide];
  return [
    v(claim.ciudad, "[Ciudad]") + ", " + today,
    "",
    "Señores",
    v(claim.empresa, "[Nombre de la empresa]"),
    "Atención al cliente / PQR",
    "",
    "Asunto: Reclamo directo. " + sit.t.es,
    "Referencia: " + v(claim.ref, "[número de pedido, reserva, factura o contrato]"),
    "",
    "Yo, " + v(claim.nombre, "[nombre completo]") + ", identificado(a) con " + v(claim.doc, "[tipo y número de documento]") + ", presento este reclamo directo como consumidor(a), con base en la Ley 1480 de 2011 (Estatuto del Consumidor).",
    "",
    "Hechos",
    "1. El " + v(claim.fecha, "[fecha]") + " compré o contraté con ustedes el producto o servicio de la referencia" + (valor ? ", por un valor de " + valor : "") + ".",
    "2. " + v(claim.hechos, "[describa en pocas líneas qué pasó]"),
    "",
    "Solicitud",
    "Solicito " + pide + ".",
    "",
    "Les pido responder por escrito dentro de los quince (15) días hábiles siguientes al recibo de este reclamo. Conservo copia de este reclamo y de sus anexos como constancia de la reclamación directa.",
    "",
    "Anexos",
    ...(anexos.length ? anexos.map(a => "- " + a) : ["- [copias de los documentos que tenga]"]),
    "",
    "Recibo la respuesta en: " + v(claim.contacto, "[correo electrónico o teléfono]"),
    "",
    "Atentamente,",
    "",
    v(claim.nombre, "[nombre completo]"),
    v(claim.doc, "[documento]")
  ].join("\n");
}
function claimSection(sit, open){
  if (!claim.touched) claim.pide = ["o-garantia","o-vehiculo","o-vivienda"].includes(sit.id) ? "garantia" : ["a-anuncio","a-paquete","o-entrega","o-publicidad"].includes(sit.id) ? "cumplimiento" : "devolucion";
  const d = el("details",{class:"claim"}); if (open) d.open = true;
  const sm = el("summary"); const t = el("span",{class:"claim-t"}); t.append(el("b",{},L(UI.claimH)), el("span",{class:"pill"},L(UI.claimTag)));
  sm.append(icon("file"), t, icon("chevD","chev"));
  const b = el("div",{class:"claim-body"});
  b.append(el("p",{class:"hint"},L(UI.claimSub)));
  if (lang !== "es") b.append(el("p",{class:"note"},L(UI.claimEs)));
  const g = el("div",{class:"fgrid"});
  const field = (key, lab, type, full) => {
    const w = el("div",{class:"field"+(full?" full":"")}); const id = "cl-"+key;
    w.append(el("label",{for:id},L(UI[lab])));
    const inp = type === "textarea" ? el("textarea",{id,rows:"4",maxlength:"700"}) : el("input",{id,type:"text",autocomplete:"off"});
    inp.value = claim[key];
    inp.addEventListener("input", () => { claim[key] = inp.value; paint(); });
    w.append(inp); return w;
  };
  const pw = el("div",{class:"field full"}); pw.append(el("label",{for:"cl-pide"},L(UI.fPide)));
  const sel = el("select",{id:"cl-pide"});
  [["devolucion","pDevolucion"],["cumplimiento","pCumplimiento"],["garantia","pGarantia"],["otra","pOtra"]].forEach(([val,k]) => { const o = el("option",{value:val},L(UI[k])); if (claim.pide === val) o.selected = true; sel.append(o); });
  pw.append(sel);
  const ow = field("otra","fOtra","text",true); ow.hidden = claim.pide !== "otra";
  sel.addEventListener("change", () => { claim.pide = sel.value; claim.touched = true; ow.hidden = claim.pide !== "otra"; paint(); });
  const aw = el("fieldset",{class:"field full checks"}); aw.append(el("legend",{},L(UI.fAnexos)));
  (sit.doc || []).forEach((txt, i) => {
    const lab = el("label"); const cb = el("input",{type:"checkbox",id:"cl-anexo-"+i});
    cb.checked = !!claim.anexos[sit.id + ":" + i];
    cb.addEventListener("change", () => { claim.anexos[sit.id + ":" + i] = cb.checked; paint(); });
    lab.append(cb, el("span",{},txt)); aw.append(lab);
  });
  g.append(field("nombre","fNombre"), field("doc","fDoc"), field("empresa","fEmpresa"), field("ref","fRef"), field("fecha","fFecha"), field("valor","fValor"), field("ciudad","fCiudad"), field("contacto","fContacto"), field("hechos","fHechos","textarea",true), pw, ow, aw);
  const pv = el("div",{class:"letter",role:"region","aria-label":L(UI.preview),tabindex:"0"});
  const status = el("p",{class:"sr","aria-live":"polite"});
  const cp = el("button",{class:"btn primary",type:"button"});
  const setCp = done => { cp.replaceChildren(icon(done ? "check" : "copy"), el("span",{},L(done ? UI.claimCopied : UI.copyClaim))); };
  setCp(false);
  const fb = el("div",{class:"copybox",hidden:""}); const fpre = el("pre"); fb.append(el("p",{class:"fine"},L(UI.copyFail)), fpre);
  cp.addEventListener("click", async () => {
    const txt = claimText(sit);
    try { await navigator.clipboard.writeText(txt); setCp(true); status.textContent = L(UI.claimCopied); setTimeout(() => setCp(false), 2400); }
    catch { fpre.textContent = txt; fb.hidden = false; const r = document.createRange(); r.selectNodeContents(fpre); const s2 = getSelection(); s2.removeAllRanges(); s2.addRange(r); }
  });
  function paint(){
    pv.replaceChildren();
    claimText(sit).split(/(\[[^\]]+\])/).forEach(part => { if (/^\[[^\]]+\]$/.test(part)) pv.append(el("mark",{},part)); else if (part) pv.append(document.createTextNode(part)); });
  }
  paint();
  b.append(g, el("p",{class:"fine"},L(UI.claimPriv)), el("p",{class:"eyebrow"},L(UI.preview)), pv, cp, status, fb);
  d.append(sm, b); return d;
}
function openDraft(){ view = "borrador"; flowId = null; setHash("borrador-reclamo"); show(); }
function renderDraft(){
  const band = el("section",{class:"band compact"}); const bi = wrapIn("narrow");
  bi.append(el("p",{class:"eyebrow",style:"color:var(--on-navy-accent);margin-bottom:10px"},L(UI.draftEye)), el("h1",{id:"view-title"},L(UI.draftH)), el("p",{class:"lead"},L(UI.draftScope)));
  band.append(bi);

  const sw = el("div",{class:"field"}); sw.append(el("label",{for:"draft-sit"},L(UI.draftSit)));
  const sel = el("select",{id:"draft-sit"});
  CLAIM_SITS.forEach(id => { const s = SITS.find(x => x.id === id); if (!s) return; const o = el("option",{value:id},L(s.t)); if (id === draftSit) o.selected = true; sel.append(o); });
  sw.append(sel);

document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; try { localStorage.setItem("iha-lang", lang); } catch {} render(); }));
document.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => { if (b.dataset.nav==="guide") openGuide("all"); else goHome(); }));
document.getElementById("brand").addEventListener("click", goHome);
function fromHash(first){
  const h = parseHash().route;
  if (h === "guia") { if (view !== "guia") openGuide("all"); return; }
  if (h === "borrador-reclamo") { if (view !== "borrador") openDraft(); return; }
  if (h.startsWith("caso-") && SITS.some(s => s.id === h.slice(5))) { if (!(view === "caso" && caseId === h.slice(5))) openCase(h.slice(5)); return; }
  if (SECTORS.some(s => s.v === h)) { if (!(flowId==="consumidor" && answers.sector===h)) start("consumidor", {sector:h}); return; }
  if (FLOWS[h]) { if (flowId !== h) start(h); return; }
  if (first) render(); else if (view !== "home") { flowId=null; view="home"; show(); }
}
window.addEventListener("hashchange", () => fromHash(false));
fromHash(true);
if (!app.childElementCount) render();
})();
