nes/10115896/que-hacer-si-eres-victima/"],sfcAccion:["Superfinanciera: acción de protección al consumidor financiero","https://www.superfinanciera.gov.co/preguntas-frecuentes/23/23-accion-jurisdiccional-de-proteccion-al-consumidor-financiero/"],l2300:["Ley 2300 de 2023, contactos de cobranza y mensajes","https://normativa.colpensiones.gov.co/colpensiones/compilacion/docs/ley_2300_2023.htm"],l2157:["Ley 2157 de 2021, hábeas data financiero","https://normativa.colpensiones.gov.co/colpensiones/compilacion/docs/ley_2157_2021.htm"],telco:["Guía de reclamos de internet, móvil y TV (CRC 5111 de 2017)","https://colombiamove.com/blog/en/reclamar-fallas-internet-fija-hogar-sic-crc-colombia/"],crcCancel:["Asuntos Legales: nueva regla de la CRC para cancelar servicios (oct. 2026)","https://www.asuntoslegales.com.co/consultorio/llego-la-hora-de-los-usuarios-4514352"],cancelar:["Infobae: derechos al cancelar un servicio (nov. 2025)","https://www.infobae.com/colombia/2025/11/05/las-empresas-no-pueden-negarse-estos-son-sus-derechos-al-cancelar-un-servicio-en-colombia/"],l142:["Ley 142 de 1994, servicios públicos domiciliarios","https://www.alcaldiabogota.gov.co/sisjur/normas/Norma1.jsp?i=2752"],sic004:["SIC: Circular Externa 004 de 2022, espectáculos","https://normograma.mintic.gov.co/mintic/compilacion/docs/circular_superindustria_0004_2022.htm"],propina:["Asuntos Legales: la propina es voluntaria (2023)","https://www.asuntoslegales.com.co/consumidor/los-consumidores-no-estan-obligados-a-pagar-propinas-de-las-aplicaciones-de-comida-3542904"],parqueo:["RCN: la SIC sobre avisos en parqueaderos (jul. 2026)","https://newsroom.rcnradio.com/colombia/avisos-en-parqueaderos-de-no-respondemos-por-danos-y-robos-son-clausulas-abusivas-esto-dice-la-sic"],carros:["El Carro Colombiano: garantía de vehículos según la SIC (2023)","https://www.elcarrocolombiano.com/notas-de-interes/asi-puede-reclamar-la-garantia-de-su-carro-en-colombia-lo-que-debe-saber/"],vivienda:["Notaría 19: protección al comprador de vivienda nueva","https://www.notaria19bogota.com/proteccion-al-comprador-de-vivienda-nueva/"],eps:["Colombia Trámita: queja contra una EPS (oct. 2026)","https://colombiatramita.co/salud/queja-eps-supersalud/"],l1581:["Ley 1581 de 2012, arts. 14 a 16 (resumen)","https://encolombia.com/derecho/leyes/ley-habeas-data/procedimientos-data/"],l2068:["Ley 2068 de 2020, Ley General de Turismo","https://www.alcaldiabogota.gov.co/sisjur/normas/Norma1.jsp?i=104746"],crc:["CRC: Resolución 5050 de 2016 (compila la Resolución 5111 de 2017)","https://normograma.crcom.gov.co/crc/compilacion/docs/resolucion_CRC_5050_2016.htm"],sicPlataforma:["Ámbito Jurídico: la SIC y la responsabilidad de las plataformas (2026)","https://www.ambitojuridico.com/noticias/comercial/entre-bots-promociones-y-reclamos-quien-responde-en-plataformas-digitales-ante"]},i=[{v:"alojamiento",l:{es:"Alojamiento y turismo",en:"Accommodation and tourism",fr:"Hébergement et tourisme",pt:"Hospedagem e turismo"},s:{es:"Reservas, hoteles, apps de alojamiento, paquetes",en:"Bookings, hotels, lodging apps, packages",fr:"Réservations, hôtels, applis d’hébergement, forfaits",pt:"Reservas, hotéis, apps de hospedagem, pacotes"}},{v:"transporte",l:{es:"Transporte",en:"Transport",fr:"Transport",pt:"Transporte"},s:{es:"Vuelos, equipaje, buses, apps y taxis, accidentes",en:"Flights, baggage, buses, ride apps and taxis, accidents",fr:"Vols, bagages, bus, VTC et taxis, accidents",pt:"Voos, bagagem, ônibus, apps e táxis, acidentes"}},{v:"otros",l:{es:"Otros consumos",en:"Other purchases and services",fr:"Autres achats et services",pt:"Outros consumos"},s:{es:"Compras en línea, bancos, telefonía, servicios públicos, salud, vivienda…",en:"Online shopping, banks, phone and internet, utilities, health, housing…",fr:"Achats en ligne, banques, télécoms, eau-électricité, santé, logement…",pt:"Compras on-line, bancos, telefonia, serviços públicos, saúde, moradia…"}}],l=["Garantía legal: todo producto debe servir para lo que se vende. Si no se indica plazo, la garantía de un producto nuevo es de un año desde la entrega (Ley 1480, art. 8). Un bien usado tiene tres meses de garantía, salvo que se haya vendido sin garantía con aceptación expresa y por escrito (Decreto 735 de 2013, art. 12).","Reparación gratuita como regla. Si la falla se repite, usted elige: nueva reparación, cambio o devolución del precio (Ley 1480, art. 11). La reparación debe hacerse en máximo 30 días hábiles si la SIC no fija otro plazo, y la devolución del dinero en 15 días hábiles después de entregar el bien (Decreto 735 de 2013, arts. 8 y 10).","Servicios mal prestados: usted elige que se repita el servicio o que le devuelvan el dinero (Decreto 735 de 2013, art. 16).","Precio: debe informarse en pesos y usted solo está obligado a pagar el precio anunciado (Ley 1480, art. 26).","Cláusulas abusivas, como las que limitan la responsabilidad del proveedor, no tienen efecto (Ley 1480, arts. 42 y 43).","Permanencia mínima: solo vale si se pactó de forma expresa y, por regla general, no puede pasar de un año (Ley 1480, art. 41).","Primero reclame por escrito al proveedor; debe responder en 15 días hábiles. Guarde copia: es requisito para demandar (Ley 1480, art. 58, num. 5).","Demanda ante la SIC: a más tardar un año después de vencida la garantía (Ley 1480, art. 58, num. 3). Según la SIC, si lo que reclama es inferior a 40 salarios mínimos mensuales, no necesita abogado.","Compras en línea: retracto de 5 días hábiles, devolución del dinero en máximo 15 días calendario y reversión del pago en 5 días hábiles en los casos de ley (Ley 1480 y Ley 2439 de 2024)."],d=["l1480","d735","l2439","sicFaq"],c=[{id:"a-cancelacion",sector:"alojamiento",t:{es:"Me cancelaron la reserva",en:"My booking was cancelled",fr:"Ma réservation a été annulée",pt:"Cancelaram a minha reserva"},d:["Si el prestador no cumple lo reservado, usted elige: otro servicio de la misma calidad o el reembolso o compensación del precio. Si no puede darle uno igual, debe contratarlo con un tercero a su costa (Ley 300 de 1996, art. 63).","La sobreventa recibe el mismo trato (Ley 300 de 1996, art. 64).","Cancelar una reserva confirmada para revenderla más cara es un incumplimiento que la SIC puede sancionar.","Si reservó por una app de alojamiento, revise también lo que ofrece la política de la plataforma."],p:["Reclame por escrito de inmediato; el proveedor tiene 15 días hábiles para responder.","Demanda ante la SIC: hasta un año."],r:["Escriba al anfitrión u hotel y a la plataforma pidiendo alojamiento equivalente o reembolso.","Si paga otro alojamiento más caro o transporte extra, guarde las facturas.","Si no resuelven, queja o demanda ante la SIC."],doc:["Confirmación de la reserva y comprobante de pago","Mensajes de cancelación con fecha","Capturas del anuncio","Facturas de los gastos adicionales"],src:["l300","sicCancel","l1480"]},{id:"a-anuncio",sector:"alojamiento",t:{es:"El alojamiento no era el anunciado",en:"The place wasn’t as advertised",fr:"Le logement n’était pas conforme à l’annonce",pt:"A hospedagem não era a anunciada"},d:["La información y la publicidad deben ser veraces; quien anuncia responde por lo que ofrece (Ley 1480, arts. 23 y 30).","Si el servicio no corresponde, usted puede pedir que se preste como se contrató o la devolución del dinero (garantía de servicios, Decreto 735 de 2013, art. 16).","Si la plataforma permite publicar a un prestador sin Registro Nacional de Turismo activo, responde ante usted por publicidad engañosa (Ley 2068 de 2020, art. 39)."],p:["Avise el mismo día por escrito: las plataformas suelen fijar plazos cortos para reportar problemas (revise sus términos)."],r:["Al llegar, tome fotos y video con fecha visible.","Escriba al anfitrión y a la plataforma pidiendo solución, reubicación o reembolso.","Si no resuelven, queja o demanda ante la SIC."],doc:["Capturas del anuncio tal como estaba al reservar","Fotos y video del lugar","Mensajes con el anfitrión y la plataforma"],src:["l1480","d735","l2068"]},{id:"a-cobros",sector:"alojamiento",t:{es:"Cobros de más o depósito no devuelto",en:"Extra charges or deposit not returned",fr:"Frais en trop ou caution non rendue",pt:"Cobranças a mais ou caução não devolvida"},urgent:!0,urgentMsg:"Si pagó en línea con tarjeta un cobro que no reconoce, la reversión del pago debe pedirse dentro de los 5 días hábiles siguientes a enterarse.",d:["Solo debe pagar el precio total anunciado antes de pagar (Ley 1480, art. 26).","El depósito se devuelve según lo pactado; cualquier descuento por daños debe justificarse con pruebas.","Si el cobro fue en línea con tarjeta y es fraudulento, no solicitado o por algo no recibido, puede proceder la reversión del pago (Ley 1480, art. 51)."],p:["Reversión del pago: 5 días hábiles desde que se enteró.","Respuesta del proveedor a su reclamo: 15 días hábiles."],r:["Pida por escrito el desglose del cobro o la razón del descuento.","Si procede, pida la reversión al vendedor y a su banco.","Si no resuelven, queja o demanda ante la SIC."],doc:["Anuncio con el precio","Recibos y extractos","Fotos de entrega del lugar","Mensajes"],src:["l1480","d587"]},{id:"a-dano",sector:"alojamiento",level:"red",t:{es:"Daño, accidente o robo en el alojamiento",en:"Damage, accident or theft at the property",fr:"Dommage, accident ou vol dans le logement",pt:"Dano, acidente ou roubo na hospedagem"},d:["Usted tiene derecho a la seguridad y a no sufrir daños en condiciones normales de uso (Ley 1480).","Los prestadores de alojamiento turístico deben tener una póliza de responsabilidad por daños a huéspedes y a terceros, que cubre como mínimo muerte, incapacidad, lesiones, daños a bienes de terceros y gastos médicos (Ley 2068 de 2020, art. 32). Pida los datos de la póliza.","Si hubo un delito, la denuncia penal va primero; la reclamación de consumo, después."],p:["Reporte por escrito al prestador el mismo día."],r:["Si hay peligro, llame al 123.","Atención médica y denuncia si corresponde.","Reporte escrito al hotel o anfitrión y a la plataforma.","Reclamación por los daños; si no responden, demanda civil o ante la SIC."],doc:["Fotos y video","Informe médico","Denuncia","Mensajes con el prestador"],src:["l2068","l1480"]},{id:"a-paquete",sector:"alojamiento",t:{es:"La agencia o el paquete turístico no cumplió",en:"The travel agency or package didn’t deliver",fr:"L’agence ou le voyage organisé n’a pas tenu ses engagements",pt:"A agência ou o pacote turístico não cumpriu"},d:["Si un servicio turístico vendido no se presta, usted elige otro de la misma calidad o el reembolso o compensación del precio (Ley 300 de 1996, art. 63).","La información del paquete debe ser veraz, completa y entregada antes de pagar (Ley 1480).","Reclame a la agencia y al prestador directo (hotel, aerolínea, operador): ambos pueden responder."],p:["Respuesta a su reclamo: 15 días hábiles.","Demanda ante la SIC: hasta un año."],r:["Reclamo escrito a la agencia y al prestador.","Si no resuelven, queja o demanda ante la SIC."],doc:["Contrato o voucher del paquete","Publicidad del paquete","Pagos","Mensajes"],src:["l300","l1480"]},{id:"a-quiero-cancelar",sector:"alojamiento",t:{es:"Quiero cancelar mi reserva",en:"I want to cancel my booking",fr:"Je veux annuler ma réservation",pt:"Quero cancelar a minha reserva"},d:["Rige la política de cancelación que aceptó, si se la informaron antes de pagar.","Si usted no se presenta, el prestador puede cobrar hasta el 20 % del precio o retener el anticipo pactado (Ley 300 de 1996, art. 65).","Una cláusula que impida todo reembolso en cualquier caso puede revisarse como abusiva (Ley 1480, arts. 42 y 43).","La ley prevé un retracto de 5 días hábiles en servicios comprados a distancia que no empiecen a ejecutarse antes de cinco días (Ley 1480, art. 47). Su aplicación a su reserva concreta la verifica nuestro equipo de abogados."],p:["Cancele por escrito y lo antes posible para entrar en la franja más favorable de la política."],r:["Revise la política de cancelación que aceptó.","Cancele por escrito y pida la liquidación del reembolso.","Si la retención le parece abusiva, reclame y luego acuda a la SIC."],doc:["Política de cancelación (captura)","Confirmación y pago","Mensajes"],src:["l300","l1480"]},{id:"t-retraso",sector:"transporte",t:{es:"Mi vuelo se retrasó",en:"My flight was delayed",fr:"Mon vol a été retardé",pt:"Meu voo atrasou"},d:["Más de 1 hora y menos de 3, por causa de la aerolínea: refrigerio y una llamada.","Más de 3 y menos de 5 horas: además, alimentos según la hora.","Más de 5 horas: compensación adicional mínima del 30 % del valor del trayecto.","Si la demora pasa de las 10 p. m.: hospedaje (si no vive en esa ciudad) y traslados.","Por clima u otras causas ajenas a la aerolínea no hay compensación, pero sí información, reprogramación o reembolso."],p:["La Supertransporte indica 15 días de respuesta a las quejas."],r:["Pida en el mostrador una constancia de la demora.","Reclamo escrito a la aerolínea o a la agencia.","Si no resuelven, queja ante la Superintendencia de Transporte; la SIC también es competente en protección al consumidor."],doc:["Tiquete y pase de abordar","Constancia de la demora","Recibos de gastos"],src:["stAereo","alVuelos"]},{id:"t-cancelacion",sector:"transporte",t:{es:"Vuelo cancelado o no me dejaron abordar (sobreventa)",en:"Flight cancelled or denied boarding (overbooking)",fr:"Vol annulé ou refus d’embarquement (surréservation)",pt:"Voo cancelado ou embarque negado (overbooking)"},d:["Cancelación por causa de la aerolínea: puede desistir y recibir el reembolso, o seguir viaje con la atención y la compensación que fija el reglamento aeronáutico.","Sobreventa: deben embarcarlo en el siguiente vuelo disponible y compensarlo según el reglamento aeronáutico.","Cancelación por causas ajenas a la aerolínea, como el clima: devolución total del precio sin penalidades."],p:["Reclamo escrito cuanto antes; respuesta indicada por la Supertransporte: 15 días."],r:["Pida por escrito la causa de la cancelación o del no embarque.","Reclamo a la aerolínea o agencia.","Si no resuelven, Superintendencia de Transporte o SIC."],doc:["Tiquete","Constancia de cancelación o de no embarque","Recibos de gastos"],src:["stAereo","alVuelos"]},{id:"t-equipaje",sector:"transporte",urgent:!0,urgentMsg:"Los plazos del equipaje son cortos: 7 días para daño o pérdida y 21 días para demora.",t:{es:"Equipaje perdido, demorado o dañado",en:"Lost, delayed or damaged baggage",fr:"Bagage perdu, retardé ou endommagé",pt:"Bagagem perdida, atrasada ou danificada"},d:["Si el equipaje se demora, la aerolínea debe cubrir artículos básicos y compensarlo según el reglamento aeronáutico.","En vuelos internacionales, el Convenio de Montreal limita la indemnización por equipaje; declare objetos de valor al facturar."],p:["Daño, pérdida o hurto: protesta escrita a más tardar en 7 días.","Demora: reclamo dentro de los 21 días siguientes a la fecha en que debía llegar."],r:["Antes de salir del aeropuerto, reporte en el mostrador de la aerolínea y pida el número de reclamo.","Protesta escrita dentro del plazo.","Si no resuelven, Superintendencia de Transporte."],doc:["Tiquete y etiqueta del equipaje","Reporte del aeropuerto","Fotos del daño","Recibos de compras de emergencia"],src:["stAereo"]},{id:"t-tiquete",sector:"transporte",t:{es:"Quiero devolver o cambiar un tiquete aéreo",en:"I want to return or change a plane ticket",fr:"Je veux rendre ou changer un billet d’avion",pt:"Quero devolver ou trocar uma passagem aérea"},d:["Puede desistir del viaje antes del vuelo; la aerolínea puede retener una parte limitada de la tarifa, según el reglamento aeronáutico.","Las tarifas promocionales pueden tener condiciones distintas: revise las que aceptó al comprar."],p:["Haga la solicitud por escrito y antes del vuelo."],r:["Solicite por escrito el desistimiento o el retracto y guarde la constancia.","Si no reembolsan, reclamo y luego Superintendencia de Transporte o SIC."],doc:["Tiquete y condiciones de la tarifa","Comprobante de pago","Constancia de la solicitud"],src:["stAereo"]},{id:"t-bus",sector:"transporte",t:{es:"Bus intermunicipal: tiquete, servicio o equipaje",en:"Intercity bus: ticket, service or luggage",fr:"Bus interurbain : billet, service ou bagages",pt:"Ônibus intermunicipal: passagem, serviço ou bagagem"},d:["Tiene derecho a información, a viajar en condiciones de calidad, a la protección contra publicidad engañosa, a llevar su equipaje y, según las reglas, a retractarse o desistir del tiquete (guía de la Supertransporte).","También hay reglas para viajar con mascotas y con menores de edad: pregunte a la empresa antes de comprar.","Los porcentajes de devolución dependen de la norma y de la empresa: pida la política por escrito."],p:["Respuesta a peticiones: 15 días.","Acción de protección al consumidor: 1 año."],r:["Reclamo a la empresa o al intermediario que le vendió.","Si no resuelven, Superintendencia de Transporte; luego jueces o SIC."],doc:["Tiquete","Fotos","Recibos","Datos del bus y la hora"],src:["stTerrestre"]},{id:"t-app",sector:"transporte",t:{es:"App de transporte o taxi: cobro, trato o incidente",en:"Ride app or taxi: fare, treatment or incident",fr:"VTC ou taxi : tarif, comportement ou incident",pt:"App de transporte ou táxi: cobrança, tratamento ou incidente"},d:["Quien le cobra debe informarle el precio de forma veraz y atender su reclamo (Ley 1480).","Taxis y transporte público: Superintendencia de Transporte y la secretaría de movilidad de la ciudad.","Si hubo un incidente de seguridad, primero la denuncia (123)."],p:["Reversión del pago en línea: 5 días hábiles, en los casos de ley."],r:["Reclamo en la app con capturas del viaje y del cobro.","Si el cobro fue con tarjeta en línea y procede, pida la reversión.","Queja ante la SIC; para taxis y servicio público, Superintendencia de Transporte."],doc:["Capturas del viaje (ruta, conductor, placa, precio)","Extracto del cobro","Mensajes con soporte"],src:["l1480","d587"]},{id:"t-accidente",sector:"transporte",level:"red",t:{es:"Accidente de tránsito (SOAT)",en:"Road accident (SOAT insurance)",fr:"Accident de la route (assurance SOAT)",pt:"Acidente de trânsito (SOAT)"},d:["El SOAT cubre a las víctimas de accidentes de tránsito, sin discutir culpas: atención médica, incapacidad, muerte y transporte de la víctima.","Si el vehículo no tenía SOAT o huyó, la reclamación se presenta ante la ADRES.","El SOAT no cubre los daños a su vehículo ni a sus bienes: esos se reclaman al responsable o a su póliza."],p:["Las urgencias no pueden negarle la atención.","Reclame pronto: los plazos y documentos varían."],r:["Llame al 123 y pida el informe policial del accidente.","Atención en urgencias con los datos del SOAT del vehículo.","Reclamación a la aseguradora del SOAT o a la ADRES."],doc:["Informe policial","Historia clínica","Datos del vehículo y del SOAT","Documento de identidad"],src:["soat","adres"]},{id:"o-entrega",sector:"otros",urgent:!0,urgentMsg:"Si pagó con tarjeta o medio electrónico y el producto no llegó, la reversión del pago debe pedirse dentro de 5 días hábiles.",t:{es:"Compra en línea que no llegó o llegó tarde",en:"Online order not delivered or late",fr:"Achat en ligne non livré ou en retard",pt:"Compra on-line que não chegou ou chegou atrasada"},d:["Deben entregarle en el plazo que aceptó al comprar; si no se pactó, en el plazo máximo que fija la ley (Ley 2439 de 2024).","Si no cumplen, puede terminar el contrato y recuperar lo pagado.","Si el producto no está disponible, deben avisarle de inmediato; si cancela, el reembolso es en 15 días calendario. Si acepta un nuevo plazo (máximo 30 días) y lo incumplen, recupera todo sin descuentos."],p:["Reversión del pago: 5 días hábiles.","Reembolso: 15 días calendario."],r:["Reclamo por el canal de atención de la tienda: debe darle un número de radicado.","Si procede, pida la reversión al vendedor y a su banco.","Si no resuelven, queja o demanda ante la SIC."],doc:["Confirmación del pedido con el plazo de entrega","Comprobante de pago","Número de radicado"],src:["l2439","abcOnline","d587"]},{id:"o-retracto",sector:"otros",urgent:!0,urgentMsg:"El retracto vence a los 5 días hábiles: ejérzalo por escrito hoy.",t:{es:"Quiero devolver una compra en línea (retracto)",en:"I want to return an online purchase",fr:"Je veux retourner un achat en ligne (rétractation)",pt:"Quero devolver uma compra on-line (direito de arrependimento)"},d:["En compras a distancia puede retractarse dentro de 5 días hábiles, sin justificar (Ley 1480, art. 47).","Devuelve el producto por los mismos medios; los costos de transporte de la devolución son suyos.","Le devuelven el dinero en máximo 15 días calendario, al mismo medio de pago (Ley 2439 de 2024).","No aplica, entre otros, a servicios ya iniciados con su consentimiento, bienes personalizados, perecederos o de uso personal."],p:["Retracto: 5 días hábiles.","Reembolso: 15 días calendario."],r:["Escriba a la tienda ejerciendo el retracto y guarde la constancia.","Devuelva el producto como indiquen.","Si no reembolsan, queja o demanda ante la SIC."],doc:["Factura","Constancia del retracto","Guía de envío de la devolución"],src:["l1480","l2439"]},{id:"o-garantia",sector:"otros",t:{es:"Producto defectuoso (garantía)",en:"Faulty product (warranty)",fr:"Produit défectueux (garantie)",pt:"Produto com defeito (garantia)"},d:["Reparación gratuita; si la falla se repite, usted elige nueva reparación, cambio o devolución del precio (Ley 1480, art. 11).","Productor y vendedor responden solidariamente: puede reclamar a cualquiera (Ley 1480, art. 10).","Reparación en máximo 30 días hábiles si la SIC no fija otro plazo; con bien en préstamo, hasta 60 (Decreto 735 de 2013, art. 8).","Si no indicaron plazo, la garantía de un producto nuevo es de un año."],p:["Respuesta a su reclamo: 15 días hábiles.","Demanda: hasta un año después de vencida la garantía."],r:["Reclamo escrito al vendedor o al fabricante; exija constancia de recibo del producto.","Si no responden o niegan sin razón, demanda ante la SIC."],doc:["Factura","Constancia de entrega a reparación","Fotos o video de la falla"],src:["l1480","d735"]},{id:"o-fraude",sector:"otros",urgent:!0,level:"red",urgentMsg:"Bloquee hoy sus productos y avise al banco: cada hora cuenta en un fraude.",t:{es:"Cobro no reconocido o fraude con mi tarjeta o cuenta",en:"Unrecognised charge or card/account fraud",fr:"Prélèvement non reconnu ou fraude sur ma carte ou mon compte",pt:"Cobrança não reconhecida ou fraude no meu cartão ou conta"},d:["Reversión del pago: en compras en línea con tarjeta u otro instrumento electrónico, por fraude, operación no solicitada, producto no recibido, distinto o defectuoso (Ley 1480, art. 51; Decreto 587 de 2016).","Fraude bancario: avise de inmediato al banco, inactive sus productos, guarde pruebas y denuncie ante la Policía (CAI Virtual) o la Fiscalía.","Puede quejarse ante el banco, su Defensor del Consumidor Financiero o la Superfinanciera; si no hay acuerdo, demandar ante la Superfinanciera, sin abogado si el valor es menor a 40 salarios mínimos."],p:["Reversión: 5 días hábiles desde que se enteró.","Demanda ante la Superfinanciera: hasta un año desde el fin de la relación con la entidad."],r:["Llame al banco y bloquee.","Reclamo escrito al banco y, si aplica, solicitud de reversión al vendedor y al emisor.","Denuncia penal.","Defensor del Consumidor Financiero o Superfinanciera."],doc:["Extracto con los cobros","Capturas de mensajes o llamadas sospechosas","Denuncia","Radicado del reclamo"],src:["d587","sfcFraude","sfcAccion"]},{id:"o-banco",sector:"otros",t:{es:"Banco, crédito o seguro",en:"Bank, loan or insurance",fr:"Banque, crédit ou assurance",pt:"Banco, crédito ou seguro"},d:["Antes de demandar debe reclamar a la entidad; adjunte el reclamo y la respuesta a la demanda.","Puede acudir al Defensor del Consumidor Financiero de la entidad o quejarse ante la Superfinanciera.","Acción de protección al consumidor financiero: ante un juez o la Superfinanciera (una sola vía), sin abogado hasta 40 salarios mínimos.","Puede cancelar un producto cuando lo necesite, sin penalidades injustificadas."],p:["Demanda: hasta un año desde el fin de la relación con la entidad."],r:["Reclamo escrito a la entidad.","Defensor del Consumidor Financiero o queja ante la Superfinanciera.","Demanda ante la Superfinanciera o un juez."],doc:["Contrato o póliza","Extractos","Radicado del reclamo y respuesta"],src:["sfcAccion","sfcFraude"]},{id:"o-cobranza",sector:"otros",t:{es:"Cobranza abusiva o reporte en centrales de riesgo",en:"Abusive debt collection or credit bureau report",fr:"Recouvrement abusif ou fichage bancaire",pt:"Cobrança abusiva ou registro em birôs de crédito"},d:["Solo pueden contactarlo por los canales que usted autorizó, de lunes a viernes de 7 a. m. a 7 p. m. y sábados de 8 a. m. a 3 p. m.; nunca domingos ni festivos (Ley 2300 de 2023).","No pueden usar varios canales la misma semana ni contactarlo más de una vez al día, ni llamar a sus referencias; tampoco visitar su casa o trabajo, salvo excepciones.","Un reporte negativo dura el doble del tiempo de la mora, máximo 4 años, y caduca a los 8 años de la mora (Ley 2157 de 2021).","Deben responder sus reclamos en 15 días hábiles (prorrogables 8); si no responden, se entiende aceptado."],p:["Reclamo de hábeas data: 15 días hábiles, más 8 de prórroga."],r:["Reclamo escrito a la entidad que lo reporta o lo cobra.","Si no responde o incumple, queja ante la Superfinanciera o la SIC."],doc:["Registro de llamadas y mensajes con fecha y hora","Certificado de la central de riesgo","Paz y salvo, si lo tiene"],src:["l2300","l2157"]},{id:"o-telco",sector:"otros",t:{es:"Internet, celular o TV",en:"Internet, mobile or TV",fr:"Internet, mobile ou télévision",pt:"Internet, celular ou TV"},d:["Toda petición o queja recibe un código único (CUN); el operador debe responder en 15 días hábiles. Si no responde a tiempo, se entiende aceptada (silencio administrativo positivo).","Si niega, presente reposición y, en subsidio, apelación en un solo escrito; la apelación la decide la SIC.","Puede cancelar el servicio; el operador debe tramitar la solicitud sin trabas.","Si el servicio falla, puede pedir el descuento correspondiente y, si el incumplimiento es grave, terminar sin penalidad."],p:["Respuesta del operador: 15 días hábiles.","Recurso de reposición, con apelación en subsidio: 10 días hábiles desde que le notifican la respuesta.","Si la respuesta no llega a tiempo, el operador debe cumplir lo pedido en 72 horas."],r:["PQR al operador y anote el CUN.","Reposición y apelación en subsidio.","Queja ante la SIC con el CUN."],doc:["Número CUN","Factura","Capturas de fallas o pruebas de velocidad"],src:["crc","telco"]},{id:"o-servpub",sector:"otros",urgent:!0,urgentMsg:"Para recurrir una factura tiene solo 5 días desde que conoce la decisión de la empresa.",t:{es:"Agua, luz o gas: factura o servicio",en:"Water, power or gas: bill or service",fr:"Eau, électricité ou gaz : facture ou service",pt:"Água, luz ou gás: conta ou serviço"},d:["Puede reclamar ante la empresa; debe responder en 15 días hábiles. Si no responde, el reclamo se entiende resuelto a su favor (Ley 142 de 1994, art. 158).","No pueden exigirle pagar la factura reclamada para tramitar su recurso; pague lo no reclamado o el promedio de los últimos cinco periodos (art. 155).","No pueden suspender ni cortar el servicio mientras resuelven el recurso presentado a tiempo, salvo excepciones (art. 155).","No proceden reclamos contra facturas con más de cinco meses de expedidas (art. 154)."],p:["Recurso de reposición: 5 días desde que conoce la decisión.","Respuesta: 15 días hábiles.","Facturas de más de 5 meses: ya no se pueden reclamar."],r:["Reclamo escrito a la empresa.","Recurso de reposición y, en subsidio, apelación ante la Superintendencia de Servicios Públicos."],doc:["Facturas","Fotos del medidor","Radicado del reclamo"],src:["l142"]},{id:"o-evento",sector:"otros",t:{es:"Concierto o evento cancelado o aplazado",en:"Concert or event cancelled or postponed",fr:"Concert ou événement annulé ou reporté",pt:"Show ou evento cancelado ou adiado"},d:["Si el servicio no se presta como se contrató, usted elige que se preste en las condiciones contratadas o la devolución del precio pagado (Ley 1480, art. 11, num. 3, citado por la SIC).","El organizador debe informar la cancelación o el aplazamiento de forma oportuna, clara y veraz (Circular SIC 004 de 2022).","La SIC puede ordenar medidas para evitar daños a los consumidores; la devolución de los cargos de servicio depende del caso."],p:["Reclamo al organizador y a la boletera: 15 días hábiles de respuesta."],r:["Reclamo escrito al organizador y a la boletera.","Si no devuelven, demanda de efectividad de la garantía ante la SIC."],doc:["Boletas y comprobante de compra","Anuncio de la cancelación"],src:["sic004","l1480"]},{id:"o-restaurante",sector:"otros",t:{es:"Restaurante: propina u otros cobros",en:"Restaurant: tip or other charges",fr:"Restaurant : pourboire ou autres frais",pt:"Restaurante: gorjeta ou outras cobranças"},d:["La propina es voluntaria (Ley 1935 de 2018).","Deben preguntarle si la acepta antes de facturar; si aparece en la factura, puede negarse a pagarla.","El precio que paga es el precio anunciado, con impuestos incluidos (Ley 1480, art. 26)."],p:["Reclame en el momento y pida la factura corregida."],r:["Pida que retiren la propina o el cobro no informado.","Si se niegan, denuncia ante la SIC."],doc:["Factura","Foto de la carta con los precios"],src:["propina","l1480"]},{id:"o-parqueadero",sector:"otros",t:{es:"Parqueadero: daño o robo del vehículo",en:"Car park: damage or theft",fr:"Parking : dommage ou vol du véhicule",pt:"Estacionamento: dano ou roubo do veículo"},d:["El parqueadero debe custodiar el vehículo y devolverlo en el mismo estado en que lo recibió (Ley 1480).","Los avisos de «no respondemos por daños ni robos» son cláusulas abusivas y no lo dejan sin derecho a reclamar (SIC, 2026).","Deben darle un recibo con tarifas; si no anota daños previos, se presume que el vehículo entró en buen estado.","Los objetos dentro del carro solo se cubren si avisó al personal. Los parqueaderos residenciales siguen la Ley 675 de 2001."],p:["Reporte antes de salir del parqueadero, por escrito."],r:["Deje constancia escrita antes de retirarse y tome fotos.","Reclamo escrito al parqueadero.","Si no responden, demanda ante la SIC."],doc:["Recibo de entrada","Fotos del daño","Testigos","Cotización de la reparación"],src:["parqueo","l1480"]},{id:"o-vehiculo",sector:"otros",t:{es:"Vehículo nuevo con fallas",en:"New vehicle with defects",fr:"Véhicule neuf défectueux",pt:"Veículo novo com defeitos"},d:["El vehículo tiene la garantía indicada en su manual; si no se indicó plazo, un año desde la entrega (Ley 1480, art. 8).","Reparación gratuita de piezas con defecto de fábrica; si la falla se repite, usted elige nueva reparación, cambio o devolución (Ley 1480, art. 11).","Consulte si su modelo tiene una campaña de seguridad (llamado a revisión) vigente."],p:["Reparación: 30 días hábiles si la SIC no fija otro plazo (Decreto 735 de 2013).","Demanda: hasta un año después de vencida la garantía."],r:["Reclamo escrito al concesionario o al importador, con orden de servicio.","Si la falla se repite, pida por escrito el cambio o la devolución.","Demanda ante la SIC."],doc:["Factura y manual de garantía","Órdenes de servicio de cada ingreso al taller","Fotos o video de la falla"],src:["l1480","d735"]},{id:"o-vivienda",sector:"otros",t:{es:"Vivienda nueva con defectos",en:"New home with defects",fr:"Logement neuf avec défauts",pt:"Imóvel novo com defeitos"},d:["Garantía legal de un inmueble: estabilidad de la obra por 10 años y acabados por 1 año (Ley 1480, art. 8).","Los proyectos nuevos de cinco o más unidades, o de 2.000 m² o más, deben amparar al comprador si la estructura falla en los 10 años siguientes (Ley 1796 de 2016 y Decreto 282 de 2019).","Al reclamar, deben darle constancia de recibo y hacer una visita de verificación en 5 días hábiles; los acabados se reparan en 30 días hábiles después de aceptar el reclamo (Decreto 735 de 2013, art. 13)."],p:["Acabados: 1 año.","Estabilidad: 10 años."],r:["Reclamo escrito a la constructora con fotos.","Exija la visita en 5 días hábiles.","Si no responden, demanda ante la SIC."],doc:["Escritura y acta de entrega","Fotos con fecha","Reclamos y respuestas"],src:["l1480","vivienda","d735"]},{id:"o-salud",sector:"otros",level:"red",t:{es:"Salud: EPS o medicina prepagada",en:"Health: EPS or private health plan",fr:"Santé : EPS ou assurance santé privée",pt:"Saúde: EPS ou plano de saúde privado"},d:["Primero, PQRS ante su EPS y guarde el número de radicado.","Si no responden o la respuesta no es satisfactoria, queja ante la Superintendencia de Salud.","En urgencia vital puede presentar una tutela desde el primer día; el juez decide en máximo 10 días."],p:["Tutela: el juez decide en máximo 10 días."],r:["PQRS a la EPS o a la prepagada.","Queja ante la Superintendencia de Salud con el radicado.","Tutela si hay urgencia."],doc:["Orden médica","Historia clínica","Radicado de la PQRS"],src:["eps"]},{id:"o-datos",sector:"otros",t:{es:"Mis datos personales o mensajes no autorizados",en:"My personal data or unwanted marketing",fr:"Mes données personnelles ou messages non autorisés",pt:"Meus dados pessoais ou mensagens não autorizadas"},d:["Puede consultar sus datos; deben responder en 10 días hábiles (prorrogables 5) (Ley 1581 de 2012, art. 14).","Puede reclamar para corregir, actualizar o suprimir sus datos; deben responder en 15 días hábiles (prorrogables 8) e incluir la leyenda «reclamo en trámite» (art. 15).","Solo puede quejarse ante la SIC después de agotar la consulta o el reclamo ante la empresa (art. 16).","Los mensajes comerciales requieren su autorización y deben permitirle darse de baja en cualquier momento (Ley 2300 de 2023)."],p:["Consulta: 10 días hábiles.","Reclamo: 15 días hábiles."],r:["Consulta o reclamo escrito a la empresa.","Si no responde o incumple, queja ante la SIC."],doc:["Capturas de los mensajes","Constancia de la consulta o del reclamo"],src:["l1581","l2300"]},{id:"o-cancelar",sector:"otros",t:{es:"No me dejan cancelar un contrato o suscripción",en:"I can’t cancel a contract or subscription",fr:"Impossible de résilier un contrat ou un abonnement",pt:"Não me deixam cancelar um contrato ou assinatura"},d:["La permanencia mínima solo vale si se pactó de forma expresa y, por regla general, por máximo un año (Ley 1480, art. 41).","En ventas en línea de contratos continuos, deben informarle la duración mínima antes de contratar (Ley 2439 de 2024).","Cargos por servicios que no aceptó no son exigibles."],p:["Guarde la constancia de su solicitud de cancelación."],r:["Solicite la cancelación por el canal por el que contrató y guarde la constancia.","Si siguen cobrando, reclamo y, si procede, reversión del pago.","Queja ante la SIC (o la Superfinanciera para productos financieros)."],doc:["Contrato o condiciones","Constancia de la solicitud","Extractos con los cobros"],src:["l1480","l2439"]},{id:"o-publicidad",sector:"otros",t:{es:"Publicidad engañosa o precio distinto al anunciado",en:"Misleading ads or a different price",fr:"Publicité trompeuse ou prix différent",pt:"Publicidade enganosa ou preço diferente do anunciado"},d:["La publicidad engañosa está prohibida; el anunciante responde por los daños que cause (Ley 1480, art. 30).","Usted solo está obligado a pagar el precio anunciado (Ley 1480, art. 26).","Las ofertas en línea deben indicar su vigencia y la disponibilidad del producto (Ley 2439 de 2024)."],p:["Reclamo al vendedor: 15 días hábiles de respuesta."],r:["Guarde la publicidad (captura con fecha).","Reclamo escrito pidiendo que respeten lo anunciado.","Denuncia ante la SIC; si sufrió un daño, demanda."],doc:["Captura de la publicidad","Factura","Mensajes"],src:["l1480","l2439"]}];i.push({v:"anfitriones",g:!0,l:{es:"Anfitriones y vivienda turística",en:"Hosts and short-term rentals",fr:"Hôtes et location touristique",pt:"Anfitriões e moradia turística"},s:{es:"RNT, reglamento del edificio, registro de huéspedes, uso del suelo",en:"RNT, building rules, guest records, zoning",fr:"RNT, règlement de copropriété, registre des voyageurs, urbanisme",pt:"RNT, regulamento do prédio, registro de hóspedes, uso do solo"}},{v:"plataformas",g:!0,l:{es:"Plataformas digitales",en:"Digital platforms",fr:"Plateformes numériques",pt:"Plataformas digitais"},s:{es:"Cuenta suspendida, pagos retenidos, anuncio retirado, vendedor que desaparece",en:"Suspended account, withheld payouts, removed listing, vanished seller",fr:"Compte suspendu, paiements bloqués, annonce retirée, vendeur disparu",pt:"Conta suspensa, pagamentos retidos, anúncio removido, vendedor que some"}},{v:"arriendo",g:!0,l:{es:"Arriendo y vivienda",en:"Renting and housing",fr:"Location et logement",pt:"Aluguel e moradia"},s:{es:"Contratos por meses, inmobiliarias, depósitos y desalojos",en:"Monthly leases, letting agencies, deposits and evictions",fr:"Baux au mois, agences, cautions et expulsions",pt:"Contratos mensais, imobiliárias, depósitos e despejos"}}),Object.assign(t,{medellin:["Alcaldía de Medellín, requisitos de la vivienda turística (2026)","https://www.medellin.gov.co/es/wp-content/uploads/2026/11/infografico-viviendas-turisticas.pdf"],ph675:["Asuntos Legales: vivienda turística en propiedad horizontal (Ley 675, art. 59)","https://www.asuntoslegales.com.co/actualidad/conozca-los-requerimientos-legales-para-la-vivienda-turistica-en-propiedad-horizontal-3181623"],sire:["Guía del SIRE de Migración Colombia (ColombiaMove, nov. 2026)","https://colombiamove.com/blog/es/sire-migracion-colombia-foreign-guest-reporting-guide/"],potn:["Portafolio: el proyecto de nuevo POT de Medellín (sep. 2026)","https://www.portafolio.co/economia/regiones/el-nuevo-pot-de-medellin-pondria-en-riesgo-el-ingreso-de-miles-de-familias-que-dependen-del-turismo-alerta-asohost-502283"],habitat:["Secretaría del Hábitat de Bogotá, ABC del arrendamiento (Ley 820 de 2003)","https://www.habitatbogota.gov.co/sites/default/files/2022-12/cartilla%20ABC%20del%20arrendamiento.pdf"],l1336:["Ley 1336 de 2009, códigos de conducta contra la explotación sexual de menores","https://normativa.colpensiones.gov.co/colpens/compilacion/docs/ley_1336_2009.htm"],fontur:["FONTUR, ABC de la contribución parafiscal","https://fontur.com.co/sites/default/files/2022-04/ABC-RNT-Contribuci%C3%B3n%20Parafiscal_0.pdf"],l1575:["Ley 1575 de 2012, Ley General de Bomberos, art. 42","https://leyes.co/ley_general_de_bomberos/42.htm"],alFraude:["Asuntos Legales: cómo actuar frente a un fraude bancario","https://www.asuntoslegales.com.co/consultorio/proteccion-al-consumidor-financiero-como-actuar-frente-a-un-fraude-bancario-4237863"],lrFraude:["La República: cuándo debe un banco devolver el dinero de un fraude (ago. 2026)","https://www.larepublica.co/finanzas/cuando-esta-obligado-un-banco-a-devolver-dinero-a-un-cliente-por-un-retiro-fraudulento-4451103"],ccoHosp:["Código de Comercio, arts. 1192 a 1199: contrato de hospedaje","https://encolombia.com/derecho/codigos/comercio-colombiano/codcomerciolibro4-7/"],l300c:["Ley 300 de 1996 (compilación vigente), arts. 63, 66 y 79","https://normativa.colpensiones.gov.co/colpens/compilacion/docs/ley_0300_1996.htm"],c519:["Corte Constitucional, C-519 de 2007: la habitación de hotel es domicilio","https://jurinfo.jep.gov.co/Normograma/compilacion/docs/C-519_2007.htm"],pol163:["Policía Nacional: cuándo puede entrar a un inmueble sin orden escrita (Ley 1801, art. 163)","https://www.policia.gov.co/noticia/en-que-casos-puede-ingresar-policia-un-inmueble-sin-orden-escrita"],pol77:["Ley 1801 de 2016, arts. 76 a 81 (compilación oficial)","https://normativa.colpensiones.gov.co/colpens/docs/ley_1801_2016_pr001.htm"],pol21:["Ley 1801 de 2016, art. 21: todo procedimiento de policía puede grabarse","https://leyes.co/codigo_nacional_de_policia/21.htm"],pol33:["Ley 1801 de 2016, art. 33: ruido y tranquilidad","https://leyes.co/codigo_nacional_de_policia/33.htm"],l820:["Ley 820 de 2003, régimen de arrendamiento de vivienda urbana","https://www.unidadvictimas.gov.co/wp-content/uploads/Documentos/ley/Ley_820_2003.pdf"],cgp384:["Código General del Proceso, art. 384: restitución de inmueble arrendado","https://leyes.co/codigo_general_del_proceso/384.htm"],metroInm:["Metrocuadrado: quién vigila a las inmobiliarias en Colombia","https://www.metrocuadrado.com/noticias/guia-de-arriendo/quien-vigila-las-inmobiliarias-en-colombia-2466"],t164:["Corte Constitucional, T-164 de 2024: el amparo policivo protege a propietarios, poseedores y meros tenedores","https://www.corteconstitucional.gov.co/relatoria/2024/t-164-24.htm"],d1423:["MinVivienda, Decreto 1423 del 17 de septiembre de 2026: medidas de arrendamiento por el sismo","https://minvivienda.gov.co/sites/default/files/normativa/decreto-no.-1423-del-17-de-septiembre-de-2026.pdf"],cco1882:["Código de Comercio, arts. 1880 a 1882: transporte aéreo de pasajeros (compilación oficial)","https://cancilleria.gov.co/sites/default/files/Normograma/docs/codigo_comercio_pr058.htm"],can619:["Decisión 619 de la Comunidad Andina: derechos de los usuarios del transporte aéreo","https://www.comunidadandina.org/StaticFiles/DocOf/DEC619.pdf"],sic002:["SIC, Circular Externa 002 de 2024: datos personales en sistemas de inteligencia artificial","https://sedeelectronica.sic.gov.co/sites/default/files/normativa/Circular%20Externa%20No.%20002%20del%2021%20de%20agosto%20de%202024.pdf"]}),c.push({id:"h-lista",sector:"anfitriones",t:{es:"Vivienda turística en regla: la lista completa",en:"Short-term rental compliance: the full checklist",fr:"Location touristique en règle : la liste complète",pt:"Moradia turística regularizada: a lista completa"},d:["Registro Nacional de Turismo (RNT) antes de empezar, tramitado ante la cámara de comercio (Ley 300 de 1996, art. 61, y Ley 2068 de 2020, art. 3).","Registro mercantil activo y RUT, que se piden para tramitar el RNT.","Un código de conducta contra la explotación sexual de niños, niñas y adolescentes, adoptado y fijado en un lugar visible; sin él no se puede inscribir ni actualizar el RNT (Ley 1336 de 2009, arts. 1 y 5).","No alojar a menores de edad sin la compañía o la autorización de sus padres o representantes, como exige la Alcaldía de Medellín.","Contribución parafiscal al FONTUR: 2,5 por mil de los ingresos de la actividad turística, cada trimestre; si no hubo ingresos, se declara en cero (Ley 1101 de 2006, art. 3).","En Medellín, además: uso del suelo que lo permita, reglamento del edificio que lo autorice expresamente, aviso escrito a la Policía (Ley 1801 de 2016, art. 87), certificado de seguridad de bomberos, concepto sanitario favorable y, si pone música o televisión al público, paz y salvo de derechos de autor.","Y con cada huésped: la TRA, el reporte al SIRE si es extranjero y una póliza que cubra daños a huéspedes y a terceros (Ley 2068 de 2020, arts. 22 y 32)."],p:["RNT: renovación cada año, entre enero y el 31 de marzo.","FONTUR: declaración y pago cada trimestre.","TRA y SIRE: con cada huésped, en los plazos que fijan el MinCIT y Migración Colombia."],r:["RNT, registro mercantil y renovaciones: ante la cámara de comercio.","TRA: plataforma del MinCIT. SIRE: portal de Migración Colombia.","Uso del suelo: Planeación municipal. Bomberos y concepto sanitario: Cuerpo de Bomberos y Secretaría de Salud.","Un alojamiento sin RNT o que no cumple se reporta ante la SIC; si hay peligro, llame al 123."],doc:["Certificado del RNT","Registro mercantil y RUT","Código de conducta contra la explotación sexual de menores, firmado y visible","Póliza de responsabilidad","Concepto de uso del suelo y reglamento del edificio","Certificado de bomberos y concepto sanitario","Constancia del aviso a la Policía","Declaraciones al FONTUR"],src:["l2068","l1336","fontur","l1575","medellin"]},{id:"h-rnt",sector:"anfitriones",t:{es:"Alquilo por días sin RNT o con el RNT vencido",en:"Short-term renting without a valid RNT",fr:"Location courte durée sans RNT valide",pt:"Aluguel por temporada sem RNT vigente"},d:["Quien arrienda o subarrienda vivienda por periodos inferiores a 30 días presta un servicio turístico (Ley 2068 de 2020, art. 37).","Todo prestador debe inscribirse en el Registro Nacional de Turismo (RNT) antes de prestar el servicio (Ley 300 de 1996, art. 61, y Ley 2068 de 2020, art. 3).","Prestar el servicio sin RNT es una infracción: la SIC puede imponer las sanciones del Estatuto del Consumidor y cancelar el registro hasta por 5 años (Ley 300 de 1996, arts. 71 y 72, modificados por la Ley 2068 de 2020, arts. 28 y 29).","Las plataformas deben dejar un espacio para el número de RNT y retirar los anuncios de prestadores sin RNT activo cuando la autoridad lo pida (Ley 2068 de 2020, art. 38)."],p:["El RNT se renueva cada año, entre enero y el 31 de marzo."],r:["Verifique en el RNT que su inscripción esté activa.","Si no la tiene, inscríbase antes de seguir publicando y muestre el número en cada anuncio.","Revise también el reglamento del edificio y el uso del suelo de su zona: el RNT solo no basta."],doc:["Certificado del RNT vigente","Registro mercantil y RUT, si aplica","Capturas de sus anuncios con el número de RNT"],src:["l2068","medellin"]},{id:"h-ph",sector:"anfitriones",t:{es:"El edificio no permite el alquiler por días o me multaron",en:"My building bans short-term rentals or fined me",fr:"Mon immeuble interdit la location courte durée ou m’a infligé une amende",pt:"O prédio não permite aluguel por temporada ou me multou"},d:["El reglamento de propiedad horizontal obliga a los propietarios y a quienes usan los inmuebles del edificio (Ley 675 de 2001).","Para operar una vivienda turística, la Alcaldía de Medellín exige que el reglamento autorice expresamente esa actividad.","Las multas por incumplir el reglamento se repiten mientras dure el incumplimiento; cada una no puede superar dos veces la cuota de administración mensual, y en total no más de diez veces (Ley 675 de 2001, art. 59).","Antes de sancionarlo, la copropiedad debe darle la oportunidad de explicarse y defenderse."],p:["Revise en la carta de sanción y en el reglamento el plazo para presentar descargos o recursos."],r:["Pida el reglamento registrado y el acta o la decisión que impuso la multa.","Presente sus descargos por escrito dentro del plazo.","Si el reglamento no lo permite, suspenda el alquiler por días mientras se define, para no acumular multas."],doc:["Reglamento de propiedad horizontal registrado","Carta o resolución de la multa","Actas de asamblea"],src:["ph675","medellin"]},{id:"h-registros",sector:"anfitriones",t:{es:"Registro de huéspedes: TRA y reporte de extranjeros (SIRE)",en:"Guest records: TRA and foreign guest reporting (SIRE)",fr:"Registre des voyageurs : TRA et déclaration des étrangers (SIRE)",pt:"Registro de hóspedes: TRA e relatório de estrangeiros (SIRE)"},d:["Todo prestador de alojamiento debe registrar a sus huéspedes en la Tarjeta de Registro de Alojamiento (TRA), que sirve como prueba del contrato de hospedaje (Ley 2068 de 2020, art. 22).","Los huéspedes extranjeros también se reportan a Migración Colombia en el SIRE (Resolución 2357 de 2020), y no hacerlo a tiempo puede dar lugar a multas.","Los prestadores de alojamiento deben tener una póliza de seguro que cubra daños a huéspedes y a terceros (Ley 2068 de 2020, art. 32).","En Medellín, la apertura de la vivienda turística se comunica por escrito a la estación de Policía más cercana (Ley 1801 de 2016, art. 87)."],p:["Reporte en el SIRE cada entrada y salida de huéspedes extranjeros dentro del plazo que fija Migración Colombia."],r:["Haga la TRA de cada huésped a su llegada.","Reporte en el SIRE la entrada y la salida de cada huésped extranjero.","Guarde las constancias de cada registro y la póliza vigente."],doc:["Constancias de la TRA","Reportes del SIRE","Póliza de responsabilidad"],src:["l2068","sire","medellin"]},{id:"h-pot",sector:"anfitriones",t:{es:"¿Mi zona permite la vivienda turística? (Medellín)",en:"Does my area allow short-term rentals? (Medellín)",fr:"Mon quartier autorise-t-il la location touristique ? (Medellín)",pt:"Minha zona permite moradia turística? (Medellín)"},d:["Además del RNT, el uso del suelo de la zona debe permitir el alojamiento turístico según el Plan de Ordenamiento Territorial (POT).","En Medellín, según el POT vigente (Acuerdo 48 de 2014), la vivienda turística se permite en zonas de media y alta mixtura de usos.","Un proyecto de revisión del POT la limitaría a zonas de alta mixtura, zonas de tratamiento especial y áreas de desarrollo orientado al transporte; aún no está aprobado."],p:["Verifique el uso del suelo antes de comprar o de publicar un anuncio."],r:["Consulte el uso del suelo de su predio ante Planeación de Medellín y pida el concepto por escrito.","Revise que el reglamento del edificio autorice la actividad.","Siga las novedades del nuevo POT antes de invertir."],doc:["Concepto de uso del suelo","Escritura y certificado de libertad","Reglamento de propiedad horizontal"],src:["medellin","potn"]},{id:"p-cuenta",sector:"plataformas",t:{es:"Me suspendieron o bloquearon la cuenta",en:"My account was suspended or blocked",fr:"Mon compte a été suspendu ou bloqué",pt:"Minha conta foi suspensa ou bloqueada"},d:["Los términos de la plataforma fijan sus reglas, una apelación interna y a veces un arbitraje en el exterior. Si el servicio se ofrece en Colombia, la ley colombiana y la SIC también pueden aplicar.","Si usa la plataforma como consumidor, las cláusulas abusivas no producen efectos (Ley 1480, arts. 42 y 43).","Puede pedir a la plataforma qué datos personales tiene sobre usted y para qué los usa: debe responder en 10 días hábiles, prorrogables 5 (Ley 1581 de 2012, art. 14)."],p:["Apelación interna: revise el plazo en los términos de la plataforma; suele ser corto.","Consulta de datos personales: 10 días hábiles, prorrogables 5."],r:["Pida por escrito el motivo concreto y la regla que aplicaron.","Use la apelación interna y guarde la constancia.","Si no resuelven, queja ante la SIC o la vía que fijen los términos."],doc:["Avisos y correos de suspensión","Copia descargada de sus datos","Capturas de su perfil e historial"],src:["l1480","l1581"]},{id:"p-pagos",sector:"plataformas",t:{es:"La plataforma me retiene los pagos",en:"The platform is withholding my payouts",fr:"La plateforme bloque mes paiements",pt:"A plataforma está retendo meus pagamentos"},d:["Los términos de la plataforma fijan cuándo puede retener pagos y por cuánto tiempo: es la primera regla que se revisa.","Una retención que no se ajusta a los términos es un incumplimiento del contrato y puede reclamarse.","Si usted actúa como consumidor y el servicio se ofrece en Colombia, la SIC puede ser una vía; si es un negocio, la vía suele ser la del contrato."],p:["Descargue hoy el historial de pagos: puede dejar de estar disponible si la cuenta se cierra."],r:["Pida por escrito el motivo, el monto retenido y la fecha de liberación.","Use la apelación interna.","Si no resuelven, carta formal de reclamación y, si el monto lo justifica, la vía del contrato o la SIC."],doc:["Historial de pagos y saldo pendiente","Términos vigentes en la fecha, en PDF","Avisos de la plataforma"],src:["l1480"]},{id:"p-anuncio",sector:"plataformas",t:{es:"Me retiraron un anuncio",en:"My listing was removed",fr:"Mon annonce a été retirée",pt:"Meu anúncio foi removido"},d:["En alojamiento, las plataformas deben dejar un espacio para el número de RNT y retirar los anuncios de prestadores sin RNT activo cuando la autoridad lo pida (Ley 2068 de 2020, art. 38).","Fuera de esos casos, el retiro debe ajustarse a los términos de la plataforma: pida la regla concreta que aplicaron.","No publique acusaciones contra la plataforma en redes: puede debilitar su reclamo."],p:["Revise el plazo de apelación en los términos de la plataforma."],r:["Guarde capturas del anuncio y de sus calificaciones.","Pida el motivo por escrito y apele.","Si el motivo es el RNT, regularícelo y pida la reactivación."],doc:["Capturas del anuncio y de sus reseñas","Aviso de retiro","Certificado del RNT, si aplica"],src:["l2068"]},{id:"p-marketplace",sector:"plataformas",t:{es:"Compré en una plataforma y el vendedor desapareció",en:"I bought on a marketplace and the seller disappeared",fr:"J’ai acheté sur une plateforme et le vendeur a disparu",pt:"Comprei numa plataforma e o vendedor sumiu"},urgent:!0,urgentMsg:"Si pagó con tarjeta o medio electrónico, la reversión del pago debe pedirse dentro de los 5 días hábiles siguientes a enterarse del problema.",d:["Las plataformas donde otros venden deben exigir a cada vendedor datos que permitan identificarlo: nombre, documento, dirección y teléfonos (Ley 1480, art. 53).","Si usted compró, puede consultar esos datos para presentar su queja o reclamo contra el vendedor (Ley 1480, art. 53).","Si pagó en línea con tarjeta y no recibió el producto, puede proceder la reversión del pago (Ley 1480, art. 51)."],p:["Reversión del pago: 5 días hábiles desde que se enteró.","Respuesta del vendedor a su reclamo: 15 días hábiles."],r:["Pida a la plataforma los datos del vendedor, citando el artículo 53 de la Ley 1480.","Reclame por escrito al vendedor.","Si no responde, queja o demanda ante la SIC."],doc:["Pedido y comprobante de pago","Publicación del producto","Mensajes con el vendedor y la plataforma"],src:["l1480"]},{id:"o-arriendo",sector:"arriendo",t:{es:"Arriendo por meses: depósito, aumento o reparaciones",en:"Monthly rental: deposit, rent increase or repairs",fr:"Location au mois : caution, hausse de loyer ou réparations",pt:"Aluguel mensal: caução, reajuste ou reparos"},d:["Una estancia de 30 días o más en vivienda urbana suele regirse por la Ley 820 de 2003, no por las normas de turismo.","El arrendador no puede exigir depósitos en dinero ni otras garantías reales para asegurar el pago (Ley 820 de 2003, art. 16).","El canon solo puede subir una vez cada 12 meses y como máximo en el IPC del año anterior (Ley 820 de 2003, art. 20).","El arrendador debe entregar el inmueble en buen estado y hacer las reparaciones necesarias; el arrendatario responde por las reparaciones locativas causadas por su uso (Ley 820 de 2003, arts. 8 y 9).","Medida temporal: si su vivienda o su contrato resultaron afectados directamente por el sismo del 10 de agosto de 2026, el Decreto 1423 de 2026 suspende por 6 meses la ejecución de órdenes de restitución, aplaza los reajustes del canon y permite prorrogar 6 meses los contratos que vencían entre el 10 de agosto y el 31 de diciembre de 2026, con excepciones (riesgo de colapso, vivienda propia del arrendador)."],p:["La terminación anticipada exige un preaviso escrito: revise el plazo en su contrato y en la Ley 820."],r:["Reclame por escrito al arrendador o a la inmobiliaria.","Intente una conciliación.","Si no hay acuerdo, el caso va ante un juez civil; las alcaldías vigilan a las inmobiliarias (en Bogotá, la Secretaría del Hábitat)."],doc:["Contrato de arrendamiento","Recibos de pago del canon","Inventario y fotos de la entrega"],src:["habitat","l820","d1423"]},{id:"r-desalojo",sector:"arriendo",t:{es:"El arrendador me quiere sacar, cambió la cerradura o me cortó los servicios",en:"My landlord wants me out, changed the lock or cut off utilities",fr:"Mon propriétaire veut me faire partir, a changé la serrure ou coupé les services",pt:"O locador quer me tirar, trocou a fechadura ou cortou os serviços"},urgent:!0,urgentMsg:"Solo un juez puede ordenar que usted salga de una vivienda arrendada. No entregue las llaves ni firme nada bajo presión; si hay violencia, llame al 123.",d:["Si usted no entrega la vivienda, el arrendador debe iniciar un proceso de restitución ante un juez (Código General del Proceso, art. 384). Ni el arrendador ni la policía pueden reemplazar esa orden.","Sin una falta suya, el arrendador puede terminar el contrato: durante las prórrogas, con preaviso escrito de al menos tres meses por correo certificado y una indemnización de tres cánones (Ley 820 de 2003, art. 22, num. 7); o al vencimiento, con preaviso de tres meses, para ocupar la vivienda, demolerla o repararla, o venderla, y después de cuatro años de contrato también por su sola voluntad, con una indemnización de un canon y medio (art. 22, num. 8).","Si el arrendador le suspende los servicios públicos a propósito, usted puede terminar el contrato y pagar la reconexión descontándola del canon (Ley 820 de 2003, art. 24, num. 1).","Si le impiden entrar, por ejemplo cambiando la cerradura: como arrendatario, usted es mero tenedor (Código Civil, art. 775) y puede presentar una querella ante el inspector de policía, que puede ordenar que le restituyan la tenencia (Ley 1801 de 2016, arts. 77, num. 5, y 79). En el momento, llame al 123.","Entrar a su vivienda sin su permiso, aunque sea el dueño, puede ser violación de habitación ajena (Código Penal, art. 189); obligarlo a salir con amenazas puede ser constreñimiento ilegal (art. 182).","Medida temporal: si su vivienda o su contrato resultaron afectados directamente por el sismo del 10 de agosto de 2026, el Decreto 1423 de 2026 suspende por 6 meses la ejecución de órdenes de restitución, aplaza los reajustes del canon y permite prorrogar 6 meses los contratos que vencían entre el 10 de agosto y el 31 de diciembre de 2026, con excepciones (riesgo de colapso, vivienda propia del arrendador)."],p:["Querella ante el inspector de policía si le impiden entrar: preséntela cuanto antes; caduca a los 4 meses del hecho (Ley 1801 de 2016, art. 80).","Preaviso del arrendador para terminar sin falta suya: al menos 3 meses (Ley 820 de 2003, art. 22).","Si hay proceso de restitución, siga pagando el canon: si no lo consigna, no lo escuchan en el proceso (Código General del Proceso, art. 384)."],r:["No entregue las llaves ni firme una entrega bajo presión.","Pida por escrito el motivo y el fundamento legal.","Si le cambian la cerradura o le impiden entrar, llame al 123 o acuda al inspector de policía.","Siga pagando el canon y guarde los recibos; si el arrendador no lo recibe, consúltenos cómo consignarlo.","Si le cortaron los servicios, guarde las facturas de reconexión."],doc:["Contrato de arrendamiento","Recibos de pago del canon","Avisos o cartas del arrendador","Fotos o video de la cerradura cambiada o del corte","Número del reporte a la policía"],src:["l820","cgp384","pol77","habitat","t164","d1423"]},{id:"r-inmobiliaria",sector:"arriendo",t:{es:"La inmobiliaria no me responde, no me devuelve dinero o cobra lo que no debe",en:"The letting agency won’t respond, won’t return money or charges what it shouldn’t",fr:"L’agence immobilière ne répond pas, ne rend pas l’argent ou facture ce qu’elle ne doit pas",pt:"A imobiliária não responde, não devolve dinheiro ou cobra o que não deve"},d:["Quien se dedica a arrendar o intermediar vivienda urbana en municipios de más de 15.000 habitantes debe estar matriculado ante la autoridad local (Ley 820 de 2003, art. 28).","La alcaldía (en Bogotá, la Secretaría del Hábitat) vigila a arrendadores e inmobiliarias y atiende quejas, por ejemplo por depósitos ilegales o por no entregar copia del contrato o los recibos (Ley 820 de 2003, art. 33).","Puede imponer multas de hasta 100 salarios mínimos y suspender o cancelar la matrícula (Ley 820 de 2003, art. 34).","No le pueden exigir depósitos en dinero ni otras garantías reales para asegurar el pago (Ley 820 de 2003, art. 16)."],p:["Reclamo escrito a la inmobiliaria primero: guarde la constancia de envío.","Queja ante la alcaldía: preséntela con el contrato y los recibos."],r:["Pida por escrito copia del contrato, de los recibos y la liquidación de lo que le deben.","Verifique en la alcaldía si la inmobiliaria está matriculada.","Presente queja ante la alcaldía (en Bogotá, la Secretaría del Hábitat).","Si hay dinero en disputa, conciliación y, si no hay acuerdo, juez civil."],doc:["Contrato y anexos","Recibos y extractos de pago","Correos y mensajes con la inmobiliaria","Constancia del reclamo escrito"],src:["l820","habitat","metroInm"]},{id:"r-larga",sector:"arriendo",t:{es:"Reservé por una app por un mes o más: ¿qué reglas aplican?",en:"I booked through an app for a month or more: which rules apply?",fr:"J’ai réservé via une appli pour un mois ou plus : quelles règles s’appliquent ?",pt:"Reservei por um app por um mês ou mais: que regras se aplicam?"},d:["El hospedaje es solo para estadías de menos de 30 días (Ley 300 de 1996, art. 79). Una estadía de 30 días o más ya no es hospedaje turístico, aunque se reserve por una app.","Si es una vivienda urbana que usted usa para vivir, por regla general es un arrendamiento de vivienda urbana (Ley 820 de 2003, art. 2): no le pueden exigir depósitos en dinero (art. 16) y, si usted no entrega, el arrendador debe acudir a un juez (Código General del Proceso, art. 384).","La plataforma sigue siendo intermediaria: sus términos y su centro de resolución aplican, y debe tener identificado al anfitrión para que usted pueda reclamar (Ley 1480 de 2011, art. 53).","Lo que cuenta es lo que realmente pactaron y cómo se usa el inmueble, no el nombre que le dé la plataforma (Código Civil, art. 1618)."],p:["Si hay un problema, avise a la plataforma el mismo día: sus plazos para reportar suelen ser cortos."],r:["Guarde la reserva y los términos de la plataforma vigentes en la fecha de la reserva (PDF o capturas).","Revise si firmó un contrato aparte con el anfitrión.","Ante un conflicto, escriba al anfitrión y a la plataforma, y consúltenos antes de entregar el inmueble."],doc:["Reserva y pagos","Términos de la plataforma vigentes en la fecha","Mensajes con el anfitrión","Contrato aparte, si lo hay"],src:["l300c","l820","l1480"]}),c.splice(c.findIndex((e=>"o-fraude"===e.id))+1,0,{id:"o-transferencia",sector:"otros",t:{es:"Me estafaron por transferencia (Bre-B, llaves o transferencia inmediata)",en:"I was scammed through a transfer (Bre-B, keys or instant transfer)",fr:"On m’a escroqué par virement (Bre-B, clés ou virement instantané)",pt:"Fui vítima de golpe por transferência (Bre-B, chaves ou transferência imediata)"},urgent:!0,urgentMsg:"Llame ya a su banco por la línea oficial, reporte la transferencia y bloquee sus canales: en una transferencia inmediata, cada minuto cuenta.",d:["Su banco tiene un deber reforzado de seguridad: debe identificarlo bien y vigilar los movimientos inusuales por monto, frecuencia o destino.","Si el banco no detectó ni frenó movimientos claramente inusuales, la Superfinanciera puede ordenarle devolver todo o parte del dinero; también se revisa si usted actuó con cuidado, por ejemplo si compartió claves o reportó tarde.","Si usted mismo autorizó la transferencia porque lo engañaron, recuperar el dinero es más difícil: por eso el reporte inmediato y la denuncia son decisivos.","Puede quejarse ante el Defensor del Consumidor Financiero o la Superfinanciera, y demandar ante la Superfinanciera sin abogado si el valor es menor a 40 salarios mínimos."],p:["Reporte al banco: de inmediato, en la primera hora.","Demanda ante la Superfinanciera: hasta un año desde el fin de la relación con la entidad."],r:["Llame a su banco por la línea oficial, reporte la transferencia y bloquee la aplicación y las tarjetas. Algunos bancos permiten reportarlo desde su aplicación.","Pida por escrito que el banco contacte al banco que recibió el dinero para intentar retenerlo, y guarde el número de radicado.","Denuncie ante la Fiscalía o en el CAI Virtual de la Policía.","Si el banco no responde o se niega, Defensor del Consumidor Financiero y Superfinanciera."],doc:["Comprobante de la transferencia: hora, monto y llave o cuenta de destino","Capturas del chat, el enlace o la llamada del engaño","Radicado del reporte al banco","Denuncia"],src:["sfcFraude","alFraude","lrFraude","sfcAccion"]}),c.splice(c.findIndex((e=>"a-cancelacion"===e.id))+1,0,{id:"a-desalojo",sector:"alojamiento",t:{es:"El anfitrión me canceló durante la estadía o llamó a la policía para sacarme",en:"The host cancelled during my stay or called the police to remove me",fr:"L’hôte a annulé pendant mon séjour ou a appelé la police pour me faire sortir",pt:"O anfitrião cancelou durante a estadia ou chamou a polícia para me tirar"},urgent:!0,urgentMsg:"Mantenga la calma, no firme nada y, si puede hacerlo sin riesgo, grabe lo que pasa. Si hay violencia o amenazas, llame al 123.",d:["Una estadía de menos de 30 días es un contrato de hospedaje (Ley 300 de 1996, art. 79). Solo termina antes de tiempo por falta de pago, por infracción del reglamento oficial del hospedaje o por otra causa pactada expresamente, como unas reglas de la casa que usted aceptó al reservar (Código de Comercio, arts. 1193 y 1197).","Si el anfitrión lo saca sin una de esas causas, incumple: usted elige otro alojamiento de la misma calidad a costa de él, o el reembolso o la compensación (Ley 300 de 1996, art. 63), y puede reclamar los gastos extra.","Durante la estadía, el alojamiento es su domicilio (Constitución, art. 28; Corte Constitucional, C-519 de 2007). La policía solo entra sin orden escrita por imperiosa necesidad, por ejemplo para auxiliar a alguien o por un incendio (Ley 1801 de 2016, art. 163).","La policía no decide quién tiene razón en el contrato: sus medidas sobre la tenencia de un inmueble son provisionales y el fondo lo resuelve un juez (Ley 1801 de 2016, art. 80). Usted puede grabar el procedimiento (art. 21).","Si el anfitrión termina el contrato, debe hacer un inventario de sus pertenencias ante testigos antes de retirarlas (Código de Comercio, art. 1198)."],p:["Avise a la plataforma de inmediato, por su canal de emergencias.","Reclamo escrito al anfitrión y a la plataforma: el mismo día; el proveedor tiene 15 días hábiles para responder.","Demanda ante la SIC: hasta un año."],r:["Pida el motivo por escrito y muestre su reserva y su pago. Si llega la policía, pida el nombre y la placa de los agentes y el motivo legal de la actuación.","Avise a la plataforma por su canal de emergencias y pida reubicación o reembolso.","Antes de salir, fotografíe sus pertenencias y no deje documentos ni dinero; si el anfitrión las retira, exija el inventario ante testigos.","Si hay violencia o amenazas, o le retienen sus cosas, llame al 123 y denuncie.","Después: reclamo escrito al anfitrión y a la plataforma, y queja o demanda ante la SIC."],doc:["Reserva y comprobante de pago","Mensajes del anfitrión y de la plataforma","Video o audio de lo ocurrido, con nombre y placa de los policías","Facturas del nuevo alojamiento y del transporte","Fotos o inventario de sus pertenencias"],src:["l300c","ccoHosp","c519","pol163","pol21","sicCancel"]}),c.splice(c.findIndex((e=>"h-registros"===e.id))+1,0,{id:"h-huesped",sector:"anfitriones",t:{es:"Un huésped no se quiere ir o incumple las reglas: ¿puedo llamar a la policía?",en:"A guest won’t leave or breaks the rules: can I call the police?",fr:"Un voyageur ne veut pas partir ou enfreint le règlement : puis-je appeler la police ?",pt:"Um hóspede não quer sair ou descumpre as regras: posso chamar a polícia?"},urgent:!0,urgentMsg:"No use la fuerza, no cambie la cerradura ni corte los servicios con el huésped adentro, y no retire sus cosas sin inventario: un problema del contrato puede volverse un problema penal. Si hay violencia, llame al 123.",d:["El hospedaje termina al vencer el plazo, por falta de pago, por infracción del reglamento oficial del hospedaje o por otra causa pactada expresamente (Código de Comercio, arts. 1193 y 1197). Sus reglas de la casa solo cuentan como causa si el huésped las aceptó expresamente al reservar.","Si termina el contrato, haga un inventario de las pertenencias del huésped ante testigos antes de retirarlas (Código de Comercio, art. 1198). Si no paga, la ley prevé el remate de sus bienes por un martillo autorizado, no quedárselos (art. 1199).","Mientras la estadía está vigente, el alojamiento es el domicilio del huésped (Constitución, art. 28; C-519 de 2007): entrar sin su permiso o grabar su vida privada adentro puede ser un delito (Código Penal, art. 189).","Por ruido, fiestas o riñas, la policía puede intervenir por convivencia (Ley 1801 de 2016, art. 33).","Si el huésped se queda después del fin de la reserva, el contrato ya terminó (Código de Comercio, art. 1197). El hospedaje tiene su propio mecanismo, distinto del proceso de restitución del arrendamiento: inventario ante testigos y retiro de las pertenencias (art. 1198), y querella ante la policía o el inspector como titular de la tenencia (Ley 1801 de 2016, arts. 77 y 79). Nunca por la fuerza."],p:["Querella ante el inspector de policía como titular de la tenencia: preséntela cuanto antes; caduca a los 4 meses (Ley 1801 de 2016, arts. 79 y 80). La acción preventiva de 48 horas (art. 81) está pensada para ocupaciones de hecho: su uso contra un huésped que entró por contrato es discutible.","Protección policiva de la tenencia: caduca a los 4 meses (Ley 1801 de 2016, art. 80).","Reporte a la plataforma: el mismo día, por su canal de emergencias."],r:["Escriba al huésped, por la plataforma, el motivo y la hora de salida, citando sus reglas de la casa.","Avise a la plataforma por su canal de emergencias o de seguridad.","Si hay ruido, riña o peligro, llame al 123; si el huésped se queda después del fin de la reserva, pida la protección de la policía o del inspector.","No entre, no cambie la cerradura y no retire sus cosas sin inventario ante testigos.","Si no pagó o causó daños, use el reclamo de la plataforma y, si no se resuelve, la vía civil."],doc:["Reserva con fechas y reglas de la casa aceptadas","Mensajes con el huésped y la plataforma","Fotos o video de daños o del ruido, tomados desde zonas comunes","Inventario firmado ante testigos, si retiró pertenencias","Número del reporte a la policía o a la plataforma"],src:["ccoHosp","l300c","pol77","pol33","c519","t164"]}),c.splice(c.findIndex((e=>"a-cancelacion"===e.id))+1,0,{id:"a-sobreventa",sector:"alojamiento",t:{es:"Llegué al hotel y no tenían mi habitación (sobreventa)",en:"I arrived at the hotel and they had no room for me (overbooking)",fr:"Je suis arrivé à l’hôtel et ma chambre n’était pas disponible (surréservation)",pt:"Cheguei ao hotel e não havia meu quarto (overbooking)"},urgent:!0,urgentMsg:"No salga del hotel sin una constancia escrita: pida que le confirmen por escrito que no hay habitación y qué solución le dan.",d:["La sobreventa es un incumplimiento: el hotel debe darle un alojamiento de la misma calidad, o la devolución o compensación del precio; si no tiene uno igual, debe contratarlo con un tercero a su costa (Ley 300 de 1996, arts. 63 y 64).","Usted elige entre el alojamiento equivalente y el reembolso.","Si reservó por una agencia o una app, avísele también: debe ayudarle a resolver según su política."],p:["Pida la solución por escrito antes de salir del hotel.","Reclamo escrito: el proveedor tiene 15 días hábiles para responder.","Demanda ante la SIC: hasta un año."],r:["Pida en la recepción una constancia escrita de que no hay habitación y de la solución que le ofrecen.","Elija: alojamiento equivalente pagado por el hotel, o la devolución del precio.","Guarde las facturas de transporte, comidas y la diferencia de precio.","Si no resuelven, queja o demanda ante la SIC."],doc:["Confirmación de la reserva y pago","Constancia escrita del hotel","Facturas de los gastos extra","Fotos o video en la recepción"],src:["l300","sicCancel","l1480"]}),c.splice(c.findIndex((e=>"o-publicidad"===e.id))+1,0,{id:"o-ia",sector:"otros",t:{es:"Un asistente de IA me informó mal o me negó algo",en:"An AI assistant misinformed me or turned me down",fr:"Un assistant IA m’a mal informé ou m’a refusé quelque chose",pt:"Um assistente de IA me informou mal ou me negou algo"},d:["Un asistente automático habla en nombre de la empresa: la información que le da debe ser clara, veraz, suficiente y verificable, y la empresa responde por los daños que cause una información inadecuada o insuficiente (Ley 1480 de 2011, art. 23).","Las condiciones concretas que se anuncian, también en un texto escrito por IA, obligan a quien las anuncia (Ley 1480 de 2011, art. 29).","Si la decisión usó sus datos personales, puede preguntar qué datos usaron y pedir que corrijan los inexactos (Ley 1581 de 2012, arts. 8 y 14). La SIC exige a quien trata datos con IA usar datos veraces y exactos, y que usted pueda saber cómo se tratan (Circular Externa 002 de 2024).","Hoy ninguna ley colombiana da un derecho general a que una persona revise una decisión automática; un proyecto de ley sobre inteligencia artificial (025 de 2026) está en discusión en el Congreso. Igual puede pedirlo en su reclamo escrito, y la empresa debe responderle."],p:["Reclamo escrito: el proveedor tiene 15 días hábiles para responder.","Consulta de datos personales: 10 días hábiles, prorrogables 5."],r:["Guarde la conversación completa con el asistente: capturas con fecha y hora, o la copia que la plataforma le deje descargar.","Reclame por escrito: cite lo que le dijo el asistente, pida que una persona revise su caso y diga qué solución espera.","Si no responden en 15 días hábiles o no lo resuelven, presente una queja ante la SIC."],doc:["Capturas o copia de la conversación con el asistente","Número de reserva, pedido o cuenta","Términos y políticas vigentes ese día, guardados en PDF"],src:["l1480","l1581","sic002"]}),c.find((e=>"t-cancelacion"===e.id)).src.push("cco1882","can619"),c.find((e=>"t-retraso"===e.id)).src.push("cco1882","can619"),c.find((e=>"t-equipaje"===e.id)).src.push("cco1882","can619"),c.find((e=>"a-dano"===e.id)).d[2]="Si hubo un delito, denúncielo; la reclamación de consumo puede avanzar al mismo tiempo, porque el plazo de un año para demandar sigue corriendo (Ley 1480 de 2011, art. 58).",c.find((e=>"t-retraso"===e.id)).p[0]="Si reclama por escrito a la aerolínea, debe responderle en 15 días hábiles, según la Superintendencia de Tran
