,"Good offices and mediation, voluntary and confidential.","Agreement or final statement. The indicative total timeframe is one year."],fr:["Une plainte écrite en espagnol, avec les faits et leurs preuves, les Principes directeurs qui auraient été enfreints, ce que vous demandez à l’entreprise et les autres procédures en cours.","Le PCN la transmet à l’entreprise, qui a 20 jours ouvrables pour répondre.","Évaluation initiale : jusqu’à deux mois pour accepter ou rejeter le dossier.","Bons offices et médiation, volontaire et confidentielle.","Accord ou déclaration finale. Le délai indicatif total est d’un an."],pt:["Queixa escrita em espanhol, com os fatos e suas provas, as Diretrizes que teriam sido descumpridas, o que você pede à empresa e os outros processos em andamento.","O PCN a encaminha à empresa, que tem 20 dias úteis para responder.","Avaliação inicial: até dois meses para aceitar ou rejeitar o caso.","Bons ofícios e mediação, voluntária e confidencial.","Acordo ou declaração final. O prazo indicativo total é de um ano."]},prfNcpEvid:{es:"Aquí las pruebas lo deciden todo: el PNC acepta o rechaza el caso según qué tan sustentada esté la queja, y sus pruebas son las que muestran el vínculo entre la conducta de la empresa y el daño que usted sufrió.",en:"Here evidence decides everything: the NCP accepts or rejects the case depending on how well the complaint is substantiated, and your evidence is what shows the link between the company’s conduct and the harm you suffered.",fr:"Ici, les preuves décident de tout : le PCN accepte ou rejette le dossier selon qu’il est bien étayé, et ce sont vos preuves qui montrent le lien entre le comportement de l’entreprise et le préjudice subi.",pt:"Aqui as provas decidem tudo: o PCN aceita ou rejeita o caso conforme a queixa esteja bem fundamentada, e são as suas provas que mostram o vínculo entre a conduta da empresa e o dano que você sofreu."},prfNcpRepH:{es:"¿Podemos representarlo?",en:"Can we represent you?",fr:"Pouvons-nous vous représenter ?",pt:"Podemos representar você?"},prfNcpRep:{es:"Sí. El PNC de Colombia admite que una persona presente la queja en nombre de otra, con su autorización expresa y por escrito. Nuestros abogados pueden preparar y radicar la instancia con su autorización y acompañarlo en la mediación. Ante los PNC de otros países las reglas cambian; las verificamos antes de presentar.",en:"Yes. Colombia’s NCP accepts a complaint filed on someone else’s behalf, with that person’s express written authorisation. Our lawyers can prepare and file the specific instance with your authorisation and accompany you in the mediation. The NCPs of other countries have their own rules; we check them before filing.",fr:"Oui. Le PCN de Colombie accepte qu’une personne dépose la plainte au nom d’une autre, avec son autorisation expresse et écrite. Nos avocats peuvent préparer et déposer la plainte avec votre autorisation et vous accompagner dans la médiation. Les PCN d’autres pays ont leurs propres règles ; nous les vérifions avant le dépôt.",pt:"Sim. O PCN da Colômbia admite que uma pessoa apresente a queixa em nome de outra, com autorização expressa e por escrito. Nossos advogados podem preparar e protocolar a instância com a sua autorização e acompanhar você na mediação. Os PCN de outros países têm regras próprias; nós as verificamos antes de apresentar."},prfNcpSrc:[["PNC de Colombia (MinCIT)","https://www.mincit.gov.co/mincomercioexterior/temas-de-interes/colombia-en-la-ocde/punto-nacional-de-contacto-pnc-de-las-directrices/presentacion-de-una-instancia-especifica"],["OECD NCPs","https://mneguidelines.oecd.org/ncps/"],["Ireland NCP, Temu (2025)","https://enterprise.gov.ie/en/publications/publication-files/final-statement-ireland-ncp-temu.pdf"]],prfEndH:{es:"¿Ya tiene sus pruebas?",en:"Got your evidence?",fr:"Vous avez vos preuves ?",pt:"Já tem suas provas?"},prfEndP:{es:"Haga su ficha gratis y envíenosla. Le diremos qué falta y qué camino conviene.",en:"Get your free sheet and send it to us. We will tell you what is missing and which route fits.",fr:"Faites votre fiche gratuitement et envoyez-la-nous. Nous vous dirons ce qui manque et quelle voie convient.",pt:"Faça sua ficha grátis e envie para nós. Diremos o que falta e qual caminho convém."},prfNote:{es:"Información general para orientarlo; no reemplaza la revisión de su caso por un abogado.",en:"General information to guide you; it does not replace a lawyer’s review of your case.",fr:"Information générale pour vous orienter ; elle ne remplace pas l’examen de votre dossier par un avocat.",pt:"Informação geral para orientar você; não substitui a análise do seu caso por um advogado."}}),Object.assign(a,{how2s:{es:"De 5 a 9 preguntas cortas.",en:"5 to 9 short questions.",fr:"De 5 à 9 questions courtes.",pt:"De 5 a 9 perguntas curtas."},originHome:{es:"inicio",en:"home page",fr:"accueil",pt:"início"},moreH:{es:"Cuéntenos un poco más (opcional)",en:"Tell us a bit more (optional)",fr:"Dites-nous-en un peu plus (facultatif)",pt:"Conte um pouco mais (opcional)"},moreP:{es:"Con estos datos, nuestros abogados pueden orientarlo desde el primer mensaje. Nada se guarda en esta página: solo va en el mensaje que usted envía.",en:"With these details, our lawyers can guide you from the first message. Nothing is stored on this page: it only goes in the message you send.",fr:"Avec ces informations, nos avocats peuvent vous orienter dès le premier message. Rien n’est enregistré sur cette page : tout part uniquement dans le message que vous envoyez.",pt:"Com esses dados, nossos advogados podem orientar você desde a primeira mensagem. Nada fica guardado nesta página: vai só na mensagem que você envia."},moreName:{es:"Su nombre",en:"Your name",fr:"Votre nom",pt:"Seu nome"},moreCity:{es:"Ciudad donde ocurrió",en:"City where it happened",fr:"Ville où cela s’est passé",pt:"Cidade onde aconteceu"},moreCo:{es:"Empresa o plataforma",en:"Company or platform",fr:"Entreprise ou plateforme",pt:"Empresa ou plataforma"} renovar: escolha sua situação e receba em 2 minutos uma ficha clara do que fazer. Você decide se nos escreve."},guideB:{es:"Guía de derechos y obligaciones",en:"Rights and obligations guide",fr:"Guide des droits et obligations",pt:"Guia de direitos e obrigações"},guideS:{es:"41 situaciones de consumidores, anfitriones y usuarios de plataformas, con plazos y a quién acudir.",en:"41 situations for consumers, hosts and platform users, with deadlines and where to turn.",fr:"41 situations pour consommateurs, hôtes et utilisateurs de plateformes, avec les délais et à qui s’adresser.",pt:"41 situações de consumidores, anfitriões e usuários de plataformas, com prazos e a quem recorrer."},guideH:{es:"Sus derechos y obligaciones en Colombia",en:"Your rights and obligations in Colombia",fr:"Vos droits et obligations en Colombie",pt:"Seus direitos e obrigações na Colômbia"},guideGo:{es:"Ver las 41 situaciones",en:"See all 41 situations",fr:"Voir les 41 situations",pt:"Ver as 41 situações"},footFaq:{es:"Preguntas frecuentes",en:"FAQ",fr:"Questions fréquentes",pt:"Perguntas frequentes"},faqEye:{es:"Preguntas frecuentes",en:"Frequently asked questions",fr:"Questions fréquentes",pt:"Perguntas frequentes"},faqT:{es:"Lo que nos preguntan antes de escribirnos",en:"What people ask before contacting us",fr:"Ce qu’on nous demande avant de nous écrire",pt:"O que nos perguntam antes de escrever"},faqLead:{es:"Respuestas cortas sobre costos, tiempos, idiomas, datos y lo que podemos hacer por usted.",en:"Short answers on costs, timing, languages, data and what we can do for you.",fr:"Des réponses courtes sur les coûts, les délais, les langues, les données et ce que nous pouvons faire pour vous.",pt:"Respostas curtas sobre custos, prazos, idiomas, dados e o que podemos fazer por você."},faq:[{q:{es:"¿Cuánto cuesta?",en:"How much does it cost?",fr:"Combien ça coûte ?",pt:"Quanto custa?"},a:{es:"La ficha y la orientación inicial no tienen costo. Si su caso necesita un servicio, como revisar su expediente o preparar un reclamo, le decimos el precio antes de empezar y usted decide.",en:"The sheet and the first guidance are free. If your case needs a service, such as reviewing your file or preparing a claim, we tell you the price before starting and you decide.",fr:"La fiche et la première orientation sont gratuites. Si votre dossier demande un service, comme l’examen de vos documents ou la préparation d’une réclamation, nous vous donnons le prix avant de commencer et vous décidez.",pt:"A ficha e a orientação inicial não têm custo. Se o seu caso precisar de um serviço, como revisar seus documentos ou preparar uma reclamação, informamos o preço antes de começar e você decide."}},{q:{es:"¿En cuánto tiempo responden?",en:"How quickly do you reply?",fr:"En combien de temps répondez-vous ?",pt:"Em quanto tempo vocês respondem?"},a:{es:"Le respondemos por el mismo medio por el que nos escribe, en horario hábil de Colombia.",en:"We reply through the same channel you used, during Colombian business hours.",fr:"Nous répondons par le même canal que vous, aux heures ouvrables de Colombie.",pt:"Respondemos pelo mesmo meio que você usou, em horário comercial da Colômbia."}},{q:{es:"¿Atienden fuera de Medellín o desde el exterior?",en:"Do you work outside Medellín or with people abroad?",fr:"Travaillez-vous hors de Medellín ou avec des personnes à l’étranger ?",pt:"Vocês atendem fora de Medellín ou no exterior?"},a:{es:"Sí. Trabajamos a distancia, con personas en toda Colombia y con quienes viven fuera del país.",en:"Yes. We work remotely, with people all over Colombia and with those living abroad.",fr:"Oui. Nous travaillons à distance, avec des personnes partout en Colombie et avec celles qui vivent à l’étranger.",pt:"Sim. Trabalhamos a distância, com pessoas de toda a Colômbia e com quem mora fora do país."}},{q:{es:"Soy extranjero. ¿La ley colombiana me protege?",en:"I’m a foreigner. Does Colombian law protect me?",fr:"Je suis étranger. La loi colombienne me protège-t-elle ?",pt:"Sou estrangeiro. A lei colombiana me protege?"},a:{es:"Sí. Si compró o recibió el servicio en Colombia, tiene los mismos derechos que un colombiano. Le orientamos en su idioma: español, inglés, francés o portugués.",en:"Yes. If you bought or received the service in Colombia, you have the same rights as a Colombian. We guide you in your language: Spanish, English, French or Portuguese.",fr:"Oui. Si vous avez acheté ou reçu le service en Colombie, vous avez les mêmes droits qu’un Colombien. Nous vous orientons dans votre langue : espagnol, anglais, français ou portugais.",pt:"Sim. Se você comprou ou recebeu o serviço na Colômbia, tem os mesmos direitos que um colombiano. Orientamos você no seu idioma: espanhol, inglês, francês ou português."},link:["#pruebas","prfIntlH"]},{q:{es:"¿Tengo que ir a un juzgado?",en:"Do I have to go to court?",fr:"Dois-je aller au tribunal ?",pt:"Preciso ir a um tribunal?"},a:{es:"En la mayoría de los casos, no. El primer paso es un reclamo escrito a la empresa; si no responde, se acude a la autoridad que corresponda, como la SIC. Solo algunos casos llegan a un juez, y se lo decimos antes.",en:"In most cases, no. The first step is a written complaint to the company; if it doesn’t answer, you turn to the relevant authority, such as the SIC. Only some cases reach a judge, and we tell you beforehand.",fr:"Dans la plupart des cas, non. La première étape est une réclamation écrite à l’entreprise ; sans réponse, on s’adresse à l’autorité compétente, comme la SIC. Seuls certains dossiers vont devant un juge, et nous vous le disons avant.",pt:"Na maioria dos casos, não. O primeiro passo é uma reclamação escrita à empresa; se ela não responder, recorre-se à autoridade competente, como a SIC. Só alguns casos chegam a um juiz, e avisamos antes."}},{q:{es:"¿Garantizan el resultado?",en:"Do you guarantee the outcome?",fr:"Garantissez-vous le résultat ?",pt:"Vocês garantem o resultado?"},a:{es:"No. Ningún abogado puede prometer un resultado. Le decimos con claridad qué es posible, qué riesgos hay y cuánto cuesta.",en:"No. No lawyer can promise an outcome. We tell you clearly what is possible, what the risks are and what it costs.",fr:"Non. Aucun avocat ne peut promettre un résultat. Nous vous disons clairement ce qui est possible, quels sont les risques et combien cela coûte.",pt:"Não. Nenhum advogado pode prometer um resultado. Dizemos com clareza o que é possível, quais são os riscos e quanto custa."}},{q:{es:"¿Qué pruebas necesito?",en:"What evidence do I need?",fr:"De quelles preuves ai-je besoin ?",pt:"De quais provas eu preciso?"},a:{es:"Depende del caso, pero casi siempre: el anuncio o el contrato, el comprobante de pago, los mensajes con la empresa y fotos con fecha. La guía de pruebas lo detalla por tipo de caso.",en:"It depends on the case, but almost always: the listing or contract, proof of payment, messages with the company and dated photos. The evidence guide details it by type of case.",fr:"Cela dépend du dossier, mais presque toujours : l’annonce ou le contrat, la preuve de paiement, les messages avec l’entreprise et des photos datées. Le guide des preuves détaille tout par type de dossier.",pt:"Depende do caso, mas quase sempre: o anúncio ou o contrato, o comprovante de pagamento, as mensagens com a empresa e fotos com data. O guia de provas detalha por tipo de caso."},link:["#pruebas","footPrf"]},{q:{es:"¿Pueden representarme ante una multinacional?",en:"Can you represent me against a multinational?",fr:"Pouvez-vous me représenter face à une multinationale ?",pt:"Vocês podem me representar contra uma multinacional?"},a:{es:"Sí. Además del reclamo y de la SIC, con su autorización escrita podemos presentar su caso ante el Punto Nacional de Contacto de la OCDE, que ofrece una mediación gratuita con la empresa.",en:"Yes. Besides the complaint and the SIC, with your written authorisation we can bring your case to the OECD National Contact Point, which offers free mediation with the company.",fr:"Oui. En plus de la réclamation et de la SIC, avec votre autorisation écrite nous pouvons porter votre dossier devant le Point de contact national de l’OCDE, qui propose une médiation gratuite avec l’entreprise.",pt:"Sim. Além da reclamação e da SIC, com sua autorização por escrito podemos levar o caso ao Ponto de Contato Nacional da OCDE, que oferece uma mediação gratuita com a empresa."},link:["#pruebas","prfNcpH"]},{q:{es:"¿Qué hacen con mis datos?",en:"What do you do with my data?",fr:"Que faites-vous de mes données ?",pt:"O que vocês fazem com meus dados?"},a:{es:"Esta página no guarda sus respuestas y cuenta las visitas de forma anónima, sin cookies. Si nos envía su ficha, usamos sus datos solo para orientarlo y responderle, y puede pedir que los corrijamos o los borremos (Ley 1581 de 2012).",en:"This page doesn’t store your answers and counts visits anonymously, without cookies. If you send us your sheet, we use your data only to guide you and reply, and you can ask us to correct or delete it (Colombian Law 1581 of 2012).",fr:"Cette page n’enregistre pas vos réponses et compte les visites de façon anonyme, sans cookies. Si vous nous envoyez votre fiche, nous utilisons vos données uniquement pour vous orienter et vous répondre, et vous pouvez demander leur correction ou leur suppression (loi colombienne 1581 de 2012).",pt:"Esta página não guarda suas respostas e conta as visitas de forma anônima, sem cookies. Se você nos enviar sua ficha, usamos seus dados só para orientar e responder, e você pode pedir que os corrijamos ou apaguemos (Lei colombiana 1581 de 2012)."}},{q:{es:"¿La información de la página es asesoría legal?",en:"Is the information on this page legal advice?",fr:"Les informations de cette page sont-elles un conseil juridique ?",pt:"A informação da página é assessoria jurídica?"},a:{es:"Es orientación general, con fuentes y fecha de actualización. No reemplaza la revisión de su caso, que nuestros abogados hacen antes de cualquier actuación.",en:"It is general guidance, with sources and an update date. It doesn’t replace the review of your case, which our lawyers carry out before taking any action.",fr:"C’est une orientation générale, avec des sources et une date de mise à jour. Elle ne remplace pas l’examen de votre dossier, que nos avocats font avant toute démarche.",pt:"É orientação geral, com fontes e data de atualização. Não substitui a análise do seu caso, que nossos advogados fazem antes de qualquer ação."}}],faqEndH:{es:"¿No encontró su pregunta?",en:"Didn’t find your question?",fr:"Vous n’avez pas trouvé votre question ?",pt:"Não encontrou sua pergunta?"},faqEndP:{es:"Haga su ficha gratis y escríbanos con su caso.",en:"Get your free sheet and write to us about your case.",fr:"Faites votre fiche gratuitement et écrivez-nous avec votre cas.",pt:"Faça sua ficha grátis e escreva para nós com o seu caso."}}),Object.assign(a,{fullSheet:{es:"Ver la ficha completa",en:"See the full sheet",fr:"Voir la fiche complète",pt:"Ver a ficha completa"},moreBarrio:{es:"Barrio o sector del inmueble",en:"Neighbourhood of the property",fr:"Quartier du logement",pt:"Bairro do imóvel"},morePlat:{es:"Plataformas donde publica",en:"Platforms where you list",fr:"Plateformes où vous publiez",pt:"Plataformas onde anuncia"},moreUnits:{es:"Qué tipo de inmueble (apartamento, casa…)",en:"Type of property (flat, house…)",fr:"Type de bien (appartement, maison…)",pt:"Tipo de imóvel (apartamento, casa…)"},moreNeed:{es:"Qué necesita resolver, en 2 o 3 líneas",en:"What you need to sort out, in 2 or 3 lines",fr:"Ce que vous devez régler, en 2 ou 3 lignes",pt:"O que precisa resolver, em 2 ou 3 linhas"},moreHas:{es:"Lo que ya tiene",en:"What you already have",fr:"Ce que vous avez déjà",pt:"O que você já tem"},moreEvHost:{es:["RNT vigente","Registro mercantil y RUT","Reglamento del edificio","Póliza de responsabilidad","Código de conducta contra la explotación sexual de menores","Carta de multa o aviso de la plataforma"],en:["Valid RNT" iennes 1581 de 2012 et 2300 de 2023).",pt:"Aceito receber pelo WhatsApp avisos da IHA sobre mudanças nas normas de moradia turística. Posso cancelar quando quiser escrevendo SAIR (Leis colombianas 1581 de 2012 e 2300 de 2023)."},alBtn:{es:"Recibir la alerta por WhatsApp",en:"Get the alert on WhatsApp",fr:"Recevoir l’alerte sur WhatsApp",pt:"Receber o alerta pelo WhatsApp"},alSave:{es:"Guarde nuestro número en sus contactos: así le llegan los avisos.",en:"Save our number in your contacts so the notices reach you.",fr:"Enregistrez notre numéro dans vos contacts pour recevoir les avis.",pt:"Salve nosso número nos seus contatos para receber os avisos."},alMsgH:{es:"ALERTA VIVIENDA TURÍSTICA",en:"SHORT-TERM RENTAL ALERT",fr:"ALERTE LOCATION TOURISTIQUE",pt:"ALERTA MORADIA TURÍSTICA"},alMsgOk:{es:"Acepto recibir avisos sobre cambios en las normas. Para darme de baja escribiré BAJA.",en:"I agree to receive notices about rule changes. To unsubscribe I will write STOP.",fr:"J’accepte de recevoir des avis sur les changements de règles. Pour me désinscrire, j’écrirai STOP.",pt:"Aceito receber avisos sobre mudanças nas normas. Para cancelar, escreverei SAIR."},homeFrT:{es:"¿Le acaban de estafar por transferencia?",en:"Just been scammed through a transfer?",fr:"Vous venez d’être escroqué par virement ?",pt:"Acabou de cair num golpe por transferência?"},homeFrP:{es:"Qué hacer en la primera hora: banco, denuncia y cómo pedir que le devuelvan el dinero.",en:"What to do in the first hour: bank, police report and how to ask for your money back.",fr:"Que faire dans la première heure : banque, plainte et comment demander le remboursement.",pt:"O que fazer na primeira hora: banco, denúncia e como pedir o dinheiro de volta."},homeClT:{es:"Su carta de reclamo, gratis y en 2 minutos",en:"Your complaint letter, free, in 2 minutes",fr:"Votre lettre de réclamation, gratuite, en 2 minutes",pt:"Sua carta de reclamação, grátis e em 2 minutos"},homeClP:{es:"Complete unos datos y copie una carta lista para enviar a la empresa, basada en el Estatuto del Consumidor.",en:"Fill in a few details and copy a letter ready to send to the company, based on Colombia’s Consumer Statute.",fr:"Remplissez quelques champs et copiez une lettre prête à envoyer à l’entreprise, fondée sur le Statut du consommateur colombien.",pt:"Preencha alguns dados e copie uma carta pronta para enviar à empresa, baseada no Estatuto do Consumidor."},clEye:{es:"Herramienta gratuita",en:"Free tool",fr:"Outil gratuit",pt:"Ferramenta gratuita"},clH:{es:"Su carta de reclamo, lista en 2 minutos",en:"Your complaint letter, ready in 2 minutes",fr:"Votre lettre de réclamation, prête en 2 minutes",pt:"Sua carta de reclamação, pronta em 2 minutos"},clLead:{es:"Elija su situación, complete los datos y copie la carta. Sirve para el primer reclamo directo a la empresa, que es el paso que exige la ley antes de acudir a la SIC.",en:"Choose your situation, fill in the details and copy the letter. It is for the first direct complaint to the company, the step the law requires before going to the SIC.",fr:"Choisissez votre situation, remplissez les champs et copiez la lettre. Elle sert à la première réclamation directe à l’entreprise, l’étape que la loi exige avant de saisir la SIC.",pt:"Escolha sua situação, preencha os dados e copie a carta. Serve para a primeira reclamação direta à empresa, o passo que a lei exige antes de recorrer à SIC."},clNote:{es:"Modelo general basado en la Ley 1480 de 2011. Revíselo antes de enviarlo; si su caso es complejo o la empresa no responde, escríbanos.",en:"General template based on Colombian Law 1480 of 2011. Check it before sending; if your case is complex or the company doesn’t answer, write to us.",fr:"Modèle général fondé sur la loi colombienne 1480 de 2011. Relisez-le avant de l’envoyer ; si votre cas est complexe ou si l’entreprise ne répond pas, écrivez-nous.",pt:"Modelo geral baseado na Lei colombiana 1480 de 2011. Revise antes de enviar; se o caso for complexo ou a e por una abogada en 2 días hábiles.","Una revisión al año de su cumplimiento: RNT, anuncio, reglamento de la copropiedad, reporte de huéspedes (TRA y SIRE) y reglas de la casa, con la lista de lo que falta.","Prioridad si surge un problema: una multa, una queja de la copropiedad o una visita de la alcaldía."],en:["Your obligations calendar, with a WhatsApp reminder before each date: RNT renewal (1 January to 31 March) and the FONTUR return every quarter.","An alert when a rule affecting your rental in your city changes, explained in a few lines with what you need to do.","One written question a month about your rental, answered by a lawyer within 2 business days.","A yearly compliance review: RNT, listing, building rules, guest reporting (TRA and SIRE) and house rules, with a list of what’s missing.","Priority if a problem comes up: a fine, a complaint from the building or a visit from the city."],fr:["Votre calendrier des obligations, avec un rappel sur WhatsApp avant chaque date : renouvellement du RNT (1er janvier au 31 mars) et déclaration au FONTUR chaque trimestre.","Une alerte quand une règle qui touche votre logement change dans votre ville, expliquée en quelques lignes avec ce que vous devez faire.","Une question écrite par mois sur votre logement, à laquelle une avocate répond en 2 jours ouvrables.","Une revue annuelle de votre conformité : RNT, annonce, règlement de copropriété, déclaration des voyageurs (TRA et SIRE) et règlement intérieur, avec la liste de ce qui manque.","Priorité en cas de problème : une amende, une plainte de la copropriété ou un contrôle de la mairie."],pt:["Seu calendário de obrigações, com um aviso pelo WhatsApp antes de cada data: renovação do RNT (1º de janeiro a 31 de março) e declaração ao FONTUR a cada trimestre.","Um aviso quando mudar uma norma que afete seu imóvel na sua cidade, explicado em poucas linhas e com o que você precisa fazer.","Uma consulta por escrito por mês sobre seu imóvel, respondida por uma advogada em 2 dias úteis.","Uma revisão por ano do seu cumprimento: RNT, anúncio, regulamento do condomínio, registro de hóspedes (TRA e SIRE) e regras da casa, com a lista do que falta.","Prioridade se surgir um problema: uma multa, uma queixa do condomínio ou uma fiscalização da prefeitura."]},abNotH:{es:"Qué no incluye",en:"What’s not included",fr:"Ce qui n’est pas inclus",pt:"O que não está incluído"},abNot:{es:["Hacer los trámites por usted (RNT, FONTUR, DIAN). Si lo necesita, se los cotizamos aparte.","Las declaraciones de impuestos: son trabajo de su contador.","Defenderlo en un proceso de sanción o en un pleito: se cotiza aparte, antes de empezar."],en:["Doing the filings for you (RNT, FONTUR, DIAN). If you need it, we quote it separately.","Tax returns: that is your accountant’s job.","Defending you in a sanction procedure or a lawsuit: quoted separately, before we start."],fr:["Faire les démarches à votre place (RNT, FONTUR, DIAN). Si vous en avez besoin, nous vous faisons un devis à part.","Les déclarations d’impôts : c’est le travail de votre comptable.","Vous défendre dans une procédure de sanction ou un procès : sur devis à part, avant de commencer."],pt:["Fazer os trâmites por você (RNT, FONTUR, DIAN). Se precisar, orçamos à parte.","As declarações de impostos: são trabalho do seu contador.","Defender você em um processo de sanção ou em uma ação judicial: orçado à parte, antes de começar."]},abPriceH:{es:"Precio",en:"Price",fr:"Prix",pt:"Preço"},abPer:{es:"al mes por vivienda",en:"a month per property",fr:"par mois et par logement",pt:"por mês por imóvel"},abPlans:[{n:{es:"1 vivienda",en:"1 property",fr:"1 logement",pt:"1 imóvel"},p:{es:"$89.000",en:"COP 89,000",fr:"89 000 COP",pt:"COP 89.000"},d:{es:"IVA incluido.",en:"VAT included.",fr:"TVA incluse.",pt:"IVA incluído."}},{n:{es:"De 2 a 5 viviendas",en:"2 to 5 properties",fr:"De 2 à 5 logements",pt:"De 2 a 5 imóveis"},p:{es:"$69.000",en:"COP 69,000",fr:"69 000 COP",pt:"COP 69.000"},d:{es:"IVA incluido. Además: una v isions vos données pour vous répondre (loi colombienne 1581 de 2012).",pt:"As mensagens da via expressa são atendidas com prioridade. Ao nos escrever, você aceita que usemos seus dados para responder (Lei colombiana 1581 de 2012)."},exMsgH:{es:"EXPRESS",en:"EXPRESS",fr:"EXPRESS",pt:"EXPRESS"},exMsgWhere:{es:"Dónde",en:"Where",fr:"Où",pt:"Onde"},exMsgWhat:{es:"Qué pasó",en:"What happened",fr:"Ce qui s’est passé",pt:"O que aconteceu"},exMsgDate:{es:"Fecha",en:"Date",fr:"Date",pt:"Data"},exMsgDl:{es:"Fecha límite",en:"Deadline",fr:"Date limite",pt:"Data-limite"},exPick:{es:"Elija una opción para ver su plan de acción.",en:"Choose an option to see your action plan.",fr:"Choisissez une option pour voir votre plan d’action.",pt:"Escolha uma opção para ver seu plano de ação."},exStaticP:{es:"Elija su situación para ver los pasos, las pruebas y los plazos. En la herramienta, la vía express calcula además su fecha límite.",en:"Choose your situation to see the steps, evidence and deadlines. In the tool, the express track also works out your deadline date.",fr:"Choisissez votre situation pour voir les étapes, les preuves et les délais. Dans l’outil, la voie express calcule aussi votre date limite.",pt:"Escolha sua situação para ver os passos, as provas e os prazos. Na ferramenta, a via expressa também calcula sua data-limite."},exChange:{es:"Cambiar",en:"Change",fr:"Changer",pt:"Mudar"},exOpenApp:{es:"Abrir la vía express",en:"Open the express track",fr:"Ouvrir la voie express",pt:"Abrir a via expressa"}}),Object.assign(a,{exLawH:{es:"Base legal: consumidor, contrato y vía penal",en:"Legal basis: consumer, contract and criminal law",fr:"Base légale : consommation, contrat et voie pénale",pt:"Base legal: consumidor, contrato e via penal"},exLawCons:{es:"Sus derechos como consumidor",en:"Your consumer rights",fr:"Vos droits de consommateur",pt:"Seus direitos como consumidor"},exLawC:{es:"Vía contractual (civil y comercial)",en:"Contract route (civil and commercial)",fr:"Voie contractuelle (civile et commerciale)",pt:"Via contratual (civil e comercial)"},exLawP:{es:"Vía penal",en:"Criminal route",fr:"Voie pénale",pt:"Via penal"},exLawNote:{es:"Resumen general de las normas. Una abogada revisa cómo se aplican a su caso antes de actuar.",en:"General summary of the rules. A lawyer reviews how they apply to your case before acting.",fr:"Résumé général des règles. Une avocate vérifie comment elles s’appliquent à votre cas avant d’agir.",pt:"Resumo geral das normas. Uma advogada revisa como se aplicam ao seu caso antes de agir."},exLaw:{cc1546:{es:"Código Civil, art. 1546: si la otra parte no cumple, usted puede exigir el cumplimiento o la terminación del contrato, en ambos casos con indemnización de perjuicios.",en:"Civil Code, art. 1546: if the other party fails to perform, you can demand performance or termination of the contract, with damages in either case.",fr:"Code civil, art. 1546 : si l’autre partie n’exécute pas, vous pouvez exiger l’exécution ou la résolution du contrat, avec des dommages et intérêts dans les deux cas.",pt:"Código Civil, art. 1546: se a outra parte não cumprir, você pode exigir o cumprimento ou a resolução do contrato, com indenização por perdas e danos em ambos os casos."},cco870:{es:"Código de Comercio, art. 870: en un contrato comercial, si la otra parte incurre en mora, puede pedir la terminación con indemnización o el cumplimiento con indemnización por la demora.",en:"Commercial Code, art. 870: in a commercial contract, if the other party defaults, you can seek termination with damages or performance with damages for the delay.",fr:"Code de commerce, art. 870 : dans un contrat commercial, si l’autre partie est en demeure, vous pouvez demander la résiliation avec indemnisation, ou l’exécution avec indemnisation du retard.",pt:"Código de Comércio, art. 870: num contrato comercial, se a outra parte estiver em mora, você pode pedir a resolução com indenização ou o cumprimento com indenização pela demora."},cc1602:{es:"Código Civil, art. 1602: el contrato es ley para las partes; los términos que usted aceptó obligan también a la plataforma.",en:"Civil Code, art. 1602: a contract is binding law between the parties; the terms you accepted also bind the platform.",fr:"Code civil, art. 1602 : le contrat fait la loi des parties ; les conditions que vous avez acceptées engagent aussi la plateforme.",pt:"Código Civil, art. 1602: o contrato é lei entre as partes; os termos que você aceitou também obrigam a plataforma."},bf:{es:"Código de Comercio, art. 871, y Código Civil, art. 1603: los contratos deben ejecutarse de buena fe y obligan a todo lo que se deriva de su naturaleza.",en:"Commercial Code, art. 871, and Civil Code, art. 1603: contracts must be performed in good faith and bind the parties to everything that follows from their nature.",fr:"Code de commerce, art. 871, et Code civil, art. 1603 : les contrats s’exécutent de bonne foi et obligent à tout ce qui découle de leur nature.",pt:"Código de Comércio, art. 871, e Código Civil, art. 1603: os contratos devem ser executados de boa-fé e obrigam a tudo o que decorre da sua natureza."},dam:{es:"Código Civil, arts. 1613 y 1614: la indemnización cubre el daño emergente (lo que perdió o pagó de más) y el lucro cesante (lo que dejó de ganar).",en:"Civil Code, arts. 1613 and 1614: damages cover actual loss (what you lost or overpaid) and lost profit (what you failed to earn).",fr:"Code civil, art. 1613 et 1614 : l’indemnisation couvre la perte subie (ce que vous avez perdu ou payé en trop) et le gain manqué.",pt:"Código Civil, arts. 1613 e 1614: a indenização cobre o dano emergente (o que perdeu ou pagou a mais) e o lucro cessante (o que deixou de ganhar)."},pr10:{es:"Código Civil, art. 2536: la acción contractual ordinaria prescribe en 10 años.",en:"Civil Code, art. 2536: an ordinary contractual action is time-barred after 10 years.",fr:"Code civil, art. 2536 : l’action contractuelle ordinaire se prescrit par 10 ans.",pt:"Código Civil, art. 2536: a ação contratual ordinária prescreve em 10 anos."},hosp:{es:"Código de Comercio, arts. 1192 y siguientes: el hospedaje que presta una empresa dedicada a esa actividad es un contrato comercial.",en:"Commercial Code, arts. 1192 et seq.: accommodation provided by a business in that trade is a commercial contract.",fr:"Code de commerce, art. 1192 et suivants : l’hébergement fourni par une entreprise dont c’est l’activité est un contrat commercial.",pt:"Código de Comércio, arts. 1192 e seguintes: a hospedagem prestada por uma empresa dedicada a essa atividade é um contrato comercial."},transp:{es:"Código de Comercio, arts. 981 y 982: el transportador se obliga a llevarlo a usted y a su equipaje al destino, en el plazo y por el medio pactados, y a conducirlo sano y salvo.",en:"Commercial Code, arts. 981 and 982: the carrier must take you and your baggage to the destination, within the agreed time and by the agreed means, and carry you safe and sound.",fr:"Code de commerce, art. 981 et 982 : le transporteur doit vous conduire, vous et vos bagages, à destination dans le délai et par le moyen convenus, sain et sauf.",pt:"Código de Comércio, arts. 981 e 982: o transportador deve levar você e sua bagagem ao destino, no prazo e pelo meio combinados, e conduzi-lo são e salvo."},pr2t:{es:"Código de Comercio, art. 993: las acciones del contrato de transporte prescriben en 2 años desde que terminó o debió terminar el viaje.",en:"Commercial Code, art. 993: actions under a contract of carriage are time-barred 2 years after the journey ended or should have ended.",fr:"Code de commerce, art. 993 : les actions nées du contrat de transport se prescrivent par 2 ans à compter de la fin, réelle ou prévue, du voyage.",pt:"Código de Comércio, art. 993: as ações do contrato de transporte prescrevem em 2 anos a partir de quando a viagem terminou ou deveria ter terminado."},mtl:{es:"Convenio de Montreal de 1999 (Ley 701 de 2001), vuelos internacionales: la aerolínea responde por el retraso (art. 19) y por el equipaje (art. 17), con los límites del art. 22; la demanda se presenta dentro de 2 años (art. 35).",en:"Montreal Convention 1999 (Colombian Law 701 of 2001), international flights: the airline is liable for delay (art. 19) and baggage (art. 17), within the limits of art. 22; claims must be filed within 2 years (art. 35).",fr:"Convention de Montréal de 1999 (loi colombienne 701 de 2001), vols internationaux : la compagnie répond du retard (art. 19) et des bagages (art. 17), dans les limites de l’art. 22 ; l’action doit être intentée dans les 2 ans (art. 35).",pt:"Convenção de Montreal de 1999 (Lei colombiana 701 de 2001), voos internacionais: a companhia responde pelo atraso (art. 19) e pela bagagem (art. 17), com os limites do art. 22; a ação deve ser proposta em até 2 anos (art. 35)."},mtl31:{es:"Convenio de Montreal, art. 31: la protesta por escrito se presenta a más tardar 7 días después de recibir el equipaje dañado, o 21 días después de que se lo pongan a disposición si llegó con retraso.",en:"Montreal Convention, art. 31: a written complaint must be made within 7 days of receiving damaged baggage, or within 21 days of it being placed at your disposal if delayed.",fr:"Convention de Montréal, art. 31 : la protestation écrite doit être faite au plus tard 7 jours après réception du bagage endommagé, ou 21 jours après sa mise à disposition en cas de retard.",pt:"Convenção de Montreal, art. 31: o protesto por escrito deve ser feito até 7 dias após receber a bagagem danificada, ou até 21 dias após ser colocada à sua disposição em caso de atraso."},sale:{es:"Código de Comercio, art. 905: en la compraventa, el vendedor se obliga a transmitir la propiedad de lo vendido y usted a pagarlo; si el vendedor no cumple, aplica el art. 870.",en:"Commercial Code, art. 905: in a sale, the seller must transfer ownership of what was sold and you must pay for it; if the seller fails to perform, art. 870 applies.",fr:"Code de commerce, art. 905 : dans la vente, le vendeur s’oblige à transférer la propriété de la chose vendue et vous à la payer ; si le vendeur n’exécute pas, l’art. 870 s’applique.",pt:"Código de Comércio, art. 905: na compra e venda, o vendedor se obriga a transferir a propriedade do que vendeu e você a pagar; se o vendedor não cumprir, aplica-se o art. 870."},bank:{es:"Ley 1328 de 2009, art. 7, lit. q: el banco debe disponer de medios electrónicos y controles idóneos para dar seguridad a las transacciones.",en:"Law 1328 of 2009, art. 7(q): banks must have suitable electronic means and controls to keep transactions secure.",fr:"Loi 1328 de 2009, art. 7, lit. q : la banque doit disposer de moyens électroniques et de contrôles adaptés pour sécuriser les transactions.",pt:"Lei 1328 de 2009, art. 7, alínea q: o banco deve dispor de meios eletrônicos e controles idôneos para dar segurança às transações."},civ:{es:"Un incumplimiento, por sí solo, no es un delito: se reclama por la vía del consumidor o la del contrato. Hay delito cuando hubo engaño desde el principio, por ejemplo un anuncio, una tienda o un vendedor falsos.",en:"A breach of contract is not, by itself, a crime: it is pursued through consumer or contract law. There is a crime when there was deception from the start, for example a fake listing, shop or seller.",fr:"Une inexécution n’est pas, à elle seule, un délit : on agit par la voie de la consommation ou du contrat. Il y a délit quand il y a eu tromperie dès le départ, par exemple une fausse annonce, une fausse boutique ou un faux vendeur.",pt:"Um descumprimento, por si só, não é crime: reclama-se pela via do consumidor ou do contrato. Há crime quando houve engano desde o início, por exemplo um anúncio, uma loja ou um vendedor falsos."},civT:{es:"Un vuelo cancelado o retrasado no es un asunto penal: se reclama a la aerolínea, ante la Superintendencia de Transporte o por la vía del contrato.",en:"A cancelled or delayed flight is not a criminal matter: you claim from the airline, before the Superintendency of Transport or through contract law.",fr:"Un vol annulé ou retardé ne relève pas du pénal : on réclame à la compagnie, devant la Superintendencia de Transporte ou par la voie du contrat.",pt:"Um voo cancelado ou atrasado não é assunto penal: reclama-se à companhia, perante a Superintendência de Transporte ou pela via do contrato."},civP:{es:"Una suspensión de cuenta, una retención de pagos o el retiro de un anuncio son, en principio, asuntos del contrato y no penales.",en:"An account suspension, withheld payouts or a removed listing are, in principle, contract matters, not criminal ones.",fr:"Une suspension de compte, des paiements retenus ou une annonce retirée relèvent en principe du contrat, pas du pénal.",pt:"Uma suspensão de conta, uma retenção de pagamentos ou a retirada de um anúncio são, em princípio, assuntos do contrato e não penais."},cp246:{es:"Código Penal, art. 246, estafa: obtener un provecho ilícito induciendo a otro en error con engaños. Prisión de 32 a 144 meses; si el monto no supera 10 salarios mínimos (unos 17,5 millones de pesos en 2026), de 16 a 36 meses.",en:"Criminal Code, art. 246, fraud (estafa): obtaining an unlawful gain by deceiving another person. 32 to 144 months in prison; 16 to 36 months if the amount is no more than 10 minimum monthly wages (about COP 17.5 million in 2026).",fr:"Code pénal, art. 246, escroquerie (estafa) : obtenir un profit illicite en trompant autrui. Prison de 32 à 144 mois ; de 16 à 36 mois si le montant ne dépasse pas 10 salaires minimums (environ 17,5 millions de pesos en 2026).",pt:"Código Penal, art. 246, estelionato (estafa): obter vantagem ilícita induzindo outra pessoa em erro com enganos. Prisão de 32 a 144 meses; de 16 a 36 meses se o valor não passar de 10 salários mínimos (cerca de 17,5 milhões de pesos em 2026)."},cp269j:{es:"Código Penal, art. 269J, transferencia no consentida de activos: mover dinero ajeno mediante una manipulación informática o un artificio semejante. Prisión de 48 a 120 meses.",en:"Criminal Code, art. 269J, non-consensual transfer of assets: moving someone else’s money through computer manipulation or a similar trick. 48 to 120 months in prison.",fr:"Code pénal, art. 269J, transfert non consenti d’actifs : déplacer l’argent d’autrui par une manipulation informatique ou un artifice semblable. Prison de 48 à 120 mois.",pt:"Código Penal, art. 269J, transferência não consentida de ativos: movimentar dinheiro alheio por manipulação informática ou artifício semelhante. Prisão de 48 a 120 meses."},cp269i:{es:"Código Penal, art. 269I, hurto por medios informáticos: apoderarse de su dinero superando medidas de seguridad o suplantándolo ante el banco. Se castiga con las penas del hurto calificado.",en:"Criminal Code, art. 269I, theft by computer means: taking your money by bypassing security measures or impersonating you to the bank. Punished with the penalties for aggravated theft.",fr:"Code pénal, art. 269I, vol par moyens informatiques : s’emparer de votre argent en contournant des mesures de sécurité ou en se faisant passer pour vous auprès de la banque. Puni des peines du vol qualifié.",pt:"Código Penal, art. 269I, furto por meios informáticos: apoderar-se do seu dinheiro superando medidas de segurança ou se passando por você perante o banco. Punido com as penas do furto qualificado."},cp269a:{es:"Código Penal, art. 269A, acceso abusivo a un sistema informático: entrar a su cuenta sin autorización. Prisión de 48 a 96 meses.",en:"Criminal Code, art. 269A, unauthorised access to a computer system: getting into your account without permission. 48 to 96 months in prison.",fr:"Code pénal, art. 269A, accès abusif à un système informatique : entrer dans votre compte sans autorisation. Prison de 48 à 96 mois.",pt:"Código Penal, art. 269A, acesso abusivo a sistema informático: entrar na sua conta sem autorização. Prisão de 48 a 96 meses."},cp269f:{es:"Código Penal, art. 269F, violación de datos personales: obtener, vender o usar sus datos sin autorización y con provecho. Prisión de 48 a 96 meses.",en:"Criminal Code, art. 269F, personal data violation: obtaining, selling or using your data without authorisation for gain. 48 to 96 months in prison.",fr:"Code pénal, art. 269F, violation de données personnelles : obtenir, vendre ou utiliser vos données sans autorisation et avec profit. Prison de 48 à 96 mois.",pt:"Código Penal, art. 269F, violação de dados pessoais: obter, vender ou usar seus dados sem autorização e com proveito. Prisão de 48 a 96 meses."},cp269g:{es:"Código Penal, art. 269G, suplantación de sitios web: crear páginas o enlaces falsos para capturar datos personales. Prisión de 48 a 96 meses.",en:"Criminal Code, art. 269G, website spoofing: creating fake pages or links to capture personal data. 48 to 96 months in prison.",fr:"Code pénal, art. 269G, usurpation de sites web : créer de fausses pages ou de faux liens pour capter des données personnelles. Prison de 48 à 96 mois.",pt:"Código Penal, art. 269G, falsificação de sites: criar páginas ou links falsos para capturar dados pessoais. Prisão de 48 a 96 meses."},cp239:{es:"Código Penal, art. 239, hurto: apoderarse de una cosa ajena, por ejemplo objetos sacados de su equipaje.",en:"Criminal Code, art. 239, theft: taking someone else’s property, for example items removed from your baggage.",fr:"Code pénal, art. 239, vol : s’emparer du bien d’autrui, par exemple des objets retirés de votre bagage.",pt:"Código Penal, art. 239, furto: apoderar-se de coisa alheia, por exemplo objetos retirados da sua bagagem."},cpPers:{es:"Código Penal, arts. 111 y siguientes (lesiones personales) y art. 210A (acoso sexual): si hubo una agresión o acoso durante el viaje, es un delito.",en:"Criminal Code, arts. 111 et seq. (personal injury) and art. 210A (sexual harassment): an assault or harassment during the ride is a crime.",fr:"Code pénal, art. 111 et suivants (coups et blessures) et art. 210A (harcèlement sexuel) : une agression ou un harcèlement pendant le trajet est un délit.",pt:"Código Penal, arts. 111 e seguintes (lesões corporais) e art. 210A (assédio sexual): uma agressão ou assédio durante a corrida é crime."},quer:{es:"Ley 906 de 2004, arts. 73, 74 y 522: la estafa y el hurto de hasta 150 salarios mínimos (unos 262 millones de pesos en 2026) requieren querella de la víctima, dentro de los 6 meses siguientes al hecho, y antes se intenta una conciliación.",en:"Law 906 of 2004, arts. 73, 74 and 522: fraud and theft of up to 150 minimum monthly wages (about COP 262 million in 2026) require a complaint by the victim (querella) within 6 months of the events, preceded by an attempt at conciliation.",fr:"Loi 906 de 2004, art. 73, 74 et 522 : l’escroquerie et le vol jusqu’à 150 salaires minimums (environ 262 millions de pesos en 2026) exigent une plainte de la victime (querella) dans les 6 mois suivant les faits, précédée d’une tentative de conciliation.",pt:"Lei 906 de 2004, arts. 73, 74 e 522: o estelionato e o furto de até 150 salários mínimos (cerca de 262 milhões de pesos em 2026) exigem queixa da vítima (querella) dentro de 6 meses após o fato, precedida de uma tentativa de conciliação."},den:{es:"Dónde denunciar: Fiscalía General de la Nación o CAI Virtual de la Policía Nacional. Guarde el número de la denuncia: el banco o la plataforma pueden pedírselo.",en:"Where to report: the Attorney General’s Office (Fiscalía) or the National Police CAI Virtual. Keep the report number: the bank or platform may ask for it.",fr:"Où porter plainte : Fiscalía General de la Nación ou CAI Virtual de la Police nationale. Gardez le numéro de plainte : la banque ou la plateforme peuvent vous le demander.",pt:"Onde denunciar: Fiscalía General de la Nación ou CAI Virtual da Polícia Nacional. Guarde o número da denúncia: o banco ou a plataforma podem pedi-lo."}},exLawMap:{"a-cancelacion":{c:["hosp","cco870","dam"],p:["civ","cp246","quer"]},"a-anuncio":{c:["hosp","cco870","dam"],p:["cp246","cp269g","quer","den"]},"a-cobros":{c:["cco870","bf","dam"],p:["civ"]},"t-cancelacion":{c:["transp","mtl","dam","pr2t"],p:["civT"]},"t-retraso":{c:["transp","mtl","dam","pr2t"],p:["civT"]},"t-equipaje":{c:["transp","mtl31","mtl","pr2t"],p:["cp239","den"]},"t-app":{c:["transp","dam"],p:["cpPers","cp239","den"]},"o-entrega":{c:["sale","cco870","dam"],p:["civ","cp246","cp269g","quer"]},"p-marketplace":{c:["sale","cco870"],p:["cp246","cp269g","quer","den"]},"o-retracto":{c:["cco870"],p:["civ"]},"o-evento":{c:["cc1546","cco870","dam"],p:["civ","cp246","quer"]},"o-transferencia":{c:["bank","dam"],p:["cp246","cp269j","cp269i","cp269g","quer","den"]},"o-fraude":{c:["bank"],p:["cp269i","cp269j","cp269a","cp269f","cp269g","den"]},"p-cuenta":{c:["cc1602","bf","cco870","pr10"],p:["civP","cp269a","cp269f"]},"p-pagos":{c:["cc1602","cco870","dam","pr10"],p:["civP"]},"p-anuncio":{c:["cc1602","bf","cco870"],p:["civP"]}}}),a.exFrom.tx={es:"Fecha de la transferencia",en:"Date of the transfer",fr:"Date du virement",pt:"Data da transferência"},a.exRes.quer={es:"Si fue una estafa de hasta 150 salarios mínimos: querella a más tardar el {d}.",en:"If it was fraud of up to 150 minimum wages: file the complaint (querella) by {d} at the latest.",fr:"S’il s’agit d’une escroquerie jusqu’à 150 salaires minimums : plainte (querella) au plus tard le {d}.",pt:"Se foi estelionato de até 150 salários mínimos: queixa (querella) até {d}, no máximo."},function(){const e=a.exTypes;e.find((e=>"aloj"===e.k)).sits.splice(1,0,"a-desalojo");const o=e.find((e=>"anf"===e.k));o.sits.unshift("h-huesped"),o.ex={es:"Un huésped que no se va, su cuenta, sus pagos o su anuncio",en:"A guest who won’t leave, your account, payouts or listing",fr:"Un voyageur qui ne part pas, votre compte, vos paiements ou votre annonce",pt:"Um hóspede que não sai, sua conta, seus pagamentos ou seu anúncio"},a.exLawPol={es:"Policía y domicilio",en:"Police and your home",fr:"Police et domicile",pt:"Polícia e domicílio"},Object.assign(a.exLaw,{hosp79:{es:"Ley 300 de 1996, art. 79 (modificado por la Ley 2068 de 2020): el hospedaje es un contrato de adhesión para alojar a una persona por menos de 30 días a cambio de un precio.",en:"Law 300 of 1996, art. 79 (amended by Law 2068 of 2020): accommodation is a standard-form contract to lodge a person for less than 30 days for a price.",fr:"Loi 300 de 1996, art. 79 (modifié par la loi 2068 de 2020) : l’hébergement est un contrat d’adhésion pour loger une personne moins de 30 jours contre un prix.",pt:"Lei 300 de 1996, art. 79 (modificado pela Lei 2068 de 2020): a hospedagem é um contrato de adesão para alojar uma pessoa por menos de 30 dias mediante um preço."},cco1197:{es:"Código de Comercio, art. 1197: el hospedaje termina al vencer el plazo, sin plazo con aviso de 12 horas, por falta de pago, por infracción del reglamento o por otra causa pactada expresamente.",en:"Commercial Code, art. 1197: accommodation ends when the term expires, with 12 hours’ notice if there is no term, for non-payment, breach of the rules or another cause expressly agreed.",fr:"Code de commerce, art. 1197 : l’hébergement prend fin à l’échéance, sans terme avec un préavis de 12 heures, pour non-paiement, infraction au règlement ou autre cause expressément convenue.",pt:"Código de Comércio, art. 1197: a hospedagem termina ao vencer o prazo, sem prazo com aviso de 12 horas, por falta de pagamento, infração do regulamento ou outra causa pactuada expressamente."},cco1198:{es:"Código de Comercio, art. 1198: si el prestador termina el contrato, hace un inventario de las pertenencias del huésped ante testigos y puede retirarlas del alojamiento.",en:"Commercial Code, art. 1198: if the provider ends the contract, it makes an inventory of the guest’s belongings in front of witnesses and may remove them.",fr:"Code de commerce, art. 1198 : si le prestataire met fin au contrat, il dresse un inventaire des affaires du voyageur devant témoins et peut les retirer du logement.",pt:"Código de Comércio, art. 1198: se o prestador encerrar o contrato, faz um inventário dos pertences do hóspede diante de testemunhas e pode retirá-los."},cco1199:{es:"Código de Comercio, art. 1199: si el huésped no paga, el prestador puede hacer rematar sus bienes por un martillo autorizado y pagarse con el producto; el sobrante queda a disposición del huésped.",en:"Commercial Code, art. 1199: if the guest doesn’t pay, the provider may have the guest’s belongings auctioned by an authorised auctioneer and be paid from the proceeds; any surplus is held for the guest.",fr:"Code de commerce, art. 1199 : si le voyageur ne paie pas, le prestataire peut faire vendre ses biens aux enchères par un commissaire-priseur agréé et se payer sur le produit ; le surplus reste à la disposition du voyageur.",pt:"Código de Comércio, art. 1199: se o hóspede não pagar, o prestador pode leiloar os bens dele por um leiloeiro autorizado e se pagar com o produto; a sobra fica à disposição do hóspede."},l300_66:{es:"Ley 300 de 1996, art. 66: si no puede prolongar la estadía, el prestador suspende el servicio y facilita que el huésped retire sus pertenencias o las deja en un depósito seguro.",en:"Law 300 of 1996, art. 66: if the stay cannot be extended, the provider suspends the service and lets the guest collect their belongings or places them in safe storage.",fr:"Loi 300 de 1996, art. 66 : si le séjour ne peut être prolongé, le prestataire suspend le service et permet au voyageur de récupérer ses affaires, ou les place dans un dépôt sûr.",pt:"Lei 300 de 1996, art. 66: se não puder prolongar a estadia, o prestador suspende o serviço e permite que o hóspede retire seus pertences, ou os deixa num depósito seguro."},const28:{es:"Constitución, art. 28, y Corte Constitucional, C-519 de 2007: la habitación de hotel o el alojamiento temporal es domicilio; solo puede registrarse con orden escrita de autoridad judicial competente.",en:"Constitution, art. 28, and Constitutional Court, C-519 of 2007: a hotel room or temporary accommodation is a home; it can only be searched with a written order from a competent judicial authority.",fr:"Constitution, art. 28, et Cour constitutionnelle, C-519 de 2007 : la chambre d’hôtel ou le logement temporaire est un domicile ; il ne peut être perquisitionné que sur ordre écrit d’une autorité judiciaire compétente.",pt:"Constituição, art. 28, e Corte Constitucional, C-519 de 2007: o quarto de hotel ou a hospedagem temporária é domicílio; só pode ser revistado com ordem escrita de autoridade judicial competente."},pol163:{es:"Ley 1801 de 2016, art. 163: la policía solo entra a un inmueble sin orden escrita por imperiosa necesidad: auxiliar a quien lo pide, un incendio o inundación, un animal peligroso, una intrusión en la casa de un ausente, agresiones desde adentro o pólvora.",en:"Law 1801 of 2016, art. 163: the police may only enter a property without a written order in cases of pressing necessity: helping someone who asks, a fire or flood, a dangerous animal, an intrusion into an absent person’s home, attacks from inside or fireworks.",fr:"Loi 1801 de 2016, art. 163 : la police n’entre sans ordre écrit qu’en cas de nécessité impérieuse : secourir quelqu’un qui appelle, un incendie ou une inondation, un animal dangereux, une intrusion chez un absent, des agressions depuis l’intérieur ou de la pyrotechnie.",pt:"Lei 1801 de 2016, art. 163: a polícia só entra num imóvel sem ordem escrita por necessidade imperiosa: socorrer quem pede, incêndio ou inundação, animal perigoso, invasão da casa de um ausente, agressões de dentro ou fogos de artifício."},pol80:{es:"Ley 1801 de 2016, art. 80: la protección de la policía sobre la tenencia de un inmueble es provisional y no decide derechos, que resuelve un juez; caduca a los 4 meses.",en:"Law 1801 of 2016, art. 80: police protection of occupation of a property is provisional and does not decide rights, which a judge resolves; it expires after 4 months.",fr:"Loi 1801 de 2016, art. 80 : la protection policière de l’occupation d’un logement est provisoire et ne tranche pas les droits, qui relèvent d’un juge ; elle expire au bout de 4 mois.",pt:"Lei 1801 de 2016, art. 80: a proteção policial da posse de um imóvel é provisória e não decide direitos, que cabem a um juiz; caduca em 4 meses."},pol81:{es:"Ley 1801 de 2016, arts. 77 y 81: la policía puede actuar contra quien ocupa ilegalmente un inmueble, de forma preventiva dentro de las 48 horas siguientes a la ocupación.",en:"Law 1801 of 2016, arts. 77 and 81: the police can act against someone unlawfully occupying a property, preventively within 48 hours of the occupation.",fr:"Loi 1801 de 2016, art. 77 et 81 : la police peut agir contre l’occupant illégal d’un logement, à titre préventif dans les 48 heures suivant l’occupation.",pt:"Lei 1801 de 2016, arts. 77 e 81: a polícia pode agir contra quem ocupa ilegalmente um imóvel, de forma preventiva nas 48 horas seguintes à ocupação."},pol21:{es:"Ley 1801 de 2016, art. 21: todo procedimiento de policía puede grabarse; nadie puede impedirlo sin una restricción legal expresa.",en:"Law 1801 of 2016, art. 21: any police procedure may be recorded; no one may prevent it without an express legal restriction.",fr:"Loi 1801 de 2016, art. 21 : toute intervention de police peut être filmée ; nul ne peut l’empêcher sans restriction légale expresse.",pt:"Lei 1801 de 2016, art. 21: todo procedimento policial pode ser gravado; ninguém pode impedir sem uma restrição legal expressa."},pol33:{es:"Ley 1801 de 2016, art. 33: el ruido de fiestas o reuniones que afecte al vecindario es contrario a la convivencia; la policía puede intervenir.",en:"Law 1801 of 2016, art. 33: noise from parties or gatherings that disturbs the neighbourhood breaches the coexistence rules; the police can intervene.",fr:"Loi 1801 de 2016, art. 33 : le bruit de fêtes ou de réunions qui gêne le voisinage est contraire à la tranquillité publique ; la police peut intervenir.",pt:"Lei 1801 de 2016, art. 33: o barulho de festas ou reuniões que afeta a vizinhança é contrário à convivência; a polícia pode intervir."},cp189:{es:"Código Penal, art. 189, violación de habitación ajena: entrar sin permiso al alojamiento de otro, o escuchar, grabar o filmar su vida privada adentro. Multa; si lo hace un servidor público, también pérdida del empleo (art. 190).",en:"Criminal Code, art. 189, violation of another’s dwelling: entering someone’s accommodation without permission, or listening to, recording or filming their private life inside. A fine; if committed by a public official, also loss of office (art. 190).",fr:"Code pénal, art. 189, violation de domicile : entrer sans permission dans le logement d’autrui, ou écouter, enregistrer ou filmer sa vie privée à l’intérieur. Amende ; si l’auteur est un agent public, aussi perte de l’emploi (art. 190).",pt:"Código Penal, art. 189, violação de domicílio: entrar sem permissão na hospedagem de outra pessoa, ou escutar, gravar ou filmar sua vida privada lá dentro. Multa; se for servidor público, também perda do cargo (art. 190)."},cp182:{es:"Código Penal, art. 182, constreñimiento ilegal: obligar a otro a hacer, tolerar u omitir algo. Prisión de 16 a 36 meses.",en:"Criminal Code, art. 182, unlawful coercion: forcing someone to do, tolerate or refrain from something. 16 to 36 months in prison.",fr:"Code pénal, art. 182, contrainte illégale : forcer autrui à faire, tolérer ou s’abstenir de quelque chose. Prison de 16 à 36 mois.",pt:"Código Penal, art. 182, constrangimento ilegal: obrigar alguém a fazer, tolerar ou deixar de fazer algo. Prisão de 16 a 36 meses."},cp134a:{es:"Código Penal, art. 134A, actos de discriminación: impedir o restringir los derechos de una persona por su raza, nacionalidad, sexo, orientación sexual, discapacidad u otra razón de discriminación. Prisión de 12 a 36 meses y multa de 10 a 15 salarios mínimos.",en:"Criminal Code, art. 134A, acts of discrimination: preventing or restricting a person’s rights because of race, nationality, sex, sexual orientation, disability or other grounds. 12 to 36 months in prison and a fine of 10 to 15 minimum wages.",fr:"Code pénal, art. 134A, actes de discrimination : empêcher ou restreindre les droits d’une personne en raison de sa race, nationalité, sexe, orientation sexuelle, handicap ou d’un autre motif. Prison de 12 à 36 mois et amende de 10 à 15 salaires minimums.",pt:"Código Penal, art. 134A, atos de discriminação: impedir ou restringir os direitos de uma pessoa por raça, nacionalidade, sexo, orientação sexual, deficiência ou outro motivo. Prisão de 12 a 36 meses e multa de 10 a 15 salários mínimos."}}),a.exLawMap["a-desalojo"]={c:["hosp79","cco1197","cco1198","cco870","dam"],pol:["const28","pol163","pol80","pol21"],p:["cp182","cp189","cp134a","den"]},a.exLawMap["h-huesped"]={c:["hosp79","cco1197","cco1198","cco1199","l300_66"],pol:["pol81","pol80","pol33","const28"],p:["cp189","cp182","cp134a"]};for(const e of["guideS","guideGo"])for(const o of["es","en","fr","pt"])a[e]&&a[e][o]&&(a[e][o]=a[e][o].replace("41","43"))}(),a.exLawRO={es:"Sus derechos y obligaciones",en:"Your rights and obligations",fr:"Vos droits et obligations",pt:"Seus direitos e obrigações"},function(){const e=a.exTypes,o=a=>e.find((e=>e.k===a));a.exTypes=[{k:"app",i:"monitor",n:{es:"Apps de alojamiento",en:"Accommodation apps",fr:"Applis d’hébergement",pt:"Apps de hospedagem"},ex:{es:"Por ejemplo Airbnb o Booking, estadías de menos de 30 días",en:"For example Airbnb or Booking, stays under 30 days",fr:"Par exemple Airbnb ou Booking, séjours de moins de 30 jours",pt:"Por exemplo Airbnb ou Booking, estadias de menos de 30 dias"},note:{es:"¿Reservó un hotel por una app? Las reglas del hotel también aplican: vea «Hoteles y hostales».",en:"Booked a hotel through an app? Hotel rules apply too: see “Hotels and hostels”.",fr:"Vous avez réservé un hôtel via une appli ? Les règles de l’hôtel s’appliquent aussi : voyez « Hôtels et auberges ».",pt:"Reservou um hotel por um app? As regras do hotel também se aplicam: veja “Hotéis e hostels”."},sits:["a-cancelacion","a-anuncio","a-desalojo","a-cobros","r-larga"],law:{c:["art53","cc1602"]}},{k:"hotel",i:"building",n:{es:"Hoteles y hostales",en:"Hotels and hostels",fr:"Hôtels et auberges",pt:"Hotéis e hostels"},ex:{es:"Reserva directa con el hotel o en la recepción",en:"Booked directly with the hotel or at reception",fr:"Réservation directe auprès de l’hôtel ou à la réception",pt:"Reserva direta com o hotel ou na recepção"},note:{es:"¿Reservó este hotel por una app? La plataforma también debe ayudarle: vea «Apps de alojamiento».",en:"Booked this hotel through an app? The platform must help you too: see “Accommodation apps”.",fr:"Vous avez réservé cet hôtel via une appli ? La plateforme doit aussi vous aider : voyez « Applis d’hébergement ».",pt:"Reservou este hotel por um app? A plataforma também deve ajudar: veja “Apps de hospedagem”."},sits:["a-sobreventa","a-cancelacion","a-dano","a-cobros"],law:{c:["cco1195","cco1196"]}},{k:"arriendo",i:"file",n:{es:"Arriendo por meses",en:"Monthly rentals",fr:"Location au mois",pt:"Aluguel mensal"},ex:{es:"Contrato de 30 días o más, con el propietario o una inmobiliaria",en:"Lease of 30 days or more, with the owner or a letting agency",fr:"Bail de 30 jours ou plus, avec le propriétaire ou une agence",pt:"Contrato de 30 dias ou mais, com o proprietário ou uma imobiliária"},sits:["r-desalojo","o-arriendo","r-inmobiliaria","r-larga"]},o("vuelo"),o("movil"),o("compras"),o("eventos"),o("pagos"),o("anf")],Object.assign(a.exLaw,{art53:{es:"Ley 1480 de 2011, art. 53: la plataforma debe tener identificado a quien ofrece el alojamiento (nombre, documento, dirección y teléfono) y darle esos datos para que pueda reclamar.",en:"Law 1480 of 2011, art. 53: the platform must have the provider identified (name, ID, address and phone) and give you those details so you can claim.",fr:"Loi 1480 de 2011, art. 53 : la plateforme doit avoir identifié celui qui propose le logement (nom, pièce d’identité, adresse et téléphone) et vous transmettre ces données pour réclamer.",pt:"Lei 1480 de 2011, art. 53: a plataforma deve ter identificado quem oferece a hospedagem (nome, documento, endereço e telefone) e dar esses dados para você reclamar."},cco1195:{es:"Código de Comercio, art. 1195: puede entregar dinero y objetos de valor al hotel, con recibo, para que los custodie; solo puede negarse si son de valor considerable o muy voluminosos.",en:"Commercial Code, art. 1195: you can hand money and valuables to the hotel, against a receipt, for safekeeping; it may only refuse if they are of considerable value or very bulky.",fr:"Code de commerce, art. 1195 : vous pouvez confier argent et objets de valeur à l’hôtel, contre reçu, pour qu’il les garde ; il ne peut refuser que s’ils sont de grande valeur ou très volumineux.",pt:"Código de Comércio, art. 1195: você pode entregar dinheiro e objetos de valor ao hotel, com recibo, para custódia; ele só pode recusar se forem de valor considerável ou muito volumosos."},cco1196:{es:"Código de Comercio, art. 1196: el hotel responde como depositario; no responde si la pérdida o el daño se deben a culpa grave del huésped, de sus acompañantes o visitantes, o a la naturaleza o vicio de la cosa.",en:"Commercial Code, art. 1196: the hotel is liable as a depositary; it is not liable if the loss or damage is due to the gross fault of the guest, companions or visitors, or to the nature or defect of the item.",fr:"Code de commerce, art. 1196 : l’hôtel répond comme un dépositaire ; il n’en répond pas si la perte ou le dommage est dû à une faute lourde du client, de ses accompagnants ou visiteurs, ou à la nature ou au vice de la chose.",pt:"Código de Comércio, art. 1196: o hotel responde como depositário; não responde se a perda ou o dano se devem a culpa grave do hóspede, acompanhantes ou visitantes, ou à natureza ou vício da coisa."},cgp384:{es:"Código General del Proceso, art. 384: la restitución de un inmueble arrendado la ordena un juez; si la demanda es por falta de pago, el arrendatario debe consignar lo adeudado y los cánones que se causen para ser oído.",en:"General Code of Procedure, art. 384: repossession of a rented property is ordered by a judge; if the claim is for non-payment, the tenant must deposit what is owed and the ongoing rent to be heard.",fr:"Code général du procès, art. 384 : la restitution d’un logement loué est ordonnée par un juge ; si la demande porte sur des impayés, le locataire doit consigner les sommes dues et les loyers en cours pour être entendu.",pt:"Código Geral do Processo, art. 384: a restituição de um imóvel alugado é ordenada por um juiz; se a ação for por falta de pagamento, o locatário deve depositar o devido e os aluguéis em curso para ser ouvido."},l820_16:{es:"Ley 820 de 2003, art. 16: no se pueden exigir depósitos en dinero ni otras garantías reales para asegurar el pago, ni disfrazarlos en otros documentos.",en:"Law 820 of 2003, art. 16: cash deposits or other real guarantees cannot be required to secure payment, nor disguised in other documents.",fr:"Loi 820 de 2003, art. 16 : aucune caution en espèces ni autre garantie réelle ne peut être exigée pour assurer le paiement, ni être déguisée dans d’autres documents.",pt:"Lei 820 de 2003, art. 16: não se podem exigir depósitos em dinheiro nem outras garantias reais para assegurar o pagamento, nem disfarçá-los em outros documentos."},l820_20:{es:"Ley 820 de 2003, art. 20: el canon sube como máximo una vez cada 12 meses y hasta el IPC del año anterior, con aviso por correo certificado; sin aviso, el aumento no se le puede cobrar.",en:"Law 820 of 2003, art. 20: rent can rise at most once every 12 months, up to the previous year’s CPI, with notice by certified mail; without notice, the increase cannot be enforced against you.",fr:"Loi 820 de 2003, art. 20 : le loyer augmente au plus une fois tous les 12 mois, dans la limite de l’inflation de l’année précédente, avec avis par courrier certifié ; sans avis, la hausse ne vous est pas opposable.",pt:"Lei 820 de 2003, art. 20: o aluguel sobe no máximo uma vez a cada 12 meses e até o IPC do ano anterior, com aviso por correio certificado; sem aviso, o aumento não pode ser cobrado."},l820_22:{es:"Ley 820 de 2003, art. 22: el arrendador termina el contrato por las causales de ley; sin falta del arrendatario, en las prórrogas, con preaviso escrito de 3 meses e indemnización de 3 cánones (num. 7).",en:"Law 820 of 2003, art. 22: the landlord ends the lease on statutory grounds; without fault by the tenant, during renewals, with 3 months’ written notice and compensation of 3 months’ rent (para. 7).",fr:"Loi 820 de 2003, art. 22 : le propriétaire résilie pour les causes légales ; sans faute du locataire, pendant les reconductions, avec un préavis écrit de 3 mois et une indemnité de 3 mois de loyer (num. 7).",pt:"Lei 820 de 2003, art. 22: o locador encerra o contrato pelas causas legais; sem falta do locatário, nas prorrogações, com aviso escrito de 3 meses e indenização de 3 aluguéis (num. 7)."},l820_24:{es:"Ley 820 de 2003, art. 24: el arrendatario puede terminar el contrato si el arrendador le suspende los servicios a propósito (num. 1), o al vencimiento con preaviso de 3 meses sin indemnización (num. 5).",en:"Law 820 of 2003, art. 24: the tenant can end the lease if the landlord deliberately cuts off utilities (para. 1), or at expiry with 3 months’ notice and no compensation (para. 5).",fr:"Loi 820 de 2003, art. 24 : le locataire peut résilier si le propriétaire coupe volontairement les services (num. 1), ou à l’échéance avec un préavis de 3 mois sans indemnité (num. 5).",pt:"Lei 820 de 2003, art. 24: o locatário pode encerrar o contrato se o locador suspender os serviços de propósito (num. 1), ou no vencimento com aviso de 3 meses sem indenização (num. 5)."},l820_28:{es:"Ley 820 de 2003, art. 28: quien se dedica a arrendar o intermediar vivienda urbana en municipios de más de 15.000 habitantes debe estar matriculado ante la autoridad local.",en:"Law 820 of 2003, art. 28: anyone in the business of renting out or brokering urban housing in municipalities over 15,000 inhabitants must register with the local authority.",fr:"Loi 820 de 2003, art. 28 : quiconque loue ou intermédie des logements urbains dans une commune de plus de 15 000 habitants doit être immatriculé auprès de l’autorité locale.",pt:"Lei 820 de 2003, art. 28: quem se dedica a alugar ou intermediar moradia urbana em municípios de mais de 15 mil habitantes deve estar registrado na autoridade local."},l820_33:{es:"Ley 820 de 2003, arts. 33 y 34: la alcaldía vigila a arrendadores e inmobiliarias, atiende quejas y puede imponer multas de hasta 100 salarios mínimos y suspender o cancelar la matrícula.",en:"Law 820 of 2003, arts. 33 and 34: the city hall supervises landlords and agencies, handles complaints and can impose fines of up to 100 minimum wages and suspend or cancel registration.",fr:"Loi 820 de 2003, art. 33 et 34 : la mairie contrôle propriétaires et agences, traite les plaintes et peut infliger des amendes jusqu’à 100 salaires minimums et suspendre ou annuler l’immatriculation.",pt:"Lei 820 de 2003, arts. 33 e 34: a prefeitura fiscaliza locadores e imobiliárias, atende queixas e pode aplicar multas de até 100 salários mínimos e suspender ou cancelar o registro."},pol77t:{es:"Ley 1801 de 2016, arts. 77 y 81: impedir el ingreso o el uso de un inmueble a quien tiene su tenencia es contrario a la convivencia; la policía puede actuar de forma preventiva dentro de las 48 horas.",en:"Law 1801 of 2016, arts. 77 and 81: preventing someone who lawfully occupies a property from entering or using it breaches the coexistence rules; the police can act preventively within 48 hours.",fr:"Loi 1801 de 2016, art. 77 et 81 : empêcher l’occupant légitime d’entrer ou d’utiliser le logement est contraire à la tranquillité publique ; la police peut agir à titre préventif dans les 48 heures.",pt:"Lei 1801 de 2016, arts. 77 e 81: impedir a entrada ou o uso do imóvel a quem tem sua posse é contrário à convivência; a polícia pode agir de forma preventiva nas 48 horas."}}),Object.assign(a.exLawMap,{"a-sobreventa":{c:["hosp","cco870","dam"],p:["civ"]},"a-dano":{c:["hosp","dam"],p:["cp239","den"]},"r-desalojo":{c:["l820_22","l820_24","cgp384","dam"],pol:["pol77t","pol21"],p:["cp189","cp182","den"]},"o-arriendo":{c:["l820_16","l820_20","l820_24","cgp384"],p:["civ","cp246","quer"]},"r-inmobiliaria":{c:["l820_28","l820_33","l820_16","pr10"],p:["civ","cp246","quer"]},"r-larga":{c:["hosp79","l820_16","cgp384","art53"],p:["civ"]}});for(const e of["guideS","guideGo"])for(const o of["es","en","fr","pt"])a[e]&&a[e][o]&&(a[e][o]=a[e][o].replace("43","47"))}(),Object.assign(a.exLaw,{pol77t:{es:"Ley 1801 de 2016, arts. 77 (num. 5) y 79, y Código Civil, art. 775: impedir el ingreso o el uso del inmueble a quien tiene su tenencia es contrario a la convivencia; el arrendatario, como mero tenedor, puede pedir al inspector que le restituya la tenencia (Corte Constitucional, T-164 de 2024).",en:"Law 1801 of 2016, arts. 77(5) and 79, and Civil Code, art. 775: preventing a lawful holder from entering or using a property breaches the coexistence rules; the tenant, as a holder, can ask the inspector to restore occupation (Constitutional Court, T-164 of 2024).",fr:"Loi 1801 de 2016, art. 77 (num. 5) et 79, et Code civil, art. 775 : empêcher le détenteur légitime d’entrer ou d’utiliser le logement est contraire à la tranquillité publique ; le locataire, en tant que détenteur, peut demander à l’inspecteur de lui rendre l’accès (Cour constitutionnelle, T-164 de 2024).",pt:"Lei 1801 de 2016, arts. 77 (num. 5) e 79, e Código Civil, art. 775: impedir a entrada ou o uso do imóvel a quem tem sua posse é contrário à convivência; o locatário, como mero detentor, pode pedir ao inspetor a restituição (Corte Constitucional, T-164 de 2024)."},l820_2:{es:"Ley 820 de 2003, art. 2: el arrendamiento de vivienda urbana es el contrato por el que una parte concede el goce de un inmueble urbano destinado a vivienda y la otra paga un precio.",en:"Law 820 of 2003, art. 2: an urban housing lease is a contract by which one party grants the use of an urban property intended as a home and the other pays a price.",fr:"Loi 820 de 2003, art. 2 : le bail d’habitation urbain est le contrat par lequel une partie accorde la jouissance d’un logement urbain et l’autre paie un prix.",pt:"Lei 820 de 2003, art. 2: o aluguel de moradia urbana é o contrato pelo qual uma parte concede o uso de um imóvel urbano destinado a moradia e a outra paga um preço."},cc1618:{es:"Código Civil, art. 1618: conocida claramente la intención de las partes, se está a ella más que a lo literal de las palabras; el nombre que use la plataforma no decide el tipo de contrato.",en:"Civil Code, art. 1618: once the parties’ intention is clear, it prevails over the literal wording; the label the platform uses does not decide the type of contract.",fr:"Code civil, art. 1618 : une fois l’intention des parties clairement établie, elle prime sur la lettre ; le nom employé par la plateforme ne décide pas du type de contrat.",pt:"Código Civil, art. 1618: conhecida claramente a intenção das partes, ela prevalece sobre a letra; o nome usado pela plataforma não decide o tipo de contrato."}}),a.exLawMap["r-desalojo"].pol=["pol77t","pol80","pol21"],a.exLawMap["r-larga"].c=["hosp79","l820_2","l820_16","cgp384","cc1618","art53"],function(){Object.assign(a.exLaw,{quer:{es:"Ley 906 de 2004, arts. 73 y 74: la estafa y el hurto simple de hasta 150 salarios mínimos (unos 262 millones de pesos en 2026) son querellables: la víctima presenta querella dentro de los 6 meses siguientes al hecho, salvo excepciones como la flagrancia. Los delitos informáticos (arts. 269A a 269J) y las estafas mayores se investigan de oficio: basta con denunciar.",en:"Law 906 of 2004, arts. 73 and 74: fraud and simple theft of up to 150 minimum wages (about COP 262 million in 2026) require a complaint by the victim (querella) within 6 months of the events, with exceptions such as being caught in the act. Computer crimes (arts. 269A to 269J) and larger frauds are prosecuted ex officio: a report is enough.",fr:"Loi 906 de 2004, art. 73 et 74 : l’escroquerie et le vol simple jusqu’à 150 salaires minimums (environ 262 millions de pesos en 2026) exigent une plainte de la victime (querella) dans les 6 mois, sauf exceptions comme le flagrant délit. Les délits informatiques (art. 269A à 269J) et les escroqueries plus importantes sont poursuivis d’office : un simple signalement suffit.",pt:"Lei 906 de 2004, arts. 73 e 74: o estelionato e o furto simples de até 150 salários mínimos (cerca de 262 milhões de pesos em 2026) exigem queixa da vítima (querella) em até 6 meses, salvo exceções como o flagrante. Os crimes informáticos (arts. 269A a 269J) e os estelionatos maiores são investigados de ofício: basta denunciar."},cpPers:{es:"Código Penal, arts. 111 y siguientes (lesiones personales), 206 (acto sexual violento) y 226 (injuria por vías de hecho): una agresión física o sexual durante el viaje es un delito. El acoso sexual del art. 210A exige una relación de superioridad o de autoridad.",en:"Criminal Code, arts. 111 et seq. (personal injury), 206 (violent sexual act) and 226 (assault by physical insult): a physical or sexual assault during the ride is a crime. Sexual harassment under art. 210A requires a relationship of superiority or authority.",fr:"Code pénal, art. 111 et suivants (coups et blessures), 206 (acte sexuel violent) et 226 (injure par voie de fait) : une agression physique ou sexuelle pendant le trajet est un délit. Le harcèlement sexuel de l’art. 210A suppose un rapport de supériorité ou d’autorité.",pt:"Código Penal, arts. 111 e seguintes (lesões corporais), 206 (ato sexual violento) e 226 (injúria por vias de fato): uma agressão física ou sexual durante a corrida é crime. O assédio sexual do art. 210A exige uma relação de superioridade ou autoridade."},l1480_58:{es:"Ley 1480 de 2011, art. 58, num. 3: la demanda ante la SIC se presenta dentro del año siguiente al fin de la garantía, al fin del contrato o, en los demás casos, a que usted conoció los hechos.",en:"Law 1480 of 2011, art. 58(3): a claim before the SIC must be filed within one year of the end of the guarantee, the end of the contract or, in other cases, of when you learned of the facts.",fr:"Loi 1480 de 2011, art. 58, num. 3 : l’action devant la SIC doit être engagée dans l’année qui suit la fin de la garantie, la fin du contrat ou, dans les autres cas, le jour où vous avez eu connaissance des faits.",pt:"Lei 1480 de 2011, art. 58, num. 3: a ação na SIC deve ser proposta no ano seguinte ao fim da garantia, ao fim do contrato ou, nos demais casos, a quando você soube dos fatos."},l2068:{es:"Ley 2068 de 2020, arts. 38 y 39: la plataforma de servicios turísticos es prestadora de servicios turísticos, debe tener RNT vigente y retirar a quien no lo tenga; responde ante usted por publicidad engañosa si permite anunciar a prestadores sin RNT activo.",en:"Law 2068 of 2020, arts. 38 and 39: a tourism platform is itself a tourism provider, must hold a valid RNT and remove providers without one; it is liable to you for misleading advertising if it lets providers without an active RNT advertise.",fr:"Loi 2068 de 2020, art. 38 et 39 : la plateforme de services touristiques est elle-même prestataire touristique, doit avoir un RNT en vigueur et retirer ceux qui n’en ont pas ; elle répond envers vous de la publicité trompeuse si elle laisse annoncer des prestataires sans RNT actif.",pt:"Lei 2068 de 2020, arts. 38 e 39: a plataforma de serviços turísticos é ela própria prestadora turística, deve ter RNT vigente e retirar quem não tiver; responde perante você por publicidade enganosa se permitir anunciar prestadores sem RNT ativo."},d1423:{es:"Decreto 1423 de 2026 (sismo del 10 de agosto de 2026): para arrendatarios afectados directamente, suspende 6 meses la ejecución de restituciones, aplaza los reajustes y permite prorrogar 6 meses los contratos que vencían entre el 10 de agosto y el 31 de diciembre de 2026.",en:"Decree 1423 of 2026 (earthquake of 10 August 2026): for directly affected tenants, it suspends enforcement of repossessions for 6 months, postpones rent increases and allows 6-month extensions of leases ending between 10 August and 31 December 2026.",fr:"Décret 1423 de 2026 (séisme du 10 août 2026) : pour les locataires directement touchés, il suspend 6 mois l’exécution des restitutions, reporte les hausses de loyer et permet de prolonger de 6 mois les baux arrivant à échéance entre le 10 août et le 31 décembre 2026.",pt:"Decreto 1423 de 2026 (sismo de 10 de agosto de 2026): para locatários afetados diretamente, suspende por 6 meses a execução de restituições, adia os reajustes e permite prorrogar por 6 meses os contratos que venciam entre 10 de agosto e 31 de dezembro de 2026."},pol79h:{es:"Ley 1801 de 2016, arts. 77, 79 y 80: el titular de la posesión o la tenencia puede presentar querella ante el inspector cuando se le impide usar el inmueble; la medida es provisional y caduca a los 4 meses. La acción preventiva de 48 horas (art. 81) está pensada para ocupaciones de hecho.",en:"Law 1801 of 2016, arts. 77, 79 and 80: the lawful possessor or holder can file a complaint with the inspector when prevented from using the property; the measure is provisional and lapses after 4 months. The 48-hour preventive action (art. 81) is meant for unlawful occupations.",fr:"Loi 1801 de 2016, art. 77, 79 et 80 : le possesseur ou détenteur légitime peut saisir l’inspecteur quand on l’empêche d’utiliser le logement ; la mesure est provisoire et se périme au bout de 4 mois. L’action préventive de 48 heures (art. 81) vise les occupations de fait.",pt:"Lei 1801 de 2016, arts. 77, 79 e 80: o titular da posse pode apresentar queixa ao inspetor quando impedido de usar o imóvel; a medida é provisória e caduca em 4 meses. A ação preventiva de 48 horas (art. 81) é pensada para ocupações de fato."}});const e=a.exLaw
