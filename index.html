do pagamento deve ser pedido em até 5 dias úteis depois de saber do problema.", "Las plataformas donde otros venden deben exigir a cada vendedor datos que permitan identificarlo: nombre, documento, dirección y teléfonos (Ley 1480, art. 53).": "As plataformas onde outros vendem devem exigir de cada vendedor dados que permitam identificá-lo: nome, documento, endereço e telefones (Lei 1480, art. 53).", "Si usted compró, puede consultar esos datos para presentar su queja o reclamo contra el vendedor (Ley 1480, art. 53).": "Se você comprou, pode consultar esses dados para apresentar sua queixa ou reclamação contra o vendedor (Lei 1480, art. 53).", "Si pagó en línea con tarjeta y no recibió el producto, puede proceder la reversión del pago (Ley 1480, art. 51).": "Se você pagou on-line com cartão e não recebeu o produto, pode caber o estorno do pagamento (Lei 1480, art. 51).", "Respuesta del vendedor a su reclamo: 15 días hábiles.": "Resposta do vendedor à sua reclamação: 15 dias úteis.", "Pida a la plataforma los datos del vendedor, citando el artículo 53 de la Ley 1480.": "Peça à plataforma os dados do vendedor, citando o artigo 53 da Lei 1480.", "Reclame por escrito al vendedor.": "Reclame por escrito ao vendedor.", "Si no responde, queja o demanda ante la SIC.": "Se não responder, queixa ou ação na SIC.", "Pedido y comprobante de pago": "Pedido e comprovante de pagamento", "Publicación del producto": "O anúncio do produto", "Mensajes con el vendedor y la plataforma": "Mensagens com o vendedor e a plataforma", "Una estancia de 30 días o más en vivienda urbana suele regirse por la Ley 820 de 2003, no por las normas de turismo.": "Uma estadia de 30 dias ou mais em moradia urbana costuma seguir a Lei 820 de 2003, e não as normas de turismo.", "El arrendador no puede exigir depósitos en dinero ni otras garantías reales para asegurar el pago (Ley 820 de 2003, art. 16).": "O locador não pode exigir depósitos em dinheiro nem outras garantias reais para assegurar o pagamento (Lei 820 de 2003, art. 16).", "El canon solo puede subir una vez cada 12 meses y como máximo en el IPC del año anterior (Ley 820 de 2003, art. 20).": "O aluguel só pode subir uma vez a cada 12 meses e no máximo pelo IPC do ano anterior (Lei 820 de 2003, art. 20).", "El arrendador debe entregar el inmueble en buen estado y hacer las reparaciones necesarias; el arrendatario responde por las reparaciones locativas causadas por su uso (Ley 820 de 2003, arts. 8 y 9).": "O locador deve entregar o imóvel em bom estado e fazer os reparos necessários; o locatário responde pelos reparos locativos causados pelo seu uso (Lei 820 de 2003, arts. 8 e 9).", "Medida temporal: si su vivienda o su contrato resultaron afectados directamente por el sismo del 10 de agosto de 2026, el Decreto 1423 de 2026 suspende por 6 meses la ejecución de órdenes de restitución, aplaza los reajustes del canon y permite prorrogar 6 meses los contratos que vencían entre el 10 de agosto y el 31 de diciembre de 2026, con excepciones (riesgo de colapso, vivienda propia del arrendador).": "Medida temporária: se sua moradia ou seu contrato foram afetados diretamente pelo sismo de 10 de agosto de 2026, o Decreto 1423 de 2026 suspende por 6 meses a execução de ordens de restituição, adia os reajustes do aluguel e permite prorrogar por 6 meses os contratos que venciam entre 10 de agosto e 31 de dezembro de 2026, com exceções (risco de colapso, moradia própria do locador).", "La terminación anticipada exige un preaviso escrito: revise el plazo en su contrato y en la Ley 820.": "A rescisão antecipada exige aviso prévio por escrito: confira o prazo no contrato e na Lei 820.", "Reclame por escrito al arrendador o a la inmobiliaria.": "Reclame por escrito ao locador ou à imobiliária.", "Intente una conciliación.": "Tente uma conciliação.", "Si no hay acuerdo, el caso va ante un juez civil; las alcaldías vigilan a las inmobiliarias (en Bogotá, la Secretaría del Hábitat).": "Sem acordo, o caso vai a um juiz cível; as prefeituras fiscalizam as imobiliárias (em Bogotá, a Secretaria do Habitat).", "Contrato de arrendamiento": "Contrato de aluguel", "Recibos de pago del canon": "Recibos de pagamento do aluguel", "Inventario y fotos de la entrega": "Inventário e fotos da entrega", "Llame ya a su banco por la línea oficial, reporte la transferencia y bloquee sus canales: en una transferencia inmediata, cada minuto cuenta.": "Ligue já para o seu banco pela linha oficial, informe a transferência e bloqueie seus canais: numa transferência imediata, cada minuto conta.", "Su banco tiene un deber reforzado de seguridad: debe identificarlo bien y vigilar los movimientos inusuales por monto, frecuencia o destino.": "Seu banco tem um dever reforçado de segurança: deve identificar você corretamente e vigiar movimentações incomuns por valor, frequência ou destino.", "Si el banco no detectó ni frenó movimientos claramente inusuales, la Superfinanciera puede ordenarle devolver todo o parte del dinero; también se revisa si usted actuó con cuidado, por ejemplo si compartió claves o reportó tarde.": "Se o banco não detectou nem barrou movimentações claramente incomuns, a Superintendência Financeira pode mandar devolver todo ou parte do dinheiro; também se verifica se você agiu com cuidado, por exemplo se compartilhou senhas ou avisou tarde.", "Si usted mismo autorizó la transferencia porque lo engañaron, recuperar el dinero es más difícil: por eso el reporte inmediato y la denuncia son decisivos.": "Se você mesmo autorizou a transferência porque foi enganado, recuperar o dinheiro é mais difícil: por isso o aviso imediato e a denúncia são decisivos.", "Puede quejarse ante el Defensor del Consumidor Financiero o la Superfinanciera, y demandar ante la Superfinanciera sin abogado si el valor es menor a 40 salarios mínimos.": "Você pode reclamar ao Defensor do Consumidor Financeiro ou à Superintendência Financeira, e processar perante ela sem advogado se o valor for menor que 40 salários mínimos.", "Reporte al banco: de inmediato, en la primera hora.": "Aviso ao banco: imediatamente, na primeira hora.", "Llame a su banco por la línea oficial, reporte la transferencia y bloquee la aplicación y las tarjetas. Algunos bancos permiten reportarlo desde su aplicación.": "Ligue para o banco pela linha oficial, informe a transferência e bloqueie o aplicativo e os cartões. Alguns bancos permitem informar pelo aplicativo.", "Pida por escrito que el banco contacte al banco que recibió el dinero para intentar retenerlo, y guarde el número de radicado.": "Peça por escrito que o banco contate o banco que recebeu o dinheiro para tentar retê-lo, e guarde o número de protocolo.", "Denuncie ante la Fiscalía o en el CAI Virtual de la Policía.": "Registre a denúncia na Fiscalía ou no CAI Virtual da Polícia.", "Si el banco no responde o se niega, Defensor del Consumidor Financiero y Superfinanciera.": "Se o banco não responder ou recusar, Defensor do Consumidor Financeiro e Superintendência Financeira.", "Comprobante de la transferencia: hora, monto y llave o cuenta de destino": "Comprovante da transferência: hora, valor e chave ou conta de destino", "Capturas del chat, el enlace o la llamada del engaño": "Capturas da conversa, do link ou da ligação do golpe", "Radicado del reporte al banco": "Protocolo do aviso ao banco", "Mantenga la calma, no firme nada y, si puede hacerlo sin riesgo, grabe lo que pasa. Si hay violencia o amenazas, llame al 123.": "Mantenha a calma, não assine nada e, se puder fazer isso sem risco, grave o que acontece. Se houver violência ou ameaças, ligue para o 123.", "Una estadía de menos de 30 días es un contrato de hospedaje (Ley 300 de 1996, art. 79). Solo termina antes de tiempo por falta de pago, por infracción del reglamento oficial del hospedaje o por otra causa pactada expresamente, como unas reglas de la casa que usted aceptó al reservar (Código de Comercio, arts. 1193 y 1197).": "Uma estadia de menos de 30 dias é um contrato de hospedagem (Lei 300 de 1996, art. 79). Só termina antes do prazo por falta de pagamento, infração do regulamento oficial da hospedagem ou outra causa pactuada expressamente, como regras da casa aceitas na reserva (Código de Comércio, arts. 1193 e 1197).", "Si el anfitrión lo saca sin una de esas causas, incumple: usted elige otro alojamiento de la misma calidad a costa de él, o el reembolso o la compensación (Ley 300 de 1996, art. 63), y puede reclamar los gastos extra.": "Se o anfitrião tirar você sem uma dessas causas, ele descumpre o contrato: você escolhe outra hospedagem equivalente à custa dele, ou o reembolso ou compensação (Lei 300 de 1996, art. 63), e pode cobrar os gastos extras.", "Durante la estadía, el alojamiento es su domicilio (Constitución, art. 28; Corte Constitucional, C-519 de 2007). La policía solo entra sin orden escrita por imperiosa necesidad, por ejemplo para auxiliar a alguien o por un incendio (Ley 1801 de 2016, art. 163).": "Durante a estadia, a hospedagem é o seu domicílio (Constituição, art. 28; Corte Constitucional, C-519 de 2007). A polícia só entra sem ordem escrita em caso de necessidade imperiosa, por exemplo para socorrer alguém ou por um incêndio (Lei 1801 de 2016, art. 163).", "La policía no decide quién tiene razón en el contrato: sus medidas sobre la tenencia de un inmueble son provisionales y el fondo lo resuelve un juez (Ley 1801 de 2016, art. 80). Usted puede grabar el procedimiento (art. 21).": "A polícia não decide quem tem razão no contrato: suas medidas sobre a ocupação de um imóvel são provisórias e o mérito é decidido por um juiz (Lei 1801 de 2016, art. 80). Você pode gravar o procedimento (art. 21).", "Si el anfitrión termina el contrato, debe hacer un inventario de sus pertenencias ante testigos antes de retirarlas (Código de Comercio, art. 1198).": "Se o anfitrião encerrar o contrato, deve fazer um inventário dos seus pertences diante de testemunhas antes de retirá-los (Código de Comércio, art. 1198).", "Avise a la plataforma de inmediato, por su canal de emergencias.": "Avise a plataforma imediatamente, pelo canal de emergência.", "Reclamo escrito al anfitrión y a la plataforma: el mismo día; el proveedor tiene 15 días hábiles para responder.": "Reclamação escrita ao anfitrião e à plataforma: no mesmo dia; o fornecedor tem 15 dias úteis para responder.", "Pida el motivo por escrito y muestre su reserva y su pago. Si llega la policía, pida el nombre y la placa de los agentes y el motivo legal de la actuación.": "Peça o motivo por escrito e mostre sua reserva e seu pagamento. Se a polícia chegar, peça o nome e a placa dos agentes e o fundamento legal da atuação.", "Avise a la plataforma por su canal de emergencias y pida reubicación o reembolso.": "Avise a plataforma pelo canal de emergência e peça realocação ou reembolso.", "Antes de salir, fotografíe sus pertenencias y no deje documentos ni dinero; si el anfitrión las retira, exija el inventario ante testigos.": "Antes de sair, fotografe seus pertences e não deixe documentos nem dinheiro; se o anfitrião os retirar, exija o inventário diante de testemunhas.", "Si hay violencia o amenazas, o le retienen sus cosas, llame al 123 y denuncie.": "Se houver violência, ameaças ou retenção dos seus pertences, ligue para o 123 e denuncie.", "Después: reclamo escrito al anfitrión y a la plataforma, y queja o demanda ante la SIC.": "Depois: reclamação escrita ao anfitrião e à plataforma, e queixa ou ação na SIC.", "Reserva y comprobante de pago": "Reserva e comprovante de pagamento", "Mensajes del anfitrión y de la plataforma": "Mensagens do anfitrião e da plataforma", "Video o audio de lo ocurrido, con nombre y placa de los policías": "Vídeo ou áudio do ocorrido, com nome e placa dos policiais", "Facturas del nuevo alojamiento y del transporte": "Notas da nova hospedagem e do transporte", "Fotos o inventario de sus pertenencias": "Fotos ou inventário dos seus pertences", "No use la fuerza, no cambie la cerradura ni corte los servicios con el huésped adentro, y no retire sus cosas sin inventario: un problema del contrato puede volverse un problema penal. Si hay violencia, llame al 123.": "Não use a força, não troque a fechadura nem corte os serviços com o hóspede dentro, e não retire os pertences dele sem inventário: um problema do contrato pode virar um problema penal. Se houver violência, ligue para o 123.", "El hospedaje termina al vencer el plazo, por falta de pago, por infracción del reglamento oficial del hospedaje o por otra causa pactada expresamente (Código de Comercio, arts. 1193 y 1197). Sus reglas de la casa solo cuentan como causa si el huésped las aceptó expresamente al reservar.": "A hospedagem termina ao vencer o prazo, por falta de pagamento, infração do regulamento oficial da hospedagem ou outra causa pactuada expressamente (Código de Comércio, arts. 1193 e 1197). Suas regras da casa só contam como causa se o hóspede as aceitou expressamente na reserva.", "Si termina el contrato, haga un inventario de las pertenencias del huésped ante testigos antes de retirarlas (Código de Comercio, art. 1198). Si no paga, la ley prevé el remate de sus bienes por un martillo autorizado, no quedárselos (art. 1199).": "Se encerrar o contrato, faça um inventário dos pertences do hóspede diante de testemunhas antes de retirá-los (Código de Comércio, art. 1198). Se ele não pagar, a lei prevê o leilão dos bens por um leiloeiro autorizado, não ficar com eles (art. 1199).", "Mientras la estadía está vigente, el alojamiento es el domicilio del huésped (Constitución, art. 28; C-519 de 2007): entrar sin su permiso o grabar su vida privada adentro puede ser un delito (Código Penal, art. 189).": "Enquanto a estadia estiver vigente, a hospedagem é o domicílio do hóspede (Constituição, art. 28; C-519 de 2007): entrar sem permissão ou gravar a vida privada dele lá dentro pode ser crime (Código Penal, art. 189).", "Por ruido, fiestas o riñas, la policía puede intervenir por convivencia (Ley 1801 de 2016, art. 33).": "Por barulho, festas ou brigas, a polícia pode intervir pelas regras de convivência (Lei 1801 de 2016, art. 33).", "Si el huésped se queda después del fin de la reserva, el contrato ya terminó (Código de Comercio, art. 1197). El hospedaje tiene su propio mecanismo, distinto del proceso de restitución del arrendamiento: inventario ante testigos y retiro de las pertenencias (art. 1198), y querella ante la policía o el inspector como titular de la tenencia (Ley 1801 de 2016, arts. 77 y 79). Nunca por la fuerza.": "Se o hóspede ficar depois do fim da reserva, o contrato já terminou (Código de Comércio, art. 1197). A hospedagem tem mecanismo próprio, diferente do processo de restituição do aluguel: inventário diante de testemunhas e retirada dos pertences (art. 1198), e queixa à polícia ou ao inspetor como titular da posse (Lei 1801 de 2016, arts. 77 e 79). Nunca pela força.", "Querella ante el inspector de policía como titular de la tenencia: preséntela cuanto antes; caduca a los 4 meses (Ley 1801 de 2016, arts. 79 y 80). La acción preventiva de 48 horas (art. 81) está pensada para ocupaciones de hecho: su uso contra un huésped que entró por contrato es discutible.": "Queixa ao inspetor de polícia como titular da posse: apresente o quanto antes; caduca em 4 meses (Lei 1801 de 2016, arts. 79 e 80). A ação preventiva de 48 horas (art. 81) é pensada para ocupações de fato: seu uso contra um hóspede que entrou por contrato é discutível.", "Protección policiva de la tenencia: caduca a los 4 meses (Ley 1801 de 2016, art. 80).": "Proteção policial da posse: caduca em 4 meses (Lei 1801 de 2016, art. 80).", "Reporte a la plataforma: el mismo día, por su canal de emergencias.": "Aviso à plataforma: no mesmo dia, pelo canal de emergência.", "Escriba al huésped, por la plataforma, el motivo y la hora de salida, citando sus reglas de la casa.": "Escreva ao hóspede, pela plataforma, o motivo e o horário de saída, citando suas regras da casa.", "Avise a la plataforma por su canal de emergencias o de seguridad.": "Avise a plataforma pelo canal de emergência ou de segurança.", "Si hay ruido, riña o peligro, llame al 123; si el huésped se queda después del fin de la reserva, pida la protección de la policía o del inspector.": "Se houver barulho, briga ou perigo, ligue para o 123; se o hóspede ficar depois do fim da reserva, peça a proteção da polícia ou do inspetor.", "No entre, no cambie la cerradura y no retire sus cosas sin inventario ante testigos.": "Não entre, não troque a fechadura e não retire os pertences sem inventário diante de testemunhas.", "Si no pagó o causó daños, use el reclamo de la plataforma y, si no se resuelve, la vía civil.": "Se não pagou ou causou danos, use a reclamação da plataforma e, se não resolver, a via civil.", "Reserva con fechas y reglas de la casa aceptadas": "Reserva com datas e regras da casa aceitas", "Mensajes con el huésped y la plataforma": "Mensagens com o hóspede e a plataforma", "Fotos o video de daños o del ruido, tomados desde zonas comunes": "Fotos ou vídeo de danos ou do barulho, feitos das áreas comuns", "Inventario firmado ante testigos, si retiró pertenencias": "Inventário assinado diante de testemunhas, se retirou pertences", "Número del reporte a la policía o a la plataforma": "Número do registro na polícia ou na plataforma", "No salga del hotel sin una constancia escrita: pida que le confirmen por escrito que no hay habitación y qué solución le dan.": "Não saia do hotel sem uma constância escrita: peça que confirmem por escrito que não há quarto e qual solução oferecem.", "La sobreventa es un incumplimiento: el hotel debe darle un alojamiento de la misma calidad, o la devolución o compensación del precio; si no tiene uno igual, debe contratarlo con un tercero a su costa (Ley 300 de 1996, arts. 63 y 64).": "O overbooking é um descumprimento: o hotel deve dar uma hospedagem da mesma qualidade, ou a devolução ou compensação do preço; se não tiver, deve contratá-la com um terceiro à sua custa (Lei 300 de 1996, arts. 63 e 64).", "Usted elige entre el alojamiento equivalente y el reembolso.": "Você escolhe entre a hospedagem equivalente e o reembolso.", "Si reservó por una agencia o una app, avísele también: debe ayudarle a resolver según su política.": "Se reservou por uma agência ou app, avise também: ela deve ajudar conforme sua política.", "Pida la solución por escrito antes de salir del hotel.": "Peça a solução por escrito antes de sair do hotel.", "Reclamo escrito: el proveedor tiene 15 días hábiles para responder.": "Reclamação escrita: o fornecedor tem 15 dias úteis para responder.", "Pida en la recepción una constancia escrita de que no hay habitación y de la solución que le ofrecen.": "Peça na recepção uma constância escrita de que não há quarto e da solução oferecida.", "Elija: alojamiento equivalente pagado por el hotel, o la devolución del precio.": "Escolha: hospedagem equivalente paga pelo hotel, ou a devolução do preço.", "Guarde las facturas de transporte, comidas y la diferencia de precio.": "Guarde as notas de transporte, refeições e a diferença de preço.", "Confirmación de la reserva y pago": "Confirmação da reserva e pagamento", "Constancia escrita del hotel": "Constância escrita do hotel", "Facturas de los gastos extra": "Notas dos gastos extras", "Fotos o video en la recepción": "Fotos ou vídeo na recepção", "Solo un juez puede ordenar que usted salga de una vivienda arrendada. No entregue las llaves ni firme nada bajo presión; si hay violencia, llame al 123.": "Só um juiz pode ordenar que você saia de uma moradia alugada. Não entregue as chaves nem assine nada sob pressão; se houver violência, ligue para o 123.", "Si usted no entrega la vivienda, el arrendador debe iniciar un proceso de restitución ante un juez (Código General del Proceso, art. 384). Ni el arrendador ni la policía pueden reemplazar esa orden.": "Se você não devolver a moradia, o locador deve iniciar um processo de restituição perante um juiz (Código Geral do Processo, art. 384). Nem o locador nem a polícia podem substituir essa ordem.", "Sin una falta suya, el arrendador puede terminar el contrato: durante las prórrogas, con preaviso escrito de al menos tres meses por correo certificado y una indemnización de tres cánones (Ley 820 de 2003, art. 22, num. 7); o al vencimiento, con preaviso de tres meses, para ocupar la vivienda, demolerla o repararla, o venderla, y después de cuatro años de contrato también por su sola voluntad, con una indemnización de un canon y medio (art. 22, num. 8).": "Sem falta sua, o locador pode encerrar o contrato: durante as prorrogações, com aviso escrito de pelo menos três meses por correio certificado e indenização de três aluguéis (Lei 820 de 2003, art. 22, num. 7); ou no vencimento, com aviso de três meses, para morar, demolir ou reformar, ou vender o imóvel, e após quatro anos de contrato também por sua só vontade, com indenização de um aluguel e meio (art. 22, num. 8).", "Si el arrendador le suspende los servicios públicos a propósito, usted puede terminar el contrato y pagar la reconexión descontándola del canon (Ley 820 de 2003, art. 24, num. 1).": "Se o locador suspender os serviços públicos de propósito, você pode encerrar o contrato e pagar a religação descontando do aluguel (Lei 820 de 2003, art. 24, num. 1).", "Si le impiden entrar, por ejemplo cambiando la cerradura: como arrendatario, usted es mero tenedor (Código Civil, art. 775) y puede presentar una querella ante el inspector de policía, que puede ordenar que le restituyan la tenencia (Ley 1801 de 2016, arts. 77, num. 5, y 79). En el momento, llame al 123.": "Se impedirem sua entrada, por exemplo trocando a fechadura: como locatário, você é mero detentor (Código Civil, art. 775) e pode apresentar uma queixa ao inspetor de polícia, que pode ordenar a restituição da posse (Lei 1801 de 2016, arts. 77, num. 5, e 79). Na hora, ligue para o 123.", "Entrar a su vivienda sin su permiso, aunque sea el dueño, puede ser violación de habitación ajena (Código Penal, art. 189); obligarlo a salir con amenazas puede ser constreñimiento ilegal (art. 182).": "Entrar na sua moradia sem permissão, mesmo sendo o dono, pode ser violação de domicílio (Código Penal, art. 189); obrigar você a sair com ameaças pode ser constrangimento ilegal (art. 182).", "Querella ante el inspector de policía si le impiden entrar: preséntela cuanto antes; caduca a los 4 meses del hecho (Ley 1801 de 2016, art. 80).": "Queixa ao inspetor de polícia se impedirem sua entrada: apresente o quanto antes; caduca 4 meses após o fato (Lei 1801 de 2016, art. 80).", "Preaviso del arrendador para terminar sin falta suya: al menos 3 meses (Ley 820 de 2003, art. 22).": "Aviso do locador para encerrar sem falta sua: pelo menos 3 meses (Lei 820 de 2003, art. 22).", "Si hay proceso de restitución, siga pagando el canon: si no lo consigna, no lo escuchan en el proceso (Código General del Proceso, art. 384).": "Se houver processo de restituição, continue pagando o aluguel: se não depositar, não será ouvido no processo (Código Geral do Processo, art. 384).", "No entregue las llaves ni firme una entrega bajo presión.": "Não entregue as chaves nem assine uma entrega sob pressão.", "Pida por escrito el motivo y el fundamento legal.": "Peça por escrito o motivo e o fundamento legal.", "Si le cambian la cerradura o le impiden entrar, llame al 123 o acuda al inspector de policía.": "Se trocarem a fechadura ou impedirem sua entrada, ligue para o 123 ou procure o inspetor de polícia.", "Siga pagando el canon y guarde los recibos; si el arrendador no lo recibe, consúltenos cómo consignarlo.": "Continue pagando o aluguel e guarde os recibos; se o locador não receber, pergunte-nos como depositá-lo.", "Si le cortaron los servicios, guarde las facturas de reconexión.": "Se cortaram os serviços, guarde as notas de religação.", "Avisos o cartas del arrendador": "Avisos ou cartas do locador", "Fotos o video de la cerradura cambiada o del corte": "Fotos ou vídeo da fechadura trocada ou do corte", "Número del reporte a la policía": "Número do registro na polícia", "Quien se dedica a arrendar o intermediar vivienda urbana en municipios de más de 15.000 habitantes debe estar matriculado ante la autoridad local (Ley 820 de 2003, art. 28).": "Quem se dedica a alugar ou intermediar moradia urbana em municípios de mais de 15 mil habitantes deve estar registrado na autoridade local (Lei 820 de 2003, art. 28).", "La alcaldía (en Bogotá, la Secretaría del Hábitat) vigila a arrendadores e inmobiliarias y atiende quejas, por ejemplo por depósitos ilegales o por no entregar copia del contrato o los recibos (Ley 820 de 2003, art. 33).": "A prefeitura (em Bogotá, a Secretaria do Habitat) fiscaliza locadores e imobiliárias e atende queixas, por exemplo por depósitos ilegais ou por não entregar cópia do contrato ou dos recibos (Lei 820 de 2003, art. 33).", "Puede imponer multas de hasta 100 salarios mínimos y suspender o cancelar la matrícula (Ley 820 de 2003, art. 34).": "Pode aplicar multas de até 100 salários mínimos e suspender ou cancelar o registro (Lei 820 de 2003, art. 34).", "No le pueden exigir depósitos en dinero ni otras garantías reales para asegurar el pago (Ley 820 de 2003, art. 16).": "Não podem exigir depósitos em dinheiro nem outras garantias reais para assegurar o pagamento (Lei 820 de 2003, art. 16).", "Reclamo escrito a la inmobiliaria primero: guarde la constancia de envío.": "Reclamação escrita à imobiliária primeiro: guarde o comprovante de envio.", "Queja ante la alcaldía: preséntela con el contrato y los recibos.": "Queixa na prefeitura: apresente com o contrato e os recibos.", "Pida por escrito copia del contrato, de los recibos y la liquidación de lo que le deben.": "Peça por escrito cópia do contrato, dos recibos e a liquidação do que lhe devem.", "Verifique en la alcaldía si la inmobiliaria está matriculada.": "Verifique na prefeitura se a imobiliária está registrada.", "Presente queja ante la alcaldía (en Bogotá, la Secretaría del Hábitat).": "Apresente queixa na prefeitura (em Bogotá, a Secretaria do Habitat).", "Si hay dinero en disputa, conciliación y, si no hay acuerdo, juez civil.": "Se houver dinheiro em disputa, conciliação e, sem acordo, juiz civil.", "Contrato y anexos": "Contrato e anexos", "Recibos y extractos de pago": "Recibos e extratos de pagamento", "Correos y mensajes con la inmobiliaria": "E-mails e mensagens com a imobiliária", "Constancia del reclamo escrito": "Comprovante da reclamação escrita", "El hospedaje es solo para estadías de menos de 30 días (Ley 300 de 1996, art. 79). Una estadía de 30 días o más ya no es hospedaje turístico, aunque se reserve por una app.": "A hospedagem é só para estadias de menos de 30 dias (Lei 300 de 1996, art. 79). Uma estadia de 30 dias ou mais já não é hospedagem turística, mesmo reservada por um app.", "Si es una vivienda urbana que usted usa para vivir, por regla general es un arrendamiento de vivienda urbana (Ley 820 de 2003, art. 2): no le pueden exigir depósitos en dinero (art. 16) y, si usted no entrega, el arrendador debe acudir a un juez (Código General del Proceso, art. 384).": "Se for uma moradia urbana onde você vive, em regra é um aluguel de moradia urbana (Lei 820 de 2003, art. 2): não podem exigir depósitos em dinheiro (art. 16) e, se você não entregar, o locador deve recorrer a um juiz (Código Geral do Processo, art. 384).", "La plataforma sigue siendo intermediaria: sus términos y su centro de resolución aplican, y debe tener identificado al anfitrión para que usted pueda reclamar (Ley 1480 de 2011, art. 53).": "A plataforma continua sendo intermediária: seus termos e seu centro de resolução se aplicam, e ela deve ter o anfitrião identificado para que você possa reclamar (Lei 1480 de 2011, art. 53).", "Lo que cuenta es lo que realmente pactaron y cómo se usa el inmueble, no el nombre que le dé la plataforma (Código Civil, art. 1618).": "O que conta é o que realmente foi combinado e como o imóvel é usado, não o nome que a plataforma lhe dá (Código Civil, art. 1618).", "Si hay un problema, avise a la plataforma el mismo día: sus plazos para reportar suelen ser cortos.": "Se houver um problema, avise a plataforma no mesmo dia: os prazos para reportar costumam ser curtos.", "Guarde la reserva y los términos de la plataforma vigentes en la fecha de la reserva (PDF o capturas).": "Guarde a reserva e os termos da plataforma vigentes na data da reserva (PDF ou capturas).", "Revise si firmó un contrato aparte con el anfitrión.": "Verifique se assinou um contrato separado com o anfitrião.", "Ante un conflicto, escriba al anfitrión y a la plataforma, y consúltenos antes de entregar el inmueble.": "Em caso de conflito, escreva ao anfitrião e à plataforma, e consulte-nos antes de entregar o imóvel.", "Reserva y pagos": "Reserva e pagamentos", "Términos de la plataforma vigentes en la fecha": "Termos da plataforma vigentes na data", "Mensajes con el anfitrión": "Mensagens com o anfitrião", "Contrato aparte, si lo hay": "Contrato separado, se houver", "Si hubo un delito, denúncielo; la reclamación de consumo puede avanzar al mismo tiempo, porque el plazo de un año para demandar sigue corriendo (Ley 1480 de 2011, art. 58).": "Se houve crime, denuncie; a reclamação de consumo pode avançar ao mesmo tempo, porque o prazo de um ano para processar continua correndo (Lei 1480 de 2011, art. 58).", "Si el lugar no tiene RNT o es inseguro, puede reportarlo ante la SIC; si hay peligro, llame al 123.": "Se o lugar não tiver RNT ou for inseguro, você pode denunciá-lo à SIC; se houver perigo, ligue 123."}};

n oficial)", "https://cancilleria.gov.co/sites/default/files/Normograma/docs/codigo_comercio_pr058.htm"], "can619": ["Decisión 619 de la Comunidad Andina: derechos de los usuarios del transporte aéreo", "https://www.comunidadandina.org/StaticFiles/DocOf/DEC619.pdf"]});
SITS.push({"id": "h-lista", "sector": "anfitriones", "t": {"es": "Vivienda turística en regla: la lista completa", "en": "Short-term rental compliance: the full checklist", "fr": "Location touristique en règle : la liste complète", "pt": "Moradia turística regularizada: a lista completa"}, "d": ["Registro Nacional de Turismo (RNT) antes de empezar, tramitado ante la cámara de comercio (Ley 2068 de 2020, art. 3).", "Registro mercantil activo y RUT, que se piden para tramitar el RNT.", "Un código de conducta contra la explotación sexual de niños, niñas y adolescentes, adoptado y fijado en un lugar visible; sin él no se puede inscribir ni actualizar el RNT (Ley 1336 de 2009, arts. 1 y 5).", "No alojar a menores de edad sin la compañía o la autorización de sus padres o representantes, como exige la Alcaldía de Medellín.", "Contribución parafiscal al FONTUR: 2,5 por mil de los ingresos de la actividad turística, cada trimestre; si no hubo ingresos, se declara en cero (Ley 1101 de 2006, art. 3).", "En Medellín, además: uso del suelo que lo permita, reglamento del edificio que lo autorice expresamente, aviso escrito a la Policía (Ley 1801 de 2016, art. 87), certificado de seguridad de bomberos, concepto sanitario favorable y, si pone música o televisión al público, paz y salvo de derechos de autor.", "Y con cada huésped: la TRA, el reporte al SIRE si es extranjero y una póliza que cubra daños a huéspedes y a terceros (Ley 2068 de 2020, arts. 22 y 32)."], "p": ["RNT: renovación cada año, entre enero y el 31 de marzo.", "FONTUR: declaración y pago cada trimestre.", "TRA y SIRE: con cada huésped, en los plazos que fijan el MinCIT y Migración Colombia."], "r": ["RNT, registro mercantil y renovaciones: ante la cámara de comercio.", "TRA: plataforma del MinCIT. SIRE: portal de Migración Colombia.", "Uso del suelo: Planeación municipal. Bomberos y concepto sanitario: Cuerpo de Bomberos y Secretaría de Salud.", "Un alojamiento sin RNT o que no cumple se reporta ante la SIC; si hay peligro, llame al 123."], "doc": ["Certificado del RNT", "Registro mercantil y RUT", "Código de conducta contra la explotación sexual de menores, firmado y visible", "Póliza de responsabilidad", "Concepto de uso del suelo y reglamento del edificio", "Certificado de bomberos y concepto sanitario", "Constancia del aviso a la Policía", "Declaraciones al FONTUR"], "src": ["l2068", "l1336", "fontur", "l1575", "medellin"]},
  {"id": "h-rnt", "sector": "anfitriones", "t": {"es": "Alquilo por días sin RNT o con el RNT vencido", "en": "Short-term renting without a valid RNT", "fr": "Location courte durée sans RNT valide", "pt": "Aluguel por temporada sem RNT vigente"}, "d": ["Quien arrienda o subarrienda vivienda por periodos inferiores a 30 días presta un servicio turístico (Ley 2068 de 2020, art. 37).", "Todo prestador debe inscribirse en el Registro Nacional de Turismo (RNT) antes de prestar el servicio (Ley 2068 de 2020, art. 3).", "Prestar el servicio sin RNT es una infracción: la SIC puede imponer las sanciones del Estatuto del Consumidor y cancelar el registro hasta por 5 años (Ley 2068 de 2020, arts. 71 y 72).", "Las plataformas deben dejar un espacio para el número de RNT y retirar los anuncios de prestadores sin RNT activo cuando la autoridad lo pida (Ley 2068 de 2020, art. 38)."], "p": ["El RNT se renueva cada año, entre enero y el 31 de marzo."], "r": ["Verifique en el RNT que su inscripción esté activa.", "Si no la tiene, inscríbase antes de seguir publicando y muestre el número en cada anuncio.", "Revise también el reglamento del edificio y el uso del suelo de su zona: el RNT solo no basta."], "doc": ["Certificado del RNT vigente", "Registro mercantil y RUT, si aplica", "Capturas de sus anuncios con el número de RNT"], "src": ["l2068", "medellin"]},
  {"id": "h-ph", "sector": "anfitriones", "t": {"es": "El edificio no permite el alquiler por días o me multaron", "en": "My building bans short-term rentals or fined me", "fr": "Mon immeuble interdit la location courte durée ou m’a infligé une amende", "pt": "O prédio não permite aluguel por temporada ou me multou"}, "d": ["El reglamento de propiedad horizontal obliga a los propietarios y a quienes usan los inmuebles del edificio (Ley 675 de 2001).", "Para operar una vivienda turística, la Alcaldía de Medellín exige que el reglamento autorice expresamente esa actividad.", "Las multas por incumplir el reglamento se repiten mientras dure el incumplimiento; cada una no puede superar dos veces la cuota de administración mensual, y en total no más de diez veces (Ley 675 de 2001, art. 59).", "Antes de sancionarlo, la copropiedad debe darle la oportunidad de explicarse y defenderse."], "p": ["Revise en la carta de sanción y en el reglamento el plazo para presentar descargos o recursos."], "r": ["Pida el reglamento registrado y el acta o la decisión que impuso la multa.", "Presente sus descargos por escrito dentro del plazo.", "Si el reglamento no lo permite, suspenda el alquiler por días mientras se define, para no acumular multas."], "doc": ["Reglamento de propiedad horizontal registrado", "Carta o resolución de la multa", "Actas de asamblea"], "src": ["ph675", "medellin"]},
  {"id": "h-registros", "sector": "anfitriones", "t": {"es": "Registro de huéspedes: TRA y reporte de extranjeros (SIRE)", "en": "Guest records: TRA and foreign guest reporting (SIRE)", "fr": "Registre des voyageurs : TRA et déclaration des étrangers (SIRE)", "pt": "Registro de hóspedes: TRA e relatório de estrangeiros (SIRE)"}, "d": ["Todo prestador de alojamiento debe registrar a sus huéspedes en la Tarjeta de Registro de Alojamiento (TRA), que sirve como prueba del contrato de hospedaje (Ley 2068 de 2020, art. 22).", "Los huéspedes extranjeros también se reportan a Migración Colombia en el SIRE (Resolución 2357 de 2020), y no hacerlo a tiempo puede dar lugar a multas.", "Los prestadores de alojamiento deben tener una póliza de seguro que cubra daños a huéspedes y a terceros (Ley 2068 de 2020, art. 32).", "En Medellín, la apertura de la vivienda turística se comunica por escrito a la estación de Policía más cercana (Ley 1801 de 2016, art. 87)."], "p": ["Reporte en el SIRE cada entrada y salida de huéspedes extranjeros dentro del plazo que fija Migración Colombia."], "r": ["Haga la TRA de cada huésped a su llegada.", "Reporte en el SIRE la entrada y la salida de cada huésped extranjero.", "Guarde las constancias de cada registro y la póliza vigente."], "doc": ["Constancias de la TRA", "Reportes del SIRE", "Póliza de responsabilidad"], "src": ["l2068", "sire", "medellin"]},
  {"id": "h-pot", "sector": "anfitriones", "t": {"es": "¿Mi zona permite la vivienda turística? (Medellín)", "en": "Does my area allow short-term rentals? (Medellín)", "fr": "Mon quartier autorise-t-il la location touristique ? (Medellín)", "pt": "Minha zona permite moradia turística? (Medellín)"}, "d": ["Además del RNT, el uso del suelo de la zona debe permitir el alojamiento turístico según el Plan de Ordenamiento Territorial (POT).", "En Medellín, según el POT vigente (Acuerdo 48 de 2014), la vivienda turística se permite en zonas de media y alta mixtura de usos.", "Un proyecto de revisión del POT la limitaría a zonas de alta mixtura, zonas de tratamiento especial y áreas de desarrollo orientado al transporte; aún no está aprobado."], "p": ["Verifique el uso del suelo antes de comprar o de publicar un anuncio."], "r": ["Consulte el uso del suelo de su predio ante Planeación de Medellín y pida el concepto por escrito.", "Revise que el reglamento del edificio autorice la actividad.", "Siga las novedades del nuevo POT antes de invertir."], "doc": ["Concepto de uso del suelo", "Escritura y certificado de libertad", "Reglamento de propiedad horizontal"], "src": ["medellin", "potn"]},
  {"id": "p-cuenta", "sector": "plataformas", "t": {"es": "Me suspendieron o bloquearon la cuenta", "en": "My account was suspended or blocked", "fr": "Mon compte a été suspendu ou bloqué", "pt": "Minha conta foi suspensa ou bloqueada"}, "d": ["Los términos de la plataforma fijan sus reglas, una apelación interna y a veces un arbitraje en el exterior. Si el servicio se ofrece en Colombia, la ley colombiana y la SIC también pueden aplicar.", "Si usa la plataforma como consumidor, las cláusulas abusivas no producen efectos (Ley 1480, arts. 42 y 43).", "Puede pedir a la plataforma qué datos personales tiene sobre usted y para qué los usa: debe responder en 10 días hábiles, prorrogables 5 (Ley 1581 de 2012, art. 14)."], "p": ["Apelación interna: revise el plazo en los términos de la plataforma; suele ser corto.", "Consulta de datos personales: 10 días hábiles, prorrogables 5."], "r": ["Pida por escrito el motivo concreto y la regla que aplicaron.", "Use la apelación interna y guarde la constancia.", "Si no resuelven, queja ante la SIC o la vía que fijen los términos."], "doc": ["Avisos y correos de suspensión", "Copia descargada de sus datos", "Capturas de su perfil e historial"], "src": ["l1480", "l1581"]},
  {"id": "p-pagos", "sector": "plataformas", "t": {"es": "La plataforma me retiene los pagos", "en": "The platform is withholding my payouts", "fr": "La plateforme bloque mes paiements", "pt": "A plataforma está retendo meus pagamentos"}, "d": ["Los términos de la plataforma fijan cuándo puede retener pagos y por cuánto tiempo: es la primera regla que se revisa.", "Una retención que no se ajusta a los términos es un incumplimiento del contrato y puede reclamarse.", "Si usted actúa como consumidor y el servicio se ofrece en Colombia, la SIC puede ser una vía; si es un negocio, la vía suele ser la del contrato."], "p": ["Descargue hoy el historial de pagos: puede dejar de estar disponible si la cuenta se cierra."], "r": ["Pida por escrito el motivo, el monto retenido y la fecha de liberación.", "Use la apelación interna.", "Si no resuelven, carta formal de reclamación y, si el monto lo justifica, la vía del contrato o la SIC."], "doc": ["Historial de pagos y saldo pendiente", "Términos vigentes en la fecha, en PDF", "Avisos de la plataforma"], "src": ["l1480"]},
  {"id": "p-anuncio", "sector": "plataformas", "t": {"es": "Me retiraron un anuncio", "en": "My listing was removed", "fr": "Mon annonce a été retirée", "pt": "Meu anúncio foi removido"}, "d": ["En alojamiento, las plataformas deben dejar un espacio para el número de RNT y retirar los anuncios de prestadores sin RNT activo cuando la autoridad lo pida (Ley 2068 de 2020, art. 38).", "Fuera de esos casos, el retiro debe ajustarse a los términos de la plataforma: pida la regla concreta que aplicaron.", "No publique acusaciones contra la plataforma en redes: puede debilitar su reclamo."], "p": ["Revise el plazo de apelación en los términos de la plataforma."], "r": ["Guarde capturas del anuncio y de sus calificaciones.", "Pida el motivo por escrito y apele.", "Si el motivo es el RNT, regularícelo y pida la reactivación."], "doc": ["Capturas del anuncio y de sus reseñas", "Aviso de retiro", "Certificado del RNT, si aplica"], "src": ["l2068"]},
  {"id": "p-marketplace", "sector": "plataformas", "t": {"es": "Compré en una plataforma y el vendedor desapareció", "en": "I bought on a marketplace and the seller disappeared", "fr": "J’ai acheté sur une plateforme et le vendeur a disparu", "pt": "Comprei numa plataforma e o vendedor sumiu"}, "urgent": true, "urgentMsg": "Si pagó con tarjeta o medio electrónico, la reversión del pago debe pedirse dentro de los 5 días hábiles siguientes a enterarse del problema.", "d": ["Las plataformas donde otros venden deben exigir a cada vendedor datos que permitan identificarlo: nombre, documento, dirección y teléfonos (Ley 1480, art. 53).", "Si usted compró, puede consultar esos datos para presentar su queja o reclamo contra el vendedor (Ley 1480, art. 53).", "Si pagó en línea con tarjeta y no recibió el producto, puede proceder la reversión del pago (Ley 1480, art. 51)."], "p": ["Reversión del pago: 5 días hábiles desde que se enteró.", "Respuesta del vendedor a su reclamo: 15 días hábiles."], "r": ["Pida a la plataforma los datos del vendedor, citando el artículo 53 de la Ley 1480.", "Reclame por escrito al vendedor.", "Si no responde, queja o demanda ante la SIC."], "doc": ["Pedido y comprobante de pago", "Publicación del producto", "Mensajes con el vendedor y la plataforma"], "src": ["l1480"]},
  {"id": "o-arriendo", "sector": "arriendo", "t": {"es": "Arriendo por meses: depósito, aumento o reparaciones", "en": "Monthly rental: deposit, rent increase or repairs", "fr": "Location au mois : caution, hausse de loyer ou réparations", "pt": "Aluguel mensal: caução, reajuste ou reparos"}, "d": ["Una estancia de 30 días o más en vivienda urbana suele regirse por la Ley 820 de 2003, no por las normas de turismo.", "El arrendador no puede exigir depósitos en dinero ni otras garantías reales para asegurar el pago (Ley 820 de 2003, art. 16).", "El canon solo puede subir una vez cada 12 meses y como máximo en el IPC del año anterior (Ley 820 de 2003, art. 20).", "El arrendador debe entregar el inmueble en buen estado y hacer las reparaciones necesarias; el arrendatario responde por las reparaciones locativas causadas por su uso (Ley 820 de 2003, arts. 8 y 9).", "Medida temporal: si su vivienda o su contrato resultaron afectados directamente por el sismo del 10 de agosto de 2026, el Decreto 1423 de 2026 suspende por 6 meses la ejecución de órdenes de restitución, aplaza los reajustes del canon y permite prorrogar 6 meses los contratos que vencían entre el 10 de agosto y el 31 de diciembre de 2026, con excepciones (riesgo de colapso, vivienda propia del arrendador)."], "p": ["La terminación anticipada exige un preaviso escrito: revise el plazo en su contrato y en la Ley 820."], "r": ["Reclame por escrito al arrendador o a la inmobiliaria.", "Intente una conciliación.", "Si no hay acuerdo, el caso va ante un juez civil; las alcaldías vigilan a las inmobiliarias (en Bogotá, la Secretaría del Hábitat)."], "doc": ["Contrato de arrendamiento", "Recibos de pago del canon", "Inventario y fotos de la entrega"], "src": ["habitat", "l820", "d1423"]},
  {"id": "r-desalojo", "sector": "arriendo", "t": {"es": "El arrendador me quiere sacar, cambió la cerradura o me cortó los servicios", "en": "My landlord wants me out, changed the lock or cut off utilities", "fr": "Mon propriétaire veut me faire partir, a changé la serrure ou coupé les services", "pt": "O locador quer me tirar, trocou a fechadura ou cortou os serviços"}, "urgent": true, "urgentMsg": "Solo un juez puede ordenar que usted salga de una vivienda arrendada. No entregue las llaves ni firme nada bajo presión; si hay violencia, llame al 123.", "d": ["Si usted no entrega la vivienda, el arrendador debe iniciar un proceso de restitución ante un juez (Código General del Proceso, art. 384). Ni el arrendador ni la policía pueden reemplazar esa orden.", "Sin una falta suya, el arrendador puede terminar el contrato: durante las prórrogas, con preaviso escrito de al menos tres meses por correo certificado y una indemnización de tres cánones (Ley 820 de 2003, art. 22, num. 7); o al vencimiento, con preaviso de tres meses, para ocupar la vivienda, demolerla o repararla, o venderla, y después de cuatro años de contrato también por su sola voluntad, con una indemnización de un canon y medio (art. 22, num. 8).", "Si el arrendador le suspende los servicios públicos a propósito, usted puede terminar el contrato y pagar la reconexión descontándola del canon (Ley 820 de 2003, art. 24, num. 1).", "Si le impiden entrar, por ejemplo cambiando la cerradura: como arrendatario, usted es mero tenedor (Código Civil, art. 775) y puede presentar una querella ante el inspector de policía, que puede ordenar que le restituyan la tenencia (Ley 1801 de 2016, arts. 77, num. 5, y 79). En el momento, llame al 123.", "Entrar a su vivienda sin su permiso, aunque sea el dueño, puede ser violación de habitación ajena (Código Penal, art. 189); obligarlo a salir con amenazas puede ser constreñimiento ilegal (art. 182).", "Medida temporal: si su vivienda o su contrato resultaron afectados directamente por el sismo del 10 de agosto de 2026, el Decreto 1423 de 2026 suspende por 6 meses la ejecución de órdenes de restitución, aplaza los reajustes del canon y permite prorrogar 6 meses los contratos que vencían entre el 10 de agosto y el 31 de diciembre de 2026, con excepciones (riesgo de colapso, vivienda propia del arrendador)."], "p": ["Querella ante el inspector de policía si le impiden entrar: preséntela cuanto antes; caduca a los 4 meses del hecho (Ley 1801 de 2016, art. 80).", "Preaviso del arrendador para terminar sin falta suya: al menos 3 meses (Ley 820 de 2003, art. 22).", "Si hay proceso de restitución, siga pagando el canon: si no lo consigna, no lo escuchan en el proceso (Código General del Proceso, art. 384)."], "r": ["No entregue las llaves ni firme una entrega bajo presión.", "Pida por escrito el motivo y el fundamento legal.", "Si le cambian la cerradura o le impiden entrar, llame al 123 o acuda al inspector de policía.", "Siga pagando el canon y guarde los recibos; si el arrendador no lo recibe, consúltenos cómo consignarlo.", "Si le cortaron los servicios, guarde las facturas de reconexión."], "doc": ["Contrato de arrendamiento", "Recibos de pago del canon", "Avisos o cartas del arrendador", "Fotos o video de la cerradura cambiada o del corte", "Número del reporte a la policía"], "src": ["l820", "cgp384", "pol77", "habitat", "t164", "d1423"]},

  {"id": "r-larga", "sector": "arriendo", "t": {"es": "Reservé por una app por un mes o más: ¿qué reglas aplican?", "en": "I booked through an app for a month or more: which rules apply?", "fr": "J’ai réservé via une appli pour un mois ou plus : quelles règles s’appliquent ?", "pt": "Reservei por um app por um mês ou mais: que regras se aplicam?"}, "d": ["El hospedaje es solo para estadías de menos de 30 días (Ley 300 de 1996, art. 79). Una estadía de 30 días o más ya no es hospedaje turístico, aunque se reserve por una app.", "Si es una vivienda urbana que usted usa para vivir, por regla general es un arrendamiento de vivienda urbana (Ley 820 de 2003, art. 2): no le pueden exigir depósitos en dinero (art. 16) y, si usted no entrega, el arrendador debe acudir a un juez (Código General del Proceso, art. 384).", "La plataforma sigue siendo intermediaria: sus términos y su centro de resolución aplican, y debe tener identificado al anfitrión para que usted pueda reclamar (Ley 1480 de 2011, art. 53).", "Lo que cuenta es lo que realmente pactaron y cómo se usa el inmueble, no el nombre que le dé la plataforma (Código Civil, art. 1618)."], "p": ["Si hay un problema, avise a la plataforma el mismo día: sus plazos para reportar suelen ser cortos."], "r": ["Guarde la reserva y los términos de la plataforma vigentes en la fecha de la reserva (PDF o capturas).", "Revise si firmó un contrato aparte con el anfitrión.", "Ante un conflicto, escriba al anfitrión y a la plataforma, y consúltenos antes de entregar el inmueble."], "doc": ["Reserva y pagos", "Términos de la plataforma vigentes en la fecha", "Mensajes con el anfitrión", "Contrato aparte, si lo hay"], "src": ["l300c", "l820", "l1480"]});

 "Demanda ante la SIC: hasta un año."], "r": ["Pida el motivo por escrito y muestre su reserva y su pago. Si llega la policía, pida el nombre y la placa de los agentes y el motivo legal de la actuación.", "Avise a la plataforma por su canal de emergencias y pida reubicación o reembolso.", "Antes de salir, fotografíe sus pertenencias y no deje documentos ni dinero; si el anfitrión las retira, exija el inventario ante testigos.", "Si hay violencia o amenazas, o le retienen sus cosas, llame al 123 y denuncie.", "Después: reclamo escrito al anfitrión y a la plataforma, y queja o demanda ante la SIC."], "doc": ["Reserva y comprobante de pago", "Mensajes del anfitrión y de la plataforma", "Video o audio de lo ocurrido, con nombre y placa de los policías", "Facturas del nuevo alojamiento y del transporte", "Fotos o inventario de sus pertenencias"], "src": ["l300c", "ccoHosp", "c519", "pol163", "pol21", "sicCancel"]});

  body.append(end, el("p",{class:"upd"},L(UI.prfNote) + " " + L(UI.updated).replace("{d}", fmtDate(PRF_DATE))));
  app.append(band, body);
}
function renderLegal(kind){
  const title = kind === "terminos" ? UI.termsT : UI.privT; const items = L(kind === "terminos" ? UI.terms : UI.priv);
  const {band} = artBand([el("p",{class:"eyebrow",style:"margin-bottom:10px"},"IHA SOLUCIONES LEGALES Y TECNICAS S.A.S."), el("h1",{id:"view-title"},L(title))], [el("p",{class:"upd"},L(UI.lastUpd).replace("{d}", fmtDate(NOV_DATE)))], "desk", true);
  const body = wrapIn("narrow sp stack");
  if (!LEGAL_PAGES_ENABLED) { const b = el("div",{class:"draft-banner"}); b.append(icon("warn"), el("p",{},L(UI.legalDraft))); body.append(b); }
  const s = el("section",{class:"psec legal-sec"});
  items.forEach(([h, p]) => s.append(el("h2",{},h), withEmail(el("p"), p)));
  body.append(s);
  app.append(band, body);
}

document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; try { localStorage.setItem("iha-lang", lang); } catch {} closeLang(true); render(); }));
document.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => { if (b.dataset.nav==="guide") openGuide("all"); else if (b.dataset.nav==="express") openExpress(null); else if (b.dataset.nav==="servicios") openServicios(null); else goHome(); }));
document.getElementById("brand").addEventListener("click", goHome);
function fromHash(first){
  const h = parseHash().route;
  if (h === "guia") { if (view !== "guia") openGuide("all"); return; }
  if (h === "borrador-reclamo" || h === "carta-de-reclamo") { if (view !== "borrador") openDraft(); return; }
  if (h === "express") { if (view !== "express" || exType) openExpress(null); return; }
  if (h.startsWith("express-") && EX_SITS.includes(h.slice(8))) { if (!(view === "express" && exSit === h.slice(8))) openExpress(h.slice(8)); return; }
  if (h.startsWith("servicios-") && UI.offerById(h.slice(10))) { openServicios(h.slice(10)); return; }
  if (own(PAGES, h)) { if (view !== PAGES[h]) openPage(h); return; }
  if (h.startsWith("caso-") && SITS.some(s => s.id === h.slice(5))) { if (!(view === "caso" && caseId === h.slice(5))) openCase(h.slice(5)); return; }
  if (SECTORS.some(s => s.v === h && !s.g)) { if (!(flowId==="consumidor" && answers.sector===h)) start("consumidor", {sector:h}); return; }
  if (own(FLOWS, h)) { if (flowId !== h) start(h); return; }
  if (first) render(); else if (view !== "home") { flowId=null; view="home"; show(); }
}
document.getElementById("skyline").innerHTML = ART.skyline();
{ const fm = document.getElementById("foot-mail"); fm.href = "mailto:" + CONTACT_EMAIL; fm.textContent = CONTACT_EMAIL; }
document.querySelectorAll("[data-legal]").forEach(a => { a.hidden = !LEGAL_PAGES_ENABLED; });
window.addEventListener("hashchange", () => fromHash(false));
fromHash(true);
if (!app.childElementCount) render();
})();
</script>
