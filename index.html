80, art. 26).", "Las ofertas en línea deben indicar su vigencia y la disponibilidad del producto (Ley 2439 de 2024).": "Les offres en ligne doivent indiquer leur durée de validité et la disponibilité du produit (loi 2439 de 2024).", "Reclamo al vendedor: 15 días hábiles de respuesta.": "Réclamation au vendeur : 15 jours ouvrables pour répondre.", "Guarde la publicidad (captura con fecha).": "Gardez la publicité (capture datée).", "Reclamo escrito pidiendo que respeten lo anunciado.": "Réclamation écrite demandant le respect de l’annonce.", "Denuncia ante la SIC; si sufrió un daño, demanda.": "Signalement à la SIC ; si vous avez subi un préjudice, action en justice.", "Captura de la publicidad": "Capture de la publicité", " Verifique si ese plazo ya pasó; aún puede quedar la vía del reclamo y la SIC.": " Vérifiez si ce délai est déjà dépassé ; la voie de la réclamation et la SIC peuvent rester ouvertes.", "Registro Nacional de Turismo (RNT) antes de empezar, tramitado ante la cámara de comercio (Ley 2068 de 2020, art. 3).": "Registre national du tourisme (RNT) avant de commencer, à demander auprès de la chambre de commerce (loi 2068 de 2020, art. 3).", "Registro mercantil activo y RUT, que se piden para tramitar el RNT.": "Une inscription active au registre du commerce et un RUT (identifiant fiscal), exigés pour obtenir le RNT.", "Un código de conducta contra la explotación sexual de niños, niñas y adolescentes, adoptado y fijado en un lugar visible; sin él no se puede inscribir ni actualizar el RNT (Ley 1336 de 2009, arts. 1 y 5).": "Un code de conduite contre l’exploitation sexuelle des enfants et adolescents, adopté et affiché dans un lieu visible ; sans lui, le RNT ne peut être ni obtenu ni mis à jour (loi 1336 de 2009, art. 1 et 5).", "No alojar a menores de edad sin la compañía o la autorización de sus padres o representantes, como exige la Alcaldía de Medellín.": "Ne pas héberger de mineurs sans la présence ou l’autorisation de leurs parents ou représentants, comme l’exige la mairie de Medellín.", "Contribución parafiscal al FONTUR: 2,5 por mil de los ingresos de la actividad turística, cada trimestre; si no hubo ingresos, se declara en cero (Ley 1101 de 2006, art. 3).": "Contribution parafiscale au FONTUR : 2,5 pour mille des revenus de l’activité touristique, chaque trimestre ; sans revenus, on déclare zéro (loi 1101 de 2006, art. 3).", "En Medellín, además: uso del suelo que lo permita, reglamento del edificio que lo autorice expresamente, aviso escrito a la Policía (Ley 1801 de 2016, art. 87), certificado de seguridad de bomberos, concepto sanitario favorable y, si pone música o televisión al público, paz y salvo de derechos de autor.": "À Medellín, en plus : un zonage qui l’autorise, un règlement de copropriété qui l’autorise expressément, une déclaration écrite à la police (loi 1801 de 2016, art. 87), un certificat de sécurité des pompiers, un avis sanitaire favorable et, si vous diffusez musique ou télévision au public, l’attestation de droits d’auteur.", "Y con cada huésped: la TRA, el reporte al SIRE si es extranjero y una póliza que cubra daños a huéspedes y a terceros (Ley 2068 de 2020, arts. 22 y 32).": "Et pour chaque voyageur : la TRA, la déclaration SIRE s’il est étranger et une assurance couvrant les dommages aux voyageurs et aux tiers (loi 2068 de 2020, art. 22 et 32).", "RNT: renovación cada año, entre enero y el 31 de marzo.": "RNT : renouvellement chaque année, entre janvier et le 31 mars.", "FONTUR: declaración y pago cada trimestre.": "FONTUR : déclaration et paiement chaque trimestre.", "TRA y SIRE: con cada huésped, en los plazos que fijan el MinCIT y Migración Colombia.": "TRA et SIRE : pour chaque voyageur, dans les délais fixés par le MinCIT et Migración Colombia.", "RNT, registro mercantil y renovaciones: ante la cámara de comercio.": "RNT, registre du commerce et renouvellements : auprès de la chambre de commerce.", "TRA: plataforma del MinCIT. SIRE: portal de Migración Colombia.": "TRA : plateforme du MinCIT. SIRE : portail de Migración Colombia.", "Uso del suelo: Planeación municipal. Bomberos y concepto sanitario: Cuerpo de Bomberos y Secretaría de Salud.": "Zonage : service d’urbanisme de la commune. Pompiers et avis sanitaire : corps des pompiers et secrétariat à la Santé.", "Un alojamiento sin RNT o que no cumple se reporta ante la SIC; si hay peligro, llame al 123.": "Un logement sans RNT ou non conforme se signale à la SIC ; en cas de danger, appelez le 123.", "Certificado del RNT": "Certificat RNT", "Registro mercantil y RUT": "Registre du commerce et RUT", "Código de conducta contra la explotación sexual de menores, firmado y visible": "Code de conduite contre l’exploitation sexuelle des mineurs, signé et affiché", "Póliza de responsabilidad": "Police d’assurance responsabilité", "Concepto de uso del suelo y reglamento del edificio": "Avis de zonage et règlement de copropriété", "Certificado de bomberos y concepto sanitario": "Certificat des pompiers et avis sanitaire", "Constancia del aviso a la Policía": "Preuve de la déclaration à la police", "Declaraciones al FONTUR": "Déclarations au FONTUR", "Quien arrienda o subarrienda vivienda por periodos inferiores a 30 días presta un servicio turístico (Ley 2068 de 2020, art. 37).": "Louer ou sous-louer un logement pour moins de 30 jours est un service touristique (loi colombienne 2068 de 2020, art. 37).", "Todo prestador debe inscribirse en el Registro Nacional de Turismo (RNT) antes de prestar el servicio (Ley 2068 de 2020, art. 3).": "Tout prestataire doit s’inscrire au Registre national du tourisme (RNT) avant d’offrir le service (loi 2068 de 2020, art. 3).", "Prestar el servicio sin RNT es una infracción: la SIC puede imponer las sanciones del Estatuto del Consumidor y cancelar el registro hasta por 5 años (Ley 2068 de 2020, arts. 71 y 72).": "Exercer sans RNT est une infraction : la SIC peut appliquer les sanctions du Statut du consommateur et annuler l’inscription jusqu’à 5 ans (loi 2068 de 2020, art. 71 et 72).", "Las plataformas deben dejar un espacio para el número de RNT y retirar los anuncios de prestadores sin RNT activo cuando la autoridad lo pida (Ley 2068 de 2020, art. 38).": "Les plateformes doivent prévoir un espace pour le numéro RNT et retirer les annonces des prestataires sans RNT actif à la demande des autorités (loi 2068 de 2020, art. 38).", "El RNT se renueva cada año, entre enero y el 31 de marzo.": "Le RNT se renouvelle chaque année, entre janvier et le 31 mars.", "Verifique en el RNT que su inscripción esté activa.": "Vérifiez dans le RNT que votre inscription est active.", "Si no la tiene, inscríbase antes de seguir publicando y muestre el número en cada anuncio.": "Si vous n’en avez pas, inscrivez-vous avant de continuer à publier et affichez le numéro dans chaque annonce.", "Revise también el reglamento del edificio y el uso del suelo de su zona: el RNT solo no basta.": "Vérifiez aussi le règlement de l’immeuble et le zonage de votre quartier : le RNT seul ne suffit pas.", "Certificado del RNT vigente": "Certificat RNT valide", "Registro mercantil y RUT, si aplica": "Registre du commerce et RUT, le cas échéant", "Capturas de sus anuncios con el número de RNT": "Captures de vos annonces avec le numéro RNT", "El reglamento de propiedad horizontal obliga a los propietarios y a quienes usan los inmuebles del edificio (Ley 675 de 2001).": "Le règlement de copropriété s’impose aux propriétaires et à tous ceux qui utilisent les logements de l’immeuble (loi colombienne 675 de 2001).", "Para operar una vivienda turística, la Alcaldía de Medellín exige que el reglamento autorice expresamente esa actividad.": "Pour exploiter une location touristique, la mairie de Medellín exige que le règlement de copropriété autorise expressément cette activité.", "Las multas por incumplir el reglamento se repiten mientras dure el incumplimiento; cada una no puede superar dos veces la cuota de administración mensual, y en total no más de diez veces (Ley 675 de 2001, art. 59).": "Les amendes pour non-respect du règlement se répètent tant que l’infraction dure ; chacune ne peut dépasser deux fois les charges mensuelles, et au total pas plus de dix fois (loi 675 de 2001, art. 59).", "Antes de sancionarlo, la copropiedad debe darle la oportunidad de explicarse y defenderse.": "Avant de vous sanctionner, la copropriété doit vous permettre de vous expliquer et de vous défendre.", "Revise en la carta de sanción y en el reglamento el plazo para presentar descargos o recursos.": "Vérifiez dans la lettre de sanction et le règlement le délai pour répondre ou contester.", "Pida el reglamento registrado y el acta o la decisión que impuso la multa.": "Demandez le règlement enregistré et le procès-verbal ou la décision qui impose l’amende.", "Presente sus descargos por escrito dentro del plazo.": "Présentez votre défense par écrit dans le délai.", "Si el reglamento no lo permite, suspenda el alquiler por días mientras se define, para no acumular multas.": "Si le règlement ne l’autorise pas, suspendez la location courte durée en attendant, pour ne pas cumuler les amendes.", "Reglamento de propiedad horizontal registrado": "Règlement de copropriété enregistré", "Carta o resolución de la multa": "Lettre ou décision d’amende", "Actas de asamblea": "Procès-verbaux d’assemblée", "Todo prestador de alojamiento debe registrar a sus huéspedes en la Tarjeta de Registro de Alojamiento (TRA), que sirve como prueba del contrato de hospedaje (Ley 2068 de 2020, art. 22).": "Tout prestataire d’hébergement doit enregistrer ses voyageurs sur la fiche d’enregistrement (TRA), qui sert de preuve du contrat d’hébergement (loi 2068 de 2020, art. 22).", "Los huéspedes extranjeros también se reportan a Migración Colombia en el SIRE (Resolución 2357 de 2020), y no hacerlo a tiempo puede dar lugar a multas.": "Les voyageurs étrangers doivent aussi être déclarés à Migración Colombia dans le SIRE (résolution 2357 de 2020), et un retard peut entraîner des amendes.", "Los prestadores de alojamiento deben tener una póliza de seguro que cubra daños a huéspedes y a terceros (Ley 2068 de 2020, art. 32).": "Les prestataires d’hébergement doivent avoir une assurance couvrant les dommages aux voyageurs et aux tiers (loi 2068 de 2020, art. 32).", "En Medellín, la apertura de la vivienda turística se comunica por escrito a la estación de Policía más cercana (Ley 1801 de 2016, art. 87).": "À Medellín, l’ouverture d’une location touristique se déclare par écrit au poste de police le plus proche (loi 1801 de 2016, art. 87).", "Reporte en el SIRE cada entrada y salida de huéspedes extranjeros dentro del plazo que fija Migración Colombia.": "Déclarez dans le SIRE chaque arrivée et départ de voyageur étranger dans le délai fixé par Migración Colombia.", "Haga la TRA de cada huésped a su llegada.": "Remplissez la TRA de chaque voyageur à son arrivée.", "Reporte en el SIRE la entrada y la salida de cada huésped extranjero.": "Déclarez dans le SIRE l’arrivée et le départ de chaque voyageur étranger.", "Guarde las constancias de cada registro y la póliza vigente.": "Conservez les justificatifs de chaque enregistrement et une assurance en cours de validité.", "Constancias de la TRA": "Justificatifs TRA", "Reportes del SIRE": "Déclarations SIRE", "Además del RNT, el uso del suelo de la zona debe permitir el alojamiento turístico según el Plan de Ordenamiento Territorial (POT).": "Outre le RNT, le zonage du quartier doit autoriser l’hébergement touristique selon le plan d’urbanisme (POT).", "En Medellín, según el POT vigente (Acuerdo 48 de 2014), la vivienda turística se permite en zonas de media y alta mixtura de usos.": "À Medellín, selon le POT en vigueur (accord 48 de 2014), la location touristique est autorisée dans les zones de mixité d’usages moyenne et forte.", "Un proyecto de revisión del POT la limitaría a zonas de alta mixtura, zonas de tratamiento especial y áreas de desarrollo orientado al transporte; aún no está aprobado.": "Un projet de révision du POT la limiterait aux zones de forte mixité, aux zones de traitement spécial et aux zones d’aménagement orienté vers les transports ; il n’est pas encore approuvé.", "Verifique el uso del suelo antes de comprar o de publicar un anuncio.": "Vérifiez le zonage avant d’acheter ou de publier une annonce.", "Consulte el uso del suelo de su predio ante Planeación de Medellín y pida el concepto por escrito.": "Consultez le zonage de votre bien auprès de l’urbanisme de Medellín et demandez l’avis écrit.", "Revise que el reglamento del edificio autorice la actividad.": "Vérifiez que le règlement de l’immeuble autorise l’activité.", "Siga las novedades del nuevo POT antes de invertir.": "Suivez l’actualité du nouveau POT avant d’investir.", "Concepto de uso del suelo": "Avis de zonage", "Escritura y certificado de libertad": "Acte de propriété et certificat foncier", "Reglamento de propiedad horizontal": "Règlement de copropriété", "Los términos de la plataforma fijan sus reglas, una apelación interna y a veces un arbitraje en el exterior. Si el servicio se ofrece en Colombia, la ley colombiana y la SIC también pueden aplicar.": "Les conditions de la plateforme fixent ses règles, un recours interne et parfois un arbitrage à l’étranger. Si le service est proposé en Colombie, la loi colombienne et la SIC peuvent aussi s’appliquer.", "Si usa la plataforma como consumidor, las cláusulas abusivas no producen efectos (Ley 1480, arts. 42 y 43).": "Si vous utilisez la plateforme en tant que consommateur, les clauses abusives sont sans effet (loi 1480, art. 42 et 43).", "Puede pedir a la plataforma qué datos personales tiene sobre usted y para qué los usa: debe responder en 10 días hábiles, prorrogables 5 (Ley 1581 de 2012, art. 14).": "Vous pouvez demander à la plateforme quelles données personnelles elle détient sur vous et à quoi elle les utilise : elle doit répondre en 10 jours ouvrables, prolongeables de 5 (loi 1581 de 2012, art. 14).", "Apelación interna: revise el plazo en los términos de la plataforma; suele ser corto.": "Recours interne : vérifiez le délai dans les conditions de la plateforme ; il est souvent court.", "Consulta de datos personales: 10 días hábiles, prorrogables 5.": "Demande d’accès aux données : 10 jours ouvrables, prolongeables de 5.", "Pida por escrito el motivo concreto y la regla que aplicaron.": "Demandez par écrit le motif précis et la règle appliquée.", "Use la apelación interna y guarde la constancia.": "Utilisez le recours interne et gardez la preuve.", "Si no resuelven, queja ante la SIC o la vía que fijen los términos.": "Sans solution, plainte auprès de la SIC ou voie prévue par les conditions.", "Avisos y correos de suspensión": "Avis et e-mails de suspension", "Copia descargada de sus datos": "Copie téléchargée de vos données", "Capturas de su perfil e historial": "Captures de votre profil et de votre historique", "Los términos de la plataforma fijan cuándo puede retener pagos y por cuánto tiempo: es la primera regla que se revisa.": "Les conditions de la plateforme fixent quand elle peut bloquer les paiements et pour combien de temps : c’est la première règle à vérifier.", "Una retención que no se ajusta a los términos es un incumplimiento del contrato y puede reclamarse.": "Un blocage qui ne respecte pas les conditions est une inexécution du contrat et peut être réclamé.", "Si usted actúa como consumidor y el servicio se ofrece en Colombia, la SIC puede ser una vía; si es un negocio, la vía suele ser la del contrato.": "Si vous agissez en tant que consommateur et que le service est proposé en Colombie, la SIC peut être une voie ; si vous êtes une entreprise, la voie est en général celle du contrat.", "Descargue hoy el historial de pagos: puede dejar de estar disponible si la cuenta se cierra.": "Téléchargez aujourd’hui l’historique des paiements : il peut disparaître si le compte est fermé.", "Pida por escrito el motivo, el monto retenido y la fecha de liberación.": "Demandez par écrit le motif, le montant bloqué et la date de déblocage.", "Use la apelación interna.": "Utilisez le recours interne.", "Si no resuelven, carta formal de reclamación y, si el monto lo justifica, la vía del contrato o la SIC.": "Sans solution, lettre de réclamation formelle puis, si le montant le justifie, voie contractuelle ou SIC.", "Historial de pagos y saldo pendiente": "Historique des paiements et solde en attente", "Términos vigentes en la fecha, en PDF": "Conditions en vigueur à la date, en PDF", "Avisos de la plataforma": "Avis de la plateforme", "En alojamiento, las plataformas deben dejar un espacio para el número de RNT y retirar los anuncios de prestadores sin RNT activo cuando la autoridad lo pida (Ley 2068 de 2020, art. 38).": "Dans l’hébergement, les plateformes doivent prévoir un espace pour le numéro RNT et retirer les annonces des prestataires sans RNT actif à la demande des autorités (loi 2068 de 2020, art. 38).", "Fuera de esos casos, el retiro debe ajustarse a los términos de la plataforma: pida la regla concreta que aplicaron.": "En dehors de ces cas, le retrait doit respecter les conditions de la plateforme : demandez la règle précise appliquée.", "No publique acusaciones contra la plataforma en redes: puede debilitar su reclamo.": "Ne publiez pas d’accusations contre la plateforme sur les réseaux : cela peut affaiblir votre réclamation.", "Revise el plazo de apelación en los términos de la plataforma.": "Vérifiez le délai de recours dans les conditions de la plateforme.", "Guarde capturas del anuncio y de sus calificaciones.": "Gardez des captures de l’annonce et de vos notes.", "Pida el motivo por escrito y apele.": "Demandez le motif par écrit et faites un recours.", "Si el motivo es el RNT, regularícelo y pida la reactivación.": "Si le motif est le RNT, régularisez puis demandez la réactivation.", "Capturas del anuncio y de sus reseñas": "Captures de l’annonce et de ses avis", "Aviso de retiro": "Avis de retrait", "Certificado del RNT, si aplica": "Certificat RNT, le cas échéant", "Si pagó con tarjeta o medio electrónico, la reversión del pago debe pedirse dentro de los 5 días hábiles siguientes a enterarse del problema.": "Si vous avez payé par carte ou moyen électronique, l’annulation du paiement doit être demandée dans les 5 jours ouvrables après avoir eu connaissance du problème.", "Las plataformas donde otros venden deben exigir a cada vendedor datos que permitan identificarlo: nombre, documento, dirección y teléfonos (Ley 1480, art. 53).": "Les plateformes où d’autres vendent doivent exiger de chaque vendeur des données permettant de l’identifier : nom, pièce d’identité, adresse et téléphones (loi 1480, art. 53).", "Si usted compró, puede consultar esos datos para presentar su queja o reclamo contra el vendedor (Ley 1480, art. 53).": "Si vous avez acheté, vous pouvez consulter ces données pour déposer votre plainte ou réclamation contre le vendeur (loi 1480, art. 53).", "Si pagó en línea con tarjeta y no recibió el producto, puede proceder la reversión del pago (Ley 1480, art. 51).": "Si vous avez payé en ligne par carte et n’avez pas reçu le produit, l’annulation du paiement peut s’appliquer (loi 1480, art. 51).", "Respuesta del vendedor a su reclamo: 15 días hábiles.": "Réponse du vendeur à votre réclamation : 15 jours ouvrables.", "Pida a la plataforma los datos del vendedor, citando el artículo 53 de la Ley 1480.": "Demandez à la plateforme les données du vendeur, en citant l’article 53 de la loi 1480.", "Reclame por escrito al vendedor.": "Réclamez par écrit auprès du vendeur.", "Si no responde, queja o demanda ante la SIC.": "Sans réponse, plainte ou action devant la SIC.", "Pedido y comprobante de pago": "Commande et preuve de paiement", "Publicación del producto": "L’annonce du produit", "Mensajes con el vendedor y la plataforma": "Messages avec le vendeur et la plateforme", "Una estancia de 30 días o más en vivienda urbana suele regirse por la Ley 820 de 2003, no por las normas de turismo.": "Un séjour de 30 jours ou plus dans un logement urbain relève en général de la loi 820 de 2003, et non des règles du tourisme.", "El arrendador no puede exigir depósitos en dinero ni otras garantías reales para asegurar el pago (Ley 820 de 2003, art. 16).": "Le bailleur ne peut pas exiger de dépôt en argent ni d’autres garanties réelles pour garantir le paiement (loi 820 de 2003, art. 16).", "El canon solo puede subir una vez cada 12 meses y como máximo en el IPC del año anterior (Ley 820 de 2003, art. 20).": "Le loyer ne peut augmenter qu’une fois tous les 12 mois, et au maximum de l’indice des prix de l’année précédente (loi 820 de 2003, art. 20).", "El arrendador debe entregar el inmueble en buen estado y hacer las reparaciones necesarias; el arrendatario responde por las reparaciones locativas causadas por su uso (Ley 820 de 2003, arts. 8 y 9).": "Le bailleur doit remettre le logement en bon état et faire les réparations nécessaires ; le locataire répond des réparations locatives dues à son usage (loi 820 de 2003, art. 8 et 9).", "Medida temporal: si su vivienda o su contrato resultaron afectados directamente por el sismo del 10 de agosto de 2026, el Decreto 1423 de 2026 suspende por 6 meses la ejecución de órdenes de restitución, aplaza los reajustes del canon y permite prorrogar 6 meses los contratos que vencían entre el 10 de agosto y el 31 de diciembre de 2026, con excepciones (riesgo de colapso, vivienda propia del arrendador).": "Mesure temporaire : si votre logement ou votre bail a été directement touché par le séisme du 10 août 2026, le décret 1423 de 2026 suspend pendant 6 mois l’exécution des ordres de restitution, reporte les hausses de loyer et permet de prolonger de 6 mois les baux arrivant à échéance entre le 10 août et le 31 décembre 2026, avec des exceptions (risque d’effondrement, logement propre du bailleur).", "La terminación anticipada exige un preaviso escrito: revise el plazo en su contrato y en la Ley 820.": "La résiliation anticipée exige un préavis écrit : vérifiez le délai dans votre contrat et dans la loi 820.", "Reclame por escrito al arrendador o a la inmobiliaria.": "Réclamez par écrit auprès du bailleur ou de l’agence.", "Intente una conciliación.": "Tentez une conciliation.", "Si no hay acuerdo, el caso va ante un juez civil; las alcaldías vigilan a las inmobiliarias (en Bogotá, la Secretaría del Hábitat).": "Faute d’accord, l’affaire va devant un juge civil ; les mairies contrôlent les agences (à Bogotá, le secrétariat à l’Habitat).", "Contrato de arrendamiento": "Contrat de bail", "Recibos de pago del canon": "Reçus de paiement du loyer", "Inventario y fotos de la entrega": "État des lieux et photos de la remise des clés", "Llame ya a su banco por la línea oficial, reporte la transferencia y bloquee sus canales: en una transferencia inmediata, cada minuto cuenta.": "Appelez tout de suite votre banque sur sa ligne officielle, signalez le virement et bloquez vos accès : avec un virement instantané, chaque minute compte.", "Su banco tiene un deber reforzado de seguridad: debe identificarlo bien y vigilar los movimientos inusuales por monto, frecuencia o destino.": "Votre banque a un devoir de sécurité renforcé : elle doit bien vous identifier et surveiller les opérations inhabituelles par leur montant, leur fréquence ou leur destination.", "Si el banco no detectó ni frenó movimientos claramente inusuales, la Superfinanciera puede ordenarle devolver todo o parte del dinero; también se revisa si usted actuó con cuidado, por ejemplo si compartió claves o reportó tarde.": "Si la banque n’a ni détecté ni bloqué des opérations clairement inhabituelles, la Superintendance financière peut lui ordonner de rembourser tout ou partie de l’argent ; elle vérifie aussi si vous avez été prudent, par exemple si vous avez partagé vos codes ou signalé tard.", "Si usted mismo autorizó la transferencia porque lo engañaron, recuperar el dinero es más difícil: por eso el reporte inmediato y la denuncia son decisivos.": "Si vous avez vous-même autorisé le virement parce qu’on vous a trompé, récupérer l’argent est plus difficile : c’est pourquoi le signalement immédiat et la plainte sont décisifs.", "Puede quejarse ante el Defensor del Consumidor Financiero o la Superfinanciera, y demandar ante la Superfinanciera sin abogado si el valor es menor a 40 salarios mínimos.": "Vous pouvez vous plaindre auprès du médiateur du consommateur financier ou de la Superintendance financière, et agir devant celle-ci sans avocat si le montant est inférieur à 40 salaires minimums.", "Reporte al banco: de inmediato, en la primera hora.": "Signalement à la banque : immédiatement, dans la première heure.", "Llame a su banco por la línea oficial, reporte la transferencia y bloquee la aplicación y las tarjetas. Algunos bancos permiten reportarlo desde su aplicación.": "Appelez votre banque sur sa ligne officielle, signalez le virement et bloquez l’application et les cartes. Certaines banques permettent de le signaler depuis leur application.", "Pida por escrito que el banco contacte al banco que recibió el dinero para intentar retenerlo, y guarde el número de radicado.": "Demandez par écrit à la banque de contacter la banque destinataire pour tenter de bloquer les fonds, et gardez le numéro de dossier.", "Denuncie ante la Fiscalía o en el CAI Virtual de la Policía.": "Portez plainte auprès du parquet (Fiscalía) ou au CAI virtuel de la police.", "Si el banco no responde o se niega, Defensor del Consumidor Financiero y Superfinanciera.": "Si la banque ne répond pas ou refuse, saisissez le médiateur du consommateur financier puis la Superintendance financière.", "Comprobante de la transferencia: hora, monto y llave o cuenta de destino": "Preuve du virement : heure, montant et clé ou compte de destination", "Capturas del chat, el enlace o la llamada del engaño": "Captures de la conversation, du lien ou de l’appel de l’arnaque", "Radicado del reporte al banco": "Numéro de dossier du signalement à la banque", "Mantenga la calma, no firme nada y, si puede hacerlo sin riesgo, grabe lo que pasa. Si hay violencia o amenazas, llame al 123.": "Restez calme, ne signez rien et, si vous pouvez le faire sans risque, filmez ce qui se passe. En cas de violence ou de menaces, appelez le 123.", "Una estadía de menos de 30 días es un contrato de hospedaje (Ley 300 de 1996, art. 79). Solo termina antes de tiempo por falta de pago, por infracción del reglamento oficial del hospedaje o por otra causa pactada expresamente, como unas reglas de la casa que usted aceptó al reservar (Código de Comercio, arts. 1193 y 1197).": "Un séjour de moins de 30 jours est un contrat d’hébergement (loi 300 de 1996, art. 79). Il ne prend fin plus tôt que pour non-paiement, infraction au règlement officiel de l’hébergement ou une autre cause expressément convenue, comme un règlement intérieur accepté lors de la réservation (Code de commerce, art. 1193 et 1197).", "Si el anfitrión lo saca sin una de esas causas, incumple: usted elige otro alojamiento de la misma calidad a costa de él, o el reembolso o la compensación (Ley 300 de 1996, art. 63), y puede reclamar los gastos extra.": "Si l’hôte vous fait sortir sans l’une de ces causes, il manque à ses obligations : vous choisissez un hébergement équivalent à ses frais, ou le remboursement ou une compensation (loi 300 de 1996, art. 63), et vous pouvez réclamer vos frais supplémentaires.", "Durante la estadía, el alojamiento es su domicilio (Constitución, art. 28; Corte Constitucional, C-519 de 2007). La policía solo entra sin orden escrita por imperiosa necesidad, por ejemplo para auxiliar a alguien o por un incendio (Ley 1801 de 2016, art. 163).": "Pendant le séjour, le logement est votre domicile (Constitution, art. 28 ; Cour constitutionnelle, C-519 de 2007). La police n’y entre sans ordre écrit qu’en cas de nécessité impérieuse, par exemple pour porter secours à quelqu’un ou en cas d’incendie (loi 1801 de 2016, art. 163).", "La policía no decide quién tiene razón en el contrato: sus medidas sobre la tenencia de un inmueble son provisionales y el fondo lo resuelve un juez (Ley 1801 de 2016, art. 80). Usted puede grabar el procedimiento (art. 21).": "La police ne tranche pas le litige contractuel : ses mesures sur l’occupation d’un logement sont provisoires et le fond relève d’un juge (loi 1801 de 2016, art. 80). Vous pouvez filmer l’intervention (art. 21).", "Si el anfitrión termina el contrato, debe hacer un inventario de sus pertenencias ante testigos antes de retirarlas (Código de Comercio, art. 1198).": "Si l’hôte met fin au contrat, il doit dresser un inventaire de vos affaires devant témoins avant de les retirer (Code de commerce, art. 1198).", "Avise a la plataforma de inmediato, por su canal de emergencias.": "Prévenez la plateforme immédiatement, par son canal d’urgence.", "Reclamo escrito al anfitrión y a la plataforma: el mismo día; el proveedor tiene 15 días hábiles para responder.": "Réclamation écrite à l’hôte et à la plateforme : le jour même ; le prestataire a 15 jours ouvrables pour répondre.", "Pida el motivo por escrito y muestre su reserva y su pago. Si llega la policía, pida el nombre y la placa de los agentes y el motivo legal de la actuación.": "Demandez le motif par écrit et montrez votre réservation et votre paiement. Si la police arrive, demandez le nom et le matricule des agents et le fondement légal de leur intervention.", "Avise a la plataforma por su canal de emergencias y pida reubicación o reembolso.": "Alertez la plateforme par son canal d’urgence et demandez un relogement ou un remboursement.", "Antes de salir, fotografíe sus pertenencias y no deje documentos ni dinero; si el anfitrión las retira, exija el inventario ante testigos.": "Avant de partir, photographiez vos affaires et ne laissez ni papiers ni argent ; si l’hôte les retire, exigez l’inventaire devant témoins.", "Si hay violencia o amenazas, o le retienen sus cosas, llame al 123 y denuncie.": "En cas de violence, de menaces ou de rétention de vos affaires, appelez le 123 et portez plainte.", "Después: reclamo escrito al anfitrión y a la plataforma, y queja o demanda ante la SIC.": "Ensuite : réclamation écrite à l’hôte et à la plateforme, puis plainte ou action devant la SIC.", "Reserva y comprobante de pago": "Réservation et preuve de paiement", "Mensajes del anfitrión y de la plataforma": "Messages de l’hôte et de la plateforme", "Video o audio de lo ocurrido, con nombre y placa de los policías": "Vidéo ou audio des faits, avec le nom et le matricule des policiers", "Facturas del nuevo alojamiento y del transporte": "Factures du nouvel hébergement et du transport", "Fotos o inventario de sus pertenencias": "Photos ou inventaire de vos affaires", "No use la fuerza, no cambie la cerradura ni corte los servicios con el huésped adentro, y no retire sus cosas sin inventario: un problema del contrato puede volverse un problema penal. Si hay violencia, llame al 123.": "N’employez pas la force, ne changez pas la serrure et ne coupez pas les services avec le voyageur à l’intérieur, et ne retirez pas ses affaires sans inventaire : un litige contractuel peut devenir pénal. En cas de violence, appelez le 123.", "El hospedaje termina al vencer el plazo, por falta de pago, por infracción del reglamento oficial del hospedaje o por otra causa pactada expresamente (Código de Comercio, arts. 1193 y 1197). Sus reglas de la casa solo cuentan como causa si el huésped las aceptó expresamente al reservar.": "L’hébergement prend fin à l’échéance, pour non-paiement, infraction au règlement officiel de l’hébergement ou une autre cause expressément convenue (Code de commerce, art. 1193 et 1197). Votre règlement intérieur ne compte comme cause que si le voyageur l’a expressément accepté lors de la réservation.", "Si termina el contrato, haga un inventario de las pertenencias del huésped ante testigos antes de retirarlas (Código de Comercio, art. 1198). Si no paga, la ley prevé el remate de sus bienes por un martillo autorizado, no quedárselos (art. 1199).": "Si vous mettez fin au contrat, dressez un inventaire des affaires du voyageur devant témoins avant de les retirer (Code de commerce, art. 1198). S’il ne paie pas, la loi prévoit une vente aux enchères par un commissaire-priseur agréé, pas la conservation des biens (art. 1199).", "Mientras la estadía está vigente, el alojamiento es el domicilio del huésped (Constitución, art. 28; C-519 de 2007): entrar sin su permiso o grabar su vida privada adentro puede ser un delito (Código Penal, art. 189).": "Tant que le séjour est en cours, le logement est le domicile du voyageur (Constitution, art. 28 ; C-519 de 2007) : y entrer sans permission ou filmer sa vie privée peut être un délit (Code pénal, art. 189).", "Por ruido, fiestas o riñas, la policía puede intervenir por convivencia (Ley 1801 de 2016, art. 33).": "En cas de bruit, de fête ou de bagarre, la police peut intervenir au titre de la tranquillité publique (loi 1801 de 2016, art. 33).", "Si el huésped se queda después del fin de la reserva, el contrato ya terminó (Código de Comercio, art. 1197). El hospedaje tiene su propio mecanismo, distinto del proceso de restitución del arrendamiento: inventario ante testigos y retiro de las pertenencias (art. 1198), y querella ante la policía o el inspector como titular de la tenencia (Ley 1801 de 2016, arts. 77 y 79). Nunca por la fuerza.": "Si le voyageur reste après la fin de la réservation, le contrat a pris fin (Code de commerce, art. 1197). L’hébergement a son propre mécanisme, distinct de la procédure de restitution du bail : inventaire devant témoins et retrait des affaires (art. 1198), et plainte auprès de la police ou de l’inspecteur en tant que détenteur légitime (loi 1801 de 2016, art. 77 et 79). Jamais par la force.", "Querella ante el inspector de policía como titular de la tenencia: preséntela cuanto antes; caduca a los 4 meses (Ley 1801 de 2016, arts. 79 y 80). La acción preventiva de 48 horas (art. 81) está pensada para ocupaciones de hecho: su uso contra un huésped que entró por contrato es discutible.": "Plainte à l’inspecteur de police en tant que détenteur légitime : déposez-la au plus vite ; elle se périme au bout de 4 mois (loi 1801 de 2016, art. 79 et 80). L’action préventive de 48 heures (art. 81) vise les occupations de fait : l’utiliser contre un voyageur entré par contrat est discutable.", "Protección policiva de la tenencia: caduca a los 4 meses (Ley 1801 de 2016, art. 80).": "Protection policière de l’occupation : expire au bout de 4 mois (loi 1801 de 2016, art. 80).", "Reporte a la plataforma: el mismo día, por su canal de emergencias.": "Signalement à la plateforme : le jour même, par son canal d’urgence.", "Escriba al huésped, por la plataforma, el motivo y la hora de salida, citando sus reglas de la casa.": "Écrivez au voyageur via la plateforme le motif et l’heure de départ, en citant votre règlement intérieur.", "Avise a la plataforma por su canal de emergencias o de seguridad.": "Alertez la plateforme par son canal d’urgence ou de sécurité.", "Si hay ruido, riña o peligro, llame al 123; si el huésped se queda después del fin de la reserva, pida la protección de la policía o del inspector.": "En cas de bruit, de bagarre ou de danger, appelez le 123 ; si le voyageur reste après la fin de la réservation, demandez la protection de la police ou de l’inspecteur.", "No entre, no cambie la cerradura y no retire sus cosas sin inventario ante testigos.": "N’entrez pas, ne changez pas la serrure et ne retirez pas ses affaires sans inventaire devant témoins.", "Si no pagó o causó daños, use el reclamo de la plataforma y, si no se resuelve, la vía civil.": "S’il n’a pas payé ou a causé des dégâts, utilisez la procédure de réclamation de la plateforme puis, à défaut, la voie civile.", "Reserva con fechas y reglas de la casa aceptadas": "Réservation avec dates et règlement intérieur accepté", "Mensajes con el huésped y la plataforma": "Messages avec le voyageur et la plateforme", "Fotos o video de daños o del ruido, tomados desde zonas comunes": "Photos ou vidéo des dégâts ou du bruit, prises depuis les parties communes", "Inventario firmado ante testigos, si retiró pertenencias": "Inventaire signé devant témoins, si des affaires ont été retirées", "Número del reporte a la policía o a la plataforma": "Numéro du signalement à la police ou à la plateforme", "No salga del hotel sin una constancia escrita: pida que le confirmen por escrito que no hay habitación y qué solución le dan.": "Ne quittez pas l’hôtel sans preuve écrite : demandez qu’on vous confirme par écrit qu’il n’y a pas de chambre et quelle solution on vous propose.", "La sobreventa es un incumplimiento: el hotel debe darle un alojamiento de la misma calidad, o la devolución o compensación del precio; si no tiene uno igual, debe contratarlo con un tercero a su costa (Ley 300 de 1996, arts. 63 y 64).": "La surréservation est un manquement : l’hôtel doit vous fournir un hébergement de même qualité, ou le remboursement ou une compensation ; s’il n’en a pas, il doit le réserver auprès d’un tiers à ses frais (loi 300 de 1996, art. 63 et 64).", "Usted elige entre el alojamiento equivalente y el reembolso.": "C’est vous qui choisissez entre l’hébergement équivalent et le remboursement.", "Si reservó por una agencia o una app, avísele también: debe ayudarle a resolver según su política.": "Si vous avez réservé via une agence ou une appli, prévenez-la aussi : elle doit vous aider selon sa politique.", "Pida la solución por escrito antes de salir del hotel.": "Demandez la solution par écrit avant de quitter l’hôtel.", "Reclamo escrito: el proveedor tiene 15 días hábiles para responder.": "Réclamation écrite : le prestataire a 15 jours ouvrables pour répondre.", "Pida en la recepción una constancia escrita de que no hay habitación y de la solución que le ofrecen.": "Demandez à la réception une attestation écrite qu’il n’y a pas de chambre et de la solution proposée.", "Elija: alojamiento equivalente pagado por el hotel, o la devolución del precio.": "Choisissez : un hébergement équivalent payé par l’hôtel, ou le remboursement.", "Guarde las facturas de transporte, comidas y la diferencia de precio.": "Gardez les factures de transport, de repas et la différence de prix.", "Confirmación de la reserva y pago": "Confirmation de réservation et paiement", "Constancia escrita del hotel": "Attestation écrite de l’hôtel", "Facturas de los gastos extra": "Factures des frais supplémentaires", "Fotos o video en la recepción": "Photos ou vidéo à la réception", "Solo un juez puede ordenar que usted salga de una vivienda arrendada. No entregue las llaves ni firme nada bajo presión; si hay violencia, llame al 123.": "Seul un juge peut ordonner que vous quittiez un logement loué. Ne rendez pas les clés et ne signez rien sous la pression ; en cas de violence, appelez le 123.", "Si usted no entrega la vivienda, el arrendador debe iniciar un proceso de restitución ante un juez (Código General del Proceso, art. 384). Ni el arrendador ni la policía pueden reemplazar esa orden.": "Si vous ne rendez pas le logement, le propriétaire doit engager une procédure de restitution devant un juge (Code général du procès, art. 384). Ni le propriétaire ni la police ne peuvent remplacer cette décision.", "Sin una falta suya, el arrendador puede terminar el contrato: durante las prórrogas, con preaviso escrito de al menos tres meses por correo certificado y una indemnización de tres cánones (Ley 820 de 2003, art. 22, num. 7); o al vencimiento, con preaviso de tres meses, para ocupar la vivienda, demolerla o repararla, o venderla, y después de cuatro años de contrato también por su sola voluntad, con una indemnización de un canon y medio (art. 22, num. 8).": "Sans faute de votre part, le propriétaire peut mettre fin au bail : pendant les reconductions, avec un préavis écrit d’au moins trois mois par courrier certifié et une indemnité de trois mois de loyer (loi 820 de 2003, art. 22, num. 7) ; ou à l’échéance, avec un préavis de trois mois, pour habiter, démolir ou réparer, ou vendre le logement, et après quatre ans de bail aussi par sa seule volonté, avec une indemnité d’un mois et demi de loyer (art. 22, num. 8).", "Si el arrendador le suspende los servicios públicos a propósito, usted puede terminar el contrato y pagar la reconexión descontándola del canon (Ley 820 de 2003, art. 24, num. 1).": "Si le propriétaire coupe volontairement vos services, vous pouvez mettre fin au bail et payer le rétablissement en le déduisant du loyer (loi 820 de 2003, art. 24, num. 1).", "Si le impiden entrar, por ejemplo cambiando la cerradura: como arrendatario, usted es mero tenedor (Código Civil, art. 775) y puede presentar una querella ante el inspector de policía, que puede ordenar que le restituyan la tenencia (Ley 1801 de 2016, arts. 77, num. 5, y 79). En el momento, llame al 123.": "Si on vous empêche d’entrer, par exemple en changeant la serrure : en tant que locataire, vous êtes détenteur légitime (Code civil, art. 775) et pouvez saisir l’inspecteur de police, qui peut ordonner qu’on vous rende l’accès (loi 1801 de 2016, art. 77, num. 5, et 79). Sur le moment, appelez le 123.", "Entrar a su vivienda sin su permiso, aunque sea el dueño, puede ser violación de habitación ajena (Código Penal, art. 189); obligarlo a salir con amenazas puede ser constreñimiento ilegal (art. 182).": "Entrer chez vous sans permission, même en étant propriétaire, peut constituer une violation de domicile (Code pénal, art. 189) ; vous forcer à partir par des menaces peut constituer une contrainte illégale (art. 182).", "Querella ante el inspector de policía si le impiden entrar: preséntela cuanto antes; caduca a los 4 meses del hecho (Ley 1801 de 2016, art. 80).": "Plainte à l’inspecteur de police si on vous empêche d’entrer : déposez-la au plus vite ; elle se périme 4 mois après les faits (loi 1801 de 2016, art. 80).", "Preaviso del arrendador para terminar sin falta suya: al menos 3 meses (Ley 820 de 2003, art. 22).": "Préavis du propriétaire pour résilier sans faute de votre part : au moins 3 mois (loi 820 de 2003, art. 22).", "Si hay proceso de restitución, siga pagando el canon: si no lo consigna, no lo escuchan en el proceso (Código General del Proceso, art. 384).": "S’il y a une procédure de restitution, continuez à payer le loyer : sinon, vous ne serez pas entendu (Code général du procès, art. 384).", "No entregue las llaves ni firme una entrega bajo presión.": "Ne rendez pas les clés et ne signez pas de restitution sous la pression.", "Pida por escrito el motivo y el fundamento legal.": "Demandez par écrit le motif et le fondement légal.", "Si le cambian la cerradura o le impiden entrar, llame al 123 o acuda al inspector de policía.": "Si on change la serrure ou vous empêche d’entrer, appelez le 123 ou adressez-vous à l’inspecteur de police.", "Siga pagando el canon y guarde los recibos; si el arrendador no lo recibe, consúltenos cómo consignarlo.": "Continuez à payer le loyer et gardez les reçus ; si le propriétaire le refuse, demandez-nous comment le consigner.", "Si le cortaron los servicios, guarde las facturas de reconexión.": "Si les services ont été coupés, gardez les factures de rétablissement.", "Avisos o cartas del arrendador": "Avis ou lettres du propriétaire", "Fotos o video de la cerradura cambiada o del corte": "Photos ou vidéo de la serrure changée ou de la coupure", "Número del reporte a la policía": "Numéro du signalement à la police", "Quien se dedica a arrendar o intermediar vivienda urbana en municipios de más de 15.000 habitantes debe estar matriculado ante la autoridad local (Ley 820 de 2003, art. 28).": "Toute personne dont l’activité est de louer ou d’intermédier des logements urbains dans une commune de plus de 15 000 habitants doit être immatriculée auprès de l’autorité locale (loi 820 de 2003, art. 28).", "La alcaldía (en Bogotá, la Secretaría del Hábitat) vigila a arrendadores e inmobiliarias y atiende quejas, por ejemplo por depósitos ilegales o por no entregar copia del contrato o los recibos (Ley 820 de 2003, art. 33).": "La mairie (à Bogotá, le Secrétariat de l’habitat) contrôle propriétaires et agences et traite les plaintes, par exemple pour cautions illégales ou absence de copie du bail ou des reçus (loi 820 de 2003, art. 33).", "Puede imponer multas de hasta 100 salarios mínimos y suspender o cancelar la matrícula (Ley 820 de 2003, art. 34).": "Elle peut infliger des amendes jusqu’à 100 salaires minimums et suspendre ou annuler l’immatriculation (loi 820 de 2003, art. 34).", "No le pueden exigir depósitos en dinero ni otras garantías reales para asegurar el pago (Ley 820 de 2003, art. 16).": "On ne peut pas exiger de vous une caution en espèces ni d’autres garanties réelles pour assurer le paiement (loi 820 de 2003, art. 16).", "Reclamo escrito a la inmobiliaria primero: guarde la constancia de envío.": "Réclamation écrite à l’agence d’abord : gardez la preuve d’envoi.", "Queja ante la alcaldía: preséntela con el contrato y los recibos.": "Plainte à la mairie : déposez-la avec le bail et les reçus.", "Pida por escrito copia del contrato, de los recibos y la liquidación de lo que le deben.": "Demandez par écrit une copie du bail, des reçus et le décompte de ce qu’on vous doit.", "Verifique en la alcaldía si la inmobiliaria está matriculada.": "Vérifiez auprès de la mairie si l’agence est immatriculée.", "Presente queja ante la alcaldía (en Bogotá, la Secretaría del Hábitat).": "Déposez plainte auprès de la mairie (à Bogotá, le Secrétariat de l’habitat).", "Si hay dinero en disputa, conciliación y, si no hay acuerdo, juez civil.": "Si de l’argent est en jeu, conciliation puis, à défaut d’accord, juge civil.", "Contrato y anexos": "Bail et annexes", "Recibos y extractos de pago": "Reçus et relevés de paiement", "Correos y mensajes con la inmobiliaria": "Courriels et messages avec l’agence", "Constancia del reclamo escrito": "Preuve de la réclamation écrite", "El hospedaje es solo para estadías de menos de 30 días (Ley 300 de 1996, art. 79). Una estadía de 30 días o más ya no es hospedaje turístico, aunque se reserve por una app.": "Le contrat d’hébergement ne vise que les séjours de moins de 30 jours (loi 300 de 1996, art. 79). Un séjour de 30 jours ou plus n’est plus de l’hébergement touristique, même réservé via une appli.", "Si es una vivienda urbana que usted usa para vivir, por regla general es un arrendamiento de vivienda urbana (Ley 820 de 2003, art. 2): no le pueden exigir depósitos en dinero (art. 16) y, si usted no entrega, el arrendador debe acudir a un juez (Código General del Proceso, art. 384).": "S’il s’agit d’un logement urbain où vous vivez, c’est en règle générale un bail d’habitation (loi 820 de 2003, art. 2) : aucune caution en espèces ne peut être exigée (art. 16) et, si vous ne partez pas, le propriétaire doit saisir un juge (Code général du procès, art. 384).", "La plataforma sigue siendo intermediaria: sus términos y su centro de resolución aplican, y debe tener identificado al anfitrión para que usted pueda reclamar (Ley 1480 de 2011, art. 53).": "La plateforme reste l’intermédiaire : ses conditions et son centre de résolution s’appliquent, et elle doit avoir identifié l’hôte pour que vous puissiez réclamer (loi 1480 de 2011, art. 53).", "Lo que cuenta es lo que realmente pactaron y cómo se usa el inmueble, no el nombre que le dé la plataforma (Código Civil, art. 1618).": "Ce qui compte, c’est ce qui a réellement été convenu et l’usage du logement, pas le nom que lui donne la plateforme (Code civil, art. 1618).", "Si hay un problema, avise a la plataforma el mismo día: sus plazos para reportar suelen ser cortos.": "En cas de problème, prévenez la plateforme le jour même : ses délais de signalement sont souvent courts.", "Guarde la reserva y los términos de la plataforma vigentes en la fecha de la reserva (PDF o capturas).": "Gardez la réservation et les conditions de la plateforme en vigueur à la date de réservation (PDF ou captures).", "Revise si firmó un contrato aparte con el anfitrión.": "Vérifiez si vous avez signé un contrat séparé avec l’hôte.", "Ante un conflicto, escriba al anfitrión y a la plataforma, y consúltenos antes de entregar el inmueble.": "En cas de conflit, écrivez à l’hôte et à la plateforme, et consultez-nous avant de rendre le logement.", "Reserva y pagos": "Réservation et paiements", "Términos de la plataforma vigentes en la fecha": "Conditions de la plateforme en vigueur à cette date", "Mensajes con el anfitrión": "Messages avec l’hôte", "Contrato aparte, si lo hay": "Contrat séparé, le cas échéant", "Si hubo un delito, denúncielo; la reclamación de consumo puede avanzar al mismo tiempo, porque el plazo de un año para demandar sigue corriendo (Ley 1480 de 2011, art. 58).": "S’il y a eu un délit, portez plainte ; la réclamation de consommation peut avancer en parallèle, car le délai d’un an pour agir continue de courir (loi 1480 de 2011, art. 58).", "Si el lugar no tiene RNT o es inseguro, puede reportarlo ante la SIC; si hay peligro, llame al 123.": "Si le logement n’a pas de RNT ou n’est pas sûr, vous pouvez le signaler à la SIC ; en cas de danger, appelez le 123."}, "pt": {"Garantía legal: todo producto debe servir para lo que se vende. Si no se indica plazo, la garantía de un producto nuevo es de un año desde la entrega (Ley 1480, art. 8). Un bien usado tiene tres meses de garantía, salvo que se haya vendido sin garantía con aceptación expresa y por escrito (Decreto 735 de 2013, art. 12).": "Garantia legal: todo produto deve servir para aquilo para o qual é vendido. Se não for indicado prazo, a garantia de um produto novo é de um ano a partir da entrega (Lei 1480, art. 8). Um bem usado tem três meses de garantia, salvo se foi vendido sem garantia com aceitação expressa e por escrito (Decreto 735 de 2013, art. 12).", "Reparación gratuita como regla. Si la falla se repite, usted elige: nueva reparación, cambio o devolución del precio (Ley 1480, art. 11). La reparación debe hacerse en máximo 30 días hábiles si la SIC no fija otro plazo, y la devolución del dinero en 15 días hábiles después de entregar el bien (Decreto 735 de 2013, arts. 8 y 10).": "O conserto gratuito é a regra. Se o defeito se repetir, você escolhe: novo conserto, troca ou devolução do preço (Lei 1480, art. 11). O conserto deve ser feito em no máximo 30 dias úteis se a SIC não fixar outro prazo, e a devolução do dinheiro em 15 dias úteis após a entrega do bem (Decreto 735 de 2013, arts. 8 e 10).", "Servicios mal prestados: usted elige que se repita el servicio o que le devuelvan el dinero (Decreto 735 de 2013, art. 16).": "Serviços mal prestados: você escolhe se o serviço é prestado novamente ou se o dinheiro é devolvido (Decreto 735 de 2013, art. 16).", "Precio: debe informarse en pesos y usted solo está obligado a pagar el precio anunciado (Ley 1480, art. 26).": "Preço: deve ser informado em pesos e você só é obrigado a pagar o preço anunciado (Lei 1480, art. 26).", "Cláusulas abusivas, como las que limitan la responsabilidad del proveedor, no tienen efecto (Ley 1480, arts. 42 y 43).": "Cláusulas abusivas, como as que limitam a responsabilidade do fornecedor, não têm efeito (Lei 1480, arts. 42 e 43).", "Permanencia mínima: solo vale si se pactó de forma expresa y, por regla general, no puede pasar de un año (Ley 1480, art. 41).": "Fidelidade mínima: só vale se foi pactuada de forma expressa e, em regra, não pode passar de um ano (Lei 1480, art. 41).", "Primero reclame por escrito al proveedor; debe responder en 15 días hábiles. Guarde copia: es requisito para demandar (Ley 1480, art. 58, num. 5).": "Primeiro reclame por escrito ao fornecedor; ele deve responder em 15 dias úteis. Guarde uma cópia: é requisito para entrar com ação (Lei 1480, art. 58, inciso 5).", "Demanda ante la SIC: a más tardar un año después de vencida la garantía (Ley 1480, art. 58, num. 3). Según la SIC, si lo que reclama es inferior a 40 salarios mínimos mensuales, no necesita abogado.": "Ação perante a SIC: no máximo um ano depois do fim da garantia (Lei 1480, art. 58, inciso 3). Segundo a SIC, se o valor reclamado for inferior a 40 salários mínimos mensais, você não precisa de advogado.", "Compras en línea: retracto de 5 días hábiles, devolución del dinero en máximo 15 días calendario y reversión del pago en 5 días hábiles en los casos de ley (Ley 1480 y Ley 2439 de 2024).": "Compras on-line: arrependimento em 5 dias úteis, devolução do dinheiro em no máximo 15 dias corridos e estorno do pagamento em 5 dias úteis nos casos previstos em lei (Lei 1480 e Lei 2439 de 2024).", "Si el prestador no cumple lo reservado, usted elige: otro servicio de la misma calidad o el reembolso o compensación del precio. Si no puede darle uno igual, debe contratarlo con un tercero a su costa (Ley 300 de 1996, art. 63).": "Se o prestador não cumprir o que foi reservado, você escolhe: outro serviço da mesma qualidade ou o reembolso ou compensação do preço. Se não puder oferecer um equivalente, ele deve contratá-lo com um terceiro por conta própria (Lei 300 de 1996, art. 63).", "La sobreventa recibe el mismo trato (Ley 300 de 1996, art. 64).": "O overbooking recebe o mesmo tratamento (Lei 300 de 1996, art. 64).", "Cancelar una reserva confirmada para revenderla más cara es un incumplimiento que la SIC puede sancionar.": "Cancelar uma reserva confirmada para revendê-la mais caro é um descumprimento que a SIC pode sancionar.", "Si reservó por una app de alojamiento, revise también lo que ofrece la política de la plataforma.": "Se você reservou por um app de hospedagem, confira também o que a política da plataforma oferece.", "Reclame por escrito de inmediato; el proveedor tiene 15 días hábiles para responder.": "Reclame por escrito imediatamente; o fornecedor tem 15 dias úteis para responder.", "Demanda ante la SIC: hasta un año.": "Ação na SIC: até um ano.", "Escriba al anfitrión u hotel y a la plataforma pidiendo alojamiento equivalente o reembolso.": "Escreva ao anfitrião ou hotel e à plataforma pedindo hospedagem equivalente ou reembolso.", "Si paga otro alojamiento más caro o transporte extra, guarde las facturas.": "Se pagar outra hospedagem mais cara ou transporte extra, guarde as notas fiscais.", "Si no resuelven, queja o demanda ante la SIC.": "Se não resolverem, queixa ou ação na SIC.", "Confirmación de la reserva y comprobante de pago": "Confirmação da reserva e comprovante de pagamento", "Mensajes de cancelación con fecha": "Mensagens de cancelamento com data", "Capturas del anuncio": "Capturas de tela do anúncio", "Facturas de los gastos adicionales": "Notas dos gastos adicionais", "La información y la publicidad deben ser veraces; quien anuncia responde por lo que ofrece (Ley 1480, arts. 23 y 30).": "A informação e a publicidade devem ser verdadeiras; quem anuncia responde pelo que oferece (Lei 1480, arts. 23 e 30).", "Si el servicio no corresponde, usted puede pedir que se preste como se contrató o la devolución del dinero (garantía de servicios, Decreto 735 de 2013, art. 16).": "Se o serviço não corresponder, você pode pedir que seja prestado como contratado ou a devolução do dinheiro (garantia de serviços, Decreto 735 de 2013, art. 16).", "Si la plataforma permite publicar a un prestador sin Registro Nacional de Turismo activo, responde ante usted por publicidad engañosa (Ley 2068 de 2020, art. 39).": "Se a plataforma permite que um prestador publique sem Registro Nacional de Turismo (RNT) ativo, ela responde perante você por publicidade enganosa (Lei 2068 de 2020, art. 39).", "Avise el mismo día por escrito: las plataformas suelen fijar plazos cortos para reportar problemas (revise sus términos).": "Avise por escrito no mesmo dia: as plataformas costumam fixar prazos curtos para relatar problemas (confira os termos).", "Al llegar, tome fotos y video con fecha visible.": "Ao chegar, tire fotos e faça vídeo com a data visível.", "Escriba al anfitrión y a la plataforma pidiendo solución, reubicación o reembolso.": "Escreva ao anfitrião e à plataforma pedindo solução, realocação ou reembolso.", "Capturas del anuncio tal como estaba al reservar": "Capturas do anúncio tal como estava ao reservar", "Fotos y video del lugar": "Fotos e vídeo do local", "Mensajes con el anfitrión y la plataforma": "Mensagens com o anfitrião e a plataforma", "Solo debe pagar el precio total anunciado antes de pagar (Ley 1480, art. 26).": "Você só deve pagar o preço total anunciado antes do pagamento (Lei 1480, art. 26).", "El depósito se devuelve según lo pactado; cualquier descuento por daños debe justificarse con pruebas.": "A caução é devolvida conforme o combinado; qualquer desconto por danos deve ser justificado com provas.", "Si el cobro fue en línea con tarjeta y es fraudulento, no solicitado o por algo no recibido, puede proceder la reversión del pago (Ley 1480, art. 51).": "Se a cobrança on-line no cartão for fraudulenta, não solicitada ou por algo não recebido, pode caber o estorno do pagamento (Lei 1480, art. 51).", "Reversión del pago: 5 días hábiles desde que se enteró.": "Estorno do pagamento: 5 dias úteis desde que soube.", "Respuesta del proveedor a su reclamo: 15 días hábiles.": "Resposta do fornecedor à sua reclamação: 15 dias úteis.", "Pida por escrito el desglose del cobro o la razón del descuento.": "Peça por escrito o detalhamento da cobrança ou o motivo do desconto.", "Si procede, pida la reversión al vendedor y a su banco.": "Se couber, peça o estorno ao vendedor e ao seu banco.", "Anuncio con el precio": "Anúncio com o preço", "Recibos y extractos": "Recibos e extratos", "Fotos de entrega del lugar": "Fotos do local na entrada", "Mensajes": "Mensagens", "Si pagó en línea con tarjeta un cobro que no reconoce, la reversión del pago debe pedirse dentro de los 5 días hábiles siguientes a enterarse.": "Se você pagou on-line com cartão uma cobrança que não reconhece, o estorno do pagamento deve ser pedido dentro de 5 dias úteis depois de ficar sabendo.", "Usted tiene derecho a la seguridad y a no sufrir daños en condiciones normales de uso (Ley 1480).": "Você tem direito à segurança e a não sofrer danos em condições normais de uso (Lei 1480).", "Los prestadores de alojamiento turístico deben tener una póliza de responsabilidad por daños a huéspedes y a terceros, que cubre como mínimo muerte, incapacidad, lesiones, daños a bienes de terceros y gastos médicos (Ley 2068 de 2020, art. 32). Pida los datos de la póliza.": "Os prestadores de hospedagem turística devem ter seguro de responsabilidade por danos a hóspedes e terceiros, que cobre no mínimo morte, invalidez, lesões, danos a bens de terceiros e despesas médicas (Lei 2068 de 2020, art. 32). Peça os dados da apólice.", "Si hubo un delito, la denuncia penal va primero; la reclamación de consumo, después.": "Se houve um crime, a denúncia penal vem primeiro; a reclamação de consumo, depois.", "Reporte por escrito al prestador el mismo día.": "Relate por escrito ao prestador no mesmo dia.", "Si hay peligro, llame al 123.": "Se houver perigo, ligue para o 123.", "Atención médica y denuncia si corresponde.": "Atendimento médico e denúncia, se for o caso.", "Reporte escrito al hotel o anfitrión y a la plataforma.": "Relato por escrito ao hotel ou anfitrião e à plataforma.", "Reclamación por los daños; si no responden, demanda civil o ante la SIC.": "Reclamação pelos danos; se não responderem, ação civil ou perante a SIC.", "Fotos y video": "Fotos e vídeo", "Informe médico": "Laudo médico", "Denuncia": "Denúncia", "Mensajes con el prestador": "Mensagens com o prestador", "Si un servicio turístico vendido no se presta, usted elige otro de la misma calidad o el reembolso o compensación del precio (Ley 300 de 1996, art. 63).": "Se um serviço turístico vendido não é prestado, você escolhe outro da mesma qualidade ou o reembolso ou compensação do preço (Lei 300 de 1996, art. 63).", "La información del paquete debe ser veraz, completa y entregada antes de pagar (Ley 1480).": "A informação do pacote deve ser verdadeira, completa e entregue antes do pagamento (Lei 1480).", "Reclame a la agencia y al prestador directo (hotel, aerolínea, operador): ambos pueden responder.": "Reclame à agência e ao prestador direto (hotel, companhia aérea, operadora): ambos podem responder.", "Respuesta a su reclamo: 15 días hábiles.": "Resposta à sua reclamação: 15 dias úteis.", "Reclamo escrito a la agencia y al prestador.": "Reclamação por escrito à agência e ao prestador.", "Contrato o voucher del paquete": "Contrato ou voucher do pacote", "Publicidad del paquete": "Publicidade do pacote", "Pagos": "Pagamentos", "Rige la política de cancelación que aceptó, si se la informaron antes de pagar.": "Vale a política de cancelamento que você aceitou, se ela foi informada antes do pagamento.", "Si usted no se presenta, el prestador puede cobrar hasta el 20 % del precio o retener el anticipo pactado (Ley 300 de 1996, art. 65).": "Se você não comparecer, o prestador pode cobrar até 20% do preço ou reter o sinal combinado (Lei 300 de 1996, art. 65).", "Una cláusula que impida todo reembolso en cualquier caso puede revisarse como abusiva (Ley 1480, arts. 42 y 43).": "Uma cláusula que impeça qualquer reembolso em todos os casos pode ser questionada como abusiva (Lei 1480, arts. 42 e 43).", "La ley prevé un retracto de 5 días hábiles en servicios comprados a distancia que no empiecen a ejecutarse antes de cinco días (Ley 1480, art. 47). Su aplicación a su reserva concreta la verifica nuestro equipo de abogados.": "A lei prevê arrependimento de 5 dias úteis em serviços comprados a distância que não comecem a ser executados antes de cinco dias (Lei 1480, art. 47). A aplicação à sua reserva concreta é verificada pelos nossos advogados.", "Cancele por escrito y lo antes posible para entrar en la franja más favorable de la política.": "Cancele por escrito e o quanto antes para ficar na faixa mais favorável da política.", "Revise la política de cancelación que aceptó.": "Confira a política de cancelamento que você aceitou.", "Cancele por escrito y pida la liquidación del reembolso.": "Cancele por escrito e peça o cálculo do reembolso.", "Si la retención le parece abusiva, reclame y luego acuda a la SIC.": "Se a retenção parecer abusiva, reclame e depois recorra à SIC.", "Política de cancelación (captura)": "Política de cancelamento (captura de tela)", "Confirmación y pago": "Confirmação e pagamento", "Más de 1 hora y menos de 3, por causa de la aerolínea: refrigerio y una llamada.": "Mais de 1 hora e menos de 3, por causa da companhia aérea: lanche e uma ligação.", "Más de 3 y menos de 5 horas: además, alimentos según la hora.": "Mais de 3 e menos de 5 horas: além disso, refeições conforme o horário.", "Más de 5 horas: compensación adicional mínima del 30 % del valor del trayecto.": "Mais de 5 horas: compensação adicional mínima de 30% do valor do trecho.", "Si la demora pasa de las 10 p. m.: hospedaje (si no vive en esa ciudad) y traslados.": "Se o atraso passar das 22h: hospedagem (se você não mora nessa cidade) e traslados.", "Por clima u otras causas ajenas a la aerolínea no hay compensación, pero sí información, reprogramación o reembolso.": "Por clima ou outras causas alheias à companhia aérea não há compensação, mas há direito a informação, remarcação ou reembolso.", "La Supertransporte indica 15 días de respuesta a las quejas.": "A Supertransporte indica 15 dias para responder às queixas.", "Pida en el mostrador una constancia de la demora.": "Peça no balcão um comprovante do atraso.", "Reclamo escrito a la aerolínea o a la agencia.": "Reclamação por escrito à companhia aérea ou à agência.", "Si no resuelven, queja ante la Superintendencia de Transporte; la SIC también es competente en protección al consumidor.": "Se não resolverem, queixa na Superintendencia de Transporte; a SIC também é competente em defesa do consumidor.", "Tiquete y pase de abordar": "Passagem e cartão de embarque", "Constancia de la demora nte de segurança, primeiro a denúncia (123).", "Reversión del pago en línea: 5 días hábiles, en los casos de ley.": "Estorno de pagamento on-line: 5 dias úteis, nos casos previstos em lei.", "Reclamo en la app con capturas del viaje y del cobro.": "Reclamação no app com capturas de tela da viagem e da cobrança.", "Si el cobro fue con tarjeta en línea y procede, pida la reversión.": "Se a cobrança foi no cartão on-line e couber, peça o estorno.", "Queja ante la SIC; para taxis y servicio público, Superintendencia de Transporte.": "Queixa na SIC; para táxis e serviço público, Superintendencia de Transporte.", "Capturas del viaje (ruta, conductor, placa, precio)": "Capturas da viagem (rota, motorista, placa, preço)", "Extracto del cobro": "Extrato com a cobrança", "Mensajes con soporte": "Mensagens com o suporte", "El SOAT cubre a las víctimas de accidentes de tránsito, sin discutir culpas: atención médica, incapacidad, muerte y transporte de la víctima.": "O SOAT cobre as vítimas de acidentes de trânsito sem discutir culpa: atendimento médico, invalidez, morte e transporte da vítima.", "Si el vehículo no tenía SOAT o huyó, la reclamación se presenta ante la ADRES.": "Se o veículo não tinha SOAT ou fugiu, a reclamação é apresentada à ADRES.", "El SOAT no cubre los daños a su vehículo ni a sus bienes: esos se reclaman al responsable o a su póliza.": "O SOAT não cobre danos ao seu veículo nem aos seus bens: esses são cobrados do responsável ou do seguro dele.", "Las urgencias no pueden negarle la atención.": "O pronto-socorro não pode negar atendimento.", "Reclame pronto: los plazos y documentos varían.": "Reclame logo: os prazos e documentos variam.", "Llame al 123 y pida el informe policial del accidente.": "Ligue para o 123 e peça o boletim policial do acidente.", "Atención en urgencias con los datos del SOAT del vehículo.": "Atendimento de urgência com os dados do SOAT do veículo.", "Reclamación a la aseguradora del SOAT o a la ADRES.": "Reclamação à seguradora do SOAT ou à ADRES.", "Informe policial": "Boletim policial", "Historia clínica": "Prontuário médico", "Datos del vehículo y del SOAT": "Dados do veículo e do SOAT", "Documento de identidad": "Documento de identidade", "Deben entregarle en el plazo que aceptó al comprar; si no se pactó, en el plazo máximo que fija la ley (Ley 2439 de 2024).": "A entrega deve ocorrer no prazo aceito na compra; se não foi combinado, no prazo máximo fixado em lei (Lei 2439 de 2024).", "Si no cumplen, puede terminar el contrato y recuperar lo pagado.": "Se não cumprirem, você pode rescindir o contrato e recuperar o que pagou.", "Si el producto no está disponible, deben avisarle de inmediato; si cancela, el reembolso es en 15 días calendario. Si acepta un nuevo plazo (máximo 30 días) y lo incumplen, recupera todo sin descuentos.": "Se o produto não estiver disponível, devem avisar imediatamente; se você cancelar, o reembolso é em 15 dias corridos. Se aceitar um novo prazo (máximo 30 dias) e ele não for cumprido, você recupera tudo sem descontos.", "Reversión del pago: 5 días hábiles.": "Estorno do pagamento: 5 dias úteis.", "Reembolso: 15 días calendario.": "Reembolso: 15 dias corridos.", "Reclamo por el canal de atención de la tienda: debe darle un número de radicado.": "Reclamação pelo canal de atendimento da loja: ela deve fornecer um número de protocolo.", "Confirmación del pedido con el plazo de entrega": "Confirmação do pedido com o prazo de entrega", "Número de radicado": "Número de protocolo", "Si pagó con tarjeta o medio electrónico y el producto no llegó, la reversión del pago debe pedirse dentro de 5 días hábiles.": "Se você pagou com cartão ou meio eletrônico e o produto não chegou, o estorno do pagamento deve ser pedido dentro de 5 dias úteis.", "En compras a distancia puede retractarse dentro de 5 días hábiles, sin justificar (Ley 1480, art. 47).": "Em compras a distância, você pode se arrepender em até 5 dias úteis, sem justificar (Lei 1480, art. 47).", "Devuelve el producto por los mismos medios; los costos de transporte de la devolución son suyos.": "Você devolve o produto pelos mesmos meios; os custos de envio da devolução são seus.", "Le devuelven el dinero en máximo 15 días calendario, al mismo medio de pago (Ley 2439 de 2024).": "O dinheiro é devolvido em no máximo 15 dias corridos, no mesmo meio de pagamento (Lei 2439 de 2024).", "No aplica, entre otros, a servicios ya iniciados con su consentimiento, bienes personalizados, perecederos o de uso personal.": "Não se aplica, entre outros, a serviços já iniciados com seu consentimento, bens personalizados, perecíveis ou de uso pessoal.", "Retracto: 5 días hábiles.": "Arrependimento: 5 dias úteis.", "Escriba a la tienda ejerciendo el retracto y guarde la constancia.": "Escreva à loja exercendo o direito de arrependimento e guarde o comprovante.", "Devuelva el producto como indiquen.": "Devolva o produto conforme as instruções.", "Si no reembolsan, queja o demanda ante la SIC.": "Se não reembolsarem, queixa ou ação perante a SIC.", "Factura": "Nota fiscal", "Constancia del retracto": "Comprovante do arrependimento", "Guía de envío de la devolución": "Comprovante de envio da devolução", "El retracto vence a los 5 días hábiles: ejérzalo por escrito hoy.": "O direito de arrependimento vence em 5 dias úteis: exerça-o por escrito hoje.", "Reparación gratuita; si la falla se repite, usted elige nueva reparación, cambio o devolución del precio (Ley 1480, art. 11).": "Conserto gratuito; se o defeito se repetir, você escolhe novo conserto, troca ou devolução do preço (Lei 1480, art. 11).", "Productor y vendedor responden solidariamente: puede reclamar a cualquiera (Ley 1480, art. 10).": "Fabricante e vendedor respondem solidariamente: você pode reclamar a qualquer um (Lei 1480, art. 10).", "Reparación en máximo 30 días hábiles si la SIC no fija otro plazo; con bien en préstamo, hasta 60 (Decreto 735 de 2013, art. 8).": "Conserto em no máximo 30 dias úteis se a SIC não fixar outro prazo; com bem e ar a multas.": "Os hóspedes estrangeiros também são informados à Migración Colombia no SIRE (Resolução 2357 de 2020), e não fazer isso a tempo pode gerar multas.", "Los prestadores de alojamiento deben tener una póliza de seguro que cubra daños a huéspedes y a terceros (Ley 2068 de 2020, art. 32).": "Os prestadores de hospedagem devem ter uma apólice que cubra danos a hóspedes e a terceiros (Lei 2068 de 2020, art. 32).", "En Medellín, la apertura de la vivienda turística se comunica por escrito a la estación de Policía más cercana (Ley 1801 de 2016, art. 87).": "Em Medellín, a abertura da moradia turística deve ser comunicada por escrito à delegacia de polícia mais próxima (Lei 1801 de 2016, art. 87).", "Reporte en el SIRE cada entrada y salida de huéspedes extranjeros dentro del plazo que fija Migración Colombia.": "Informe no SIRE cada entrada e saída de hóspedes estrangeiros dentro do prazo fixado pela Migración Colombia.", "Haga la TRA de cada huésped a su llegada.": "Faça a TRA de cada hóspede na chegada.", "Reporte en el SIRE la entrada y la salida de cada huésped extranjero.": "Informe no SIRE a entrada e a saída de cada hóspede estrangeiro.", "Guarde las constancias de cada registro y la póliza vigente.": "Guarde os comprovantes de cada registro e a apólice vigente.", "Constancias de la TRA": "Comprovantes da TRA", "Reportes del SIRE": "Relatórios do SIRE", "Además del RNT, el uso del suelo de la zona debe permitir el alojamiento turístico según el Plan de Ordenamiento Territorial (POT).": "Além do RNT, o uso do solo da zona deve permitir a hospedagem turística segundo o Plano de Ordenamento Territorial (POT).", "En Medellín, según el POT vigente (Acuerdo 48 de 2014), la vivienda turística se permite en zonas de media y alta mixtura de usos.": "Em Medellín, segundo o POT vigente (Acordo 48 de 2014), a moradia turística é permitida em zonas de média e alta mistura de usos.", "Un proyecto de revisión del POT la limitaría a zonas de alta mixtura, zonas de tratamiento especial y áreas de desarrollo orientado al transporte; aún no está aprobado.": "Um projeto de revisão do POT a limitaria a zonas de alta mistura, zonas de tratamento especial e áreas de desenvolvimento orientado ao transporte; ainda não foi aprovado.", "Verifique el uso del suelo antes de comprar o de publicar un anuncio.": "Verifique o uso do solo antes de comprar ou de anunciar.", "Consulte el uso del suelo de su predio ante Planeación de Medellín y pida el concepto por escrito.": "Consulte o uso do solo do imóvel no Planejamento de Medellín e peça o parecer por escrito.", "Revise que el reglamento del edificio autorice la actividad.": "Confira se o regulamento do prédio autoriza a atividade.", "Siga las novedades del nuevo POT antes de invertir.": "Acompanhe as novidades do novo POT antes de investir.", "Concepto de uso del suelo": "Parecer de uso do solo", "Escritura y certificado de libertad": "Escritura e certidão de matrícula", "Reglamento de propiedad horizontal": "Regulamento do condomínio", "Los términos de la plataforma fijan sus reglas, una apelación interna y a veces un arbitraje en el exterior. Si el servicio se ofrece en Colombia, la ley colombiana y la SIC también pueden aplicar.": "Os termos da plataforma fixam as regras, um recurso interno e às vezes uma arbitragem no exterior. Se o serviço é oferecido na Colômbia, a lei colombiana e a SIC também podem se aplicar.", "Si usa la plataforma como consumidor, las cláusulas abusivas no producen efectos (Ley 1480, arts. 42 y 43).": "Se você usa a plataforma como consumidor, as cláusulas abusivas não produzem efeitos (Lei 1480, arts. 42 e 43).", "Puede pedir a la plataforma qué datos personales tiene sobre usted y para qué los usa: debe responder en 10 días hábiles, prorrogables 5 (Ley 1581 de 2012, art. 14).": "Você pode perguntar à plataforma quais dados pessoais ela tem sobre você e para que os usa: ela deve responder em 10 dias úteis, prorrogáveis por 5 (Lei 1581 de 2012, art. 14).", "Apelación interna: revise el plazo en los términos de la plataforma; suele ser corto.": "Recurso interno: confira o prazo nos termos da plataforma; costuma ser curto.", "Consulta de datos personales: 10 días hábiles, prorrogables 5.": "Consulta de dados pessoais: 10 dias úteis, prorrogáveis por 5.", "Pida por escrito el motivo concreto y la regla que aplicaron.": "Peça por escrito o motivo concreto e a regra aplicada.", "Use la apelación interna y guarde la constancia.": "Use o recurso interno e guarde o comprovante.", "Si no resuelven, queja ante la SIC o la vía que fijen los términos.": "Se não resolverem, queixa na SIC ou a via que os termos fixarem.", "Avisos y correos de suspensión": "Avisos e e-mails de suspensão", "Copia descargada de sus datos": "Cópia baixada dos seus dados", "Capturas de su perfil e historial": "Capturas do seu perfil e histórico", "Los términos de la plataforma fijan cuándo puede retener pagos y por cuánto tiempo: es la primera regla que se revisa.": "Os termos da plataforma fixam quando ela pode reter pagamentos e por quanto tempo: é a primeira regra a conferir.", "Una retención que no se ajusta a los términos es un incumplimiento del contrato y puede reclamarse.": "Uma retenção que não segue os termos é um descumprimento do contrato e pode ser reclamada.", "Si usted actúa como consumidor y el servicio se ofrece en Colombia, la SIC puede ser una vía; si es un negocio, la vía suele ser la del contrato.": "Se você age como consumidor e o serviço é oferecido na Colômbia, a SIC pode ser uma via; se é um negócio, a via costuma ser a do contrato.", "Descargue hoy el historial de pagos: puede dejar de estar disponible si la cuenta se cierra.": "Baixe hoje o histórico de pagamentos: ele pode deixar de estar disponível se a conta for fechada.", "Pida por escrito el motivo, el monto retenido y la fecha de liberación.": "Peça por escrito o motivo, o valor retido e a data de liberação.", "Use la apelación interna.": "Use o recurso interno.", "Si no resuelven
