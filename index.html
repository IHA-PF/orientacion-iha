 denúncielo; la reclamación de consumo puede avanzar al mismo tiempo, porque el plazo de un año para demandar sigue corriendo (Ley 1480 de 2011, art. 58).": "If a crime occurred, report it; the consumer claim can proceed at the same time, because the one-year deadline to sue keeps running (Law 1480 of 2011, art. 58).", "Si el lugar no tiene RNT o es inseguro, puede reportarlo ante la SIC; si hay peligro, llame al 123.": "If the place has no RNT or is unsafe, you can report it to the SIC; if there is danger, call 123."}, "fr": {"Garantía legal: todo producto debe servir para lo que se vende. Si no se indica plazo, la garantía de un producto nuevo es de un año desde la entrega (Ley 1480, art. 8). Un bien usado tiene tres meses de garantía, salvo que se haya vendido sin garantía con aceptación expresa y por escrito (Decreto 735 de 2013, art. 12).": "Garantie légale : tout produit doit servir à l’usage pour lequel il est vendu. Sans durée indiquée, la garantie d’un produit neuf est d’un an à partir de la livraison (loi 1480, art. 8). Un bien d’occasion bénéficie de trois mois de garantie, sauf s’il a été vendu sans garantie avec votre accord exprès et écrit (décret 735 de 2013, art. 12).", "Reparación gratuita como regla. Si la falla se repite, usted elige: nueva reparación, cambio o devolución del precio (Ley 1480, art. 11). La reparación debe hacerse en máximo 30 días hábiles si la SIC no fija otro plazo, y la devolución del dinero en 15 días hábiles después de entregar el bien (Decreto 735 de 2013, arts. 8 y 10).": "La réparation gratuite est la règle. Si la panne se répète, vous choisissez : nouvelle réparation, échange ou remboursement (loi 1480, art. 11). La réparation doit être faite en 30 jours ouvrables au plus si la SIC ne fixe pas d’autre délai, et le remboursement en 15 jours ouvrables après la remise du bien (décret 735 de 2013, art. 8 et 10).", "Servicios mal prestados: usted elige que se repita el servicio o que le devuelvan el dinero (Decreto 735 de 2013, art. 16).": "Service mal exécuté : vous choisissez qu’il soit refait ou que l’on vous rembourse (décret 735 de 2013, art. 16).", "Precio: debe informarse en pesos y usted solo está obligado a pagar el precio anunciado (Ley 1480, art. 26).": "Prix : il doit être indiqué en pesos et vous ne devez payer que le prix annoncé (loi 1480, art. 26).", "Cláusulas abusivas, como las que limitan la responsabilidad del proveedor, no tienen efecto (Ley 1480, arts. 42 y 43).": "Les clauses abusives, comme celles qui limitent la responsabilité du fournisseur, sont sans effet (loi 1480, art. 42 et 43).", "Permanencia mínima: solo vale si se pactó de forma expresa y, por regla general, no puede pasar de un año (Ley 1480, art. 41).": "Durée minimale d’engagement : elle ne vaut que si elle a été convenue expressément et, en règle générale, ne peut dépasser un an (loi 1480, art. 41).", "Primero reclame por escrito al proveedor; debe responder en 15 días hábiles. Guarde copia: es requisito para demandar (Ley 1480, art. 58, num. 5).": "Réclamez d’abord par écrit auprès du fournisseur ; il doit répondre en 15 jours ouvrables. Gardez une copie : c’est une condition pour agir en justice (loi 1480, art. 58, al. 5).", "Demanda ante la SIC: a más tardar un año después de vencida la garantía (Ley 1480, art. 58, num. 3). Según la SIC, si lo que reclama es inferior a 40 salarios mínimos mensuales, no necesita abogado.": "Action devant la SIC : au plus tard un an après la fin de la garantie (loi 1480, art. 58, al. 3). Selon la SIC, si votre demande est inférieure à 40 salaires minimums mensuels, vous n’avez pas besoin d’avocat.", "Compras en línea: retracto de 5 días hábiles, devolución del dinero en máximo 15 días calendario y reversión del pago en 5 días hábiles en los casos de ley (Ley 1480 y Ley 2439 de 2024).": "Achats en ligne : rétractation sous 5 jours ouvrables, remboursement en 15 jours calendaires au plus et annulation du paiement sous 5 jours ouvrables dans les cas prévus par la loi (loi 1480 et loi 2439 de 2024).", "Si el prestador no cumple lo reservado, usted elige: otro servicio de la misma calidad o el reembolso o compensación del precio. Si no puede darle uno igual, debe contratarlo con un tercero a su costa (Ley 300 de 1996, art. 63).": "Si le prestataire ne fournit pas ce que vous avez réservé, vous choisissez : un autre service de même qualité, ou le remboursement ou une compensation. S’il ne peut pas vous offrir l’équivalent, il doit le réserver auprès d’un tiers à ses frais (loi 300 de 1996, art. 63).", "La sobreventa recibe el mismo trato (Ley 300 de 1996, art. 64).": "La surréservation reçoit le même traitement (loi 300 de 1996, art. 64).", "Cancelar una reserva confirmada para revenderla más cara es un incumplimiento que la SIC puede sancionar.": "Annuler une réservation confirmée pour la revendre plus cher est un manquement que la SIC peut sanctionner.", "Si reservó por una app de alojamiento, revise también lo que ofrece la política de la plataforma.": "Si vous avez réservé par une appli d’hébergement, vérifiez aussi ce que prévoit la politique de la plateforme.", "Reclame por escrito de inmediato; el proveedor tiene 15 días hábiles para responder.": "Réclamez par écrit sans attendre ; le fournisseur a 15 jours ouvrables pour répondre.", "Demanda ante la SIC: hasta un año.": "Action devant la SIC : jusqu’à un an.", "Escriba al anfitrión u hotel y a la plataforma pidiendo alojamiento equivalente o reembolso.": "Écrivez à l’hôte ou à l’hôtel et à la plateforme pour demander un logement équivalent ou le remboursement.", "Si paga otro alojamiento más caro o transporte extra, guarde las facturas.": "Si vous payez un logement plus cher ou un transport supplémentaire, gardez les factures.", "Si no resuelven, queja o demanda ante la SIC.": "À défaut de solution, plainte ou action devant la SIC.", "Confirmación de la reserva y comprobante de pago": "Confirmation de réservation et preuve de paiement", "Mensajes de cancelación con fecha": "Messages d’annulation datés", "Capturas del anuncio": "Captures de l’annonce", "Facturas de los gastos adicionales": "Factures des frais supplémentaires", "La información y la publicidad deben ser veraces; quien anuncia responde por lo que ofrece (Ley 1480, arts. 23 y 30).": "L’information et la publicité doivent être véridiques ; celui qui annonce répond de ce qu’il propose (loi 1480, art. 23 et 30).", "Si el servicio no corresponde, usted puede pedir que se preste como se contrató o la devolución del dinero (garantía de servicios, Decreto 735 de 2013, art. 16).": "Si le service n’est pas conforme, vous pouvez demander qu’il soit fourni comme convenu ou être remboursé (garantie des services, décret 735 de 2013, art. 16).", "Si la plataforma permite publicar a un prestador sin Registro Nacional de Turismo activo, responde ante usted por publicidad engañosa (Ley 2068 de 2020, art. 39).": "Si la plateforme laisse publier un prestataire sans Registre national du tourisme (RNT) actif, elle répond envers vous de la publicité trompeuse (loi 2068 de 2020, art. 39).", "Avise el mismo día por escrito: las plataformas suelen fijar plazos cortos para reportar problemas (revise sus términos).": "Signalez-le par écrit le jour même : les plateformes fixent souvent des délais courts pour signaler un problème (voir leurs conditions).", "Al llegar, tome fotos y video con fecha visible.": "À l’arrivée, prenez photos et vidéo avec la date visible.", "Escriba al anfitrión y a la plataforma pidiendo solución, reubicación o reembolso.": "Écrivez à l’hôte et à la plateforme pour demander une solution, un relogement ou un remboursement.", "Capturas del anuncio tal como estaba al reservar": "Captures de l’annonce telle qu’elle était à la réservation", "Fotos y video del lugar": "Photos et vidéo du logement", "Mensajes con el anfitrión y la plataforma": "Messages avec l’hôte et la plateforme", "Solo debe pagar el precio total anunciado antes de pagar (Ley 1480, art. 26).": "Vous ne devez payer que le prix total annoncé avant le paiement (loi 1480, art. 26).", "El depósito se devuelve según lo pactado; cualquier descuento por daños debe justificarse con pruebas.": "La caution est rendue selon ce qui a été convenu ; toute retenue pour dégâts doit être justifiée par des preuves.", "Si el cobro fue en línea con tarjeta y es fraudulento, no solicitado o por algo no recibido, puede proceder la reversión del pago (Ley 1480, art. 51).": "Si le débit par carte en ligne est frauduleux, non demandé ou pour quelque chose que vous n’avez pas reçu, l’annulation du paiement peut s’appliquer (loi 1480, art. 51).", "Reversión del pago: 5 días hábiles desde que se enteró.": "Annulation du paiement : 5 jours ouvrables à partir du moment où vous l’avez appris.", "Respuesta del proveedor a su reclamo: 15 días hábiles.": "Réponse du fournisseur à votre réclamation : 15 jours ouvrables.", "Pida por escrito el desglose del cobro o la razón del descuento.": "Demandez par écrit le détail du montant ou le motif de la retenue.", "Si procede, pida la reversión al vendedor y a su banco.": "Si c’est applicable, demandez l’annulation du paiement au vendeur et à votre banque.", "Anuncio con el precio": "Annonce avec le prix", "Recibos y extractos": "Reçus et relevés", "Fotos de entrega del lugar": "Photos du logement à l’arrivée", "Mensajes": "Messages", "Si pagó en línea con tarjeta un cobro que no reconoce, la reversión del pago debe pedirse dentro de los 5 días hábiles siguientes a enterarse.": "Si vous avez payé en ligne par carte un montant que vous ne reconnaissez pas, l’annulation du paiement doit être demandée dans les 5 jours ouvrables après l’avoir appris.", "Usted tiene derecho a la seguridad y a no sufrir daños en condiciones normales de uso (Ley 1480).": "Vous avez droit à la sécurité et à ne pas subir de dommage dans des conditions normales d’utilisation (loi 1480).", "Los prestadores de alojamiento turístico deben tener una póliza de responsabilidad por daños a huéspedes y a terceros, que cubre como mínimo muerte, incapacidad, lesiones, daños a bienes de terceros y gastos médicos (Ley 2068 de 2020, art. 32). Pida los datos de la póliza.": "Les hébergeurs touristiques doivent avoir une assurance responsabilité pour les dommages aux clients et aux tiers, couvrant au minimum le décès, l’invalidité, les blessures, les dégâts aux biens de tiers et les frais médicaux (loi 2068 de 2020, art. 32). Demandez les références de la police.", "Si hubo un delito, la denuncia penal va primero; la reclamación de consumo, después.": "S’il y a eu un délit, la plainte pénale passe d’abord ; la réclamation de consommateur ensuite.", "Reporte por escrito al prestador el mismo día.": "Signalez-le par écrit au prestataire le jour même.", "Si hay peligro, llame al 123.": "En cas de danger, appelez le 123.", "Atención médica y denuncia si corresponde.": "Soins médicaux et plainte si nécessaire.", "Reporte escrito al hotel o anfitrión y a la plataforma.": "Signalement écrit à l’hôtel ou à l’hôte et à la plateforme.", "Reclamación por los daños; si no responden, demanda civil o ante la SIC.": "Réclamation pour les dommages ; sans réponse, action civile ou devant la SIC.", "Fotos y video": "Photos et vidéo", "Informe médico": "Rapport médical", "Denuncia": "Plainte", "Mensajes con el prestador": "Messages avec le prestataire", "Si un servicio turístico vendido no se presta, usted elige otro de la misma calidad o el reembolso o compensación del precio (Ley 300 de 1996, art. 63).": "Si un service touristique vendu n’est pas fourni, vous choisissez un autre de même qualité, ou le remboursement ou une compensation (loi 300 de 1996, art. 63).", "La información del paquete debe ser veraz, completa y entregada antes de pagar (Ley 1480).": "L’information sur le forfait doit être véridique, complète et donnée avant le paiement (loi 1480).", "Reclame a la agencia y al prestador directo (hotel, aerolínea, operador): ambos pueden responder.": "Réclamez à l’agence et au prestataire direct (hôtel, compagnie aérienne, opérateur) : tous deux peuvent être responsables.", "Respuesta a su reclamo: 15 días hábiles.": "Réponse à votre réclamation : 15 jours ouvrables.", "Reclamo escrito a la agencia y al prestador.": "Réclamation écrite à l’agence et au prestataire.", "Contrato o voucher del paquete": "Contrat ou bon d’échange du forfait", "Publicidad del paquete": "Publicité du forfait", "Pagos": "Paiements", "Rige la política de cancelación que aceptó, si se la informaron antes de pagar.": "La politique d’annulation que vous avez acceptée s’applique, si elle vous a été présentée avant le paiement.", "Si usted no se presenta, el prestador puede cobrar hasta el 20 % del precio o retener el anticipo pactado (Ley 300 de 1996, art. 65).": "Si vous ne vous présentez pas, le prestataire peut facturer jusqu’à 20 % du prix ou garder l’acompte convenu (loi 300 de 1996, art. 65).", "Una cláusula que impida todo reembolso en cualquier caso puede revisarse como abusiva (Ley 1480, arts. 42 y 43).": "Une clause qui interdit tout remboursement dans tous les cas peut être contestée comme abusive (loi 1480, art. 42 et 43).", "La ley prevé un retracto de 5 días hábiles en servicios comprados a distancia que no empiecen a ejecutarse antes de cinco días (Ley 1480, art. 47). Su aplicación a su reserva concreta la verifica nuestro equipo de abogados.": "La loi prévoit une rétractation de 5 jours ouvrables pour les services achetés à distance qui ne commencent pas dans les cinq jours (loi 1480, art. 47). Son application à votre réservation est vérifiée par nos avocats.", "Cancele por escrito y lo antes posible para entrar en la franja más favorable de la política.": "Annulez par écrit et le plus tôt possible pour bénéficier de la tranche la plus favorable de la politique.", "Revise la política de cancelación que aceptó.": "Relisez la politique d’annulation que vous avez acceptée.", "Cancele por escrito y pida la liquidación del reembolso.": "Annulez par écrit et demandez le calcul du remboursement.", "Si la retención le parece abusiva, reclame y luego acuda a la SIC.": "Si la retenue vous semble abusive, réclamez puis saisissez la SIC.", "Política de cancelación (captura)": "Politique d’annulation (capture)", "Confirmación y pago": "Confirmation et paiement", "Más de 1 hora y menos de 3, por causa de la aerolínea: refrigerio y una llamada.": "Plus d’1 heure et moins de 3, du fait de la compagnie : une collation et un appel.", "Más de 3 y menos de 5 horas: además, alimentos según la hora.": "Plus de 3 heures et moins de 5 : en plus, des repas selon l’heure.", "Más de 5 horas: compensación adicional mínima del 30 % del valor del trayecto.": "Plus de 5 heures : une compensation supplémentaire d’au moins 30 % du prix du trajet.", "Si la demora pasa de las 10 p. m.: hospedaje (si no vive en esa ciudad) y traslados.": "Si le retard dépasse 22 h : hébergement (si vous n’habitez pas cette ville) et transferts.", "Por clima u otras causas ajenas a la aerolínea no hay compensación, pero sí información, reprogramación o reembolso.": "Pour la météo ou d’autres causes extérieures à la compagnie, pas de compensation, mais droit à l’information, à un nouveau vol ou au remboursement.", "La Supertransporte indica 15 días de respuesta a las quejas.": "La Supertransporte indique un délai de réponse de 15 jours aux plaintes.", "Pida en el mostrador una constancia de la demora.": "Demandez au comptoir une attestation du retard.", "Reclamo escrito a la aerolínea o a la agencia.": "Réclamation écrite à la compagnie ou à l’agence.", "Si no resuelven, queja ante la Superintendencia de Transporte; la SIC también es competente en protección al consumidor.": "Sans solution, plainte auprès de la Superintendencia de Transporte ; la SIC est aussi compétente en protection du consommateur.", "Tiquete y pase de abordar": "Billet et carte d’embarquement", "Constancia de la demora": "Attestation du retard", "Recibos de gastos": "Reçus des dépenses", "Cancelación por causa de la aerolínea: puede desistir y recibir el reembolso, o seguir viaje con la atención y la compensación que fija el reglamento aeronáutico.": "Annulation du fait de la compagnie : vous pouvez renoncer et être remboursé, ou poursuivre le voyage avec l’assistance et la compensation prévues par le règlement aéronautique.", "Sobreventa: deben embarcarlo en el siguiente vuelo disponible y compensarlo según el reglamento aeronáutico.": "Surréservation : on doit vous placer sur le prochain vol disponible et vous indemniser selon le règlement aéronautique.", "Cancelación por causas ajenas a la aerolínea, como el clima: devolución total del precio sin penalidades.": "Annulation pour une cause extérieure à la compagnie, comme la météo : remboursement total du prix sans pénalité.", "Reclamo escrito cuanto antes; respuesta indicada por la Supertransporte: 15 días.": "Réclamation écrite au plus vite ; délai de réponse indiqué par la Supertransporte : 15 jours.", "Pida por escrito la causa de la cancelación o del no embarque.": "Demandez par écrit le motif de l’annulation ou du refus d’embarquement.", "Reclamo a la aerolínea o agencia.": "Réclamation à la compagnie ou à l’agence.", "Si no resuelven, Superintendencia de Transporte o SIC.": "Sans solution, Superintendencia de Transporte ou SIC.", "Tiquete": "Billet", "Constancia de cancelación o de no embarque": "Attestation d’annulation ou de refus d’embarquement", "Si el equipaje se demora, la aerolínea debe cubrir artículos básicos y compensarlo según el reglamento aeronáutico.": "Si le bagage est retardé, la compagnie doit couvrir les articles de première nécessité et vous indemniser selon le règlement aéronautique.", "En vuelos internacionales, el Convenio de Montreal limita la indemnización por equipaje; declare objetos de valor al facturar.": "Sur les vols internationaux, la Convention de Montréal plafonne l’indemnisation des bagages ; déclarez les objets de valeur à l’enregistrement.", "Daño, pérdida o hurto: protesta escrita a más tardar en 7 días.": "Dommage, perte ou vol : réclamation écrite au plus tard sous 7 jours.", "Demora: reclamo dentro de los 21 días siguientes a la fecha en que debía llegar.": "Retard : réclamation dans les 21 jours suivant la date à laquelle il devait arriver.", "Antes de salir del aeropuerto, reporte en el mostrador de la aerolínea y pida el número de reclamo.": "Avant de quitter l’aéroport, déclarez-le au comptoir de la compagnie et demandez le numéro de dossier.", "Protesta escrita dentro del plazo.": "Réclamation écrite dans le délai.", "Si no resuelven, Superintendencia de Transporte.": "Sans solution, Superintendencia de Transporte.", "Tiquete y etiqueta del equipaje": "Billet et étiquette du bagage", "Reporte del aeropuerto": "Déclaration faite à l’aéroport", "Fotos del daño": "Photos des dégâts", "Recibos de compras de emergencia": "Reçus des achats de première nécessité", "Los plazos del equipaje son cortos: 7 días para daño o pérdida y 21 días para demora.": "Les délais pour les bagages sont courts : 7 jours pour un dommage ou une perte et 21 jours pour un retard.", "Puede desistir del viaje antes del vuelo; la aerolínea puede retener una parte limitada de la tarifa, según el reglamento aeronáutico.": "Vous pouvez renoncer au voyage avant le vol ; la compagnie peut garder une part limitée du tarif selon le règlement aéronautique.", "Las tarifas promocionales pueden tener condiciones distintas: revise las que aceptó al comprar.": "Les tarifs promotionnels peuvent avoir d’autres conditions : vérifiez celles acceptées à l’achat.", "Haga la solicitud por escrito y antes del vuelo.": "Faites la demande par écrit et avant le vol.", "Solicite por escrito el desistimiento o el retracto y guarde la constancia.": "Demandez par écrit le désistement ou la rétractation et gardez la preuve.", "Si no reembolsan, reclamo y luego Superintendencia de Transporte o SIC.": "Sans remboursement, réclamation puis Superintendencia de Transporte ou SIC.", "Tiquete y condiciones de la tarifa": "Billet et conditions du tarif", "Comprobante de pago": "Preuve de paiement", "Constancia de la solicitud": "Preuve de la demande", "Tiene derecho a información, a viajar en condiciones de calidad, a la protección contra publicidad engañosa, a llevar su equipaje y, según las reglas, a retractarse o desistir del tiquete (guía de la Supertransporte).": "Vous avez droit à l’information, à voyager dans des conditions de qualité, à la protection contre la publicité trompeuse, à transporter vos bagages et, selon les règles, à vous rétracter ou renoncer au billet (guide de la Supertransporte).", "También hay reglas para viajar con mascotas y con menores de edad: pregunte a la empresa antes de comprar.": "Il existe aussi des règles pour voyager avec des animaux et des mineurs : renseignez-vous auprès de la compagnie avant d’acheter.", "Los porcentajes de devolución dependen de la norma y de la empresa: pida la política por escrito.": "Les pourcentages de remboursement dépendent de la règle et de la compagnie : demandez la politique par écrit.", "Respuesta a peticiones: 15 días.": "Réponse aux demandes : 15 jours.", "Acción de protección al consumidor: 1 año.": "Action en protection du consommateur : 1 an.", "Reclamo a la empresa o al intermediario que le vendió.": "Réclamation à la compagnie ou à l’intermédiaire qui vous a vendu le billet.", "Si no resuelven, Superintendencia de Transporte; luego jueces o SIC.": "Sans solution, Superintendencia de Transporte ; ensuite les juges ou la SIC.", "Fotos": "Photos", "Recibos": "Reçus", "Datos del bus y la hora": "Données du bus et horaire", "Quien le cobra debe informarle el precio de forma veraz y atender su reclamo (Ley 1480).": "Celui qui vous fait payer doit vous informer du prix de façon véridique et traiter votre réclamation (loi 1480).", "Taxis y transporte público: Superintendencia de Transporte y la secretaría de movilidad de la ciudad.": "Taxis et transports publics : Superintendencia de Transporte et le service de la mobilité de la ville.", "Si hubo un incidente de seguridad, primero la denuncia (123).": "En cas d’incident de sécurité, d’abord la plainte (123).", "Reversión del pago en línea: 5 días hábiles, en los casos de ley.": "Annulation d’un paiement en ligne : 5 jours ouvrables, dans les cas prévus par la loi.", "Reclamo en la app con capturas del viaje y del cobro.": "Réclamation dans l’appli avec captures du trajet et du paiement.", "Si el cobro fue con tarjeta en línea y procede, pida la reversión.": "Si vous avez payé par carte en ligne et que c’est applicable, demandez l’annulation du paiement.", "Queja ante la SIC; para taxis y servicio público, Superintendencia de Transporte.": "Plainte auprès de la SIC ; pour les taxis et le service public, Superintendencia de Transporte.", "Capturas del viaje (ruta, conductor, placa, precio)": "Captures du trajet (itinéraire, conducteur, plaque, prix)", "Extracto del cobro": "Relevé montrant le débit", "Mensajes con soporte": "Messages avec le support", "El SOAT cubre a las víctimas de accidentes de tránsito, sin discutir culpas: atención médica, incapacidad, muerte y transporte de la víctima.": "Le SOAT couvre les victimes d’accidents de la route sans discussion sur la faute : soins médicaux, invalidité, décès et transport de la victime.", "Si el vehículo no tenía SOAT o huyó, la reclamación se presenta ante la ADRES.": "Si le véhicule n’avait pas de SOAT ou a pris la fuite, la demande se fait auprès de l’ADRES.", "El SOAT no cubre los daños a su vehículo ni a sus bienes: esos se reclaman al responsable o a su póliza.": "Le SOAT ne couvre pas les dégâts à votre véhicule ni à vos biens : réclamez-les au responsable ou à son assurance.", "Las urgencias no pueden negarle la atención.": "Les urgences ne peuvent pas vous refuser des soins.", "Reclame pronto: los plazos y documentos varían.": "Réclamez vite : les délais et les documents varient.", "Llame al 123 y pida el informe policial del accidente.": "Appelez le 123 et demandez le rapport de police de l’accident.", "Atención en urgencias con los datos del SOAT del vehículo.": "Soins aux urgences avec les données du SOAT du véhicule.", "Reclamación a la aseguradora del SOAT o a la ADRES.": "Demande à l’assureur du SOAT ou à l’ADRES.", "Informe policial": "Rapport de police", "Historia clínica": "Dossier médical", "Datos del vehículo y del SOAT": "Données du véhicule et du SOAT", "Documento de identidad": "Pièce d’identité", "Deben entregarle en el plazo que aceptó al comprar; si no se pactó, en el plazo máximo que fija la ley (Ley 2439 de 2024).": "La livraison doit avoir lieu dans le délai accepté à l’achat ; à défaut, dans le délai maximal fixé par la loi (loi 2439 de 2024).", "Si no cumplen, puede terminar el contrato y recuperar lo pagado.": "En cas de manquement, vous pouvez résilier le contrat et récupérer ce que vous avez payé.", "Si el producto no está disponible, deben avisarle de inmediato; si cancela, el reembolso es en 15 días calendario. Si acepta un nuevo plazo (máximo 30 días) y lo incumplen, recupera todo sin descuentos.": "Si le produit n’est pas disponible, on doit vous prévenir immédiatement ; si vous annulez, le remboursement se fait en 15 jours calendaires. Si vous acceptez un nouveau délai (30 jours au plus) et qu’il n’est pas tenu, vous récupérez tout sans retenue.", "Reversión del pago: 5 días hábiles.": "Annulation du paiement : 5 jours ouvrables.", "Reembolso: 15 días calendario.": "Remboursement : 15 jours calendaires.", "Reclamo por el canal de atención de la tienda: debe darle un número de radicado.": "Réclamation par le service client du magasin : il doit vous donner un numéro de dossier.", "Confirmación del pedido con el plazo de entrega": "Confirmation de commande avec le délai de livraison", "Número de radicado": "Numéro de dossier", "Si pagó con tarjeta o medio electrónico y el producto no llegó, la reversión del pago debe pedirse dentro de 5 días hábiles.": "Si vous avez payé par carte ou moyen électronique et que le produit n’est pas arrivé, l’annulation du paiement doit être demandée sous 5 jours ouvrables.", "En compras a distancia puede retractarse dentro de 5 días hábiles, sin justificar (Ley 1480, art. 47).": "Pour un achat à distance, vous pouvez vous rétracter sous 5 jours ouvrables sans justification (loi 1480, art. 47).", "Devuelve el producto por los mismos medios; los costos de transporte de la devolución son suyos.": "Vous renvoyez le produit par les mêmes moyens ; les frais de retour sont à votre charge.", "Le devuelven el dinero en máximo 15 días calendario, al mismo medio de pago (Ley 2439 de 2024).": "Vous êtes remboursé en 15 jours calendaires au plus, sur le même moyen de paiement (loi 2439 de 2024).", "No aplica, entre otros, a servicios ya iniciados con su consentimiento, bienes personalizados, perecederos o de uso personal.": "Elle ne s’applique pas, entre autres, aux services déjà commencés avec votre accord, aux biens personnalisés, périssables ou d’usage personnel.", "Retracto: 5 días hábiles.": "Rétractation : 5 jours ouvrables.", "Escriba a la tienda ejerciendo el retracto y guarde la constancia.": "Écrivez au magasin pour exercer la rétractation et gardez la preuve.", "Devuelva el producto como indiquen.": "Renvoyez le produit selon leurs instructions.", "Si no reembolsan, queja o demanda ante la SIC.": "Sans remboursement, plainte ou action devant la SIC.", "Factura": "Facture", "Constancia del retracto": "Preuve de la rétractation", "Guía de envío de la devolución": "Bordereau d’envoi du retour", "El retracto vence a los 5 días hábiles: ejérzalo por escrito hoy.": "La rétractation expire au bout de 5 jours ouvrables : exercez-la par écrit aujourd’hui.", "Reparación gratuita; si la falla se repite, usted elige nueva reparación, cambio o devolución del precio (Ley 1480, art. 11).": "Réparation gratuite ; si la panne se répète, vous choisissez nouvelle réparation, échange ou remboursement (loi 1480, art. 11).", "Productor y vendedor responden solidariamente: puede reclamar a cualquiera (Ley 1480, art. 10).": "Le producteur et le vendeur sont solidairement responsables : vous pouvez réclamer à l’un ou l’autre (loi 1480, art. 10).", "Reparación en máximo 30 días hábiles si la SIC no fija otro plazo; con bien en préstamo, hasta 60 (Decreto 735 de 2013, art. 8).": "Réparation en 30 jours ouvrables au plus si la SIC ne fixe pas d’autre délai ; jusqu’à 60 avec un bien prêté en remplacement (décret 735 de 2013, art. 8).", "Si no indicaron plazo, la garantía de un producto nuevo es de un año.": "Sans délai indiqué, la garantie d’un produit neuf est d’un an.", "Demanda: hasta un año después de vencida la garantía.": "Action : jusqu’à un an après la fin de la garantie.", "Reclamo escrito al vendedor o al fabricante; exija constancia de recibo del producto.": "Réclamation écrite au vendeur ou au fabricant ; exigez un reçu de dépôt du produit.", "Si no responden o niegan sin razón, demanda ante la SIC.": "Sans réponse ou en cas de refus injustifié, action devant la SIC.", "Constancia de entrega a reparación": "Reçu de dépôt pour réparation", "Fotos o video de la falla": "Photos ou vidéo de la panne", "Reversión del pago: en compras en línea con tarjeta u otro instrumento electrónico, por fraude, operación no solicitada, producto no recibido, distinto o defectuoso (Ley 1480, art. 51; Decreto 587 de 2016).": "Annulation du paiement : pour les achats en ligne par carte ou autre moyen électronique, en cas de fraude, d’opération non demandée, de produit non reçu, différent ou défectueux (loi 1480, art. 51 ; décret 587 de 2016).", "Fraude bancario: avise de inmediato al banco, inactive sus productos, guarde pruebas y denuncie ante la Policía (CAI Virtual) o la Fiscalía.": "Fraude bancaire : prévenez immédiatement la banque, bloquez vos moyens de paiement, gardez les preuves et portez plainte auprès de la Police (CAI Virtual) ou de la Fiscalía.", "Puede quejarse ante el banco, su Defensor del Consumidor Financiero o la Superfinanciera; si no hay acuerdo, demandar ante la Superfinanciera, sin abogado si el valor es menor a 40 salarios mínimos.": "Vous pouvez vous plaindre auprès de la banque, de son Défenseur du consommateur financier ou de la Superfinanciera ; sans accord, agir devant la Superfinanciera, sans avocat si le montant est inférieur à 40 salaires minimums.", "Reversión: 5 días hábiles desde que se enteró.": "Annulation : 5 jours ouvrables à partir du moment où vous l’avez appris.", "Demanda ante la Superfinanciera: hasta un año desde el fin de la relación con la entidad.": "Action devant la Superintendance financière : jusqu’à un an après la fin de la relation avec la banque.", "Llame al banco y bloquee.": "Appelez la banque et faites bloquer.", "Reclamo escrito al banco y, si aplica, solicitud de reversión al vendedor y al emisor.": "Réclamation écrite à la banque et, si c’est applicable, demande d’annulation au vendeur et à l’émetteur de la carte.", "Denuncia penal.": "Plainte pénale.", "Defensor del Consumidor Financiero o Superfinanciera.": "Défenseur du consommateur financier ou Superfinanciera.", "Extracto con los cobros": "Relevé avec les débits", "Capturas de mensajes o llamadas sospechosas": "Captures des messages ou appels suspects", "Radicado del reclamo": "Numéro de la réclamation", "Bloquee hoy sus productos y avise al banco: cada hora cuenta en un fraude.": "Bloquez aujourd’hui vos moyens de paiement et prévenez la banque : en cas de fraude, chaque heure compte.", "Antes de demandar debe reclamar a la entidad; adjunte el reclamo y la respuesta a la demanda.": "Avant d’agir, vous devez réclamer auprès de l’établissement ; joignez la réclamation et sa réponse à votre demande.", "Puede acudir al Defensor del Consumidor Financiero de la entidad o quejarse ante la Superfinanciera.": "Vous pouvez saisir le Défenseur du consommateur financier de l’établissement ou vous plaindre auprès de la Superfinanciera.", "Acción de protección al consumidor financiero: ante un juez o la Superfinanciera (una sola vía), sin abogado hasta 40 salarios mínimos.": "Action en protection du consommateur financier : devant un juge ou la Superfinanciera (une seule voie), sans avocat jusqu’à 40 salaires minimums.", "Puede cancelar un producto cuando lo necesite, sin penalidades injustificadas.": "Vous pouvez résilier un produit quand vous le souhaitez, sans pénalité injustifiée.", "Demanda: hasta un año desde el fin de la relación con la entidad.": "Action : jusqu’à un an après la fin de la relation avec l’établissement.", "Reclamo escrito a la entidad.": "Réclamation écrite à l’établissement.", "Defensor del Consumidor Financiero o queja ante la Superfinanciera.": "Défenseur du consommateur financier ou plainte auprès de la Superfinanciera.", "Demanda ante la Superfinanciera o un juez.": "Action devant la Superfinanciera ou un juge.", "Contrato o póliza": "Contrat ou police", "Extractos": "Relevés", "Radicado del reclamo y respuesta": "Numéro de la réclamation et réponse", "Solo pueden contactarlo por los canales que usted autorizó, de lunes a viernes de 7 a. m. a 7 p. m. y sábados de 8 a. m. a 3 p. m.; nunca domingos ni festivos (Ley 2300 de 2023).": "On ne peut vous contacter que par les canaux que vous avez autorisés, du lundi au vendredi de 7 h à 19 h et le samedi de 8 h à 15 h ; jamais le dimanche ni les jours fériés (loi 2300 de 2023).", "No pueden usar varios canales la misma semana ni contactarlo más de una vez al día, ni llamar a sus referencias; tampoco visitar su casa o trabajo, salvo excepciones.": "On ne peut pas utiliser plusieurs canaux la même semaine, vous contacter plus d’une fois par jour ni appeler vos références ; ni venir chez vous ou à votre travail, sauf exceptions.", "Un reporte negativo dura el doble del tiempo de la mora, máximo 4 años, y caduca a los 8 años de la mora (Ley 2157 de 2021).": "Un fichage négatif dure deux fois la durée du retard, 4 ans au maximum, et expire 8 ans après l
