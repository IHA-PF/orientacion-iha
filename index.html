 Medellín: o que se sabe e o que fazer desde já."},read:{es:"Leer",en:"Read",fr:"Lire",pt:"Ler"},howMore:{es:"Cómo trabajamos, paso a paso",en:"How we work, step by step",fr:"Comment nous travaillons, étape par étape",pt:"Como trabalhamos, passo a passo"},howT:{es:"Cómo trabajamos",en:"How we work",fr:"Comment nous travaillons",pt:"Como trabalhamos"},howEye:{es:"IHA Soluciones Legales y Técnicas",en:"IHA Soluciones Legales y Técnicas",fr:"IHA Soluciones Legales y Técnicas",pt:"IHA Soluciones Legales y Técnicas"},howLead:{es:"Orientamos a personas y empresas en sus problemas con plataformas digitales en Colombia. La orientación es gratuita; el trabajo jurídico se cotiza antes de empezar.",en:"We guide people and businesses through problems with digital platforms in Colombia. Guidance is free; legal work is quoted before it starts.",fr:"Nous orientons particuliers et entreprises face aux problèmes avec les plateformes numériques en Colombie. L’orientation est gratuite ; le travail juridique fait l’objet d’un devis avant de commencer.",pt:"Orientamos pessoas e empresas em problemas com plataformas digitais na Colômbia. A orientação é gratuita; o trabalho jurídico é orçado antes de começar."},howStepsH:{es:"Paso a paso",en:"Step by step",fr:"Étape par étape",pt:"Passo a passo"},howSteps:{es:["Usted obtiene su ficha gratis, sin registro y sin dejar datos.","Si quiere ayuda, nos envía la ficha por correo o WhatsApp, después de autorizar el uso de sus datos.","Revisamos si su caso está dentro de lo que hacemos. Si no, le decimos a quién acudir.","Le enviamos por escrito el alcance, el precio y los plazos. Nada empieza sin su aceptación.","Toda opinión jurídica la dan nuestros abogados colombianos. El resto del equipo orienta, organiza los documentos y traduce."],en:["You get your sheet for free, with no sign-up and without leaving any data.","If you want help, you send us the sheet by email or WhatsApp, after authorising the use of your data.","We check whether your case is within what we do. If not, we tell you where to go.","We send you the scope, price and timeline in writing. Nothing starts without your agreement.","Any legal opinion is given by our Colombian lawyers. The rest of the team guides you, organises documents and translates."],fr:["Vous obtenez votre fiche gratuitement, sans inscription et sans laisser de données.","Si vous voulez de l’aide, vous nous envoyez la fiche par e-mail ou WhatsApp, après avoir autorisé l’usage de vos données.","Nous vérifions si votre cas entre dans notre champ d’action. Sinon, nous vous disons à qui vous adresser.","Nous vous envoyons par écrit le périmètre, le prix et les délais. Rien ne commence sans votre accord.","Tout avis juridique est donné par nos avocats colombiens. Le reste de l’équipe oriente, organise les documents et traduit."],pt:["Você recebe sua ficha de graça, sem cadastro e sem deixar dados.","Se quiser ajuda, você nos envia a ficha por e-mail ou WhatsApp, depois de autorizar o uso dos seus dados.","Verificamos se o seu caso está dentro do que fazemos. Se não estiver, dizemos a quem recorrer.","Enviamos por escrito o escopo, o preço e os prazos. Nada começa sem a sua aceitação.","Toda opinião jurídica é dada pelos nossos advogados colombianos. O restante da equipe orienta, organiza os documentos e traduz."]},howLevelsH:{es:"Qué incluye cada servicio",en:"What each service includes",fr:"Ce que comprend chaque service",pt:"O que inclui cada serviço"},tagFree:{es:"Gratis",en:"Free",fr:"Gratuit",pt:"Grátis"},tagQuote:{es:"Con cotización",en:"Quoted first",fr:"Sur devis",pt:"Com orçamento"},howLevels:{es:[["Información general","La guía de derechos: normas, plazos y fuentes, igual para todos.",0],["Orientación inicial","Su ficha según sus respuestas: qué revisar y qué hacer ahora. No es un concepto sobre su caso.",0],["Asesoría","Un abogado del equipo estudia sus documentos y le da su concepto sobre su caso concreto.",1],["Documentos","Reclamaciones, derechos de petición, contratos y poderes redactados o revisados por nuestros abogados.",1],["Representación","Un abogado del equipo actúa en su nombre ante la empresa o la autoridad, con poder firmado.",1]],en:[["General information","The rights guide: rules, deadlines and sources, the same for everyone.",0],["First guidance","Your sheet based on your answers: what to check and what to do now. It is not an opinion on your case.",0],["Advice","One of our lawyers studies your documents and gives you an opinion on your specific case.",1],["Documents","Complaints, formal petitions, contracts and powers of attorney drafted or reviewed by our lawyers.",1],["Representation","One of our lawyers acts on your behalf before the company or the authority, under a signed power of attorney.",1]],fr:[["Information générale","Le guide des droits : règles, délais et sources, identiques pour tous.",0],["Orientation initiale","Votre fiche selon vos réponses : quoi vérifier et quoi faire maintenant. Ce n’est pas un avis sur votre cas.",0],["Conseil","Un de nos avocats étudie vos documents et vous donne son avis sur votre cas précis.",1],["Documents","Réclamations, requêtes (derechos de petición), contrats et procurations rédigés ou revus par nos avocats.",1],["Représentation","Un de nos avocats agit en votre nom auprès de l’entreprise ou de l’autorité, avec une procuration signée.",1]],pt:[["Informação geral","O guia de direitos: normas, prazos e fontes, igual para todos.",0],["Orientação inicial","Sua ficha conforme suas respostas: o que revisar e o que fazer agora. Não é um parecer sobre o seu caso.",0],["Assessoria","Um dos nossos advogados estuda seus documentos e dá o parecer sobre o seu caso concreto.",1],["Documentos","Reclamações, petições (derechos de petición), contratos e procurações redigidos ou revisados pelos nossos advogados.",1],["Representação","Um dos nossos advogados atua em seu nome perante a empresa ou a autoridade, com procuração assinada.",1]]},howNotH:{es:"Lo que no hacemos",en:"What we don’t do",fr:"Ce que nous ne faisons pas",pt:"O que não fazemos"},howNot:{es:["No generamos respuestas automáticas sobre su caso: la ficha sigue un cuestionario fijo, con fuentes citadas y fecha de actualización.","No prometemos resultados: le decimos con claridad qué es posible.","La ficha gratuita es orientación general, no un concepto jurídico sobre su caso.","No tratamos la relación laboral de conductores y repartidores; le indicamos a quién acudir.","No guardamos lo que responde en esta página."],en:["We don’t generate automatic answers about your case: the sheet follows a fixed questionnaire, with cited sources and an update date.","We don’t promise outcomes: we tell you clearly what is possible.","The free sheet is general guidance, not a legal opinion on your case.","We don’t handle the employment relationship of drivers and couriers; we tell you who does.","We don’t store what you answer on this page."],fr:["Nous ne générons pas de réponses automatiques sur votre cas : la fiche suit un questionnaire fixe, avec sources citées et date de mise à jour.","Nous ne promettons pas de résultat : nous vous disons clairement ce qui est possible.","La fiche gratuite est une orientation générale, pas un avis juridique sur votre cas.","Nous ne traitons pas la relation de travail des chauffeurs et livreurs ; nous vous indiquons à qui vous adresser.","Nous ne gardons pas ce que vous répondez sur cette page."],pt:["Não geramos respostas automáticas sobre o seu caso: a ficha segue um questionário fixo, com fontes citadas e data de atualização.","Não prometemos resultados: dizemos com clareza o que é possível.","A ficha gratuita é orientação geral, não um parecer jurídico sobre o seu caso.","Não tratamos da relação de trabalho de motoristas e entregadores; indicamos a quem recorrer.","Não guardamos o que você responde nesta página."]},howDataH:{es:"Sus datos",en:"Your data",fr:"Vos données",pt:"Seus dados"},howData:{es:"Esta página no usa cookies ni guarda sus respuestas. Si nos escribe, usamos sus datos solo para atender su caso (Ley 1581 de 2012) y puede pedir que los corrijamos o borremos.",en:"This page uses no cookies and does not store your answers. If you write to us, we use your data only to handle your case (Colombian Law 1581 of 2012), and you can ask us to correct or delete it.",fr:"Cette page n’utilise pas de cookies et ne garde pas vos réponses. Si vous nous écrivez, nous utilisons vos données uniquement pour traiter votre cas (loi colombienne 1581 de 2012) et vous pouvez demander leur correction ou leur suppression.",pt:"Esta página não usa cookies nem guarda suas respostas. Se você nos escrever, usamos seus dados apenas para atender o seu caso (Lei colombiana 1581 de 2012) e você pode pedir que sejam corrigidos ou excluídos."},howContactH:{es:"Contacto y reclamos",en:"Contact and complaints",fr:"Contact et réclamations",pt:"Contato e reclamações"},howContact:{es:"Escríbanos a {email}. Por el mismo correo puede presentar una petición, queja o reclamo (PQR) sobre nuestro servicio; respondemos en máximo 15 días hábiles.",en:"Write to us at {email}. You can use the same address for any request or complaint about our service; we reply within 15 business days at most.",fr:"Écrivez-nous à {email}. La même adresse reçoit vos demandes et réclamations sur notre service ; nous répondons en 15 jours ouvrables au plus.",pt:"Escreva para {email}. O mesmo endereço recebe pedidos, queixas e reclamações sobre o nosso serviço; respondemos em no máximo 15 dias úteis."},howCompanyH:{es:"La empresa",en:"The company",fr:"La société",pt:"A empresa"},legalDraft:{es:"Borrador para revisión de la abogada. Esta página no se enlaza para los clientes hasta su validación.",en:"Draft for the lawyer’s review. This page is not linked for clients until it is approved.",fr:"Brouillon soumis à l’avocate. Cette page n’est pas proposée aux clients avant validation.",pt:"Rascunho para revisão da advogada. Esta página não é exibida aos clientes até ser validada."},lastUpd:{es:"Última actualización: {d}.",en:"Last updated: {d}.",fr:"Dernière mise à jour : {d}.",pt:"Última atualização: {d}."},termsT:{es:"Términos y condiciones",en:"Terms and conditions",fr:"Conditions générales",pt:"Termos e condições"},terms:{es:[["Quiénes somos","Este sitio es de IHA SOLUCIONES LEGALES Y TECNICAS S.A.S., NIT 900.365.039-8, con domicilio en Medellín, Colombia. Contacto: {email}."],["Orientación gratuita","La ficha y la guía son información general sobre normas colombianas. No son un concepto jurídico sobre su caso ni crean una relación abogado-cliente."],["Servicios pagos","Antes de cualquier servicio pago le enviamos por escrito el alcance, el precio, los impuestos y los plazos. El servicio empieza solo cuando usted acepta y firma el contrato."],["Sin promesa de resultados","Le explicamos con claridad lo que es posible, pero el resultado depende también de terceros: empresas, plataformas y autoridades."],["Quién da la opinión jurídica","Toda opinión jurídica o actuación ante una autoridad la realiza un abogado inscrito en Colombia."],["Información y fuentes","Revisamos la información con regularidad y citamos las fuentes. Las normas cambian: confirmamos su caso antes de actuar."],["Peticiones, quejas y reclamos","Puede presentar una PQR sobre nuestro servicio a {email}. Respondemos en máximo 15 días hábiles."],["Ley aplicable","Estos términos se rigen por la ley colombiana. Como consumidor, conserva todos sus derechos, incluido acudir a la SIC."],["Cambios","Podemos actualizar estos términos; la fecha de la última versión aparece arriba."]],en:[["Who we are","This site belongs to IHA SOLUCIONES LEGALES Y TECNICAS S.A.S., tax ID (NIT) 900.365.039-8, based in Medellín, Colombia. Contact: {email}."],["Free guidance","The sheet and the guide are general information about Colombian rules. They are not a legal opinion on your case and do not create a lawyer-client relationship."],["Paid services","Before any paid service we send you the scope, price, taxes and timeline in writing. The service starts only when you accept and sign the contract."],["No promised outcome","We explain clearly what is possible, but the outcome also depends on others: companies, platforms and authorities."],["Who gives legal opinions","Any legal opinion or action before an authority is carried out by a lawyer registered in Colombia."],["Information and sources","We review the information regularly and cite our sources. Rules change: we confirm your case before acting."],["Requests and complaints","You can send a request or complaint about our service to {email}. We reply within 15 business days at most."],["Governing law","These terms are governed by Colombian law. As a consumer, you keep all your rights, including going to the SIC."],["Changes","We may update these terms; the date of the latest version appears above."]],fr:[["Qui sommes-nous","Ce site appartient à IHA SOLUCIONES LEGALES Y TECNICAS S.A.S., NIT 900.365.039-8, dont le siège est à Medellín, Colombie. Contact : {email}."],["Orientation gratuite","La fiche et le guide sont des informations générales sur les règles colombiennes. Ce ne sont pas un avis juridique sur votre cas et ils ne créent pas de relation avocat-client."],["Services payants","Avant tout service payant, nous vous envoyons par écrit le périmètre, le prix, les taxes et les délais. Le service ne commence que lorsque vous acceptez et signez le contrat."],["Pas de résultat promis","Nous expliquons clairement ce qui est possible, mais le résultat dépend aussi de tiers : entreprises, plateformes et autorités."],["Qui donne l’avis juridique","Tout avis juridique ou toute démarche auprès d’une autorité est assuré par un avocat inscrit en Colombie."],["Informations et sources","Nous révisons régulièrement les informations et citons nos sources. Les règles changent : nous vérifions votre cas avant d’agir."],["Demandes et réclamations","Vous pouvez adresser une demande ou une réclamation sur notre service à {email}. Nous répondons en 15 jours ouvrables au plus."],["Droit applicable","Ces conditions relèvent du droit colombien. En tant que consommateur, vous gardez tous vos droits, dont celui de saisir la SIC."],["Modifications","Nous pouvons mettre à jour ces conditions ; la date de la dernière version figure ci-dessus."]],pt:[["Quem somos","Este site pertence à IHA SOLUCIONES LEGALES Y TECNICAS S.A.S., NIT 900.365.039-8, com sede em Medellín, Colômbia. Contato: {email}."],["Orientação gratuita","A ficha e o guia são informação geral sobre normas colombianas. Não são um parecer jurídico sobre o seu caso nem criam uma relação advogado-cliente."],["Serviços pagos","Antes de qualquer serviço pago, enviamos por escrito o escopo, o preço, os impostos e os prazos. O serviço só começa quando você aceita e assina o contrato."],["Sem promessa de resultados","Explicamos com clareza o que é possível, mas o resultado também depende de terceiros: empresas, plataformas e autoridades."],["Quem dá o parecer jurídico","Todo parecer jurídico ou atuação perante uma autoridade é feito por um advogado inscrito na Colômbia."],["Informação e fontes","Revisamos a informação com regularidade e citamos as fontes. As normas mudam: confirmamos o seu caso antes de agir."],["Pedidos, queixas e reclamações","Você pode enviar um pedido ou reclamação sobre o nosso serviço para {email}. Respondemos em no máximo 15 dias úteis."],["Lei aplicável","Estes termos são regidos pela lei colombiana. Como consumidor, você mantém todos os seus direitos, inclusive recorrer à SIC."],["Alterações","Podemos atualizar estes termos; a data da última versão aparece acima."]]},privT:{es:"Política de tratamiento de datos personales",en:"Personal data policy",fr:"Politique de traitement des données personnelles",pt:"Política de tratamento de dados pessoais"},priv:{es:[["Responsable","IHA SOLUCIONES LEGALES Y TECNICAS S.A.S., NIT 900.365.039-8, Medellín, Colombia. Correo: {email}."],["Qué datos tratamos","Los que usted nos envía: su ficha, su nombre, sus datos de contacto y los documentos de su caso. Esta página no usa cookies ni guarda sus respuestas."],["Para qué","Para responderle, orientarle, preparar una propuesta y, si la acepta, prestar el servicio y facturarlo. No vendemos ni cedemos sus datos."],["Datos sensibles","Si su caso incluye datos de salud, de menores o de violencia, no está obligado a darlos; los usamos solo con su autorización expresa y para su caso."],["Transferencias","WhatsApp y el correo electrónico guardan los mensajes en servidores fuera de Colombia. Al escribirnos por esos medios, usted lo acepta."],["Sus derechos","Conocer, actualizar, corregir y suprimir sus datos, revocar su autorización y quejarse ante la SIC (Ley 1581 de 2012, art. 8)."],["Cómo ejercerlos","Escriba a {email}. Respondemos las consultas en 10 días hábiles y los reclamos en 15 días hábiles, prorrogables según la ley."],["Conservación","Guardamos los datos mientras atendemos su caso y el tiempo que exige la ley; después los borramos."],["Vigencia","Esta política rige desde su publicación."]],en:[["Data controller","IHA SOLUCIONES LEGALES Y TECNICAS S.A.S., NIT 900.365.039-8, Medellín, Colombia. Email: {email}."],["What data we process","What you send us: your sheet, your name, your contact details and the documents for your case. This page uses no cookies and does not store your answers."],["Why","To reply to you, guide you, prepare a proposal and, if you accept it, provide and invoice the service. We do not sell or share your data."],["Sensitive data","If your case involves health data, minors or violence, you are not required to provide it; we use it only with your express consent and for your case."],["Transfers","WhatsApp and email store messages on servers outside Colombia. By writing to us through these channels, you accept this."],["Your rights","To know, update, correct and delete your data, withdraw your consent and complain to the SIC (Law 1581 of 2012, art. 8)."],["How to exercise them","Write to {email}. We answer requests within 10 business days and complaints within 15 business days, extendable as the law allows."],["Retention","We keep your data while we handle your case and for as long as the law requires; then we delete it."],["Effective date","This policy applies from its publication."]],fr:[["Responsable du traitement","IHA SOLUCIONES LEGALES Y TECNICAS S.A.S., NIT 900.365.039-8, Medellín, Colombie. E-mail : {email}."],["Quelles données","Celles que vous nous envoyez : votre fiche, votre nom, vos coordonnées et les documents de votre dossier. Cette page n’utilise pas de cookies et ne garde pas vos réponses."],["Pour quoi faire","Pour vous répondre, vous orienter, préparer une proposition et, si vous l’acceptez, fournir et facturer le service. Nous ne vendons ni ne cédons vos données."],["Données sensibles","Si votre dossier comporte des données de santé, concernant des mineurs ou des violences, vous n’êtes pas obligé de les fournir ; nous les utilisons uniquement avec votre accord exprès et pour votre dossier."],["Transferts","WhatsApp et la messagerie électronique conservent les messages sur des serveurs hors de Colombie. En nous écrivant par ces moyens, vous l’acceptez."],["Vos droits","Connaître, mettre à jour, corriger et supprimer vos données, retirer votre autorisation et vous plaindre auprès de la SIC (loi 1581 de 2012, art. 8)."],["Comment les exercer","Écrivez à {email}. Nous répondons aux demandes en 10 jours ouvrables et aux réclamations en 15 jours ouvrables, prolongeables selon la loi."],["Conservation","Nous gardons les données pendant le traitement de votre dossier et la durée exigée par la loi ; ensuite nous les supprimons."],["Entrée en vigueur","Cette politique s’applique dès sa publication."]],pt:[["Responsável","IHA SOLUCIONES LEGALES Y TECNICAS S.A.S., NIT 900.365.039-8, Medellín, Colômbia. E-mail: {email}."],["Que dados tratamos","Os que você nos envia: sua ficha, seu nome, seus dados de contato e os documentos do seu caso. Esta página não usa cookies nem guarda suas respostas."],["Para quê","Para responder, orientar, preparar uma proposta e, se você aceitar, prestar o serviço e faturá-lo. Não vendemos nem cedemos seus dados."],["Dados sensíveis","Se o seu caso incluir dados de saúde, de menores ou de violência, você não é obrigado a fornecê-los; só os usamos com sua autorização expressa e para o seu caso."],["Transferências","O WhatsApp e o e-mail guardam as mensagens em servidores fora da Colômbia. Ao nos escrever por esses meios, você aceita isso."],["Seus direitos","Conhecer, atualizar, corrigir e excluir seus dados, revogar sua autorização e reclamar à SIC (Lei 1581 de 2012, art. 8)."],["Como exercê-los","Escreva para {email}. Respondemos às consultas em 10 dias úteis e às reclamações em 15 dias úteis, prorrogáveis conforme a lei."],["Conservação","Guardamos os dados enquanto atendemos o seu caso e pelo tempo que a lei exige; depois os excluímos."],["Vigência","Esta política vigora a partir da sua publicação."]]},novT:{es:"Lo que podría cambiar para la vivienda turística",en:"What could change for short-term rentals",fr:"Ce qui pourrait changer pour la location touristique",pt:"O que pode mudar para o aluguel por temporada"},novEye:{es:"Novedades para anfitriones",en:"News for hosts",fr:"Nouveautés pour les hôtes",pt:"Novidades para anfitriões"},novLead:{es:"Dos proyectos en discusión podrían cambiar las reglas para anfitriones y plataformas. Todavía no son normas vigentes: esto es lo que se sabe al {d}.",en:"Two drafts under discussion could change the rules for hosts and platforms. They are not in force yet: this is what is known as of {d}.",fr:"Deux projets en discussion pourraient changer les règles pour les hôtes et les plateformes. Ils ne sont pas encore en vigueur : voici ce que l’on sait au {d}.",pt:"Dois projetos em discussão podem mudar as regras para anfitriões e plataformas. Ainda não estão em vigor: isto é o que se sabe em {d}."},novStatus:{es:"Estado",en:"Status",fr:"Statut",pt:"Situação"},novCards:[{h:{es:"Proyecto de decreto del Registro Nacional de Turismo (MinCIT)",en:"Draft decree on the National Tourism Registry (MinCIT)",fr:"Projet de décret sur le Registre national du tourisme (MinCIT)",pt:"Projeto de decreto do Registro Nacional de Turismo (MinCIT)"},st:{es:"Borrador. El Gobierno reabrió los comentarios en julio de 2026; no hay fecha de expedición.",en:"Draft. The government reopened comments in July 2026; no issue date has been set.",fr:"Projet. Le gouvernement a rouvert la consultation en juillet 2026 ; aucune date d’adoption.",pt:"Rascunho. O governo reabriu os comentários em julho de 2026; não há data de publicação."},items:{es:["Un RNT por cada vivienda: ya no valdría un registro general para un edificio o un portafolio.","En propiedad horizontal, probar que el reglamento permite el alquiler turístico (reglamento o certificado del administrador).","Si quien opera no es el propietario, declaración bajo juramento con su autorización.","Número de RNT vigente visible en cada anuncio.","Las plataformas tendrían que registrarse en el RNT y retirar los anuncios sin RNT vigente o con datos que no coincidan, con una verificación cada seis meses."],en:["One RNT per property: a single registration for a building or portfolio would no longer be valid.","In a condominium, proof that the building rules allow short-term rentals (the rules or a certificate from the administrator).","If the operator is not the owner, a sworn statement of the owner’s permission.","A valid RNT number visible on every listing.","Platforms would have to register in the RNT and remove listings without a valid RNT or with mismatched details, checking every six months."],fr:["Une RNT par logement : un enregistrement global pour un immeuble ou un portefeuille ne serait plus valable.","En copropriété, prouver que le règlement autorise la location touristique (règlement ou attestation du syndic).","Si l’exploitant n’est pas le propriétaire, déclaration sur l’honneur de son autorisation.","Numéro de RNT valide visible sur chaque annonce.","Les plateformes devraient s’inscrire au RNT et retirer les annonces sans RNT valide ou aux données discordantes, avec une vérification tous les six mois."],pt:["Um RNT por imóvel: um registro geral para um prédio ou carteira deixaria de valer.","Em condomínio, comprovar que o regulamento permite o aluguel turístico (regulamento ou certidão do administrador).","Se quem opera não é o proprietário, declaração sob juramento com a autorização dele.","Número de RNT vigente visível em cada anúncio.","As plataformas teriam de se registrar no RNT e retirar anúncios sem RNT vigente ou com dados divergentes, com verificação a cada seis meses."]},src:["Vanguardia, 16 jul. 2026","https://www.vanguardia.com/colombia/2026/07/16/atencion-propietarios-de-airbnb-gobierno-alista-decreto-que-cambiaria-las-reglas-del-negocio-en-colombia/"]},{h:{es:"Proyecto de nuevo POT de Medellín",en:"Draft new zoning plan (POT) for Medellín",fr:"Projet de nouveau POT de Medellín",pt:"Projeto de novo POT de Medellín"},st:{es:"Borrador en discusión (septiembre de 2026).",en:"Draft under discussion (September 2026).",fr:"Projet en discussion (septembre 2026).",pt:"Rascunho em discussão (setembro de 2026)."},items:{es:["Restringiría las zonas donde se permite la vivienda turística y la prohibiría en amplias zonas residenciales.","Según el gremio Asohost, no prevé un periodo de transición y el «uso establecido» no protegería a quienes hoy operan en zonas residenciales."],en:["It would restrict the areas where short-term rentals are allowed and ban them in large residential areas.","According to the trade group Asohost, it sets no transition period and “established use” would not protect those operating today in residential areas."],fr:["Il restreindrait les zones où la location touristique est permise et l’interdirait dans de vastes zones résidentielles.","Selon l’organisation Asohost, il ne prévoit pas de période de transition et l’« usage établi » ne protégerait pas ceux qui exploitent aujourd’hui en zone résidentielle."],pt:["Restringiria as zonas onde o aluguel por temporada é permitido e o proibiria em amplas áreas residenciais.","Segundo a entidade Asohost, não prevê período de transição e o «uso estabelecido» não protegeria quem opera hoje em zonas residenciais."]},src:["Portafolio, 11 sep. 2026","https://www.portafolio.co/economia/regiones/el-nuevo-pot-de-medellin-pondria-en-riesgo-el-ingreso-de-miles-de-familias-que-dependen-del-turismo-alerta-asohost-502283"]}],novTodoH:{es:"Qué hacer desde ya",en:"What to do now",fr:"Que faire dès maintenant",pt:"O que fazer desde já"},novTodo:{es:["Tenga el RNT vigente de cada unidad y renuévelo antes del 31 de marzo.","Reúna hoy el reglamento de la copropiedad o un certificado del administrador.","Si administra inmuebles de terceros, pida la autorización escrita de cada propietario.","Mantenga la TRA y el reporte SIRE al día."],en:["Keep a valid RNT for each unit and renew it before 31 March.","Gather the building rules or a certificate from the administrator now.","If you manage other owners’ properties, get each owner’s written permission.","Keep guest records (TRA) and SIRE reporting up to date."],fr:["Ayez une RNT valide pour chaque logement et renouvelez-la avant le 31 mars.","Réunissez dès maintenant le règlement de copropriété ou une attestation du syndic.","Si vous gérez des biens de tiers, obtenez l’autorisation écrite de chaque propriétaire.","Tenez à jour la fiche des voyageurs (TRA) et les déclarations SIRE."],pt:["Tenha o RNT vigente de cada unidade e renove-o antes de 31 de março.","Reúna desde já o regulamento do condomínio ou uma certidão do administrador.","Se administra imóveis de terceiros, peça a autorização por escrito de cada proprietário.","Mantenha a TRA e o reporte SIRE em dia."]},novCta:{es:"Revisar mi situación de anfitrión",en:"Check my situation as a host",fr:"Vérifier ma situation d’hôte",pt:"Verificar minha situação de anfitrião"},novNote:{es:"Información sobre proyectos en discusión, no sobre normas vigentes. Con la Suscripción Esencial le avisamos cuando se expidan.",en:"Information about drafts under discussion, not rules in force. With the Essential subscription we alert you when they are issued.",fr:"Informations sur des projets en discussion, pas sur des règles en vigueur. Avec l’abonnement Essentiel, nous vous prévenons dès leur adoption.",pt:"Informação sobre projetos em discussão, não sobre normas vigentes. Com a Assinatura Essencial avisamos quando forem publicados."}});const r="2026-11-09";Object.assign(a,{footPrf:{es:"Guía de pruebas",en:"Evidence guide",fr:"Guide des preuves",pt:"Guia de provas"},homePrfT:{es:"Guía de pruebas: qué reunir y cómo cuidarlo",en:"Evidence guide: what to gather and how to keep it",fr:"Guide des preuves : quoi réunir et comment le conserver",pt:"Guia de provas: o que reunir e como guardar"},homePrfP:{es:"Por tipo de caso, con buenas prácticas digitales, protección de datos y a quién acudir si la empresa está en el exterior.",en:"By type of case, with good digital habits, data protection and where to turn if the company is abroad.",fr:"Par type de dossier, avec les bonnes pratiques numériques, la protection des données et les recours si l’entreprise est à l’étranger.",pt:"Por tipo de caso, com boas práticas digitais, proteção de dados e a quem recorrer se a empresa estiver no exterior."},docsHow:{es:"Cómo reunir y cuidar estas pruebas",en:"How to gather and keep this evidence",fr:"Comment réunir et conserver ces preuves",pt:"Como reunir e guardar essas provas"},prfEye:{es:"Guía de pruebas",en:"Evidence guide",fr:"Guide des preuves",pt:"Guia de provas"},prfT:{es:"Cómo reunir y cuidar sus pruebas",en:"How to gather and protect your evidence",fr:"Comment réunir et protéger vos preuves",pt:"Como reunir e proteger suas provas"},prfLead:{es:"Una prueba convierte su versión en un hecho que la empresa, la SIC o un juez pueden verificar. Aquí ve qué reunir según su caso, cómo guardarlo para que conserve su valor y cómo proteger sus datos al compartirlo.",en:"Evidence turns your account into a fact that the company, the SIC (Colombia’s consumer authority) or a judge can check. Here you will see what to gather for your case, how to store it so it keeps its value, and how to protect your data when you share it.",fr:"Une preuve transforme votre version en un fait que l’entreprise, la SIC (l’autorité colombienne de la consommation) ou un juge peuvent vérifier. Vous verrez ici quoi réunir selon votre dossier, comment le conserver pour qu’il garde sa valeur et comment protéger vos données en le partageant.",pt:"Uma prova transforma a sua versão num fato que a empresa, a SIC (autoridade colombiana do consumidor) ou um juiz podem verificar. Aqui você vê o que reunir conforme o seu caso, como guardar para que mantenha o valor e como proteger seus dados ao compartilhar."},prfToc:{es:"En esta página",en:"On this page",fr:"Sur cette page",pt:"Nesta página"},prfGuide:{es:"Ver las fichas por situación",en:"See the sheets by situation",fr:"Voir les fiches par situation",pt:"Ver as fichas por situação"},prfValueH:{es:"Lo que una prueba representa",en:"What evidence is worth",fr:"Ce que vaut une preuve",pt:"O que uma prova representa"},prfValueP:{es:"Quien afirma un hecho debe probarlo (Código General del Proceso, art. 167). En un reclamo, sus pruebas obligan a la empresa a responder sobre hechos concretos y no sobre su palabra contra la de ella. Una prueba vale por tres cosas: que no haya sido alterada, que tenga fecha y que se pueda ligar a la empresa (su nombre, su número, su sitio web).",en:"Whoever states a fact must prove it (Colombian General Code of Procedure, art. 167). In a complaint, your evidence forces the company to answer on concrete facts rather than your word against theirs. Evidence is worth three things: it has not been altered, it has a date, and it can be tied to the company (its name, its number, its website).",fr:"Celui qui affirme un fait doit le prouver (Code général de procédure colombien, art. 167). Dans une réclamation, vos preuves obligent l’entreprise à répondre sur des faits concrets, et non sur votre parole contre la sienne. Une preuve vaut par trois choses : elle n’a pas été modifiée, elle est datée et on peut la relier à l’entreprise (son nom, son numéro, son site web).",pt:"Quem afirma um fato deve prová-lo (Código Geral do Processo colombiano, art. 167). Numa reclamação, suas provas obrigam a empresa a responder sobre fatos concretos, e não sobre a sua palavra contra a dela. Uma prova vale por três coisas: não foi alterada, tem data e pode ser ligada à empresa (nome, número, site)."},prfTag:{strong:{es:"Más fuerte",en:"Strongest",fr:"La plus solide",pt:"Mais forte"},useful:{es:"Útil",en:"Useful",fr:"Utile",pt:"Útil"},weak:{es:"Débil si va sola",en:"Weak on its own",fr:"Faible si elle est seule",pt:"Fraca sozinha"}},prfLadder:{es:[["Documentos y mensajes en su formato original","La factura, el contrato, el correo guardado como archivo, el chat exportado desde la aplicación, el extracto del banco. La ley los admite como prueba y los valora según cómo se generaron y se guardaron, y si se conservan íntegros (Ley 527 de 1999, arts. 10 y 11; Código General del Proceso, arts. 243 y 247).","strong"],["Fotos, videos, capturas y testigos","Fotos y videos con fecha, capturas de pantalla completas, el nombre y el contacto de quien vio lo ocurrido. Refuerzan su relato, sobre todo cuando coinciden entre sí.","useful"],["Una captura impresa, sin el original","La Corte Constitucional trató capturas impresas de WhatsApp como un simple indicio (Sentencia T-043 de 2020), aunque otras autoridades las valoran como documento. Por eso, además de la captura, conserve el original en su celular o exportado.","weak"]],en:[["Documents and messages in their original format","The invoice, the contract, the email saved as a file, the chat exported from the app, the bank statement. The law accepts them as evidence and weighs them by how they were created and stored, and whether they remain intact (Colombian Law 527 of 1999, arts. 10 and 11; General Code of Procedure, arts. 243 and 247).","strong"],["Photos, videos, screenshots and witnesses","Dated photos and videos, full screenshots, the name and contact details of anyone who saw what happened. They support your account, especially when they match each other.","useful"],["A printed screenshot without the original","Colombia’s Constitutional Court treated printed WhatsApp screenshots as mere circumstantial evidence (Judgment T-043 of 2020), although other authorities treat them as documents. So, besides the screenshot, keep the original on your phone or exported.","weak"]],fr:[["Documents et messages dans leur format d’origine","La facture, le contrat, l’e-mail enregistré comme fichier, la conversation exportée depuis l’application, le relevé bancaire. La loi les admet comme preuve et les apprécie selon la façon dont ils ont été créés et conservés, et s’ils sont restés intacts (loi colombienne 527 de 1999, art. 10 et 11 ; Code général de procédure, art. 243 et 247).","strong"],["Photos, vidéos, captures et témoins","Photos et vidéos datées, captures d’écran complètes, le nom et les coordonnées de qui a vu les faits. Elles renforcent votre récit, surtout quand elles concordent.","useful"],["Une capture imprimée, sans l’original","La Cour constitutionnelle a traité des captures WhatsApp imprimées comme un simple indice (arrêt T-043 de 2020), même si d’autres autorités les considèrent comme des documents. Donc, en plus de la capture, gardez l’original sur votre téléphone ou exporté.","weak"]],pt:[["Documentos e mensagens no formato original","A nota fiscal, o contrato, o e-mail salvo como arquivo, a conversa exportada do aplicativo, o extrato do banco. A lei os admite como prova e os avalia conforme foram gerados e guardados, e se continuam íntegros (Lei colombiana 527 de 1999, arts. 10 e 11; Código Geral do Processo, arts. 243 e 247).","strong"],["Fotos, vídeos, capturas e testemunhas","Fotos e vídeos com data, capturas de tela completas, o nome e o contato de quem viu o ocorrido. Reforçam o seu relato, sobretudo quando batem entre si.","useful"],["Uma captura impressa, sem o original","A Corte Constitucional tratou capturas impressas de WhatsApp como simples indício (Sentença T-043 de 2020), embora outras autoridades as considerem documento. Por isso, além da captura, guarde o original no celular ou exportado.","weak"]]},prfRulesH:{es:"Siete reglas para reunirlas",en:"Seven rules for gathering it",fr:"Sept règles pour les réunir",pt:"Sete regras para reunir"},prfRules:{es:["Hoy, no mañana: los anuncios cambian, los chats se borran y algunos plazos son de 5 días hábiles.","Con fecha y hora visibles: en la captura, en el nombre del archivo o diciendo la fecha en voz alta al empezar un video.","El original, además de la captura: exporte el chat desde la aplicación, guarde el correo como archivo y descargue la factura del sitio de la empresa.","Sin editar: no recorte, no marque ni aplique filtros al original. Si necesita resaltar algo, hágalo en una copia.","Por escrito: si habló por teléfono, confirme lo dicho en un correo o mensaje y anote el número de radicado o CUN.","El anuncio completo: con la dirección web, el precio, las condiciones y la fecha. Si puede, guárdelo también en PDF desde el navegador (Imprimir, Guardar como PDF).","Dos copias: una en el celular y otra en la nube o en un computador, en una carpeta por caso."],en:["Today, not tomorrow: listings change, chats get deleted and some deadlines are 5 business days.","With the date and time visible: in the screenshot, in the file name, or by saying the date out loud at the start of a video.","The original as well as the screenshot: export the chat from the app, save the email as a file and download the invoice from the company’s website.","Unedited: do not crop, mark or filter the original. If you need to highlight something, do it on a copy.","In writing: if you spoke by phone, confirm what was said by email or message and note the reference number.","The whole listing: with the web address, price, conditions and date. If you can, also save it as a PDF from your browser (Print, Save as PDF).","Two copies: one on your phone and one in the cloud or on a computer, in one folder per case."],fr:["Aujourd’hui, pas demain : les annonces changent, les conversations s’effacent et certains délais sont de 5 jours ouvrables.","Avec la date et l’heure visibles : sur la capture, dans le nom du fichier, ou en disant la date à voix haute au début d’une vidéo.","L’original en plus de la capture : exportez la conversation depuis l’application, enregistrez l’e-mail comme fichier et téléchargez la facture sur le site de l’entreprise.","Sans retouche : ne recadrez pas, n’annotez pas et n’appliquez aucun filtre à l’original. Pour surligner, travaillez sur une copie.","Par écrit : après un appel, confirmez ce qui a été dit par e-mail ou message et notez le numéro de dossier.","L’annonce complète : avec l’adresse web, le prix, les conditions et la date. Si possible, enregistrez-la aussi en PDF depuis le navigateur (Imprimer, Enregistrer en PDF).","Deux copies : une sur le téléphone et une dans le cloud ou sur un ordinateur, dans un dossier par affaire."],pt:["Hoje, não amanhã: os anúncios mudam, as conversas se apagam e alguns prazos são de 5 dias úteis.","Com data e hora visíveis: na captura, no nome do arquivo ou dizendo a data em voz alta no início de um vídeo.","O original, além da captura: exporte a conversa pelo aplicativo, salve o e-mail como arquivo e baixe a nota fiscal no site da empresa.","Sem editar: não corte, não marque nem aplique filtros ao original. Se precisar destacar algo, faça numa cópia.","Por escrito: se falou por telefone, confirme o que foi dito por e-mail ou mensagem e anote o número de protocolo.","O anúncio completo: com o endereço web, o preço, as condições e a data. Se puder, salve também em PDF pelo navegador (Imprimir, Salvar como PDF).","Duas cópias: uma no celular e outra na nuvem ou num computador, numa pasta por caso."]},prfSecH:{es:"Qué reunir según su caso",en:"What to gather for your case",fr:"Quoi réunir selon votre dossier",pt:"O que reunir conforme o seu caso"},prfSecP:{es:"Abra su tipo de caso. Cada lista se completa con la ficha de su situación en la guía.",en:"Open your type of case. Each list is completed by the sheet for your situation in the guide.",fr:"Ouvrez votre type de dossier. Chaque liste se complète avec la fiche de votre situation dans le guide.",pt:"Abra o seu tipo de caso. Cada lista se completa com a ficha da sua situação no guia."},prfSectors:[{ic:"home",t:{es:"Alojamiento y turismo (huéspedes)",en:"Accommodation and tourism (guests)",fr:"Hébergement et tourisme (voyageurs)",pt:"Hospedagem e turismo (hóspedes)"},i:{es:["El anuncio tal como estaba al reservar: fotos, descripción, precio y política de cancelación.","La confirmación de la reserva y el comprobante de pago.","Los mensajes con el anfitrión, el hotel o la agencia, y con la plataforma, dentro de la aplicación.","Fotos y video del lugar al llegar y al salir, con fecha visible.","El número de reclamo que le dé la plataforma.","Las facturas de lo que pagó de más: otro alojamiento, transporte, comidas."],en:["The listing as it was when you booked: photos, description, price and cancellation policy.","The booking confirmation and proof of payment.","Messages with the host, hotel or agency, and with the platform, inside the app.","Photos and video of the place on arrival and departure, with the date visible.","The complaint number the platform gives you.","Receipts for anything extra you paid: another place to stay, transport, meals."],fr:["L’annonce telle qu’elle était au moment de réserver : photos, description, prix et conditions d’annulation.","La confirmation de réservation et la preuve de paiement.","Les messages avec l’hôte, l’hôtel ou l’agence, et avec la plateforme, dans l’application.","Photos et vidéo du logement à l’arrivée et au départ, date visible.","Le numéro de réclamation donné par la plateforme.","Les factures de ce que vous avez payé en plus : autre logement, transport, repas."],pt:["O anúncio como estava ao reservar: fotos, descrição, preço e política de cancelamento.","A confirmação da reserva e o comprovante de pagamento.","As mensagens com o anfitrião, o hotel ou a agência, e com a plataforma, dentro do aplicativo.","Fotos e vídeo do lugar na chegada e na saída, com data visível.","O número de reclamação que a plataforma informar.","As notas do que pagou a mais: outra hospedagem, transporte, refeições."]}},{ic:"bus",t:{es:"Vuelos y transporte",en:"Flights and transport",fr:"Vols et transport",pt:"Voos e transporte"},i:{es:["El tiquete, la reserva y el pasabordo.","El aviso de cancelación o de retraso, con la hora en que llegó.","Los recibos de comida, hotel y transporte que tuvo que pagar.","Equipaje: el informe de irregularidad que se hace en el aeropuerto, la etiqueta, fotos del daño y una lista del contenido, con facturas si las tiene.","Apps y taxis: el recibo del viaje, la ruta y la captura del precio estimado.","Su reclamo escrito y el número de radicado."],en:["The ticket, booking and boarding pass.","The cancellation or delay notice, with the time it arrived.","Receipts for the meals, hotel and transport you had to pay for.","Baggage: the irregularity report made at the airport, the tag, photos of the damage and a list of the contents, with receipts if you have them.","Ride apps and taxis: the trip receipt, the route and a screenshot of the estimated fare.","Your written complaint and its reference number."],fr:["Le billet, la réservation et la carte d’embarquement.","L’avis d’annulation ou de retard, avec l’heure de réception.","Les reçus des repas, de l’hôtel et du transport payés.","Bagages : le rapport d’irrégularité fait à l’aéroport, l’étiquette, des photos des dégâts et la liste du contenu, avec factures si vous en avez.","Applis de VTC et taxis : le reçu de la course, le trajet et la capture du prix estimé.","Votre réclamation écrite et son numéro de dossier."],pt:["A passagem, a reserva e o cartão de embarque.","O aviso de cancelamento ou atraso, com a hora em que chegou.","Os recibos de refeição, hotel e transporte que precisou pagar.","Bagagem: o relatório de irregularidade feito no aeroporto, a etiqueta, fotos do dano e uma lista do conteúdo, com notas se tiver.","Apps e táxis: o recibo da corrida, o trajeto e a captura do preço estimado.","Sua reclamação escrita e o número de protocolo."]}},{ic:"bag",t:{es:"Compras en línea y productos",en:"Online purchases and products",fr:"Achats en ligne et produits",pt:"Compras on-line e produtos"},i:{es:["La oferta o la publicidad, con fecha, precio y condiciones.","El pedido, la factura y el comprobante de pago.","El seguimiento del envío y las fechas prometidas.","Fotos o video al abrir el paquete y del defecto.","La garantía y las órdenes de servicio técnico de cada visita.","Los mensajes con el vendedor."],en:["The offer or advert, with date, price and conditions.","The order, invoice and proof of payment.","The shipment tracking and the promised dates.","Photos or video when opening the parcel and of the defect.","The warranty and the repair orders for each visit.","Messages with the seller."],fr:["L’offre ou la publicité, avec la date, le prix et les conditions.","La commande, la facture et la preuve de paiement.","Le suivi de l’envoi et les dates promises.","Photos ou vidéo à l’ouverture du colis et du défaut.","La garantie et les bons d’intervention de chaque passage au service technique.","Les messages avec le vendeur."],pt:["A oferta ou a publicidade, com data, preço e condições.","O pedido, a nota fiscal e o comprovante de pagamento.","O rastreamento do envio e as datas prometidas.","Fotos ou vídeo ao abrir o pacote e do defeito.","A garantia e as ordens de serviço de cada visita à assistência técnica.","As mensagens com o vendedor."]}},{ic:"lock",t:{es:"Bancos, pagos y cobros",en:"Banks, payments and charges",fr:"Banques, paiements et prélèvements",pt:"Bancos, pagamentos e cobranças"},i:{es:["El extracto con el cobro que no reconoce.","El número del reporte que hizo al banco y la hora.","La solicitud de reversión del pago y su respuesta.","La denuncia, si hubo fraude.","Capturas de los mensajes o correos sospechosos, sin abrir sus enlaces."],en:["The statement showing the charge you do not recognise.","The reference number and time of your report to the bank.","The payment reversal request and its answer.","The police report, if there was fraud.","Screenshots of suspicious messages or emails, without opening their links."],fr:["Le relevé avec l’opération que vous ne reconnaissez pas.","Le numéro et l’heure de votre signalement à la banque.","La demande d’annulation du paiement et sa réponse.","La plainte, en cas de fraude.","Des captures des messages ou e-mails suspects, sans ouvrir leurs liens."],pt:["O extrato com a cobrança que você não reconhece.","O número e a hora do aviso que fez ao banco.","O pedido de estorno do pagamento e a resposta.","O boletim de ocorrência, se houve fraude.","Capturas das mensagens ou e-mails suspeitos, sem abrir os links."]}},{ic:"phone",t:{es:"Telefonía, internet y servicios públicos",en:"Phone, internet and utilities",fr:"Téléphonie, internet et services publics",pt:"Telefonia, internet e serviços públicos"},i:{es:["El contrato o las condiciones que aceptó.","Las facturas con el cobro que discute.","El CUN o número de radicado de cada reclamo.","Pruebas de velocidad o capturas de las fallas, con fecha.","Fotos del medidor.","La constancia de su solicitud de cancelación."],en:["The contract or the terms you accepted.","The bills with the charge you dispute.","The CUN or reference number of each complaint.","Speed tests or screenshots of the outages, with dates.","Photos of the meter.","Proof of your cancellation request."],fr:["Le contrat ou les conditions acceptées.","Les factures avec le montant contesté.","Le CUN ou numéro de dossier de chaque réclamation.","Des tests de débit ou des captures des pannes, datés.","Des photos du compteur.","La preuve de votre demande de résiliation."],pt:["O contrato ou as condições que aceitou.","As contas com a cobrança que contesta.","O CUN ou número de protocolo de cada reclamação.","Testes de velocidade ou capturas das falhas, com data.","Fotos do medidor.","O comprovante do seu pedido de cancelamento."]}},{ic:"monitor",t:{es:"Plataformas digitales: cuenta, pagos y anuncios",en:"Digital platforms: account, payouts and listings",fr:"Plateformes numériques : compte, paiements et annonces",pt:"Plataformas digitais: conta, pagamentos e anúncios"},i:{es:["La copia de sus datos que la plataforma le permite descargar (en la configuración de la cuenta suele llamarse «Descargar tu información»).","Los avisos y correos de suspensión, retiro o retención, con fecha.","El historial de pagos y el saldo pendiente.","Los términos y políticas vigentes en la fecha del problema, guardados en PDF.","Capturas de su perfil, sus calificaciones y sus anuncios antes de que desaparezcan.","Su apelación y la respuesta."],en:["The copy of your data the platform lets you download (in the account settings it is often called “Download your information”).","The suspension, removal or withholding notices and emails, with dates.","Your payout history and pending balance.","The terms and policies in force on the date of the problem, saved as PDF.","Screenshots of your profile, ratings and listings before they disappear.","Your appeal and the answer."],fr:["La copie de vos données que la plateforme permet de télécharger (dans les paramètres du compte, souvent « Télécharger vos informations »).","Les avis et e-mails de suspension, de retrait ou de blocage, datés.","L’historique des paiements et le solde en attente.","Les conditions et politiques en vigueur à la date du problème, enregistrées en PDF.","Des captures de votre profil, de vos notes et de vos annonces avant qu’ils ne disparaissent.","Votre recours et la réponse."],pt:["A cópia dos seus dados que a plataforma permite baixar (nas configurações da conta costuma se chamar “Baixar suas informações”).","Os avisos e e-mails de suspensão, remoção ou retenção, com data.","O histórico de pagamentos e o saldo pendente.","Os termos e políticas vigentes na data do problema, salvos em PDF.","Capturas do seu perfil, avaliações e anúncios antes que desapareçam.","Seu recurso e a resposta."]}},{ic:"building",t:{es:"Anfitriones e inversionistas",en:"Hosts and investors",fr:"Hôtes et investisseurs",pt:"Anfitriões e investidores"},i:{es:["El RNT vigente de cada unidad y su certificado.","El reglamento de propiedad horizontal o el certificado del administrador.","Los registros en la TRA y los reportes al SIRE de huéspedes extranjeros.","La póliza de responsabilidad.","Fotos e inventario de entrada y salida de cada huésped.","Los mensajes con huéspedes y con la plataforma dentro de la aplicación, y los reportes de daños hechos a tiempo.","Las facturas de reparaciones."],en:["The valid RNT (National Tourism Registry) of each unit and its certificate.","The building rules or the administrator’s certificate.","The TRA guest records and the SIRE reports of foreign guests.","The liability insurance policy.","Check-in and check-out photos and inventory for each guest.","Messages with guests and with the platform inside the app, and damage reports made on time.","Repair invoices."],fr:["Le RNT (Registre national du tourisme) valide de chaque logement et son certificat.","Le règlement de copropriété ou l’attestation du syndic.","Les fiches TRA des voyageurs et les déclarations SIRE des voyageurs étrangers.","La police d’assurance responsabilité.","Photos et inventaire d’entrée et de sortie pour chaque voyageur.","Les messages avec les voyageurs et avec la plateforme dans l’application, et les signalements de dégâts faits à temps.","Les factures de réparation."],pt:["O RNT (Registro Nacional de Turismo) vigente de cada unidade e o certificado.","O regulamento do condomínio ou a certidão do administrador.","Os registros na TRA e os relatórios ao SIRE de hóspedes estrangeiros.","A apólice de responsabilidade.","Fotos e inventário de entrada e saída de cada hóspede.","As mensagens com hóspedes e com a plataforma dentro do aplicativo, e os relatos de danos feitos a tempo.","As notas de reparos."]}},{ic:"shield",t:{es:"Salud y datos personales",en:"Health and personal data",fr:"Santé et données personnelles",pt:"Saúde e dados pessoais"},i:{es:["La orden médica y la respuesta de la EPS o del plan.","El número de radicado de la PQRS.","Capturas de los mensajes o llamadas comerciales que no autorizó, con fecha y número.","La constancia de su consulta o reclamo sobre sus datos."],en:["The medical order and the answer from your health insurer (EPS) or plan.","The reference number of your complaint (PQRS).","Screenshots of marketing messages or calls you did not authorise, with date and number.","Proof of your request or complaint about your data."],fr:["L’ordonnance médicale et la réponse de l’EPS ou de la mutuelle.","Le numéro de dossier de la réclamation (PQRS).","Des captures des messages ou appels commerciaux non autorisés, avec date et numéro.","La preuve de votre demande ou réclamation sur vos données."],pt:["O pedido médico e a resposta da EPS ou do plano.","O número de protocolo da PQRS.","Capturas das mensagens ou ligações comerciais que não autorizou, com data e número.","O comprovante da sua consulta ou reclamação sobre seus dados."]}}],prfKeepH:{es:"Cómo conservarlas en digital",en:"How to keep it digitally",fr:"Comment les conserver en numérique",pt:"Como guardar no digital"},prfKeep:{es:["WhatsApp: exporte el chat con sus archivos (en Android: menú, Más, Exportar chat; en iPhone: toque el nombre del contacto, Exportar chat). No borre el chat del celular: el original es la mejor prueba.","Correo: guarde el mensaje como archivo (Descargar mensaje o Guardar como) o imprímalo en PDF con remitente, fecha y asunto visibles.","Páginas y anuncios: captura completa con la dirección web y la fecha, y además una copia en PDF desde el navegador.","Fotos y videos: guarde el archivo original. Las aplicaciones de mensajería los comprimen y pueden borrar la fecha y el lugar que trae el archivo.","Nombres que se ordenan solos: año, mes, día y qué es, por ejemplo 2026-11-09_anuncio.pdf. Una carpeta por caso.","Una línea de tiempo: fecha, qué pasó y qué prueba lo muestra. Es lo primero que le pediremos.","En la nube, con verificación en dos pasos, y una segunda copia en otro lugar."],en:["WhatsApp: export the chat with its media (on Android: menu, More, Export chat; on iPhone: tap the contact’s name, Export chat). Do not delete the chat from your phone: the original is the best evidence.","Email: save the message as a file (Download message or Save as) or print it to PDF with the sender, date and subject visible.","Web pages and listings: a full screenshot showing the web address and the date, plus a PDF copy from your browser.","Photos and videos: keep the original file. Messaging apps compress them and may strip the date and location stored in the file.","File names that sort themselves: year, month, day and what it is, for example 2026-11-09_listing.pdf. One folder per case.","A timeline: date, what happened and which evidence shows it. It is the first thing we will ask for.","In the cloud, with two-step verification, and a second copy somewhere else."],fr:["WhatsApp : exportez la conversation avec ses fichiers (sur Android : menu, Plus, Exporter la discussion ; sur iPhone : touchez le nom du contact, Exporter la discussion). N’effacez pas la conversation du téléphone : l’original est la meilleure preuve.","E-mail : enregistrez le message comme fichier (Télécharger le message ou Enregistrer sous) ou imprimez-le en PDF avec l’expéditeur, la date et l’objet visibles.","Pages web et annonces : une capture complète avec l’adresse web et la date, plus une copie PDF depuis le navigateur.","Photos et vidéos : gardez le fichier d’origine. Les messageries les compressent et peuvent effacer la date et le lieu enregistrés dans le fichier.","Des noms qui se trient tout seuls : année, mois, jour et contenu, par exemple 2026-11-09_annonce.pdf. Un dossier par affaire.","Une chronologie : la date, ce qui s’est passé et la preuve qui le montre. C’est la première chose que nous vous demanderons.","Dans le cloud, avec la validation en deux étapes, et une deuxième copie ailleurs."],pt:["WhatsApp: exporte a conversa com os arquivos (no Android: menu, Mais, Exportar conversa; no iPhone: toque no nome do contato, Exportar conversa). Não apague a conversa do celular: o original é a melhor prova.","E-mail: salve a mensagem como arquivo (Baixar mensagem ou Salvar como) ou imprima em PDF com remetente, data e assunto visíveis.","Páginas e anúncios: captura completa com o endereço web e a data, e também uma cópia em PDF pelo navegador.","Fotos e vídeos: guarde o arquivo original. Os aplicativos de mensagem os comprimem e podem apagar a data e o local gravados no arquivo.","Nomes que se ordenam sozinhos: ano, mês, dia e o que é, por exemplo 2026-11-09_anuncio.pdf. Uma pasta por caso.","Uma linha do tempo: data, o que aconteceu e qual prova mostra isso. É a primeira coisa que vamos pedir.","Na nuvem, com verificação em duas etapas, e uma segunda cópia em outro lugar."]},prfShareH:{es:"Proteja sus datos al compartir pruebas",en:"Protect your data when you share evidence",fr:"Protégez vos données en partageant vos preuves",pt:"Proteja seus dados ao compartilhar provas"},prfShare:{es:["Comparta solo lo necesario para el caso.","Tape en una copia, nunca en el original, el número completo de la tarjeta (deje los últimos 4 dígitos) y los datos de otras personas, en especial de menores de edad.","Nunca envíe contraseñas, códigos de verificación ni claves del banco, ni a IHA ni a nadie. Ninguna empresa seria se los pide.","No publique sus pruebas en redes sociales: expone sus datos y puede debilitar su caso.","Con IHA, usted decide qué envía. Usamos sus datos solo para orientarlo y responderle, y puede pedir que los borremos (Ley 1581 de 2012)."],en:["Share only what the case needs.","On a copy, never the original, cover the full card number (leave the last 4 digits) and other people’s details, especially those of minors.","Never send passwords, verification codes or bank PINs, to IHA or anyone else. No serious company asks for them.","Do not post your evidence on social media: it exposes your data and can weaken your case.","With IHA, you decide what to send. We use your data only to guide you and reply to you, and you can ask us to delete it (Colombian Law 1581 of 2012)."],fr:["Ne partagez que ce dont le dossier a besoin.","Sur une copie, jamais sur l’original, masquez le numéro complet de la carte (laissez les 4 derniers chiffres) et les données d’autres personnes, surtout de mineurs.","N’envoyez jamais de mots de passe, de codes de vérification ni de codes bancaires, ni à IHA ni à personne. Aucune entreprise sérieuse ne les demande.","Ne publiez pas vos preuves sur les réseaux sociaux : cela expose vos données et peut affaiblir votre dossier.","Avec IHA, vous décidez de ce que vous envoyez. Nous utilisons vos données uniquement pour vous orienter et vous répondre, et vous pouvez demander leur suppression (loi colombienne 1581 de 2012)."],pt:["Compartilhe só o necessário para o caso.","Numa cópia, nunca no original, cubra o número completo do cartão (deixe os 4 últimos dígitos) e os dados de outras pessoas, em especial de menores de idade.","Nunca envie senhas, códigos de verificação nem senhas do banco, nem à IHA nem a ninguém. Nenhuma empresa séria pede isso.","Não publique suas provas nas redes sociais: expõe seus dados e pode enfraquecer o seu caso.","Com a IHA, você decide o que envia. Usamos seus dados só para orientar e responder, e você pode pedir que sejam apagados (Lei colombiana 1581 de 2012)."]},prfDataH:{es:"¿Sus datos fueron bien protegidos? Verifíquelo",en:"Was your data properly protected? Check",fr:"Vos données ont-elles été bien protégées ? Vérifiez",pt:"Seus dados foram bem protegidos? Verifique"},prfDataP:{es:"Toda empresa que guarda sus datos debe cuidarlos y usarlos solo para lo que usted autorizó. Revise estas señales y estos derechos:",en:"Any company that holds your data must protect it and use it only for what you authorised. Check these signs and these rights:",fr:"Toute entreprise qui détient vos données doit les protéger et ne les utiliser que pour ce que vous avez autorisé. Vérifiez ces signaux et ces droits :",pt:"Toda empresa que guarda seus dados deve protegê-los e usá-los só para o que você autorizou. Confira estes sinais e estes direitos:"},prfData:{es:["Señales de alerta: mensajes o llamadas de empresas que no conoce, avisos de inicio de sesión que usted no hizo, cobros extraños o un correo de la empresa sobre una filtración.","Pregunte a la empresa qué datos suyos tiene, de dónde los sacó y para qué los usa. Debe responder en 10 días hábiles, prorrogables 5 (Ley 1581 de 2012, art. 14).","Pida corregirlos o borrarlos. Debe responder en 15 días hábiles, prorrogables 8 (art. 15).","Si no responde o se niega, presente una queja ante la SIC, que vigila la protección de datos (art. 16).","Si sus datos se filtraron: cambie sus contraseñas, active la verificación en dos pasos y avise al banco si hay datos financieros. La empresa debe informar a la SIC los incidentes de seguridad (art. 17)."],en:["Warning signs: messages or calls from companies you do not know, sign-in alerts you did not trigger, strange charges or an email from the company about a breach.","Ask the company what data it holds about you, where it got it and what it uses it for. It must answer within 10 business days, extendable by 5 (Colombian Law 1581 of 2012, art. 14).","Ask for it to be corrected or deleted. It must answer within 15 business days, extendable by 8 (art. 15).","If it does not answer or refuses, file a complaint with the SIC, which oversees data protection (art. 16).","If your data was leaked: change your passwords, turn on two-step verification and alert your bank if financial data is involved. The company must report security incidents to the SIC (art. 17)."],fr:["Signaux d’alerte : messages ou appels d’entreprises inconnues, alertes de connexion que vous n’avez pas faites, opérations étranges ou e-mail de l’entreprise annonçant une fuite.","Demandez à l’entreprise quelles données elle détient sur vous, d’où elle les tient et à quoi elle les utilise. Elle doit répondre en 10 jours ouvrables, prolongeables de 5 (loi colombienne 1581 de 2012, art. 14).","Demandez leur correction ou leur suppression. Elle doit répondre en 15 jours ouvrables, prolongeables de 8 (art. 15).","Sans réponse ou en cas de refus, déposez une plainte auprès de la SIC, qui contrôle la protection des données (art. 16).","En cas de fuite : changez vos mots de passe, activez la validation en deux étapes et prévenez votre banque s’il y a des données financières. L’entreprise doit signaler les incidents de sécurité à la SIC (art. 17)."],pt:["Sinais de alerta: mensagens ou ligações de empresas que você não conhece, avisos de login que você não fez, cobranças estranhas ou um e-mail da empresa sobre um vazamento.","Pergunte à empresa quais dados seus ela tem, de onde os tirou e para que os usa. Ela deve responder em 10 dias úteis, prorrogáveis por 5 (Lei colombiana 1581 de 2012, art. 14).","Peça a correção ou a exclusão. Ela deve responder em 15 dias úteis, prorrogáveis por 8 (art. 15).","Se não responder ou recusar, apresente uma queixa na SIC, que fiscaliza a proteção de dados (art. 16).","Se seus dados vazaram: troque as senhas, ative a verificação em duas etapas e avise o banco se houver dados financeiros. A empresa deve informar à SIC os incidentes de segurança (art. 17)."]},prfDataLink:{es:"Ver la ficha sobre datos personales",en:"See the sheet on personal data",fr:"Voir la fiche sur les données personnelles",pt:"Ver a ficha sobre dados pessoais"},prfIntlH:{es:"Si es extranjero o la empresa está fuera de Colombia",en:"If you are a foreigner or the company is outside Colombia",fr:"Si vous êtes étranger ou si l’entreprise est hors de Colombie",pt:"Se você é estrangeiro ou a empresa está fora da Colômbia"},prfIntlP:{es:"La ley colombiana lo protege igual: si compró o recibió el servicio en Colombia, tiene los mismos derechos que un colombiano. Si la empresa ofrece su producto o servicio en Colombia, la ley colombiana y la SIC pueden aplicar aunque su sede esté en el exterior. Además, estas entidades pueden servirle:",en:"Colombian law protects you all the same: if you bought or received the service in Colombia, you have the same rights as a Colombian. If the company offers its product or service in Colombia, Colombian law and the SIC may apply even if it is based abroad. These bodies can also help:",fr:"La loi colombienne vous protège de la même façon : si vous avez acheté ou reçu le service en Colombie, vous avez les mêmes droits qu’un Colombien. Si l’entreprise propose son produit ou service en Colombie, la loi colombienne et la SIC peuvent s’appliquer même si son siège est à l’étranger. Ces organismes peuvent aussi vous aider :",pt:"A lei colombiana protege você da mesma forma: se comprou ou recebeu o serviço na Colômbia, tem os mesmos direitos que um colombiano. Se a empresa oferece o produto ou serviço na Colômbia, a lei colombiana e a SIC podem se aplicar mesmo com sede no exterior. Estas entidades também podem ajudar:"},prfIntl:[{n:{es:"Superintendencia de Industria y Comercio (SIC), Colombia",en:"Superintendence of Industry and Commerce (SIC), Colombia",fr:"Surintendance de l’industrie et du commerce (SIC), Colombie",pt:"Superintendência de Indústria e Comércio (SIC), Colômbia"},d:{es:"Recibe quejas y demandas de protección al consumidor, también de extranjeros.",en:"Handles consumer complaints and claims, including from foreigners.",fr:"Reçoit les plaintes et actions en matière de consommation, y compris d’étrangers.",pt:"Recebe queixas e ações de defesa do consumidor, inclusive de estrangeiros."},u:"https://www.sic.gov.co"},{n:{es:"econsumer.gov",en:"econsumer.gov",fr:"econsumer.gov",pt:"econsumer.gov"},d:{es:"Para reportar problemas con compras internacionales en línea. Lo comparten más de 35 autoridades de consumo de la red ICPEN, de la que Colombia hace parte desde 2013. No resuelve casos individuales, pero ayuda a detectar a las empresas que reinciden.",en:"To report problems with cross-border online purchases. It is shared by more than 35 consumer authorities in the ICPEN network, which Colombia joined in 2013. It does not resolve individual cases, but it helps spot repeat offenders.",fr:"Pour signaler un problème d’achat en ligne transfrontalier. Plus de 35 autorités de consommation du réseau ICPEN, dont la Colombie fait partie depuis 2013, y ont accès. Il ne règle pas les cas individuels, mais aide à repérer les entreprises récidivistes.",pt:"Para relatar problemas com compras internacionais on-line. É compartilhado por mais de 35 autoridades de consumo da rede ICPEN, da qual a Colômbia faz parte desde 2013. Não resolve casos individuais, mas ajuda a identificar empresas reincidentes."},u:"https://www.econsumer.gov"},{n:{es:"Centros Europeos del Consumidor (ECC-Net)",en:"European Consumer Centres (ECC-Net)",fr:"Centres européens des consommateurs (CEC)",pt:"Centros Europeus do Consumidor (ECC-Net)"},d:{es:"Ayuda gratuita si usted vive en la Unión Europea, Noruega o Islandia y la empresa está en otro de esos países, por ejemplo la filial europea de una plataforma. No atienden si la empresa está fuera de Europa.",en:"Free help if you live in the EU, Norway or Iceland and the company is in another of those countries, for example a platform’s European subsidiary. They cannot help if the company is outside Europe.",fr:"Aide gratuite si vous vivez dans l’Union européenne, en Norvège ou en Islande et que l’entreprise est dans un autre de ces pays, par exemple la filiale européenne d’une plateforme. Ils n’interviennent pas si l’entreprise est hors d’Europe.",pt:"Ajuda gratuita se você mora na União Europeia, Noruega ou Islândia e a empresa está em outro desses países, por exemplo a filial europeia de uma plataforma. Não atendem se a empresa estiver fora da Europa."},u:"https://www.eccnet.eu"},{n:{es:"El banco que emitió su tarjeta",en:"The bank that issued your card",fr:"La banque qui a émis votre carte",pt:"O banco que emitiu o seu cartão"},d:{es:"Si pagó con tarjeta, puede pedir el contracargo según las reglas de su banco. Los plazos suelen ser cortos: hágalo pronto y con sus pruebas.",en:"If you paid by card, you can request a chargeback under your bank’s rules. Deadlines are usually short: act quickly and with your evidence.",fr:"Si vous avez payé par carte, vous pouvez demander une rétrofacturation selon les règles de votre banque. Les délais sont souvent courts : agissez vite, preuves à l’appui.",pt:"Se pagou com cartão, pode pedir o chargeback (estorno) conforme as regras do seu banco. Os prazos costumam ser curtos: aja rápido e com suas provas."}},{n:{es:"Su consulado o embajada",en:"Your consulate or embassy",fr:"Votre consulat ou ambassade",pt:"Seu consulado ou embaixada"},d:{es:"Orientación, listas de abogados y apoyo en emergencias. No lo representa en su reclamo.",en:"Guidance, lists of lawyers and help in emergencies. It does not represent you in your complaint.",fr:"Conseils, listes d’avocats et aide en cas d’urgence. Il ne vous représente pas dans votre réclamation.",pt:"Orientação, listas de advogados e apoio em emergências. Não representa você na reclamação."}},{n:{es:"El Punto Nacional de Contacto de la OCDE",en:"The OECD National Contact Point",fr:"Le Point de contact national de l’OCDE",pt:"O Ponto de Contato Nacional da OCDE"},d:{es:"Si la empresa es multinacional. Vea abajo qué es y cómo funciona.",en:"If the company is a multinational. See below what it is and how it works.",fr:"Si l’entreprise est une multinationale. Voir plus bas ce que c’est et comment cela fonctionne.",pt:"Se a empresa for multinacional. Veja abaixo o que é e como funciona."},pnc:!0}],prfNcpH:{es:"El Punto Nacional de Contacto (PNC) de la OCDE",en:"The OECD National Contact Point (NCP)",fr:"Le Point de contact national (PCN) de l’OCDE",pt:"O Ponto de Contato Nacional (PCN) da OCDE"},prfNcpWhat:{es:"Colombia adhiere a las Líneas Directrices de la OCDE para Empresas Multinacionales sobre Conducta Empresarial Responsable. Cada país que las adopta tiene un Punto Nacional de Contacto; el de Colombia funciona en el Ministerio de Comercio, Industria y Turismo desde 2012 (Decreto 1400 de 2012).",en:"Colombia adheres to the OECD Guidelines for Multinational Enterprises on Responsible Business Conduct. Every country that adopts them has a National Contact Point; Colombia’s has operated within the Ministry of Commerce, Industry and Tourism since 2012 (Decree 1400 of 2012).",fr:"La Colombie adhère aux Principes directeurs de l’OCDE à l’intention des entreprises multinationales sur la conduite responsable des entreprises. Chaque pays qui les adopte a un Point de contact national ; celui de la Colombie fonctionne au sein du ministère du Commerce, de l’Industrie et du Tourisme depuis 2012 (décret 1400 de 2012).",pt:"A Colômbia adere às Diretrizes da OCDE para Empresas Multinacionais sobre Conduta Empresarial Responsável. Cada país que as adota tem um Ponto de Contato Nacional; o da Colômbia funciona no Ministério do Comércio, Indústria e Turismo desde 2012 (Decreto 1400 de 2012)."},prfNcpForH:{es:"Para qué sirve",en:"What it is for",fr:"À quoi il sert",pt:"Para que serve"},prfNcpFor:{es:"Recibe quejas, llamadas «instancias específicas», sobre la conducta de una empresa multinacional que no respetaría las Líneas Directrices, incluido su capítulo sobre los intereses de los consumidores: información veraz, prácticas comerciales leales, mecanismos para reclamar y protección de datos. Ofrece buenos oficios y una mediación gratuita entre usted y la empresa.",en:"It receives complaints, called “specific instances”, about a multinational’s conduct that may breach the Guidelines, including their chapter on consumer interests: truthful information, fair business practices, ways to complain and data protection. It offers good offices and free mediation between you and the company.",fr:"Il reçoit des plaintes, appelées « circonstances spécifiques », sur le comportement d’une multinationale qui ne respecterait pas les Principes directeurs, y compris leur chapitre sur les intérêts des consommateurs : information loyale, pratiques commerciales équitables, voies de réclamation et protection des données. Il offre ses bons offices et une médiation gratuite entre vous et l’entreprise.",pt:"Recebe queixas, chamadas “instâncias específicas”, sobre a conduta de uma multinacional que não respeitaria as Diretrizes, incluindo o capítulo sobre os interesses dos consumidores: informação verdadeira, práticas comerciais leais, mecanismos de reclamação e proteção de dados. Oferece bons ofícios e uma mediação gratuita entre você e a empresa."},prfNcpNotH:{es:"Lo que no es",en:"What it is not",fr:"Ce qu’il n’est pas",pt:"O que não é"},prfNcpNot:{es:"No es un juez ni reemplaza a la SIC. No ordena devoluciones ni multas, y sus decisiones no son obligatorias. Si no hay acuerdo, publica una declaración final con recomendaciones a la empresa.",en:"It is not a court and does not replace the SIC. It does not order refunds or fines, and its decisions are not binding. If there is no agreement, it publishes a final statement with recommendations to the company.",fr:"Ce n’est pas un juge et il ne remplace pas la SIC. Il n’ordonne ni remboursement ni amende, et ses décisions ne sont pas contraignantes. Faute d’accord, il publie une déclaration finale avec des recommandations à l’entreprise.",pt:"Não é um juiz nem substitui a SIC. Não ordena devoluções nem multas, e suas decisões não são obrigatórias. Se não houver acordo, publica uma declaração final com recomendações à empresa."},prfNcpWhyH:{es:"Por qué puede pesar en su caso",en:"Why it can matter in your case",fr:"Pourquoi il peut peser dans votre dossier",pt:"Por que pode pesar no seu caso"},prfNcpWhy:{es:["Llega a la casa matriz cuando la filial local no responde.","La empresa recibe su queja y, ante el PNC de Colombia, tiene 20 días hábiles para contestar.","La mediación es neutral, confidencial y sin costo.","Una declaración pública pesa en la reputación de una multinacional, que suele preferir un acuerdo.","Funciona con casos de consumidores: en 2025, el PNC de Irlanda recibió la queja de una persona contra la plataforma Temu, y el caso terminó en un acuerdo con el pago completo.","Puede ir junto con otros caminos: el PNC pide informar los procesos en curso, pero su existencia no impide presentar la queja."],en:["It reaches the parent company when the local subsidiary does not answer.","The company receives your complaint and, before Colombia’s NCP, has 20 business days to reply.","Mediation is neutral, confidential and free.","A public statement weighs on a multinational’s reputation, so companies often prefer an agreement.","It works for consumer cases: in 2025, Ireland’s NCP received an individual’s complaint against the Temu platform, and the case ended in a settlement with payment in full.","It can run alongside other routes: the NCP asks you to report ongoing proceedings, but their existence does not prevent you from filing."],fr:["Il atteint la maison mère quand la filiale locale ne répond pas.","L’entreprise reçoit votre plainte et, devant le PCN de Colombie, dispose de 20 jours ouvrables pour répondre.","La médiation est neutre, confidentielle et gratuite.","Une déclaration publique pèse sur la réputation d’une multinationale, qui préfère souvent un accord.","Il traite des cas de consommateurs : en 2025, le PCN d’Irlande a reçu la plainte d’un particulier contre la plateforme Temu, et l’affaire s’est conclue par un accord et un paiement intégral.","Il peut s’ajouter à d’autres recours : le PCN demande de signaler les procédures en cours, mais leur existence n’empêche pas de déposer la plainte."],pt:["Chega à matriz quando a filial local não responde.","A empresa recebe sua queixa e, perante o PCN da Colômbia, tem 20 dias úteis para responder.","A mediação é neutra, confidencial e gratuita.","Uma declaração pública pesa na reputação de uma multinacional, que costuma preferir um acordo.","Funciona para casos de consumidores: em 2025, o PCN da Irlanda recebeu a queixa de uma pessoa contra a plataforma Temu, e o caso terminou num acordo com pagamento integral.","Pode correr junto com outros caminhos: o PCN pede que se informem os processos em andamento, mas eles não impedem a apresentação da queixa."]},prfNcpWhenH:{es:"Cuándo conviene",en:"When it makes sense",fr:"Quand y recourir",pt:"Quando vale a pena"},prfNcpWhen:{es:["La empresa es multinacional o pertenece a un grupo con sede en un país que adhiere a las Líneas Directrices.","El problema muestra una conducta de la empresa, no solo una diferencia de precio.","Ya reclamó por escrito y no obtuvo una respuesta satisfactoria."],en:["The company is a multinational or part of a group based in a country that adheres to the Guidelines.","The problem shows a pattern of conduct by the company, not just a price disagreement.","You have already complained in writing without a satisfactory answer."],fr:["L’entreprise est une multinationale ou appartient à un groupe dont le siège est dans un pays adhérent.","Le problème révèle un comportement de l’entreprise, pas seulement un désaccord sur un prix.","Vous avez déjà réclamé par écrit sans obtenir de réponse satisfaisante."],pt:["A empresa é multinacional ou pertence a um grupo com sede num país que adere às Diretrizes.","O problema mostra uma conduta da empresa, não só uma diferença de preço.","Você já reclamou por escrito e não obteve resposta satisfatória."]},prfNcpWhere:{es:"Dónde presentarla: ante el PNC de Colombia si la conducta ocurrió en Colombia, o ante el PNC del país donde la empresa tiene su sede. La OCDE publica la lista de los PNC de los más de 50 países que adhieren.",en:"Where to file: with Colombia’s NCP if the conduct took place in Colombia, or with the NCP of the country where the company is based. The OECD publishes the list of NCPs of the more than 50 adhering countries.",fr:"Où la déposer : auprès du PCN de Colombie si les faits ont eu lieu en Colombie, ou auprès du PCN du pays où l’entreprise a son siège. L’OCDE publie la liste des PCN des plus de 50 pays adhérents.",pt:"Onde apresentar: no PCN da Colômbia se a conduta ocorreu na Colômbia, ou no PCN do país onde a empresa tem sede. A OCDE publica a lista dos PCN dos mais de 50 países que aderem."},prfNcpStepsH:{es:"Cómo funciona en Colombia",en:"How it works in Colombia",fr:"Comment cela fonctionne en Colombie",pt:"Como funciona na Colômbia"},prfNcpSteps:{es:["Queja escrita en español, con los hechos y sus pruebas, las Líneas Directrices que se habrían incumplido, lo que usted pide a la empresa y los otros procesos en curso.","El PNC la traslada a la empresa, que tiene 20 días hábiles para responder.","Evaluación inicial: hasta dos meses para aceptar o rechazar el caso.","Buenos oficios y mediación, voluntaria y confidencial.","Acuerdo o declaración final. El plazo indicativo total es de un año."],en:["A written complaint in Spanish, with the facts and their evidence, the Guidelines allegedly breached, what you ask of the company and any other ongoing proceedings.","The NCP forwards it to the company, which has 20 business days to reply.","Initial assessment: up to two months to accept or reject the case."
