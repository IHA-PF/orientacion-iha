      en:"The land-use plan (POT) defines in which areas renting by the night is allowed. Before renting out or buying for short-term rental, check the property's land use. The City Council approved the revised POT on November 5, 2026; until it is signed and takes effect, Acuerdo 48 of 2014 applies.",
      fr:"Le POT (plan d'urbanisme) définit dans quels secteurs la location à la nuitée est permise. Avant de louer ou d'acheter pour la location courte, vérifiez l'usage du sol du bien. Le Concejo a approuvé la révision du POT le 5 novembre 2026 ; tant qu'elle n'est pas signée et en vigueur, l'Acuerdo 48 de 2014 s'applique.",
      pt:"O POT (plano de ordenamento) define em quais setores o aluguel por diária é permitido. Antes de alugar ou comprar para aluguel de curta duração, consulte o uso do solo do imóvel. O Concejo aprovou a revisão do POT em 5 de novembro de 2026; até que seja sancionada e entre em vigor, vale o Acuerdo 48 de 2014."},
   s:[[{es:"Consulta de uso del suelo (MapGIS)",en:"Land-use lookup (MapGIS)",fr:"Consultation de l'usage du sol (MapGIS)",pt:"Consulta de uso do solo (MapGIS)"},"https://www.medellin.gov.co/mapgis9/tools/UsoSuelos.html",1],
      [{es:"Alcaldía: aprobación del POT",en:"City hall: POT approval",fr:"Mairie : approbation du POT",pt:"Prefeitura: aprovação do POT"},"https://www.medellin.gov.co/es/sala-de-prensa/noticias/el-concejo-de-medellin-aprobo-el-proyecto-de-acuerdo-para-la-revision-del-pot/",1],

 bogota:{name:"Bogotá",note:NOTE("Bogotá"),rules:[
  {id:"BOG1",i:"home",t:USO_T,
   p:{es:"El POT de Bogotá (Decreto 555 de 2021) define los usos permitidos en cada sector. Antes de alquilar o comprar para renta corta, consulte la norma urbana del predio.",
      en:"Bogotá's land-use plan (Decreto 555 of 2021) defines the uses allowed in each area. Before renting out or buying for short-term rental, check the zoning rules for the property.",
      fr:"Le POT de Bogotá (Decreto 555 de 2021) définit les usages permis dans chaque secteur. Avant de louer ou d'acheter pour la location courte, vérifiez la règle d'urbanisme applicable au bien.",
      pt:"O POT de Bogotá (Decreto 555 de 2021) define os usos permitidos em cada setor. Antes de alugar ou comprar para aluguel de curta duração, consulte a norma urbanística do imóvel."},
   s:[[{es:"Mapas Bogotá",en:"Mapas Bogotá",fr:"Mapas Bogotá",pt:"Mapas Bogotá"},"https://mapas.bogota.gov.co/",1]]},
  {id:"BOG2",i:"car",t:PYP_T,
   p:{es:"Para carros particulares, de lunes a viernes, de 6:00 a. m. a 9:00 p. m.: los días pares no circulan las placas terminadas en 1, 2, 3, 4 y 5, y los días impares las terminadas en 6, 7, 8, 9 y 0. Existe el «pico y placa solidario», un pago voluntario que permite circular.",
      en:"For private cars, Monday to Friday, 6:00 a.m. to 9:00 p.m.: on even-numbered days, plates ending in 1, 2, 3, 4 and 5 may not circulate, and on odd-numbered days those ending in 6, 7, 8, 9 and 0. A voluntary payment («pico y placa solidario») allows you to drive anyway.",
      fr:"Pour les voitures particulières, du lundi au vendredi, de 6 h à 21 h : les jours pairs, les plaques finissant par 1, 2, 3, 4 et 5 ne peuvent pas circuler ; les jours impairs, celles finissant par 6, 7, 8, 9 et 0. Un paiement volontaire (« pico y placa solidario ») permet de circuler malgré tout.",
      pt:"Para carros particulares, de segunda a sexta, das 6h às 21h: nos dias pares não circulam as placas terminadas em 1, 2, 3, 4 e 5, e nos dias ímpares as terminadas em 6, 7, 8, 9 e 0. Existe o «pico y placa solidario», um pagamento voluntário que permite circular."},
   s:[[{es:"Bogotá: pico y placa",en:"Bogotá: pico y placa",fr:"Bogotá : pico y placa",pt:"Bogotá: pico y placa"},"https://bogota.gov.co/mi-ciudad/movilidad/pico-y-placa-en-bogota-para-la-semana-del-20-al-26-de-julio-de-2026",1],
      [{es:"Canal Trece: reglas de 2026",en:"Canal Trece: 2026 rules",fr:"Canal Trece : règles de 2026",pt:"Canal Trece: regras de 2026"},"https://canaltrece.com.co/noticias/atencion-conductores-alcaldia-de-bogota-anuncia-nuevas-restricciones-de-movilidad-para-el-segundo-semestre-de-2026/",1]]},
  {id:"BOG3",i:"glass",
   t:{es:"Rumba hasta las 5:00 a. m.",en:"Nightlife until 5:00 a.m.",fr:"Sorties jusqu'à 5 h du matin",pt:"Balada até as 5h"},
   p:{es:"Los bares y discotecas de 19 «zonas focalizadas» pueden operar hasta las 5:00 a. m. (Decreto 644 de 2025, art. 98, y Resolución Conjunta 001 de 2025). Fuera de esas zonas aplican los horarios generales. Las zonas se revisan cada seis meses.",
      en:"Bars and clubs in 19 designated zones may stay open until 5:00 a.m. (Decreto 644 of 2025, art. 98, and Resolución Conjunta 001 of 2025). Outside those zones, the general opening hours apply. The zones are reviewed every six months.",
      fr:"Les bars et discothèques de 19 « zones focalisées » peuvent ouvrir jusqu'à 5 h (Decreto 644 de 2025, art. 98, et Resolución Conjunta 001 de 2025). En dehors de ces zones, les horaires généraux s'appliquent. Les zones sont réexaminées tous les six mois.",
      pt:"Bares e casas noturnas de 19 «zonas focalizadas» podem funcionar até as 5h (Decreto 644 de 2025, art. 98, e Resolución Conjunta 001 de 2025). Fora dessas zonas valem os horários gerais. As zonas são revisadas a cada seis meses."},
   s:[[{es:"Alcaldía de Bogotá: ABC de la medida",en:"Bogotá city hall: about the measure",fr:"Mairie de Bogotá : la mesure en bref",pt:"Prefeitura de Bogotá: entenda a medida"},"https://bogota.gov.co/mi-ciudad/gobierno/abc-ampliacion-de-horarios-de-rumba-en-19-zonas-de-bogota-2026",1]]}]},
 cartagena:{name:"Cartagena",note:NOTE("Cartagena"),rules:[
  {id:"CTG1",i:"home",t:USO_T,
   p:{es:"El POT define los usos permitidos en cada sector. En el Centro Histórico, además, rige el Plan Especial de Manejo y Protección (PEMP), que regula los usos de los inmuebles. Consulte el uso del suelo antes de alquilar o comprar para renta corta.",
      en:"The land-use plan (POT) defines the uses allowed in each area. In the Historic Centre, the Special Management and Protection Plan (PEMP) also regulates how buildings may be used. Check the land use before renting out or buying for short-term rental.",
      fr:"Le POT définit les usages permis dans chaque secteur. Dans le Centre historique s'applique en plus le Plan spécial de gestion et de protection (PEMP), qui encadre l'usage des immeubles. Vérifiez l'usage du sol avant de louer ou d'acheter pour la location courte.",
      pt:"O POT define os usos permitidos em cada setor. No Centro Histórico vale, além disso, o Plano Especial de Manejo e Proteção (PEMP), que regula o uso dos imóveis. Consulte o uso do solo antes de alugar ou comprar para aluguel de curta duração."},
   s:[[{es:"Cartagena: opciones de usos en el Centro Histórico (PDF)",en:"Cartagena: permitted uses in the Historic Centre (PDF, Spanish)",fr:"Cartagena : usages possibles dans le Centre historique (PDF, espagnol)",pt:"Cartagena: usos no Centro Histórico (PDF, espanhol)"},"https://seguimientopot.cartagena.gov.co/sites/default/files/2024-10/3.%20Opciones%20de%20Usos-%20Centro%20Historico.pdf"]]},
  {id:"CTG2",i:"car",t:PYP_T,
   p:{es:"Para carros particulares, de 7:00 a 9:00 a. m. y de 6:00 a 8:00 p. m., con dígitos que rotan cada día. Para motos, de 5:00 a. m. a 11:00 p. m., salvo las que tienen permiso. La sanción es una multa de 15 salarios mínimos diarios y, en algunos casos, la inmovilización del vehículo. Verifique los dígitos del día antes de conducir.",
      en:"For private cars, 7:00 to 9:00 a.m. and 6:00 to 8:00 p.m., with digits that rotate every day. For motorbikes, 5:00 a.m. to 11:00 p.m., except those with a permit. The penalty is a fine of 15 daily minimum wages and, in some cases, impoundment of the vehicle. Check the day's digits before driving.",
      fr:"Pour les voitures particulières, de 7 h à 9 h et de 18 h à 20 h, avec des chiffres qui changent chaque jour. Pour les motos, de 5 h à 23 h, sauf celles qui ont une autorisation. La sanction est une amende de 15 salaires minimums journaliers et, dans certains cas, l'immobilisation du véhicule. Vérifiez les chiffres du jour avant de conduire.",
      pt:"Para carros particulares, das 7h às 9h e das 18h às 20h, com dígitos que mudam a cada dia. Para motos, das 5h às 23h, exceto as que têm autorização. A sanção é uma multa de 15 salários mínimos diários e, em alguns casos, a imobilização do veículo. Verifique os dígitos do dia antes de dirigir."},
   s:[[{es:"El Universal: pico y placa (octubre de 2026)",en:"El Universal: pico y placa (October 2026)",fr:"El Universal : pico y placa (octobre 2026)",pt:"El Universal: pico y placa (outubro de 2026)"},"https://www.eluniversal.com.co/cartagena/2026/10/28/pico-y-placa-en-cartagena-digitos-y-horarios-del-jueves-29-de-octubre-de-2026/",1]]}]},
 santamarta:{name:"Santa Marta",note:NOTE("Santa Marta"),rules:[
  {id:"SMR1",i:"car",t:PYP_T,
   p:{es:"Desde mayo de 2025 (Decreto 160), para carros particulares de lunes a viernes, de 7:00 a 9:00 a. m., de 11:30 a. m. a 2:00 p. m. y de 5:00 a 8:00 p. m., dentro del anillo vial: lunes 1 y 2, martes 3 y 4, miércoles 5 y 6, jueves 7 y 8, viernes 9 y 0. La Alcaldía puede modificar la medida; verifique antes de conducir.",
      en:"Since May 2025 (Decreto 160), for private cars Monday to Friday, 7:00–9:00 a.m., 11:30 a.m.–2:00 p.m. and 5:00–8:00 p.m., inside the ring road: Monday 1 and 2, Tuesday 3 and 4, Wednesday 5 and 6, Thursday 7 and 8, Friday 9 and 0. The city hall may change the measure; check before driving.",
      fr:"Depuis mai 2025 (Decreto 160), pour les voitures particulières du lundi au vendredi, de 7 h à 9 h, de 11 h 30 à 14 h et de 17 h à 20 h, à l'intérieur de l'anneau routier : lundi 1 et 2, mardi 3 et 4, mercredi 5 et 6, jeudi 7 et 8, vendredi 9 et 0. La mairie peut modifier la mesure ; vérifiez avant de conduire.",
      pt:"Desde maio de 2025 (Decreto 160), para carros particulares de segunda a sexta, das 7h às 9h, das 11h30 às 14h e das 17h às 20h, dentro do anel viário: segunda 1 e 2, terça 3 e 4, quarta 5 e 6, quinta 7 e 8, sexta 9 e 0. A prefeitura pode alterar a medida; verifique antes de dirigir."},
   s:[[{es:"Noticias Caracol: decreto de 2025",en:"Noticias Caracol: 2025 decree",fr:"Noticias Caracol : décret de 2025",pt:"Noticias Caracol: decreto de 2025"},"https://www.noticiascaracol.com/colombia/santa-marta-implementa-nuevo-pico-y-placa-asi-seran-las-restricciones-desde-mayo-de-2025-so35",1]]},
  {id:"SMR2",i:"map",
   t:{es:"Parque Tayrona",en:"Tayrona National Park",fr:"Parc Tayrona",pt:"Parque Tayrona"},
   p:{es:"Parques Nacionales cierra el Parque Tayrona en algunas épocas del año para su recuperación ambiental, y en 2026 también lo cerró temporalmente por razones de seguridad. Antes de ir, verifique que esté abierto y compre la entrada solo por los canales oficiales.",
      en:"National Parks closes Tayrona at certain times of the year so nature can recover, and in 2026 it also closed it temporarily for security reasons. Before you go, check that it is open and buy your ticket only through official channels.",
      fr:"Parques Nacionales ferme le parc Tayrona à certaines périodes de l'année pour sa régénération, et en 2026 l'a aussi fermé temporairement pour des raisons de sécurité. Avant d'y aller, vérifiez qu'il est ouvert et achetez votre billet uniquement par les canaux officiels.",
      pt:"Parques Nacionais fecha o Parque Tayrona em algumas épocas do ano para a recuperação ambiental e, em 2026, também o fechou temporariamente por razões de segurança. Antes de ir, verifique se está aberto e compre a entrada só pelos canais oficiais."},
   s:[[{es:"Parques Nacionales: resolución de apertura (2026)",en:"National Parks: reopening resolution (2026, Spanish)",fr:"Parques Nacionales : résolution de réouverture (2026, espagnol)",pt:"Parques Nacionais: resolução de reabertura (2026, espanhol)"},"https://www.parquesnacionales.gov.co/wp-content/uploads/2026/03/Resolucion-No.-112-Por-medio-de-la-cual-se-ordena-la-apertura-del-Parque-Nacional-Natural-Tayrona.pdf"]]},
  {id:"SMR3",...usoMun("Santa Marta","https://www.santamarta.gov.co/")}]}
};

const ACTS=[
 {k:"moto",i:"moto",
  t:{es:"Alquilar una moto o un carro",en:"Renting a motorbike or a car",fr:"Louer une moto ou une voiture",pt:"Alugar uma moto ou um carro"},
  prev:{es:["Exija la licencia de tránsito del vehículo y el SOAT vigente: ningún vehículo puede circular sin seguro obligatorio.","En moto, el casco es obligatorio para el conductor y para el acompañante.","Si es extranjero y está como turista, puede conducir con la licencia vigente de su país durante su permanencia autorizada. Si no está en español, lleve una traducción."],
        en:["Ask for the vehicle's registration (licencia de tránsito) and a valid SOAT: no vehicle may circulate without mandatory insurance.","On a motorbike, a helmet is mandatory for the rider and the passenger.","If you are a foreign tourist, you may drive with your valid home-country licence during your authorised stay. If it is not in Spanish, carry a translation."],
        fr:["Exigez la carte grise du véhicule (licencia de tránsito) et un SOAT en cours de validité : aucun véhicule ne peut circuler sans assurance obligatoire.","À moto, le casque est obligatoire pour le conducteur et pour le passager.","Si vous êtes un touriste étranger, vous pouvez conduire avec le permis valide de votre pays pendant votre séjour autorisé. S'il n'est pas en espagnol, ayez une traduction."],
        pt:["Exija o documento do veículo (licencia de tránsito) e o SOAT vigente: nenhum veículo pode circular sem seguro obrigatório.","Na moto, o capacete é obrigatório para o condutor e para o passageiro.","Se você é estrangeiro e está como turista, pode dirigir com a carteira válida do seu país durante a permanência autorizada. Se não estiver em espanhol, leve uma tradução."]},
  sos:{es:["En caso de accidente con heridos, llame al 123.","El SOAT cubre la atención médica de las víctimas de accidentes de tránsito.","No firme acuerdos de pago en el lugar sin entender lo que firma."],
       en:["If there is an accident with injuries, call 123.","SOAT covers medical care for road-accident victims.","Do not sign payment agreements on the spot without understanding what you are signing."],
       fr:["En cas d'accident avec blessés, appelez le 123.","Le SOAT couvre les soins médicaux des victimes d'accidents de la route.","Ne signez pas d'accord de paiement sur place sans comprendre ce que vous signez."],
       pt:["Em caso de acidente com feridos, ligue para o 123.","O SOAT cobre o atendimento médico das vítimas de acidentes de trânsito.","Não assine acordos de pagamento no local sem entender o que está assinando."]},
  law:{es:["Código Nacional de Tránsito (Ley 769 de 2002): licencias extranjeras de turistas (art. 25), seguro obligatorio (art. 42) y casco en motocicletas (art. 96)."],
       en:["National Traffic Code (Law 769 of 2002): foreign licences of tourists (art. 25), mandatory insurance (art. 42) and helmets on motorbikes (art. 96)."],
       fr:["Code national de la route (Loi 769 de 2002) : permis étrangers des touristes (art. 25), assurance obligatoire (art. 42) et casque à moto (art. 96)."],
       pt:["Código Nacional de Trânsito (Lei 769 de 2002): carteiras estrangeiras de turistas (art. 25), seguro obrigatório (art. 42) e capacete em motos (art. 96)."]},
  s:[[{es:"Bogotá: conducir con licencia extranjera",en:"Bogotá: driving with a foreign licence (Spanish)",fr:"Bogotá : conduire avec un permis étranger (espagnol)",pt:"Bogotá: dirigir com carteira estrangeira (espanhol)"},"https://bogota.gov.co/mi-ciudad/movilidad/que-documentos-requiere-un-extranjero-para-conducir-en-bogota"],
     [{es:"Resolución 1244 de 2019 (MinTransporte)",en:"Resolution 1244 of 2019 (MinTransporte, Spanish)",fr:"Résolution 1244 de 2019 (MinTransporte, espagnol)",pt:"Resolução 1244 de 2019 (MinTransporte, espanhol)"},"https://www.cancilleria.gov.co/sites/default/files/Normograma/docs/pdf/resolucion_mintransporte_1244_2019.pdf"]]},
 {k:"cita",i:"heart",
  t:{es:"Cita por aplicación",en:"Dating-app meetups",fr:"Rendez-vous par application",pt:"Encontro por aplicativo"},
  prev:{es:["Encuéntrese en un lugar público y concurrido, y llegue por su cuenta.","No deje su bebida sola ni acepte bebidas o comida abiertas.","Cuente a alguien de confianza dónde y con quién va a estar.","La Embajada de EE. UU. advirtió en 2024 que delincuentes usan aplicaciones de citas para drogar y robar a sus víctimas; reportó ocho muertes de ciudadanos estadounidenses en circunstancias sospechosas en Medellín a finales de 2023."],
        en:["Meet in a busy public place and get there on your own.","Do not leave your drink unattended or accept opened drinks or food.","Tell someone you trust where you will be and with whom.","In 2024 the U.S. Embassy warned that criminals use dating apps to drug and rob their victims; it reported eight deaths of U.S. citizens in suspicious circumstances in Medellín in late 2023."],
        fr:["Retrouvez-vous dans un lieu public et fréquenté, et venez par vos propres moyens.","Ne laissez pas votre verre sans surveillance et n'acceptez ni boisson ni nourriture déjà ouvertes.","Dites à une personne de confiance où et avec qui vous serez.","En 2024, l'ambassade des États-Unis a averti que des délinquants utilisent les applications de rencontre pour droguer et voler leurs victimes ; elle a signalé huit décès de citoyens américains dans des circonstances suspectes à Medellín fin 2023."],
        pt:["Encontre-se em um lugar público e movimentado, e chegue por conta própria.","Não deixe sua bebida sozinha nem aceite bebidas ou comida abertas.","Conte a alguém de confiança onde e com quem você vai estar.","Em 2024, a Embaixada dos EUA alertou que criminosos usam aplicativos de encontro para drogar e roubar suas vítimas; informou oito mortes de cidadãos americanos em circunstâncias suspeitas em Medellín no fim de 2023."]},
  sos:{es:["Llame al 123.","Bloquee sus tarjetas y su celular; reporte de inmediato al banco los cobros que no reconoce.","Denuncie ante la Fiscalía; si es extranjero, avise a su consulado."],
       en:["Call 123.","Block your cards and phone; report any charges you do not recognise to your bank immediately.","File a report with the Fiscalía (prosecutor's office); if you are a foreigner, notify your consulate."],
       fr:["Appelez le 123.","Faites bloquer vos cartes et votre téléphone ; signalez immédiatement à votre banque les débits que vous ne reconnaissez pas.","Portez plainte auprès de la Fiscalía (parquet) ; si vous êtes étranger, prévenez votre consulat."],
       pt:["Ligue para o 123.","Bloqueie seus cartões e seu celular; informe imediatamente ao banco as cobranças que você não reconhece.","Registre denúncia na Fiscalía (Ministério Público); se for estrangeiro, avise o seu consulado."]},
  law:{es:["El banco debe atender su reclamo por cobros no reconocidos; si no responde, puede acudir al Defensor del Consumidor Financiero (Ley 1328 de 2009)."],
       en:["Your bank must handle your claim for unrecognised charges; if it does not respond, you can go to the Financial Consumer Ombudsman (Law 1328 of 2009)."],
       fr:["La banque doit traiter votre réclamation pour les débits non reconnus ; sinon, vous pouvez saisir le médiateur du consommateur financier (Loi 1328 de 2009)."],
       pt:["O banco deve atender sua reclamação por cobranças não reconhecidas; se não responder, você pode recorrer ao Defensor do Consumidor Financeiro (Lei 1328 de 2009)."]},
  s:[[{es:"Ficha: cobro no reconocido o fraude",en:"Guide: unrecognised charge or fraud",fr:"Fiche : débit non reconnu ou fraude",pt:"Ficha: cobrança não reconhecida ou fraude"},"@fraude"],
     [{es:"Alerta de la Embajada de EE. UU. (ASIS)",en:"U.S. Embassy alert (ASIS)",fr:"Alerte de l'ambassade des États-Unis (ASIS)",pt:"Alerta da Embaixada dos EUA (ASIS)"},"https://www.asisonline.org/security-management-magazine/latest-news/today-in-security/2024/january/dating-attacks-colombia/"]]},
 {k:"taxi",i:"taxi",
  t:{es:"Tomar un taxi o una app",en:"Taking a taxi or a ride app",fr:"Prendre un taxi ou un VTC",pt:"Pegar um táxi ou um app"},
  prev:{es:["En taxi, pida que se use el taxímetro o acuerde la tarifa antes de subir.","Anote o fotografíe la placa.","El transporte en carros particulares por aplicación no tiene hoy una regulación específica en Colombia. El proyecto de ley 430 de 2026 de la Cámara («Por allá sí voy») busca regularlo y está en trámite. Use los canales de reclamo de la app y guarde las pruebas."],
        en:["In a taxi, ask for the meter to be used or agree on the fare before getting in.","Note down or photograph the plate number.","Rides in private cars through apps have no specific regulation in Colombia today. Bill 430 of 2026 in the House of Representatives («Por allá sí voy») seeks to regulate them and is under discussion. Use the app's complaint channels and keep the evidence."],
        fr:["En taxi, demandez que le compteur soit utilisé ou convenez du prix avant de monter.","Notez ou photographiez la plaque.","Le transport en voiture particulière par application n'a pas aujourd'hui de réglementation spécifique en Colombie. Le projet de loi 430 de 2026 de la Chambre (« Por allá sí voy ») vise à l'encadrer et est en cours d'examen. Utilisez les canaux de réclamation de l'application et gardez les preuves."],
        pt:["No táxi, peça que use o taxímetro ou combine o preço antes de entrar.","Anote ou fotografe a placa.","O transporte em carros particulares por aplicativo não tem hoje regulamentação específica na Colômbia. O projeto de lei 430 de 2026 da Câmara («Por allá sí voy») busca regulamentá-lo e está em tramitação. Use os canais de reclamação do app e guarde as provas."]},
  sos:{es:["Ante un riesgo para su seguridad, llame al 123.","Si le cobraron de más o hubo un incidente, reclame por escrito y guarde el recibo o las capturas."],
       en:["If your safety is at risk, call 123.","If you were overcharged or something happened, complain in writing and keep the receipt or screenshots."],
       fr:["Si votre sécurité est menacée, appelez le 123.","Si l'on vous a trop facturé ou en cas d'incident, réclamez par écrit et gardez le reçu ou les captures d'écran."],
       pt:["Diante de um risco para sua segurança, ligue para o 123.","Se cobraram a mais ou houve um incidente, reclame por escrito e guarde o recibo ou as capturas de tela."]},

/* Cajas aproximadas para reconocer la ciudad (la ubicación no sale del teléfono). */
const BOX={va:[6.00,6.48,-75.75,-75.40],bogota:[4.45,4.85,-74.25,-73.98],cartagena:[10.28,10.52,-75.62,-75.40],santamarta:[11.08,11.36,-74.25,-73.85],colombia:[-4.3,13.6,-82.0,-66.8]};
const inBox=(b,la,lo)=>la>=b[0]&&la<=b[1]&&lo>=b[2]&&lo<=b[3];


const LANGS=["es","en","fr","pt"];
let lang=(()=>{try{const q=new URLSearchParams(location.search).get("lang");if(LANGS.includes(q))return q;}catch(e){}
 const n=(navigator.language||"es").slice(0,2).toLowerCase();return LANGS.includes(n)?n:"es";})();
const L=o=>o==null?"":typeof o==="string"?o:(o[lang]||o.es);
const src=a=>a.map(([lab,url,esOnly])=>{
  const ext=!url.startsWith("@")&&!url.startsWith("#");
  const href=url.startsWith("@")?fx(url.slice(1)):url;
  const txt=L(lab)+(ext&&esOnly&&lang!=="es"?NOTE_LANG[lang]:"");
  return `<a href="${esc(href)}"${ext?' target="_blank" rel="noopener"':""}${url.startsWith("#")?"":""}>${esc(txt)}</a>`;}).join("");
const app=document.getElementById("app");
let state={zone:null,tab:"normas",act:null,msg:"",ask:false};
function pick(z){state={zone:z,tab:"normas",act:null,msg:"",ask:false};render();window.scrollTo(0,0);}
function locate(){
  if(!("geolocation" in navigator)){state.msg="noGeo";return render();}
  state.msg="searching";render();
  navigator.geolocation.getCurrentPosition(p=>{
    const la=p.coords.latitude, lo=p.coords.longitude;
    if(inBox(BOX.va,la,lo)){state.msg="";state.ask=true;return render();}
    for(const k of ["bogota","cartagena","santamarta"]) if(inBox(BOX[k],la,lo)) return pick(k);
    if(inBox(BOX.colombia,la,lo)) return pick("colombia");
    pick("fuera");
  },()=>{state.msg="geoFail";render();},{enableHighAccuracy:false,timeout:10000,maximumAge:600000});
}
const VA=["medellin","envigado","sabaneta","itagui","bello"];
const chip=(k,n)=>`<button class="chip" data-zone="${k}">${esc(n)}</button>`;
function vHome(){
  const ask=state.ask?`<section class="sec"><h2 class="h2">${esc(L(UI.which))}</h2><p class="sub">${esc(L(UI.inVA))}</p><div class="chips">${VA.map(k=>chip(k,CITIES[k].name)).join("")}${chip("colombia",L(UI.other))}</div></section>`:"";
  return `<section class="hero"><p class="eye">${esc(L(UI.eye))}</p><h1>${esc(L(UI.h1))}</h1>
  <p class="lead">${esc(L(UI.lead))}</p>
  <button class="btn" data-do="loc">${ic("pin")} ${esc(L(UI.loc))}</button>
  <p class="priv">${ic("lock",16)}<span>${esc(L(UI.priv))}</span></p>
  ${state.msg?`<p class="msg" role="status">${esc(L(UI[state.msg]))}</p>`:""}</section>${ask}
  <section class="sec"><h2 class="h2">${esc(L(UI.choose))}</h2>
  <p class="sub">${esc(L(UI.va))}</p><div class="chips">${VA.map(k=>chip(k,CITIES[k].name)).join("")}</div>
  <p class="sub" style="margin-top:14px">${esc(L(UI.others))}</p><div class="chips">${["bogota","cartagena","santamarta"].map(k=>chip(k,CITIES[k].name)).join("")}${chip("colombia",L(UI.otherCo))}</div></section>`;
}
const card=r=>`<article class="card"><span class="i">${ic(r.i)}</span><div><b>${esc(L(r.t))}</b><p>${esc(L(r.p))}</p>${r.s&&r.s.length?`<div class="src">${src(r.s)}</div>`:""}</div></article>`;
function vZone(){
  const c=CITIES[state.zone];
  const name=c?c.name:state.zone==="fuera"?L(UI.outside):L(UI.colombia);
  const note=c?L(c.note):state.zone==="fuera"?L(UI.noteOut):L(UI.noteCo);
  const head=`<section class="zone"><p class="where">${ic("pin",16)} ${esc(L(UI.youAre))}</p><h1>${esc(name)}</h1><p class="note">${esc(note)}</p><button class="chg" data-do="home">${esc(L(UI.change))}</button></section>
  <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${state.tab==="normas"}" data-tab="normas">${esc(L(UI.tabZone))}</button><button class="tab" role="tab" aria-selected="${state.tab==="act"}" data-tab="act">${esc(L(UI.tabAct))}</button></div>`;
  if(state.tab==="normas") return head+`<section class="sec">${c?`<h2 class="h2">${esc(c.name)}</h2>${c.rules.map(card).join("")}<h2 class="h2" style="margin-top:18px">${esc(L(UI.allCo))}</h2>`:""}${NAC.map(card).join("")}</section>`;
  return head+`<section class="sec"><h2 class="h2">${esc(L(UI.what))}</h2><p class="sub">${esc(L(UI.whatSub))}</p>
  <div class="grid">${ACTS.map(a=>`<button class="act" data-act="${a.k}"><span class="i">${ic(a.i)}</span>${esc(L(a.t))}</button>`).join("")}</div>
  <article class="card emer" style="margin-top:12px"><span class="i">${ic("phone")}</span><div><b>${esc(L(UI.emerT))}</b><p>${esc(L(UI.emerP))}</p></div></article></section>`;
}
function vAct(){
  const a=ACTS.find(x=>x.k===state.act);
  const ul=l=>`<ul>${L(l).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  return `<div class="top"><button class="back" data-do="zone" aria-label="${esc(L(UI.back))}">${ic("back")}</button><b>${esc(L(a.t))}</b></div><section class="sec">
  <div class="blk prev"><h3>${ic("shield",18)} ${esc(L(UI.prevH))}</h3>${ul(a.prev)}</div>
  <div class="blk sos2"><h3>${ic("alert",18)} ${esc(L(UI.sosH))}</h3>${ul(a.sos)}</div>
  <div class="blk law"><h3>${ic("file",18)} ${esc(L(UI.lawH))}</h3>${ul(a.law)}<div class="src">${src(a.s)}</div></div>
  <a class="cta" href="${esc(fx("servicios"))}">${esc(L(UI.cta))}</a>
  <p class="disc">${esc(L(UI.disc))}</p></section>`;
}
function chrome(){
  document.documentElement.lang=lang==="pt"?"pt-BR":lang; document.title=L(UI.title);
  const s=document.getElementById("lsel"); if(s){s.value=lang;s.setAttribute("aria-label",L(UI.langLbl));}
  const h=document.querySelector(".bar .sos"); if(h) h.setAttribute("aria-label",L(UI.sos123));
  const b=document.querySelector(".bar .brand"); if(b) b.setAttribute("href",lang==="es"?"/":"/?lang="+lang);
}
function render(){ chrome(); app.innerHTML = state.act ? vAct() : state.zone ? vZone() : vHome(); }
app.addEventListener("click",e=>{
  const l=e.target.closest('a[href^="#act-"]'); if(l){e.preventDefault();state.act=l.getAttribute("href").slice(5);render();return window.scrollTo(0,0);}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.do==="loc") return locate();
  if(b.dataset.do==="home"){state={zone:null,tab:"normas",act:null,msg:"",ask:false};return render();}
  if(b.dataset.do==="zone"){state.act=null;render();return window.scrollTo(0,0);}
  if(b.dataset.zone) return pick(b.dataset.zone);
  if(b.dataset.tab){state.tab=b.dataset.tab;return render();}
  if(b.dataset.act){state.act=b.dataset.act;render();window.scrollTo(0,0);}
});
document.getElementById("lsel").addEventListener("change",e=>{
  lang=e.target.value; try{const u=new URL(location.href);u.searchParams.set("lang",lang);history.replaceState(null,"",u);}catch(err){}
  render();
});
