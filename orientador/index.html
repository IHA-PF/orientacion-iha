const app=document.getElementById("app");
let state={zone:null,tab:"normas",act:null,msg:"",ask:false};
function pick(z){state={zone:z,tab:"normas",act:null,msg:"",ask:false};render();window.scrollTo(0,0);}
function locate(){
  if(!("geolocation" in navigator)){state.msg="Su navegador no permite la ubicación. Elija el lugar abajo.";return render();}
  state.msg="Buscando su ubicación…";render();
  navigator.geolocation.getCurrentPosition(p=>{
    const la=p.coords.latitude, lo=p.coords.longitude;
    if(inBox(BOX.va,la,lo)){state.msg="";state.ask=true;return render();}
    for(const k of ["bogota","cartagena","santamarta"]) if(inBox(BOX[k],la,lo)) return pick(k);
    if(inBox(BOX.colombia,la,lo)) return pick("colombia");
    pick("fuera");
  },()=>{state.msg="No pudimos obtener su ubicación. Elija el lugar abajo.";render();},{enableHighAccuracy:false,timeout:10000,maximumAge:600000});
}
const chip=(k,n)=>`<button class="chip" data-zone="${k}">${esc(n)}</button>`;
function vHome(){
  const ask=state.ask?`<section class="sec"><h2 class="h2">¿En qué municipio está?</h2><p class="sub">Usted está en el Valle de Aburrá.</p><div class="chips">${["medellin","envigado","sabaneta","itagui","bello"].map(k=>chip(k,CITIES[k].name)).join("")}${chip("colombia","Otro municipio")}</div></section>`:"";
  return `<section class="hero"><p class="eye">Orientador por zona</p><h1>Las reglas cambian según dónde esté</h1>
  <p class="lead">Vea qué normas aplican en su zona y qué tener en cuenta para lo que va a hacer, en toda Colombia.</p>
  <button class="btn" data-do="loc">${ic("pin")} Usar mi ubicación</button>
  <p class="priv">${ic("lock",16)}<span>Su ubicación se usa solo en su teléfono para saber en qué ciudad está. No la guardamos ni la enviamos.</span></p>
  ${state.msg?`<p class="msg" role="status">${esc(state.msg)}</p>`:""}</section>${ask}
  <section class="sec"><h2 class="h2">O elija el lugar</h2>
  <p class="sub">Valle de Aburrá</p><div class="chips">${["medellin","envigado","sabaneta","itagui","bello"].map(k=>chip(k,CITIES[k].name)).join("")}</div>
  <p class="sub" style="margin-top:14px">Otras ciudades</p><div class="chips">${["bogota","cartagena","santamarta"].map(k=>chip(k,CITIES[k].name)).join("")}${chip("colombia","Otro lugar de Colombia")}</div></section>`;
}
const card=r=>`<article class="card"><span class="i">${ic(r.i)}</span><div><b>${esc(r.t)}</b><p>${esc(r.p)}</p>${r.s&&r.s.length?`<div class="src">${src(r.s)}</div>`:""}</div></article>`;
function vZone(){
  const c=CITIES[state.zone];
  const name=c?c.name:state.zone==="fuera"?"Fuera de Colombia":"Colombia";
  const note=c?c.note:state.zone==="fuera"?"Esta guía cubre Colombia. Estas son las normas nacionales que le aplicarán cuando esté en el país.":"Estas normas aplican en todo el país. Las normas locales (horarios, uso del suelo, pico y placa) dependen de cada municipio.";
  const head=`<section class="zone"><p class="where">${ic("pin",16)} Usted está en</p><h1>${esc(name)}</h1><p class="note">${esc(note)}</p><button class="chg" data-do="home">Cambiar lugar</button></section>
  <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${state.tab==="normas"}" data-tab="normas">Normas de la zona</button><button class="tab" role="tab" aria-selected="${state.tab==="act"}" data-tab="act">Mi actividad</button></div>`;
  if(state.tab==="normas") return head+`<section class="sec">${c?`<h2 class="h2">${esc(c.name)}</h2>${c.rules.map(card).join("")}<h2 class="h2" style="margin-top:18px">En toda Colombia</h2>`:""}${NAC.map(card).join("")}</section>`;
  return head+`<section class="sec"><h2 class="h2">¿Qué va a hacer?</h2><p class="sub">Le decimos qué dice la ley y cómo prevenir problemas, en cualquier lugar de Colombia.</p>
  <div class="grid">${ACTS.map(a=>`<button class="act" data-act="${a.k}"><span class="i">${ic(a.i)}</span>${esc(a.t)}</button>`).join("")}</div>
  <article class="card emer" style="margin-top:12px"><span class="i">${ic("phone")}</span><div><b>Emergencias: línea 123</b><p>Policía, ambulancia y bomberos. Desde cualquier celular.</p></div></article></section>`;
}
function vAct(){
  const a=ACTS.find(x=>x.k===state.act);
  const ul=l=>`<ul>${l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  return `<div class="top"><button class="back" data-do="zone" aria-label="Volver">${ic("back")}</button><b>${esc(a.t)}</b></div><section class="sec">
  <div class="blk prev"><h3>${ic("shield",18)} Para prevenir</h3>${ul(a.prev)}</div>
  <div class="blk sos2"><h3>${ic("alert",18)} Si algo pasa</h3>${ul(a.sos)}</div>
  <div class="blk law"><h3>${ic("file",18)} Lo que dice la ley</h3>${ul(a.law)}<div class="src">${src(a.s)}</div></div>
  <a class="cta" href="/es/servicios/">Hablar con una abogada</a>
  <p class="disc">Información general con fuentes oficiales, actualizada en noviembre de 2026; no reemplaza la revisión de su caso.</p></section>`;
}
function render(){ app.innerHTML = state.act ? vAct() : state.zone ? vZone() : vHome(); }
app.addEventListener("click",e=>{
  const l=e.target.closest('a[href^="#act-"]'); if(l){e.preventDefault();state.act=l.getAttribute("href").slice(5);render();return window.scrollTo(0,0);}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.do==="loc") return locate();
  if(b.dataset.do==="home"){state={zone:null,tab:"normas",act:null,msg:"",ask:false};return render();}
  if(b.dataset.do==="zone"){state.act=null;render();return window.scrollTo(0,0);}
  if(b.dataset.zone) return pick(b.dataset.zone);
  if(b.dataset.tab){state.tab=b.dataset.tab;return render();}
  if(b.dataset.act){state.act=b.dataset.act;render();window.scrollTo(0,0);}
});
render();
</script>
</body>
</html>
